  ok(rep==='[주간 업무 보고] 10/12(월)~10/18(일) · 홍길동\n\n■ 완료 (1건)\n- 가 (10/13)\n  · 메모\n  · 둘째 줄\n\n■ 진행 중 (1건)\n- 나 (마감 10/16) 1/2\n\n■ 다음 주 예정 (1건)\n- 다 (10/20)', '주간 보고 초안');
  ok(wsParse('회의 내일', T).dated && !wsParse('회의 3시', T).dated && !wsParse('회의', T).dated, '날짜를 읽었는지 따로 알려 준다 (달력 보기는 안 읽혔을 때 누른 날로 등록)');
  ok(homeDots({ tasks:[mk(T)], evs:[{ color:'a' }, { color:'b' }, { color:'c' }] }).join()===HOME_TASK_DOT+',a,b' && !homeDots(undefined).length && !homeDots({ tasks:[mk(T, '완료', T)], evs:[] }).length, '달력 점: 끝나지 않은 업무 하나 + 일정, 셋까지');
  const [left, done] = wsTodayCount(); ok(left>=0 && done>=0 && homeRate().every(p=>p==null || (p>=0 && p<=100)), '오늘 할 일·달성률 범위');
  return 'wsSelfCheck 통과';
}

/* ----- 동작 ----- */
const wsPut = (role, v)=>{ wsStore[role] = v; wsSave(role); };
function wsKeep(msg, get=wsTasks, put=wsPut){   // 되돌릴 수 있게 지금 목록을 떠 두고 알림을 띄운다 — 목록을 바꾸기 "전에" 부른다. 되돌리기는 마지막 한 번, 6초 동안. 나의 일상도 같이 쓴다(get·put = 그 목록을 읽고 되돌려 놓는 함수)
  clearTimeout(wsUndo?.timer); document.getElementById('wsToast')?.remove();
  wsUndo = { role:kpiRole, put, snap:JSON.stringify(get()), timer:setTimeout(()=>{ wsUndo = null; document.getElementById('wsToast')?.remove(); }, 6000) };
  const d = document.createElement('div'); d.id = 'wsToast'; d.className = 'ws-toast'; d.setAttribute('role', 'status');
  d.innerHTML = `<span>${escapeHtml(msg)}</span><button type="button" onclick="wsUndoNow()">되돌리기</button>`;
  document.body.appendChild(d);
}
function wsUndoNow(){
  if(!wsUndo) return;
  clearTimeout(wsUndo.timer); document.getElementById('wsToast')?.remove();
  const { role, put, snap } = wsUndo; wsUndo = null; put(role, JSON.parse(snap));
}
function wsSetState(id, state){   // 완료로 바꾸면 끝낸 날을 적고, 반복 업무면 다음 회차를 만든다(하위 할 일은 체크를 풀고 메모는 비운다). 완료를 풀면 아직 끝내지 않은 그 다음 회차를 지운다
  const list = wsTasks(), x = list.find(v=>v.id===id), was = x.state==='완료', now = state==='완료';
  if(now && !was) wsKeep('완료했습니다 — '+x.title);
  x.state = state; x.doneAt = now ? (x.doneAt || kpiDay(0)) : '';
  if(now && !was && x.repeat && x.due && !list.some(v=>v.from===id))
    list.push({ ...x, id:wsNewId(list), from:id, due:wsNextDue(x, kpiDay(0)), state:'예정', doneAt:'', memo:'', tags:[...x.tags], subs:x.subs.map(s=>({ t:s.t, done:false })) });
  if(was && !now) wsStore[kpiRole] = list.filter(v=>!(v.from===id && v.state!=='완료'));
  wsSave();
}
function wsToggle(id, key){ wsSetState(id, wsTasks().find(v=>v.id===id).state==='완료' ? '예정' : '완료'); document.getElementById(key+id)?.focus(); }   // 다시 그린 뒤에도 누르던 칸에 머문다
function wsAddBase(){ return wsView==='cal' && currentNav.id==='ws' ? (wsCalDay || kpiDay(0)) : kpiDay(0); }   // 빠른 등록에 날짜를 안 적었을 때의 마감일: 달력 보기에서는 누른 날, 그 밖에는 오늘
function wsAdd(e){   // 빠른 등록: 제목만 — 끝에 적은 날짜·시간을 읽고(wsParse), 날짜가 없으면 wsAddBase. 중요도 보통, 상태 예정
  e.preventDefault();
  const today = kpiDay(0), { dated, ...p } = wsParse(new FormData(e.target).get('title'), today), list = wsTasks(); if(!p.title) return;
  if(!dated) p.due = wsAddBase();
  const x = wsFill({ ...p, id:wsNewId(list) });
  if(currentNav.id==='home' && !wsIn(x, 'today', today)) wsKeep(`추가했습니다 — ${x.title} · ${wsWhen(x, today)[0]}`);   // 홈의 오늘 목록에는 안 보이는 날짜라서 알려 준다
  list.push(x);
  if(!wsIn(x, wsFilter, today)) wsFilter = 'all';   // 방금 적은 것이 보이는 목록으로
  if(wsView==='cal'){ const d = celebParse(x.due), t = celebParse(today); wsCalDay = x.due; wsCalOff = (d.getFullYear()-t.getFullYear())*12 + d.getMonth() - t.getMonth(); }   // 달력은 그 날짜가 있는 달로
  wsSave(); document.getElementById('wsAddIn')?.focus();
}
function wsHint(inp){   // 적는 동안 마감이 어떻게 들어갈지 미리 보여 준다
  const today = kpiDay(0), p = wsParse(inp.value, today), el = document.getElementById('wsHint'); if(!el) return;
  if(!p.dated) p.due = wsAddBase();
  el.innerHTML = p.title!==inp.value.trim() ? `마감 <b>${wsWhen(p, today)[0]}</b> · 제목 “${escapeHtml(p.title)}”` : WS_HINT;
}
function wsCarry(){   // 못 끝낸 일 내일로: 마감이 오늘이거나 지난 미완료 업무의 마감일을 내일로
  const today = kpiDay(0), late = wsTasks().filter(x=>x.state!=='완료' && x.due && x.due<=today); if(!late.length) return;
  wsKeep(`${late.length}건을 내일로 옮겼습니다`); late.forEach(x=>{ x.due = wsShift(today, 1); }); wsSave();
}
function wsDrop(e, state){ e.preventDefault(); const id = +e.dataTransfer.getData('text/plain'); if(wsTasks().some(x=>x.id===id && x.state!==state)) wsSetState(id, state); }
function wsEdit(id){
  const x = wsTasks().find(v=>v.id===id);
  orgModal(`<form id="wsSubForm" onsubmit="wsSubAdd(event, ${id})"></form>
  <form id="wsForm" onsubmit="wsSubmit(event, ${id})">
    <div class="card-title">업무 수정</div>
    <div class="field" style="margin-bottom:14px;"><label>제목</label><input name="title" required maxlength="80" value="${escapeHtml(x.title)}"></div>
    <div class="field-row"><div class="field"><label>마감일</label><input type="date" name="due" value="${escapeHtml(x.due)}" onchange="wsRepLabel(${id})"></div><div class="field"><label>시간 (선택)</label><input type="time" name="time" value="${escapeHtml(x.time)}"></div></div>
    <div class="field-row"><div class="field"><label>중요도</label><select name="pri">${wsOpts(WS_PRIS, x.pri)}</select></div><div class="field"><label>상태</label><select name="state">${wsOpts(WS_STATES, x.state)}</select></div></div>
    <div class="field-row"><div class="field"><label>반복</label><select name="repeat">${Object.keys(WS_REPEATS).map(k=>`<option value="${k}"${k===x.repeat?' selected':''}></option>`).join('')}</select></div><div class="field"><label>태그 (쉼표로 구분)</label><input name="tags" maxlength="60" placeholder="급여, 채용" value="${escapeHtml(x.tags.join(', '))}"></div></div>
    <div style="margin-bottom:14px;"><span class="ws-lbl">하위 할 일</span><div id="wsSubs">${wsSubsHtml(x)}</div>
      <div class="field" style="margin-top:6px;"><input form="wsSubForm" name="sub" maxlength="60" placeholder="하위 할 일을 적고 Enter" aria-label="새 하위 할 일" autocomplete="off"></div></div>
    <div class="field"><label>메모</label><textarea name="memo" rows="3" maxlength="1000">${escapeHtml(x.memo)}</textarea></div>
    <div class="ws-btns"><button type="button" class="btn ws-del" onclick="wsDelete(${id})">삭제</button><span><button type="button" class="btn" onclick="orgCloseModal()">취소</button><button class="btn primary">저장</button></span></div>
  </form>`);
  wsRepLabel(id);
}
function wsRepLabel(id){   // 반복 칸 글자: 마감일에 맞춰 "매주 금요일"·"매월 16일". 마감일을 안 바꿨으면 원래 반복 기준(rday)을 보여 준다
  const f = document.getElementById('wsForm'), x = wsTasks().find(v=>v.id===id), due = f.elements.due.value, d = due && celebParse(due);
  const r = k=>x.repeat===k && due===x.due && Number.isInteger(x.rday) ? x.rday : k==='weekly' ? d.getDay() : d.getDate();
  [...f.elements.repeat.options].forEach(o=>{ o.text = WS_REPEATS[o.value] + (!d || !o.value ? '' : o.value==='weekly' ? ` ${WS_DOW[r('weekly')]}요일` : ` ${r('monthly')}일`); });
}
function wsSubsHtml(x){ return x.subs.map((s,i)=>`<label class="ws-sub${s.done?' done':''}"><input type="checkbox" class="hm-check" ${s.done?'checked':''} onchange="wsSub(${x.id}, ${i})"><span>${escapeHtml(s.t)}</span><button type="button" aria-label="${escapeHtml(s.t)} 지우기" onclick="wsSub(${x.id}, ${i}, true)">${icon('x')}</button></label>`).join(''); }
function wsSub(id, i, del){   // 하위 할 일은 누르는 즉시 저장된다 (수정 창의 저장·취소와 상관없이). 전부 체크해도 업무는 자동으로 완료되지 않는다
  const x = wsTasks().find(v=>v.id===id);
  if(del) x.subs.splice(i, 1); else x.subs[i].done = !x.subs[i].done;
  wsSave(); document.getElementById('wsSubs').innerHTML = wsSubsHtml(x);
}
function wsSubAdd(e, id){
  e.preventDefault();
  const inp = e.target.elements.sub, t = inp.value.trim(), x = wsTasks().find(v=>v.id===id); if(!t || x.subs.length>=20) return;
  x.subs.push({ t, done:false }); inp.value = ''; wsSave(); document.getElementById('wsSubs').innerHTML = wsSubsHtml(x); inp.focus();
}
function wsSubmit(e, id){
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target)), title = f.title.trim(), x = wsTasks().find(v=>v.id===id); if(!title) return;
  const due = f.due || (f.repeat ? kpiDay(0) : '');   // 반복하려면 마감일이 있어야 한다 — 비어 있으면 오늘
  if(f.repeat && (f.repeat!==x.repeat || due!==x.due)) x.rday = f.repeat==='weekly' ? celebParse(due).getDay() : celebParse(due).getDate();
  Object.assign(x, { title, due, time:f.time, pri:f.pri, repeat:f.repeat, memo:f.memo.trim(), tags:[...new Set(f.tags.split(',').map(s=>s.trim()).filter(Boolean))].slice(0, 5) });
  orgCloseModal(); wsSetState(id, f.state);
}
function wsDelete(id){   // 확인 창 대신 되돌리기
  wsKeep('삭제했습니다 — '+wsTasks().find(v=>v.id===id).title);
  wsStore[kpiRole] = wsTasks().filter(v=>v.id!==id); orgCloseModal(); wsSave();
}
function wsReport(off=0){
  const me = KPI_USERS[kpiRole];
  orgModal(`<div class="card-title"><span>주간 보고 초안</span><select class="ws-pick" aria-label="기간" onchange="wsReport(+this.value)"><option value="0">이번 주</option><option value="1"${off?' selected':''}>지난주</option></select></div>
    <textarea id="wsReportTa" class="ws-report" rows="16" aria-label="주간 보고 초안">${escapeHtml(wsReportText(wsTasks(), kpiDay(0), off, me.name+' '+me.title))}</textarea>
    <div class="ws-btns"><span class="list-sub">고쳐서 쓰는 초안입니다. 여기서 고친 글은 저장되지 않습니다.</span><span><button type="button" class="btn" onclick="orgCloseModal()">닫기</button><button type="button" class="btn primary" onclick="const t = document.getElementById('wsReportTa'); t.select(); orgCopy(t.value, this)">복사</button></span></div>`);
}

/* ----- 화면 ----- */
const WS_HINT = '끝에 ‘내일’, ‘금요일’, ‘10/15’, ‘3시’를 적으면 마감이 들어갑니다';
const wsCls = state=>({ '완료':'success', '진행 중':'info' }[state] || 'neutral');
const wsOpts = (list, v)=>list.map(o=>`<option${o===v?' selected':''}>${escapeHtml(o)}</option>`).join('');
const wsTagCls = t=>'c' + [...t].reduce((a,c)=>a+c.codePointAt(0), 0) % 6;   // 같은 태그는 늘 같은 색
function wsAddForm(){
  const base = wsAddBase(), d = celebParse(base), ph = (base===kpiDay(0) ? '' : `${d.getMonth()+1}/${d.getDate()} (${WS_DOW[d.getDay()]})에 등록 — `) + '할 일을 적고 Enter';
  return `<div class="ws-quick"><form class="field ws-add" onsubmit="wsAdd(event)"><input id="wsAddIn" name="title" required maxlength="80" placeholder="${ph}" aria-label="새 업무 제목" autocomplete="off" oninput="wsHint(this)"><button class="btn primary">추가</button></form>
    <div class="ws-hint" id="wsHint">${WS_HINT}</div></div>`;
}
function wsMeta(x){   // 제목 옆 작은 표시: 태그 · 하위 할 일 진행 · 반복 · 메모
  return x.tags.map(t=>`<span class="ws-tag ${wsTagCls(t)}">${escapeHtml(t)}</span>`).join('')
    + (x.subs.length ? `<span class="ws-meta" title="하위 할 일">${icon('checks')}${x.subs.filter(s=>s.done).length}/${x.subs.length}</span>` : '')
    + (WS_REPEATS[x.repeat] && x.repeat ? `<span class="ws-meta">${icon('repeat')}${WS_REPEATS[x.repeat]}</span>` : '')
    + (x.memo ? `<span class="ws-meta" title="메모 있음">${icon('message')}</span>` : '');
}
function wsMatch(x){   // 태그·검색에 맞는가 (검색은 제목·메모·태그·하위 할 일)
  const q = wsQuery.trim().toLowerCase();
  return (!wsTag || x.tags.includes(wsTag)) && (!q || [x.title, x.memo, ...x.tags, ...x.subs.map(s=>s.t)].join('\n').toLowerCase().includes(q));
}
function wsRow(x, today){
  const fin = x.state==='완료', [when, late] = wsWhen(x, today), urgent = x.pri==='긴급' && !fin ? '<span class="hm-tag red">긴급</span>' : '';
  return `<div class="hm-row ws-row${fin?' done':''}"><input type="checkbox" class="hm-check" id="wsT${x.id}" aria-label="${escapeHtml(x.title)} 완료" ${fin?'checked':''} onchange="wsToggle(${x.id},'wsT')"><span class="t" onclick="wsEdit(${x.id})">${escapeHtml(x.title)}${urgent}${wsMeta(x)}</span><small${late?' class="late"':''}>${when}</small><select class="badge ${wsCls(x.state)} ws-state" aria-label="상태" onchange="wsSetState(${x.id}, this.value)">${wsOpts(WS_STATES, x.state)}</select></div>`;
}
function wsBoard(list, today){   // 보드: 예정 · 진행 중 · 완료(이번 주에 끝낸 것만). 카드를 끌어 옮기면 상태가 바뀐다 — 휴대폰은 카드의 상태 칸으로
  const mon = wsWeek(today)[0], open = wsSorted(list.filter(x=>x.state!=='완료'));
  const done = list.filter(x=>x.state==='완료' && x.doneAt>=mon).sort((a,b)=>a.doneAt<b.doneAt ? 1 : a.doneAt>b.doneAt ? -1 : 0);
  const card = x=>{ const fin = x.state==='완료', [when, late] = wsWhen(x, today);
    return `<div class="ws-kcard${fin?' done':''}" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${x.id}')" onclick="wsEdit(${x.id})"><div class="t">${escapeHtml(x.title)}${x.pri==='긴급' && !fin ? '<span class="hm-tag red">긴급</span>' : ''}</div><div class="ws-kmeta">${x.due ? `<small${late?' class="late"':''}>${when}</small>` : ''}${wsMeta(x)}</div><select class="badge ${wsCls(x.state)} ws-state" aria-label="상태" onclick="event.stopPropagation()" onchange="wsSetState(${x.id}, this.value)">${wsOpts(WS_STATES, x.state)}</select></div>`; };
  const col = (state, items, n=items.length)=>`<div class="ws-col" ondragover="event.preventDefault()" ondrop="wsDrop(event,'${state}')"><div class="ws-col-h ${wsCls(state)}">${state}<b>${state==='완료' ? '이번 주 ' : ''}${n}</b></div>${items.map(card).join('') || '<div class="hm-empty">없음</div>'}${n>items.length ? `<div class="ws-more">외 ${n-items.length}건 — 목록의 ‘완료’에서 볼 수 있어요</div>` : ''}</div>`;
  return `<div class="ws-board">${col('예정', open.filter(x=>x.state!=='진행 중'))}${col('진행 중', open.filter(x=>x.state==='진행 중'))}${col('완료', done.slice(0, 8), done.length)}</div>`;
}
function wsBody(){   // 목록(날짜별 묶음) · 보드 · 달력. 태그·검색은 셋 다에, 목록 종류(오늘·이번 주…)는 목록에만 적용된다
  const today = kpiDay(0), list = wsTasks().filter(wsMatch), q = wsQuery.trim().toLowerCase(), empty = '<div class="hm-empty">해당하는 업무가 없습니다</div>';
  if(wsView==='board') return wsBoard(list, today);
  if(wsView==='cal') return wsCalendar(list, today);
  const rows = list.filter(x=>wsIn(x, wsFilter, today));
  if(wsFilter==='done') return `<div class="hm-list">${rows.sort((a,b)=>a.doneAt<b.doneAt ? 1 : a.doneAt>b.doneAt ? -1 : 0).map(x=>wsRow(x, today)).join('') || empty}</div>`;
  const portal = (wsFilter==='today' || wsFilter==='all') && !wsTag ? homePortalTasks().filter(p=>p.title.toLowerCase().includes(q)) : [];   // 인사포털이 만든 일(서명·승인·평가) — 누르면 그 화면으로
  const html = { portal:portal.map(p=>`<div class="hm-row ws-row" onclick="goTo('${p.nav}','${p.tab}')"><span class="hm-go">${icon('chevR')}</span><span class="t">${p.title}<span class="hm-tag">인사포털</span></span><small>${NAV.find(v=>v.id===p.nav).label}</small><span class="badge warning">${p.badge}</span></div>`) };
  wsSorted(rows).forEach(x=>{ (html[wsGroupOf(x, today)] ||= []).push(wsRow(x, today)); });
  return Object.keys(WS_GROUPS).filter(k=>html[k]?.length).map(k=>`<details class="ws-grp ${k}"${wsFold.has(k)?'':' open'} ontoggle="wsFold[this.open ? 'delete' : 'add']('${k}')"><summary>${k==='done' ? (wsFilter==='week' ? '이번 주 완료' : '오늘 완료') : WS_GROUPS[k]}<b>${html[k].length}</b></summary><div class="hm-list">${html[k].join('')}</div></details>`).join('') || empty;
}
function wsCalPick(ymd){   // 달력에서 날짜를 고른다 — 적던 글자는 남긴다
  const typed = document.getElementById('wsAddIn')?.value || '';
  wsCalDay = ymd; renderContent();
  const inp = document.getElementById('wsAddIn'); if(inp && typed){ inp.value = typed; wsHint(inp); }
  document.getElementById('wsD'+ymd)?.focus();
}
function wsDropDay(e, ymd){   // 달력에서 업무를 다른 날짜 칸으로 끌어 놓으면 마감일이 바뀐다 (반복 기준 rday는 그대로 — 다음 회차는 원래 요일·날짜로 돌아온다)
  e.preventDefault();
  const x = wsTasks().find(v=>v.id===+e.dataTransfer.getData('text/plain')), d = celebParse(ymd); if(!x || x.due===ymd) return;
  wsKeep(`마감일을 옮겼습니다 — ${x.title} · ${d.getMonth()+1}/${d.getDate()} (${WS_DOW[d.getDay()]})`); x.due = ymd; wsSave();
}
function wsCalendar(list, today){   // 달력 보기: 마감일 칸에 업무 제목(둘까지, 넘으면 +n)과 그 달의 급여일·KPI·평가. 끝낸 일도 마감일 칸에 줄 그어진 채 남는다. 마감일 없는 업무는 나오지 않는다(건수만). 휴대폰은 칸이 좁아 점으로 보인다
  const t = celebParse(today), first = new Date(t.getFullYear(), t.getMonth()+wsCalOff, 1), y = first.getFullYear(), m = first.getMonth(), last = new Date(y, m+1, 0).getDate(), sel = wsCalDay || today;
  const map = homeDayMap(y, m, list), sd = celebParse(sel);
  const chip = x=>`<span class="ws-chip ${x.state==='완료' ? 'success' : wsWhen(x, today)[1] ? 'late' : wsCls(x.state)}" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${x.id}')" onclick="event.stopPropagation(); wsEdit(${x.id})" title="${escapeHtml(x.title)}">${escapeHtml(x.title)}</span>`;
  let cells = [...WS_DOW].map((d,i)=>`<div class="dow${i?'':' red'}">${d}</div>`).join('') + '<div class="ws-day blank"></div>'.repeat(first.getDay());
  for(let d=1; d<=last; d++){
    const ymd = ctYmd(new Date(y, m, d)), it = map[ymd], tasks = wsSorted(it?.tasks || []), evs = it?.evs || [];
    const cls = [((first.getDay()+d-1)%7===0 || PAY_HOLIDAYS.has(ymd)) && 'red', ymd===today && 'today', ymd===sel && 'sel'].filter(Boolean).join(' ');
    cells += `<div class="ws-day ${cls}" id="wsD${ymd}" aria-pressed="${ymd===sel}" aria-label="${m+1}월 ${d}일, 업무 ${tasks.length}건${evs.map(e=>', '+e.label).join('')}" onclick="wsCalPick('${ymd}')" ondragover="event.preventDefault()" ondrop="wsDropDay(event,'${ymd}')"><b>${d}</b>${tasks.slice(0, 2).map(chip).join('')}${tasks.length>2 ? `<small>+${tasks.length-2}</small>` : ''}${evs.map(e=>`<small class="ev" style="--dot:${e.color}">${e.label}</small>`).join('')}<i>${homeDots(it).map(c=>`<span style="background:${c}"></span>`).join('')}</i></div>`;
  }
  cells += '<div class="ws-day blank"></div>'.repeat((7 - (first.getDay()+last)%7)%7);

}

/* ---------------- 워크스페이스 > 나의 일상 (2026-10-11) ----------------
   반복해서 실천할 행동(루틴)을 날마다 체크한다. 그 기록이 주간 표·기록 달력·연속 실천·달성률이 되고, 홈의 "오늘의 루틴"·이번 주 달성률이 같은 자료를 읽는다.
   - 저장: 나의 업무와 같다 — 실제 로그인이면 서버에 사람별로, 시연은 각자 브라우저에 시연 역할마다 따로. 손대기 전에는 예시 루틴이 보인다(처음 고칠 때 저장).
   - 루틴 기록은 본인만 보고 평가와 잇지 않는다. 알림·공유는 없다(로그인 이후의 일).
   - 지난 날은 언제든 고칠 수 있고 앞날은 못 누른다 (인사담당자 확정).
   루틴 한 건: { id, title, cat:분류, when:시간대, archived:보관한 날|'', log:{ 'YYYY-MM-DD':1 },
                 sch:[{ from:'YYYY-MM-DD', rep:daily·weekdays·days·weekly·off, days:[요일 0~6], n:주 몇 번 }] }
   sch = 반복을 바꾼 이력(from 순, 맨 뒤가 지금 것). 바꾼 날부터 적용하고 지난 날은 그때의 반복으로 센다. off = 보관해 둔 동안(다시 쓸 때 끼워 넣는다) */
const RT_CATS = { 업무:'c0', 건강:'c1', 성장:'c2', 생활:'c3', 기타:'c5' }, RT_WHENS = ['아침','근무 중','퇴근 전','저녁','언제든'];   // 분류 → 색(.ws-tag), 시간대는 목록에 나오는 순서
const RT_REPS = { daily:'매일', weekdays:'평일', days:'요일 선택', weekly:'주 N회' }, RT_WEEK = [1,2,3,4,5,6,0];   // 요일은 월요일부터
const rtStore = {};   // 역할 → 루틴 목록
let rtView = 'today', rtCat = '', rtWeekOff = 0, rtMonOff = 0, rtDaySel = '', rtPick = 0;   // 보기(today·week·log), 고른 분류, 몇 주·몇 달 전, 기록에서 누른 날, 기록에서 고른 루틴(0 = 전부)
const rtFill = x=>({ ...x, cat:x.cat in RT_CATS ? x.cat : '기타', when:RT_WHENS.includes(x.when) ? x.when : '언제든', archived:typeof x.archived==='string' ? x.archived : '',
  log:x.log && typeof x.log==='object' ? x.log : {}, sch:x.sch.map(s=>({ rep:'daily', n:3, ...s, days:Array.isArray(s.days) ? s.days : [] })) });
const rtNow = x=>x.sch[x.sch.length-1];   // 지금의 반복
function rtSeed(){   // 예시: 5주 전부터 해 온 것처럼 — 가끔 빠뜨렸고, 오늘은 앞의 둘만 해 둔 모습
  const from = kpiDay(-35);
  return [['오늘의 업무 우선순위 정리','업무','아침','weekdays'], ['업무 중 스트레칭하기','건강','근무 중','weekdays'], ['점심 산책 15분','건강','근무 중','days',[1,3,5]],
    ['퇴근 전 내일 할 일 정리','업무','퇴근 전','weekdays'], ['책 10분 읽기','성장','저녁','daily'], ['영어 회화','성장','저녁','weekly']].map(([title, cat, when, rep, days=[]], i)=>{
    const x = rtFill({ id:i+1, title, cat, when, sch:[{ from, rep, days, n:3 }] });
    for(let o=35; o>=0; o--){ const d = kpiDay(-o); if((rep==='weekly' ? [1,3,6].includes(celebParse(d).getDay()) : rtDue(x, d)) && (o ? (o*3 + i*5)%(7+i)!==2 : i<2)) x.log[d] = 1; }
    return x;
  });
}
function rtNorm(saved){   // 저장된 목록(브라우저 · 서버)을 화면용으로. 목록이 아니면 예시
  return Array.isArray(saved) ? saved.filter(x=>x && typeof x.title==='string' && Array.isArray(x.sch) && x.sch.length && x.sch.every(s=>s && typeof s.from==='string')).map((x,i)=>rtFill({ ...x, id:i+1 })) : rtSeed();
}
function rtData(){   // 지금 역할의 루틴 전부(보관한 것 포함). 저장된 것이 없으면 예시
  if(!rtStore[kpiRole]) rtStore[kpiRole] = rtNorm(wsLocal('routines'));
  return rtStore[kpiRole];
}
const rtList = ()=>rtData().filter(x=>!x.archived).sort((a,b)=>RT_WHENS.indexOf(a.when) - RT_WHENS.indexOf(b.when) || a.id - b.id);   // 쓰고 있는 루틴, 시간대 순
function rtSave(role=kpiRole){ try{ localStorage.setItem('wsRoutines:'+role, JSON.stringify(rtStore[role])); }catch(_){} wsPush('routines'); renderContent(); }

/* ---------------- 워크스페이스 서버 저장 (2026-10-19 인사담당자 — "PC에 적은 것이 휴대폰에서 안 보인다") ----------------
   실제 로그인이면 나의 업무 · 나의 일상을 서버에 사람별로 둔다(GET · POST /api/workspace) — PC와 휴대폰이 같은 내용이고 본인만 본다.
   - 이 기기 브라우저(localStorage)는 마지막으로 본 내용을 담아 두는 곳으로만 쓴다.
   - 처음 한 번(이 기기 · 이 사람): 이 기기에 적어 둔 것을 서버 것에 합친다(wsMerge — 업무는 제목 · 마감일, 루틴은 제목이 같으면 하나로, 루틴 기록은 합침. 인사담당자 선택).
   - 고칠 때마다 저장한다(wsPush, 한 번에 하나씩 — 저장 중에 또 고치면 끝난 뒤 한 번 더).
   - 판 번호가 다르면(다른 기기가 먼저 저장) 서버 것을 불러오고 알린다 — 방금 고친 한 가지는 다시 해야 한다.
   - 화면이 다시 보일 때(다른 앱 · 창에서 돌아올 때) 서버에 새 판이 있으면 불러온다(wsPull).
   ponytail: 목록 하나를 통째로 저장한다 — 두 기기에서 동시에 고치면 늦게 저장한 쪽이 한 가지를 다시 해야 한다. 자주 겹치면 항목별 저장으로 바꾼다.
   시연(서버 없음)은 예전처럼 브라우저에만. */
const WS_SYNC = { tasks:{ v:0, busy:false, again:false }, routines:{ v:0, busy:false, again:false } };
const WS_KIND = { tasks:['wsTasks:', wsStore, l=>wsNorm(l)], routines:['wsRoutines:', rtStore, l=>rtNorm(l)] };   // 종류 → [브라우저 칸 이름, 화면 저장소, 읽어 들이기]
function wsLocal(kind){ try{ const v = JSON.parse(localStorage.getItem(WS_KIND[kind][0]+kpiRole)); return Array.isArray(v) ? v : null; }catch(_){ return null; } }
function wsMerge(kind, server, local){   // 순수 함수 — 이 기기에 있던 것을 서버 것 뒤에 더한다. 같은 것은 하나로 (wsSyncSelfCheck 가 검증)
  const out = server.map(x=>({ ...x }));
  if(kind==='routines'){
    local.forEach(l=>{ const s = out.find(x=>x.title===l.title); if(s) s.log = { ...(l.log || {}), ...(s.log || {}) }; else out.push({ ...l }); });
    return out;
  }
  const add = local.filter(l=>!out.some(x=>x.title===l.title && (x.due || '')===(l.due || ''))), base = Math.max(0, ...out.map(x=>Number.isInteger(x.id) ? x.id : 0));
  const id = new Map(add.map((l, i)=>[l.id, base+i+1]));   // 새 번호 — 반복 회차가 가리키는 앞 회차 번호도 같이 바꾼다
  return out.concat(add.map(l=>({ ...l, id:id.get(l.id), from:id.get(l.from) })));
}
function wsTake(kind, data, v){   // 서버 것을 화면 저장소와 이 기기 브라우저에
  const [key, store, norm] = WS_KIND[kind];
  store[kpiRole] = norm(data); WS_SYNC[kind].v = v;
  try{ localStorage.setItem(key+kpiRole, JSON.stringify(store[kpiRole])); }catch(_){}
}
async function wsPull(first){   // first = 로그인 직후 한 번 (합치기 포함)
  let j; try{ const r = await fetch('/api/workspace'); if(!r.ok) return; j = await r.json(); }catch(_){ return; }
  const mark = 'wsSynced:'+AUTH.me.user_id; let synced = true; try{ synced = localStorage.getItem(mark)==='1'; }catch(_){}
  let changed = false;
  for(const kind of ['tasks', 'routines']){
    const srv = j[kind], s = WS_SYNC[kind], local = first && !synced ? wsLocal(kind) : null;
    if(s.busy || (!first && srv.version===s.v)) continue;
    if(srv.data && !local){ wsTake(kind, srv.data, srv.version); changed = true; continue; }
    s.v = srv.version;
    if(local){   // 이 기기에 적어 둔 것 → 서버로 (서버에 있으면 합쳐서)
      const [, store, norm] = WS_KIND[kind];
      store[kpiRole] = norm(srv.data ? wsMerge(kind, srv.data, local) : local); changed = true;
      wsPush(kind);
    }
  }
  if(first){ try{ localStorage.setItem(mark, '1'); }catch(_){} }
  if(changed && !first) renderContent();
}
async function wsPush(kind){
  const s = WS_SYNC[kind]; if(!AUTH.live) return;
  if(s.busy){ s.again = true; return; }
  s.busy = true;
  try{
    const r = await fetch('/api/workspace/'+kind, { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ data:WS_KIND[kind][1][kpiRole], version:s.v }) });
    const j = await r.json().catch(()=>({}));
    if(r.ok) s.v = j.version;
    else if(r.status===409){ s.again = false; clearTimeout(wsUndo?.timer); wsUndo = null; wsTake(kind, j.data || [], j.version); renderContent(); wsNotice('다른 기기에서 바뀐 내용이 있어 새로 불러왔습니다. 방금 고친 것은 한 번 더 해 주세요.'); }
    else wsNotice(j.error || '저장하지 못했습니다. 잠시 뒤 다시 해 주세요.');
  }catch(_){ wsNotice('저장하지 못했습니다(인터넷 연결을 확인해 주세요). 다시 연결되면 한 번 더 고쳐 주세요.'); }
  finally{ s.busy = false; if(s.again){ s.again = false; wsPush(kind); } }
}
function wsNotice(msg){   // 아래쪽 알림(되돌리기 알림과 같은 자리) — 어느 화면에서든 보인다. 8초 뒤 사라진다
  document.getElementById('wsToast')?.remove();
  const d = document.createElement('div'); d.id = 'wsToast'; d.className = 'ws-toast'; d.setAttribute('role', 'status');
  d.innerHTML = `<span>${escapeHtml(msg)}</span><button type="button" onclick="this.parentNode.remove()">닫기</button>`;
  document.body.appendChild(d); setTimeout(()=>d.remove(), 8000);
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && AUTH.live){ wsPull(false); payWake(); whWake(); } });   // 다른 기기에서 고친 업무 · 그사이 공개된 급여명세서 · 원천징수영수증
function wsSyncSelfCheck(){   // 브라우저 콘솔에서 wsSyncSelfCheck() 실행
  const ok = (c, msg)=>{ if(!c) throw new Error('wsSyncSelfCheck 실패: '+msg); };
  const srv = [{ id:1, title:'보고', due:'2026-10-20' }, { id:2, title:'회의', due:'' }];
  const loc = [{ id:1, title:'보고', due:'2026-10-20' }, { id:2, title:'주간', due:'2026-10-21', repeat:'weekly' }, { id:3, title:'주간', due:'2026-10-28', from:2 }, { id:4, title:'회의', due:'2026-10-22' }];
  const t = wsMerge('tasks', srv, loc);
  ok(t.map(x=>x.title+x.id).join()==='보고1,회의2,주간3,주간4,회의5', '업무: 제목·마감일이 같으면 하나, 나머지는 새 번호로 뒤에 '+t.map(x=>x.title+x.id).join());
  ok(t[3].from===3 && t[2].from===undefined, '반복 회차가 가리키는 앞 회차 번호도 같이 바뀜');
  const r = wsMerge('routines', [{ title:'산책', log:{ '2026-10-01':1 } }], [{ title:'산책', log:{ '2026-10-02':1 } }, { title:'독서', log:{} }]);
  ok(r.length===2 && Object.keys(r[0].log).sort().join()==='2026-10-01,2026-10-02' && r[1].title==='독서', '루틴: 제목이 같으면 하나로, 기록은 합침');
  ok(srv.length===2 && !srv[0].log, '서버 것은 그대로 두고 새 목록을 만든다');
  return 'wsSyncSelfCheck 통과';
}

/* ----- 규칙 (순수 로직, rtSelfCheck가 검증) ----- */
function rtDays(from, to){ const out = []; for(let d=from; d<=to; d=wsShift(d, 1)) out.push(d); return out; }   // from~to의 날짜들
function rtSch(x, ymd){ let s = null; for(const e of x.sch) if(e.from<=ymd) s = e; return s; }   // 그날의 반복. 시작하기 전이면 null
function rtDue(x, ymd){   // 그날 하기로 한 루틴인가. 평일 = 월~금 중 공휴일이 아닌 날. 주 N회·보관 중은 정해진 날이 없다
  const s = rtSch(x, ymd), w = celebParse(ymd).getDay();
  return !!s && (s.rep==='daily' || (s.rep==='weekdays' && w>0 && w<6 && !PAY_HOLIDAYS.has(ymd)) || (s.rep==='days' && s.days.includes(w)));
}
const rtFree = (x, ymd)=>rtSch(x, ymd)?.rep==='weekly';   // 주 N회: 아무 날이나 하면 된다
const rtOn = (x, ymd)=>rtDue(x, ymd) || rtFree(x, ymd);   // 그날 체크할 수 있는가
const rtPct = ([d, n])=>n ? Math.round(d/n*100) : null;   // 셀 것이 없으면 null (화면에는 '–')
function rtWeekly(x, mon, today){   // 주 N회 루틴의 그 주 [한 횟수, 목표, 지금까지 채웠어야 할 횟수]. 남은 날에 다 채울 수 있는 동안은 모자란 것으로 세지 않는다. 그 주에 주 N회가 아니었으면 [0,0,0]
  const days = rtDays(mon, wsShift(mon, 6)).filter(d=>rtFree(x, d)), past = days.filter(d=>d<=today);
  if(!past.length) return [0, 0, 0];
  const n = Math.min(rtSch(x, past[past.length-1]).n, days.length), c = past.filter(d=>x.log[d]).length;
  return [c, n, Math.max(Math.min(c, n), n - (days.length - past.length))];
}
function rtStat(x, from, to, today){   // 루틴 x의 from~to [실천, 예정] — 오늘까지만 센다(인사담당자 확정). 주 N회는 월요일이 그 기간에 드는 주를 주 단위로 센다(rtWeekly)
  let done = 0, all = 0;
  for(const d of rtDays(from, to<today ? to : today)){
    if(rtDue(x, d)){ all++; if(x.log[d]) done++; }
    if(celebParse(d).getDay()===1){ const [c, n, need] = rtWeekly(x, d, today); done += Math.min(c, n); all += need; }
  }
  return [done, all];
}
const rtSum = (list, from, to, today)=>list.reduce((a,x)=>{ const [d, n] = rtStat(x, from, to, today); return [a[0]+d, a[1]+n]; }, [0, 0]);
function rtDayRows(list, ymd, today){   // 그날의 루틴: 하기로 한 것 + 주 N회 중 그날 한 것. 오늘은 이번 주 목표를 아직 못 채운 주 N회도 나온다(채웠으면 빠진다)
  return list.filter(x=>rtDue(x, ymd) || (rtFree(x, ymd) && (!!x.log[ymd] || (ymd===today && (([c, n])=>c<n)(rtWeekly(x, wsWeek(ymd)[0], today))))));
}
const rtDay = (list, ymd, today)=>{ const rows = rtDayRows(list, ymd, today); return [rows.filter(x=>x.log[ymd]).length, rows.length]; };   // 그날 [실천, 예정]
function rtStreak(x, today){   // [지금 연속, 최고 기록, 단위]. 예정 없는 날과 아직 하지 않은 오늘(주 N회는 이번 주)로는 끊기지 않는다. 주 N회는 목표를 채운 '주' 단위
  let run = 0, best = 0; const hit = v=>{ run = v ? run+1 : 0; best = Math.max(best, run); };
  const weekly = rtNow(x).rep==='weekly', mon = wsWeek(today)[0];
  if(weekly) for(let m = wsWeek(x.sch[0].from)[0]; m<=mon; m = wsShift(m, 7)){ const [c, n] = rtWeekly(x, m, today); if(n && (c>=n || m<mon)) hit(c>=n); }
  else for(const d of rtDays(x.sch[0].from, today)) if(rtDue(x, d) && (x.log[d] || d<today)) hit(x.log[d]);
  return [run, best, weekly ? '주' : '일'];
}
function rtRepLabel(x, today){   // 반복 칸 글자: 매일 · 평일 · 월·수·금 · 주 3회 · 이번 주 1/3
  const s = rtNow(x);
  if(s.rep==='weekly') return `주 ${s.n}회` + (x.archived ? '' : ` · 이번 주 ${rtWeekly(x, wsWeek(today)[0], today)[0]}/${s.n}`);
  return s.rep==='days' ? RT_WEEK.filter(w=>s.days.includes(w)).map(w=>WS_DOW[w]).join('·') : RT_REPS[s.rep];
}
function rtSelfCheck(){   // 브라우저 콘솔에서 rtSelfCheck() 실행 — 2026-10-14(수)를 오늘로 놓고 본다
  const ok = (c,m)=>{ if(!c) throw new Error('rtSelfCheck 실패: '+m); }, T = '2026-10-14', W = ['2026-10-12', '2026-10-18'];
  const mk = (rep, log=[], from='2026-09-01', more={})=>rtFill({ id:1, title:'t', sch:[{ from, rep, days:[1,3,5], n:3 }], log:Object.fromEntries(log.map(d=>[d.length>2 ? d : '2026-10-'+d, 1])), ...more });
  ok(rtDue(mk('daily'), '2026-10-11') && !rtDue(mk('daily'), '2026-08-31'), '매일: 시작한 날부터');
  ok(rtDue(mk('weekdays'), T) && !rtDue(mk('weekdays'), '2026-10-10') && !rtDue(mk('weekdays'), '2026-10-09'), '평일: 주말·공휴일(한글날)은 예정 없음');
  ok(rtDue(mk('days'), T) && !rtDue(mk('days'), '2026-10-13') && !rtDue(mk('weekly'), T) && rtOn(mk('weekly'), T) && !rtOn(mk('days'), '2026-10-13'), '요일 선택은 고른 요일만, 주 N회는 아무 날이나');
  ok(String(rtStat(mk('daily', ['12','14']), ...W, T))==='2,3' && String(rtStat(mk('days', ['12']), ...W, T))==='1,2', '이번 주 달성률은 오늘까지 예정된 것만 센다');
  const wk = (log, today, from)=>String(rtStat(mk('weekly', log, from), ...W, today));
  ok(wk(['12'], T)==='1,1' && wk([], T)==='0,0' && wk(['12'], '2026-10-17')==='1,2' && wk(['12'], '2026-10-18')==='1,3' && wk(['12','13','14','15'], '2026-10-18')==='3,3', '주 3회: 남은 날에 채울 수 있는 동안은 깎지 않는다');
  ok(wk([], '2026-10-18', '2026-10-17')==='0,2', '주 중에 시작한 주 N회는 남은 날 수까지만 목표로 본다');
  ok(String(rtSum([mk('daily', ['12','13','14']), mk('weekly', ['12'])], ...W, T))==='4,4' && rtPct([0, 0])===null && rtPct([1, 3])===33, '합계·비율');
  ok(String(rtStreak(mk('daily', ['10','11','12','13'], '2026-10-08'), T))==='4,4,일', '아직 하지 않은 오늘로는 끊기지 않는다');
  ok(String(rtStreak(mk('daily', ['08','09','11','12','13','14'], '2026-10-08'), T))==='4,4,일' && String(rtStreak(mk('daily', ['08','09','10','12'], '2026-10-08'), T))==='0,3,일', '빠뜨린 날에서 끊기고 최고 기록은 남는다');
  ok(String(rtStreak(mk('days', ['05','07','09','12'], '2026-10-05'), T))==='4,4,일' && String(rtStreak(mk('weekdays', ['07','08','12','13'], '2026-10-07'), T))==='4,4,일', '예정 없는 날(다른 요일·주말·공휴일)로는 끊기지 않는다');
  ok(String(rtStreak(mk('weekly', ['2026-09-28','2026-09-30','02','05','06','07','12'], '2026-09-28'), T))==='2,2,주' && String(rtStreak(mk('weekly', ['2026-09-28','2026-09-30','02','05','06','12'], '2026-09-28'), T))==='0,1,주', '주 N회의 연속은 목표를 채운 주 단위, 이번 주는 아직 끊지 않는다');
  const ch = mk('daily', ['12']); ch.sch.push({ from:'2026-10-13', rep:'days', days:[5], n:3 });
  ok(rtDue(ch, '2026-10-12') && !rtDue(ch, T) && String(rtStat(ch, ...W, T))==='1,1', '반복을 바꾸면 바꾼 날부터 — 지난 날은 그때의 반복으로 센다');
  const off = mk('daily', ['12']); off.sch.push({ from:'2026-10-13', rep:'off', days:[], n:3 }, { from:T, rep:'daily', days:[], n:3 });
  ok(String(rtStat(off, ...W, T))==='1,2' && !rtOn(off, '2026-10-13') && String(rtStreak(off, T).slice(0, 2))==='1,1', '보관해 둔 동안은 세지 않는다');
  const a = mk('daily', ['14']), b = mk('weekly', ['12']), c = mk('weekly', ['12','13','14']);
  ok(rtDayRows([a, b], T, T).length===2 && rtDayRows([a, b], '2026-10-13', T).length===1 && String(rtDay([a, b], T, T))==='1,2', '오늘은 목표를 못 채운 주 N회도 나오고, 지난 날은 한 것만');
  ok(rtDayRows([c], '2026-10-15', '2026-10-15').length===0 && rtDayRows([c], T, T).length===1, '이번 주 목표를 채운 주 N회는 오늘 목록에서 빠진다');
  ok(rtRepLabel(mk('days'), T)==='월·수·금' && rtRepLabel(mk('weekdays'), T)==='평일' && rtRepLabel(b, T)==='주 3회 · 이번 주 1/3', '반복 글자');
  ok(rtFill({ title:'t', cat:'없는 분류', when:'', sch:[{ from:T }] }).cat==='기타' && rtSeed().every(x=>rtNow(x).from<=kpiDay(0)) && homeRate().every(p=>p==null || (p>=0 && p<=100)), '저장된 값 보정·예시·홈 달성률 범위');
  return 'rtSelfCheck 통과';
}

/* ----- 동작 ----- */
const rtPut = (role, v)=>{ rtStore[role] = v; rtSave(role); if(document.getElementById('rtArch')) rtArchived(); };   // 되돌리기(wsKeep)가 부른다
function rtToggle(id, ymd, key){   // 체크·해제. 지난 날도 고칠 수 있고 앞날은 못 누른다. key = 다시 그린 뒤 머물 칸
  const x = rtData().find(v=>v.id===id); if(!x || ymd>kpiDay(0) || !rtOn(x, ymd)) return;
  if(x.log[ymd]) delete x.log[ymd]; else x.log[ymd] = 1;
  rtSave(); document.getElementById(key)?.focus();
}
function rtAdd(e){   // 빠른 등록: 이름만 — 매일 · 기타 · 언제든으로 만들고 바로 수정 창을 연다
  e.preventDefault();
  const title = new FormData(e.target).get('title').trim(), list = rtData(); if(!title) return;
  const x = rtFill({ id:wsNewId(list), title, sch:[{ from:kpiDay(0), rep:'daily', days:[], n:3 }] });
  list.push(x); rtView = 'today'; rtCat = ''; rtSave(); rtEdit(x.id);
}
function rtEdit(id){
  const today = kpiDay(0), x = rtData().find(v=>v.id===id), s = rtNow(x), [run, best, unit] = rtStreak(x, today), d = celebParse(x.sch[0].from);
  const chips = (name, label, opts, v)=>`<span class="ws-lbl">${label}</span><div class="hm-chips" role="radiogroup" aria-label="${label}">${opts.map(([k, t])=>`<label class="hm-chip"><input type="radio" name="${name}" value="${k}"${k===v?' checked':''}>${t}</label>`).join('')}</div>`;
  orgModal(`<form class="rt-form" onsubmit="rtSubmit(event, ${id})">
    <div class="card-title">루틴 수정</div>
    <div class="field"><label>이름</label><input name="title" required maxlength="40" value="${escapeHtml(x.title)}"></div>
    ${chips('cat', '분류', Object.keys(RT_CATS).map(c=>[c, c]), x.cat)}
    ${chips('when', '시간대', RT_WHENS.map(c=>[c, c]), x.when)}
    ${chips('rep', '반복', Object.entries(RT_REPS), s.rep)}
    <div class="rt-dows" role="group" aria-label="요일">${RT_WEEK.map(w=>`<label><input type="checkbox" name="days" value="${w}"${s.days.includes(w)?' checked':''} aria-label="${WS_DOW[w]}요일">${WS_DOW[w]}</label>`).join('')}</div>
    <div class="rt-warn">요일을 하나 이상 골라 주세요</div>
    <div class="rt-n">일주일에 <select name="n" class="ws-pick" aria-label="일주일에 몇 번">${[1,2,3,4,5,6].map(n=>`<option${n===s.n?' selected':''}>${n}</option>`).join('')}</select> 번</div>
    <div class="rt-rec">${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}부터 실천 · 지금 <b>연속 ${run}${unit}</b> · 최고 기록 ${best}${unit}<br>반복을 바꾸면 오늘부터 적용되고 지난 기록은 그대로 남습니다</div>
    <div class="ws-btns"><button type="button" class="btn" onclick="rtArchive(${id})">보관</button><span><button type="button" class="btn" onclick="orgCloseModal()">취소</button><button class="btn primary">저장</button></span></div>
  </form>`);
}
function rtSubmit(e, id){   // 반복을 바꾸면 오늘부터 적용한다 — 지난 날은 그때의 반복으로 센다(sch에 이력을 남긴다. 같은 날 다시 바꾸면 그날 것을 덮어쓴다)
  e.preventDefault();
  const f = new FormData(e.target), title = f.get('title').trim(), x = rtData().find(v=>v.id===id), s = rtNow(x), today = kpiDay(0);
  const next = { from:today, rep:f.get('rep'), days:f.getAll('days').map(Number), n:+f.get('n') };
  if(!title || (next.rep==='days' && !next.days.length)) return;
  Object.assign(x, { title, cat:f.get('cat'), when:f.get('when') });
  if(next.rep!==s.rep || next.n!==s.n || String(next.days)!==String(s.days)){ if(s.from===today) x.sch[x.sch.length-1] = next; else x.sch.push(next); }
  orgCloseModal(); rtSave();
}
function rtArchive(id){   // 보관: 목록·달성률에서 빠지고 기록은 남는다
  const x = rtData().find(v=>v.id===id);
  wsKeep('보관했습니다 — '+x.title, rtData, rtPut); x.archived = kpiDay(0); orgCloseModal(); rtSave();
}
function rtRestore(id){   // 다시 쓰기: 보관해 둔 동안은 예정이 없던 것으로 친다 (연속 실천·달성률이 깎이지 않게)
  const x = rtData().find(v=>v.id===id), today = kpiDay(0), s = rtNow(x);
  if(x.archived<today) x.sch.push({ ...s, from:x.archived, rep:'off' }, { ...s, from:today });
  x.archived = ''; rtSave(); rtArchived();
}
function rtDelete(id){   // 삭제하면 기록도 지워진다 — 확인 창 대신 되돌리기
  wsKeep('삭제했습니다 — '+rtData().find(v=>v.id===id).title, rtData, rtPut);
  rtStore[kpiRole] = rtData().filter(v=>v.id!==id); rtSave(); rtArchived();
}
function rtArchived(){   // 보관한 루틴 창 — 하나도 없으면 닫는다
  const list = rtData().filter(x=>x.archived); if(!list.length) return orgCloseModal();
  orgModal(`<div class="card-title" id="rtArch">보관한 루틴</div>
    <div class="hm-list">${list.map(x=>`<div class="hm-row rt-arow"><span class="t">${escapeHtml(x.title)}${rtTag(x)}<small>${rtRepLabel(x, kpiDay(0))}</small></span><button type="button" class="btn sm" onclick="rtRestore(${x.id})">다시 쓰기</button><button type="button" class="btn sm ws-del" onclick="rtDelete(${x.id})">삭제</button></div>`).join('')}</div>
    <div class="ws-btns"><span class="list-sub">삭제하면 그 루틴의 기록도 함께 지워집니다.</span><span><button type="button" class="btn" onclick="orgCloseModal()">닫기</button></span></div>`);
}

/* ----- 화면 ----- */
const rtTag = x=>`<span class="ws-tag ${RT_CATS[x.cat]}">${x.cat}</span>`;
const rtStreakHtml = ([run, , unit])=>run ? `<span class="rt-streak" title="연속 실천">${icon('flame')}${run}${unit}</span>` : '<span class="rt-streak zero">–</span>';
function rtTodayView(list, today, st){   // 오늘: 시간대별로 묶은 체크 목록
  const all = rtDayRows(list, today, today), rows = all.filter(x=>!rtCat || x.cat===rtCat), t = celebParse(today);
  const row = x=>{ const on = !!x.log[today];
    return `<div class="rt-row${on?' done':''}"><input type="checkbox" class="hm-check round rt-check" id="rtC${x.id}" aria-label="${escapeHtml(x.title)} 실천" ${on?'checked':''} onchange="rtToggle(${x.id},'${today}','rtC${x.id}')"><span class="t" onclick="rtEdit(${x.id})"><span>${escapeHtml(x.title)}</span>${rtTag(x)}</span><small>${rtRepLabel(x, today)}</small>${rtStreakHtml(st.get(x.id))}</div>`; };
  return `<div class="ws-tools"><div class="hm-chips">${['', ...Object.keys(RT_CATS)].map(c=>`<button type="button" class="hm-chip${rtCat===c?' on':''}" aria-pressed="${rtCat===c}" onclick="rtCat='${c}'; renderContent()">${c || '전체'}</button>`).join('')}</div></div>
    <div class="rt-date">${t.getMonth()+1}월 ${t.getDate()}일 ${WS_DOW[t.getDay()]}요일${all.length ? `<small>${all.length}개 중 ${all.filter(x=>x.log[today]).length}개 완료</small>` : ''}</div>
    ${RT_WHENS.map(g=>{ const v = rows.filter(x=>x.when===g); return v.length ? `<div class="rt-grp">${g}<b>${v.filter(x=>x.log[today]).length}/${v.length}</b></div>${v.map(row).join('')}` : ''; }).join('')
      || `<div class="hm-empty">${!list.length ? '아직 루틴이 없습니다. 위 칸에 적어 첫 루틴을 만들어 보세요' : all.length ? '해당하는 루틴이 없습니다' : '오늘 예정된 루틴이 없습니다'}</div>`}`;
}
function rtWeekView(list, today){   // 주간 표: 루틴 × 월~일. 지난 날은 눌러서 고친다. 그 주에 하기로 한 날이 하나도 없는 루틴은 나오지 않는다
  const mon = wsShift(wsWeek(today)[0], -7*rtWeekOff), days = rtDays(mon, wsShift(mon, 6)), a = celebParse(mon), b = celebParse(days[6]);
  const cell = (x, d)=>{ const on = !!x.log[d], k = `rtW${x.id}_${d}`;
    return !rtOn(x, d) ? '<span class="rt-dot off"></span>' : d>today ? '<span class="rt-dot later"></span>'
      : `<button type="button" class="rt-dot${on ? ' on' : rtFree(x, d) ? ' free' : ''}" id="${k}" aria-pressed="${on}" aria-label="${escapeHtml(x.title)} ${+d.slice(5, 7)}월 ${+d.slice(8)}일" onclick="rtToggle(${x.id},'${d}','${k}')"></button>`; };
  const sum = x=>{ const [c, n] = rtWeekly(x, mon, today), [dn, all] = n ? [c, n] : rtStat(x, mon, days[6], today); return all ? `${dn}/${all}` : '–'; };   // 주 N회는 목표 대비 횟수
  const nav = (off, name, label)=>`<button type="button" aria-label="${label}"${rtWeekOff+off<0 ? ' disabled' : ''} onclick="rtWeekOff+=${off}; renderContent()">${icon(name)}</button>`;
  return `<div class="ws-calbar"><span><span class="hm-calnav">${nav(1,'chevL','지난주')}${a.getMonth()+1}월 ${a.getDate()}일 ~ ${b.getMonth()===a.getMonth() ? '' : (b.getMonth()+1)+'월 '}${b.getDate()}일${nav(-1,'chevR','다음 주')}</span><button type="button" class="btn sm"${rtWeekOff ? '' : ' disabled'} onclick="rtWeekOff=0; renderContent()">이번 주</button></span>

    const res = await fetch('/api/search-places', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({query})});

    if(!res.ok) throw new Error(data.error || '검색에 실패했습니다.');
    expSearchCache[target] = data.results || [];
    if(!expSearchCache[target].length){ resultsEl.innerHTML = '<div class="placeholder-note">검색 결과가 없습니다. 도로명 주소를 직접 입력해 보세요.</div>'; return; }

      <div class="list-row" style="cursor:pointer;" onclick='expPickPlace(${JSON.stringify(target)}, ${i})'>
        <div><div class="list-title">${escapeHtml(r.name)}</div><div class="list-sub">${escapeHtml(r.road_address)}</div></div>
      </div>`).join('');
  }catch(err){
    resultsEl.innerHTML = expErrorBox(err.message);

}
function expPickPlace(target, idx){
  const place = expSearchCache[target][idx];
  const inputId = target==='departure' ? 'expDeparture' : `expDest_${target}`;
  const resultsId = target==='departure' ? 'expDepartureResults' : `expDestResults_${target}`;
  document.getElementById(inputId).value = place.road_address;

async function expCalculate(){
  const msgEl = document.getElementById('expMessage');
  const resultEl = document.getElementById('expResult');
  msgEl.innerHTML=''; resultEl.innerHTML='';

  const payload = {
    trip_date: document.getElementById('expDate').value,
    vehicle_type: document.getElementById('expVehicle').value,
    fuel_type: document.getElementById('expFuel').value,
  };

  if(expDistanceMode==='manual'){
    const total = Number(document.getElementById('expManualTotal').value);
    const destCount = Number(document.getElementById('expManualDestCount').value) || 1;
    if(!total || total<=0){ msgEl.innerHTML = expErrorBox('총 이동거리를 입력해 주세요.'); return; }
    payload.manual_distance = { total_km: total, destination_count: destCount };
  } else {
    const departure = document.getElementById('expDeparture').value.trim();
    const destinations = expDestinations.map(d=>d.trim()).filter(Boolean);
    if(!departure){ msgEl.innerHTML = expErrorBox('출발지를 입력해 주세요.'); return; }
    if(!destinations.length){ msgEl.innerHTML = expErrorBox('출장지를 1곳 이상 입력해 주세요.'); return; }
    payload.departure = departure;
    payload.destinations = destinations;
    payload.return_trip = document.getElementById('expReturn').checked;
  }

  msgEl.innerHTML = '<div class="placeholder-note">계산 중입니다... (지도·유가 조회에 몇 초 걸릴 수 있습니다)</div>';
  try{
    const res = await fetch('/api/calculate', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || '계산에 실패했습니다.');
    expLastResult = data;
    msgEl.innerHTML = '';
    resultEl.innerHTML = expRenderResult(data);
  }catch(err){
    msgEl.innerHTML = expErrorBox(err.message);
  }
}

async function expDownload(kind){
  if(!expLastResult){ return; }
  const payload = Object.assign({}, expLastResult);
  if(kind==='application-form'){
    const nameEl = document.getElementById('expApplicantName');
    payload.applicant_name = nameEl ? nameEl.value : '';
  }
  try{ await expSaveFile(kind, payload); }
  catch(err){ document.getElementById('expMessage').innerHTML = expErrorBox(err.message); }
}
async function expSaveFile(kind, payload){   // /api/export/<kind> 응답을 파일로 저장한다. 실패하면 Error를 던진다
  const res = await fetch(`/api/export/${kind}`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
  if(!res.ok){
    const data = await res.json().catch(()=>({}));
    throw new Error(data.error || '다운로드에 실패했습니다.');
  }
  const blob = await res.blob();
  const disposition = res.headers.get('Content-Disposition') || '';
  const starMatch = disposition.match(/filename\*=UTF-8''([^;]+)/);
  const plainMatch = disposition.match(/filename="?([^";]+)"?/);
  const filename = starMatch ? decodeURIComponent(starMatch[1]) : (plainMatch ? plainMatch[1] : `출장경비.${kind==='pdf'||kind==='application-form'?'pdf':'xlsx'}`);
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

/* ---------------- 규정 검색 ----------------
   원문은 서버(regulations/)에만 있다 — 이 파일에는 규정 문장을 넣지 않는다(Public 저장소).
   서버가 규정을 장·조로 나눠 주면(/api/rules/…), 검색은 조항 단위로 보여 주고
   조항을 누르면 포털 안 본문 보기가 그 조항 위치에서 열린다. 표는 원본 PDF 해당 쪽으로. */
const RULE_CHIPS = ['연차','출장비','경조사','육아휴직','급여일','시간외','자격증','징계'];
let ruleState = { q:'', data:null, view:null };   // view = {id, key} 이면 본문 보기
const ruleDocs = {};
let ruleList = null;

async function ruleFetch(url){
  const res = await fetch(url);
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || '규정을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.');
  return data;
}
function ruleGetDoc(id){   // 같은 규정을 동시에 여러 번 열어도 요청은 한 번 (실패하면 다음에 다시)
  return ruleDocs[id] || (ruleDocs[id] = ruleFetch('/api/rules/'+encodeURIComponent(id)).catch(e=>{ delete ruleDocs[id]; throw e; }));
}
function ruleSecLabel(s){ return s.no!=null ? `제${s.no}조 ${s.title}` : s.title; }
function ruleErr(msg){ return `<div class="placeholder-note" style="background:var(--bg-danger); color:var(--danger);">${escapeHtml(msg)}</div>`; }
/* 검색어를 칠한다. 글자 사이 띄어쓰기는 무시 — 서버 검색과 같은 규칙. html은 이미 escape된 문자열 */
function ruleMark(html, terms){
  const pats = (terms||[]).map(t=>[...t.replace(/\s/g,'')].map(ch=>ch.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('\\s*')).filter(Boolean);
  if(!pats.length) return html;
  return html.replace(new RegExp('('+pats.join('|')+')','gi'), '<mark class="rule-mark">$1</mark>');
}

/* 조항 본문 그리기 — 본문 속 ⟦표n⟧ 자리에 서버가 칸까지 읽어 준 표(doc.tables[n])를 그린다.
   첫 줄은 머리줄, 합친 칸은 colspan/rowspan 그대로. 넓은 표는 가로로 밀어 본다.
   글자는 가운데 정렬. 문장·목록처럼 긴 칸만 왼쪽 정렬, 여러 줄을 덮는 칸은 위쪽에 붙여 이름이 화면 밖으로 밀리지 않게. */
function ruleCellClass(c){
  const cls = [];
  const longest = Math.max(...c.t.split('\n').map(l=>l.length));
  if(c.t.length > 18 || c.t.includes('\n') || /^(\d+[.)]|\(\d+\)|-\s|※|<)/.test(c.t)) cls.push('l');
  if(longest > 18) cls.push('wide');          // 문장 칸은 너무 좁아지지 않게
  else if(longest <= 10) cls.push('nw');      // '100% ~ 60%' 같은 짧은 값은 한 줄로
  if(c.rs >= 6) cls.push('top');
  return cls.length ? ` class="${cls.join(' ')}"` : '';
}
function ruleBodyHtml(doc, body, terms){
  return body.split(/⟦표(\d+)⟧/).map((part, i)=>{
    if(i%2===0) return part.trim() ? `<div class="rule-text">${ruleMark(escapeHtml(part.trim()), terms)}</div>` : '';
    const t = doc.tables[+part];
    if(!t) return '';
    return `<div class="rule-table-wrap"><table class="rule-table">${t.rows.map((row, r)=>`<tr>${row.map(c=>{
      const tag = r===0 ? 'th' : 'td';
      return `<${tag}${r===0?'':ruleCellClass(c)}${c.cs>1?` colspan="${c.cs}"`:''}${c.rs>1?` rowspan="${c.rs}"`:''}>${ruleMark(escapeHtml(c.t), terms)}</${tag}>`;
    }).join('')}</tr>`).join('')}</table></div>`;
  }).join('');
}

      <div class="field" style="flex:1;"><input id="ruleQuery" aria-label="규정 검색어" placeholder="예: 연차, 출장비, 경조사, 육아휴직" value="${escapeHtml(ruleState.q)}"/></div>
      <button class="btn primary" style="flex-shrink:0;" onclick="ruleDoSearch()">${icon('search')} 검색</button>
    </div>
    <div class="rule-chips"><span>자주 찾는 말</span>${RULE_CHIPS.map(c=>`<button class="rule-chip" onclick="ruleDoSearch('${c}')">${c}</button>`).join('')}</div>
  </div>
  <div id="ruleResults"></div>`;
  document.getElementById('ruleQuery').addEventListener('keydown', e=>{ if(e.key==='Enter') ruleDoSearch(); });
  if(ruleState.data) ruleShowResults(); else ruleShowList();
}
async function ruleShowList(){
  const el = document.getElementById('ruleResults');
  el.innerHTML = '<div class="placeholder-note">규정 목록을 불러오는 중...</div>';
  try{
    ruleList = ruleList || (await ruleFetch('/api/rules')).rules;
    el.innerHTML = `<div class="card"><div class="card-title">사내 규정 전체 (${ruleList.length}개)</div>
      <div class="rule-grid">${ruleList.map(r=> r.available
        ? `<button class="rule-tile" onclick="ruleOpen('${r.id}')"><b>${escapeHtml(r.title)}</b><span>${r.effective?r.effective+' 시행 · ':''}${r.count}개 조항</span></button>`
        : `<div class="rule-tile off"><b>${escapeHtml(r.title)}</b><span>준비 중</span></div>`).join('')}</div>
      <div class="placeholder-note">규정 이름을 누르면 전문을 읽을 수 있습니다. 궁금한 내용은 위에서 검색하면 해당 조항을 바로 찾아 줍니다.</div></div>`;
  }catch(err){ el.innerHTML = ruleErr(err.message); }
}
async function ruleDoSearch(q){
  const input = document.getElementById('ruleQuery');
  if(q!==undefined && input) input.value = q;
  q = (input ? input.value : q || '').trim();
  ruleState.q = q;
  if(!q){ ruleState.data = null; return ruleShowList(); }
  const el = document.getElementById('ruleResults');
  el.innerHTML = '<div class="placeholder-note">검색 중...</div>';
  try{
    ruleState.data = await ruleFetch('/api/rules/search?q='+encodeURIComponent(q));
    ruleShowResults();
  }catch(err){ ruleState.data = null; el.innerHTML = ruleErr(err.message); }
}
function ruleShowResults(){
  const el = document.getElementById('ruleResults'), d = ruleState.data;
  const total = d.results.reduce((n,r)=>n+r.hits.length, 0);
  if(!d.results.length){
    el.innerHTML = `<div class="card"><div class="placeholder-note" style="margin-top:0;">"${escapeHtml(ruleState.q)}"이(가) 들어간 조항이 없습니다. 더 짧은 말(예: "연차휴가" → "연차")이나 위의 자주 찾는 말로 찾아 보세요.</div>
      <div style="margin-top:10px;"><button class="btn sm" onclick="ruleDoSearch('')">규정 전체 보기</button></div></div>`;
    return;
  }
  el.innerHTML = `<div class="card"><div class="card-title"><span>검색 결과 — 조항 ${total}건</span><button class="btn sm" onclick="ruleDoSearch('')">규정 전체 보기</button></div>${
    d.results.map(r=>`
    <div class="rule-group">
      <div class="rule-group-head"><button class="rule-link" onclick="ruleOpen('${r.id}')">${escapeHtml(r.title)}</button>
        <span class="badge neutral">${r.effective?r.effective+' 시행 · ':''}${r.hits.length}건</span></div>
      ${r.hits.map(h=>`
      <button class="rule-hit" onclick="ruleOpen('${r.id}','${h.key}')">
        <span class="rule-hit-title">${ruleMark(escapeHtml(ruleSecLabel(h)), d.terms)}</span>
        <span class="rule-hit-snip">${ruleMark(escapeHtml(h.snippet), d.terms)}</span>
      </button>`).join('')}
    </div>`).join('')}</div>`;
}

function ruleOpen(id, key){
  ruleState.view = { id, key };
  if(currentNav.id==='rule' && currentTab.id==='r1') ruleRender(); else goTo('rule','r1');
}
function ruleBack(){ ruleState.view = null; ruleRender(); document.querySelector('.content').scrollTop = 0; }
async function ruleRenderView(area){
  const { id, key } = ruleState.view;
  area.innerHTML = '<div class="placeholder-note">규정을 불러오는 중...</div>';
  let doc;
  try{ doc = await ruleGetDoc(id); }
  catch(err){ area.innerHTML = `<button class="btn sm" onclick="ruleBack()">← 돌아가기</button>${ruleErr(err.message)}`; return; }
  const terms = ruleState.data ? ruleState.data.terms : [];
  const file = `/api/rules/${encodeURIComponent(id)}/file`;
  let chapter = null, toc = '', body = '';
  doc.sections.forEach(s=>{
    if(s.chapter && s.chapter!==chapter){
      chapter = s.chapter;
      toc += `<div class="rule-toc-ch">${escapeHtml(chapter)}</div>`;
      body += `<div class="rule-ch">${escapeHtml(chapter)}</div>`;
    }
    toc += `<button class="rule-toc-item" data-key="${s.key}" onclick="ruleGo('${s.key}')">${escapeHtml(ruleSecLabel(s))}</button>`;
    body += `<section class="rule-sec" id="rs-${s.key}">
      <h3>${ruleMark(escapeHtml(ruleSecLabel(s)), terms)}${doc.pdf?`<a class="rule-page" href="${file}#page=${s.page}" target="_blank" rel="noopener">원본 ${s.page}쪽</a>`:''}</h3>
      ${ruleBodyHtml(doc, s.body, terms)}</section>`;
  });
  area.innerHTML = `
  <div class="card rule-view">
    <div class="rule-view-head">
      <button class="btn sm" onclick="ruleBack()">← ${ruleState.data?'검색 결과로':'규정 목록으로'}</button>
      <div class="rule-view-title">${escapeHtml(doc.title)} ${doc.effective?`<span class="badge neutral">${doc.effective} 시행</span>`:''}</div>
      <a class="btn sm" href="${file}" target="_blank" rel="noopener">${icon('file')} ${doc.pdf?'원본 PDF':'원본 파일 받기'}</a>
    </div>
    <select class="rule-toc-select" aria-label="조항 바로가기" onchange="ruleGo(this.value)">
      ${doc.sections.map(s=>`<option value="${s.key}"${s.key===key?' selected':''}>${escapeHtml(ruleSecLabel(s))}</option>`).join('')}
    </select>
    <div class="rule-view-grid">
      <nav class="rule-toc" aria-label="${escapeHtml(doc.title)} 목차">${toc}</nav>
      <div class="rule-body">${body}
        <div class="placeholder-note">표 모양이 원본과 다르게 보이면 조항 제목 옆 "원본 n쪽"으로 원본을 확인해 주세요.</div>
      </div>
    </div>
  </div>`;
  if(key) ruleGo(key); else document.querySelector('.content').scrollTop = 0;
}
function ruleGo(key){
  const sec = document.getElementById('rs-'+key);
  if(!sec) return;
  document.querySelectorAll('.rule-sec.on, .rule-toc-item.on').forEach(e=>e.classList.remove('on'));
  sec.classList.add('on');
  const t = document.querySelector(`.rule-toc-item[data-key="${key}"]`);
  if(t){ t.classList.add('on'); t.scrollIntoView({block:'nearest'}); }
  const sel = document.querySelector('.rule-toc-select'); if(sel) sel.value = key;
  sec.scrollIntoView({block:'start'});
}

  </div>`;

/* 쉬운 설명 글 → 화면. 빈 줄 = 문단(문단 안의 줄바꿈은 그대로), 줄마다 '- ' = 목록,
   '# ' = 굵은 소제목, '예)'로 시작하는 문단 = 흐린 예시 */
function ruleFaqEasy(text){
  return text.trim().split(/\n\s*\n/).map(p=>{
    const lines = p.split('\n');
    if(lines.every(l=>l.startsWith('- '))) return `<ul>${lines.map(l=>`<li>${escapeHtml(l.slice(2))}</li>`).join('')}</ul>`;
    if(p.startsWith('# ')) return `<p class="h">${escapeHtml(p.slice(2))}</p>`;
    return `<p${p.startsWith('예)')?' class="ex"':''}>${escapeHtml(p)}</p>`;
  }).join('');
}
let ruleFaqAnswers = null;   // 쉬운 설명 묶음 — 한 번만 받는다. 못 받으면 원문만 보여 주고 다음에 다시 받는다
async function ruleFaqLoad(i){
  const [, , id, no, ...more] = RULE_FAQ[i], el = document.getElementById('ruleFaq'+i);
  const refs = [[id, no], ...more];
  try{
    const [easy, ...docs] = await Promise.all([
      ruleFaqAnswers || (ruleFaqAnswers = ruleFetch('/api/rules/faq').then(d=>d.answers||{}).catch(()=>{ ruleFaqAnswers = null; return {}; })),
      ...refs.map(r=>ruleGetDoc(r[0]))]);
    const text = easy[id+'-'+no];
    el.innerHTML = (text ? `<div class="rule-faq-easy">${ruleFaqEasy(text)}</div>` : '') + refs.map(([rid, rno], k)=>{
      const doc = docs[k], s = doc.sections.find(x=>x.no===rno);
      if(!s) throw new Error('근거 조항을 찾지 못했습니다. 규정이 바뀌었을 수 있으니 "규정 검색" 탭에서 찾아 주세요.');
      return `<div class="rule-faq-box"><div class="rule-faq-src">규정 원문 · ${escapeHtml(doc.title)} ${escapeHtml(ruleSecLabel(s))}</div>
      ${ruleBodyHtml(doc, s.body, [])}
      <div style="display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;">
        <button class="btn sm" onclick="ruleState.data=null; ruleOpen('${rid}','${s.key}')">규정에서 보기</button>
        ${doc.pdf?`<a class="btn sm" href="/api/rules/${encodeURIComponent(rid)}/file#page=${s.page}" target="_blank" rel="noopener">원본 ${s.page}쪽</a>`:''}
      </div></div>`;
    }).join('');
  }catch(err){ el.innerHTML = ruleErr(err.message); }
}

   구조는 하이웍스 조직 그대로, 연락처·내선·메일은 HR 이 넣은 비상연락망 값이 먼저. 홈 이번 주 소식도 이 명단으로 사람을 찾는다(NEWS_LIVE). 다른 메뉴(KPI·평가 등)는 아직 시연 명단(orgMembers)을 쓴다. */

const ORG_ID = 100000;   // 실제 명단의 화면 번호 = DB 번호 + ORG_ID — 시연 명단(1부터)과 겹치지 않게 (경조사 배너는 시연 번호로 orgShow 를 부른다)
const orgLive = ()=>AUTH.live && ORG_LIVE.state==='ok';
const orgTree = ()=>orgLive() ? ORG_LIVE.tree : ORG_TREE;
const orgPeople = ()=>orgLive() ? ORG_LIVE.people : orgMembers;
function orgFind(id){ return (id>=ORG_ID ? ORG_LIVE.people : orgMembers).find(m=>m.id===id); }
async function orgLoad(){
  ORG_LIVE.state = 'loading';
  try {
    const r = await fetch('/api/org'); if(!r.ok) throw new Error(r.status);
    const j = await r.json();
    ORG_LIVE.people = j.members.map(m=>({ ...m, uid:m.id, id:ORG_ID+m.id, hideMobile:m.mobile===null }));
    ORG_LIVE.tree = j.divisions.map(d=>({ division:d.name, teams:d.teams, noHead:!j.members.some(m=>m.division===d.name && m.lead==='DIVISION') }));
    ORG_LIVE.state = 'ok';
  } catch(e){ ORG_LIVE.state = 'err'; }
  renderContent();
}
function orgGate(){   // 실제 로그인인데 명단이 아직이면 안내 (불러오기 시작)
  if(!AUTH.live || ORG_LIVE.state==='ok') return '';
  if(!ORG_LIVE.state) orgLoad();
  return kpiNote(ORG_LIVE.state==='err' ? '조직도를 불러오지 못했습니다. 잠시 뒤 새로 고쳐 주세요.' : '조직도를 불러오는 중입니다…', ORG_LIVE.state==='err' ? 'danger' : 'info');
}
async function orgPrivacy(on, el, key='mobile_public'){   // 내 휴대폰 공개 · 생일 알림 (본인)
  const r = await fetch('/api/me/privacy', { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ [key]:on }) });
  if(!r.ok){ el.checked = !on; return; }
  const me = ORG_LIVE.people.find(m=>m.me); if(me) me[key==='mobile_public' ? 'mobilePublic' : 'birthdayPublic'] = on;
  if(key==='birthday_public') NEWS_LIVE.state = '';   // 홈에 돌아가면 다시 불러온다
}
async function orgHide(id, hidden){   // HR: 조직도에서 빼기 · 다시 보이기 (DB 번호)
  const r = await fetch(`/api/members/${id}/org`, { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ hidden }) });
  orgCloseModal();
  if(!r.ok) return kpiFlash('바꾸지 못했습니다. 잠시 뒤 다시 해 주세요.', 'danger');
  ORG_LIVE.state = ''; MS_LIVE.state = '';
  kpiFlash(hidden ? '조직도에서 뺐습니다. 다시 보이게 하려면 구성원 설정에서 이름을 누르세요.' : '조직도에 다시 보이게 했습니다.');
}
function orgTeamsOf(div){ const d = ORG_TREE.find(x=>x.division===div); return d ? d.teams : []; }

/* ----- 규칙 (순수 로직, orgSelfCheck가 검증) ----- */
function orgLeadErrs(m, members){   // 직책 규칙만 — 구성원 설정(msSet)도 이것으로 따진다
  const errs = [], div = ORG_TREE.find(d=>d.division===m.division), others = members.filter(o=>o.id!==m.id);
  if(m.lead==='TEAM' && !m.team && !/팀$/.test(m.division)) errs.push('팀장은 팀 소속이어야 합니다.');   // 하이웍스 맨 위에 있는 팀(지원팀 · 총무팀 — 대표이사 직속)은 부서 자체가 팀이라 팀장을 둔다
  if(m.lead==='DIVISION' && div && div.noHead) errs.push('이 본부는 본부장을 두지 않습니다.');
  if(m.lead==='TEAM' && others.some(o=>o.lead==='TEAM' && o.division===m.division && o.team===m.team)) errs.push('이 팀에는 이미 팀장이 있습니다.');
  if(m.lead==='DIVISION' && others.some(o=>o.lead==='DIVISION' && o.division===m.division)) errs.push('이 본부에는 이미 본부장이 있습니다.');
  if(m.lead==='CEO' && others.some(o=>o.lead==='CEO')) errs.push('대표이사는 이미 있습니다.');
  return errs;
}
function orgValidate(m, members){
  const errs = [], div = ORG_TREE.find(d=>d.division===m.division);
  if(!m.name.trim()) errs.push('이름을 입력해 주세요.');
  if(!m.title.trim()) errs.push('직급을 입력해 주세요.');
  if(!div) errs.push('본부를 선택해 주세요.');
  if(m.team && !orgTeamsOf(m.division).includes(m.team)) errs.push('선택한 본부에 없는 팀입니다.');
  errs.push(...orgLeadErrs(m, members));
  if(m.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m.email)) errs.push('메일 형식이 올바르지 않습니다.');
  if(m.birthday && !celebValidMd(m.birthday)) errs.push('생일은 월-일 형식으로 입력해 주세요. (예: 03-15)');
  return errs;
}
function orgUpsert(members, m, isHr){
  if(!isHr) return ['조직도 수정은 HR 관리자만 할 수 있습니다.'];
  const errs = orgValidate(m, members);
  if(errs.length) return errs;
  const i = members.findIndex(o=>o.id===m.id);
  msFix(m);
  if(i<0){ m.id = ++orgSeq; members.push(m); } else members[i] = m;
  return [];
}
function orgRemove(members, id, isHr){
  if(!isHr) return ['조직도 수정은 HR 관리자만 할 수 있습니다.'];
  if(msLastHr(members, id)) return [MS_LAST_HR];
  const i = members.findIndex(o=>o.id===id);
  if(i>=0) members.splice(i,1);
  return [];
}
const HW_MAIL = 'https://mails.office.hiworks.com/write?mode=normal';   // 하이웍스 메일 쓰기 (2026-10-19 인사담당자 지시 — 메일은 하이웍스로)
// 받는 사람을 미리 채우는 것은 메일 주소로는 안 된다(to= 를 무시함, 2026-10-19 확인). 하이웍스 "회사 안 직원 번호"로만 된다: &user_nos=번호
// — 로그인에 쓰는 통합 사용자 번호와 다르다(2026-10-20 확인). 실제 명단은 HR 이 넣은 회사 번호(mailNo, auth.py members_mail_nos)를 받는다.
// 번호가 없는 사람(새 직원 · 시연 명단)은 누를 때 메일 주소를 복사해 둔다 → 받는 사람 칸에 붙여넣기 (인사담당자 선택)
const hwMailUrl = mailNo=>HW_MAIL + (mailNo ? '&user_nos='+encodeURIComponent(mailNo) : '');
const hwMailLink = (inner, cls='', m={})=>`<a ${cls ? `class="${cls}" ` : ''}href="${hwMailUrl(m.mailNo)}" target="_blank" rel="noopener"${!m.mailNo && m.email ? ` data-copy="${escapeHtml(m.email)}" onclick="hwMailCopy(this.dataset.copy)"` : ''}>${inner}</a>`;
function hwMailCopy(email){ try { navigator.clipboard.writeText(email).then(()=>wsNotice('메일 주소를 복사했어요. 하이웍스 받는 사람 칸에 붙여넣기(Ctrl+V) 해 주세요.'), ()=>{}); } catch(e){} }
function orgVisibleContacts(m){ return { ext:m.ext, email:m.email, mobile: m.hideMobile ? null : m.mobile }; }
function orgSelfCheck(){   // 브라우저 콘솔에서 orgSelfCheck() 실행
  const ok = (c,msg)=>{ if(!c) throw new Error('orgSelfCheck 실패: '+msg); };
  const ms = orgMembers.map(m=>({...m}));
  const mk = o=>({ id:0, name:'테스트', title:'사원', division:'DR사업본부', team:'Device 개발팀', lead:'', hideMobile:false, mobile:'', ext:'', email:'', ...o });
  ok(orgUpsert(ms, mk({}), false).length===1, 'HR 아니면 등록 불가');
  const order = [mk({ name:'프로', title:'프로' }), mk({ name:'기타', title:'사원' }), mk({ name:'조장', title:'조장' }), mk({ name:'이사팀장', title:'이사', lead:'TEAM' }), mk({ name:'리더', title:'리더' }), mk({ name:'본부장', title:'상무이사', lead:'DIVISION' })]
    .sort((a,b)=>orgRank(a)-orgRank(b)).map(m=>m.name).join();
  ok(order==='본부장,이사팀장,리더,조장,프로,기타', '부서 명단 순서: 본부장 → 팀장 → 리더 → 조장 → 프로 → 그 밖 (직책이 직급보다 먼저) '+order);
  ok(orgRemove(ms, ms[0].id, false).length===1 && ms.length===orgMembers.length, 'HR 아니면 삭제 불가');
  ok(orgUpsert(ms, mk({}), true).length===0 && ms.length===orgMembers.length+1, 'HR 등록');
  ok(orgUpsert(ms, mk({name:' '}), true).length===1, '이름 필수');
  ok(orgUpsert(ms, mk({lead:'TEAM'}), true).length===1, '팀장 중복 불가');
  ok(orgUpsert(ms, mk({team:'솔루션 개발팀', lead:'TEAM'}), true).length===1, '이미 팀장 있는 팀');
  ok(orgUpsert(ms, mk({division:'솔루션사업본부', team:'솔루션 제조팀', lead:'DIVISION'}), true).length===0, '본부장 없는 본부에 본부장 등록');
  ok(orgUpsert(ms, mk({division:'대표이사 직속부서', team:'지원팀', lead:'DIVISION'}), true).length===1, '대표이사 직속은 본부장 없음');
  ok(orgUpsert(ms, mk({team:'CsI팀'}), true).length===1, '다른 본부의 팀 선택 불가');
  ok(orgUpsert(ms, mk({email:'nope'}), true).length===1, '메일 형식');
  ok(orgVisibleContacts(mk({hideMobile:true, mobile:'x'})).mobile===null && orgVisibleContacts(mk({mobile:'x'})).mobile==='x', '휴대폰 비공개');
  const last = ms[ms.length-1]; orgRemove(ms, last.id, true); ok(!ms.some(o=>o.id===last.id), 'HR 삭제');
  return 'orgSelfCheck 통과';
}

/* ----- 화면 ----- */
function orgLeadBadge(m){ return m.lead==='CEO' ? '<span class="badge info">대표이사</span>' : m.lead==='DIVISION' ? '<span class="badge success">본부장</span>' : m.lead==='TEAM' ? '<span class="badge warning">팀장</span>' : ''; }
function orgMemberRow(m){
  const hr = orgIsHr() && !AUTH.live ? `<span style="margin-left:auto; display:flex; gap:6px;"><button class="btn sm" onclick="orgEdit(${m.id})">수정</button><button class="btn sm" onclick="orgDelete(${m.id})">삭제</button></span>` : '';
  return `<div class="org-member"><span class="org-name" onclick="orgShow(${m.id})">${escapeHtml(m.name)}</span><span style="color:var(--text-secondary);">${escapeHtml(m.title)}</span>${orgLeadBadge(m)}${hr}</div>`;
}
function orgShortTeam(t){ return t.replace(/팀$/, ''); }   // 화면 표시만 '팀' 생략, 데이터는 원래 이름
function orgPerson(m, cls){ return m ? `<div class="org-bx ${cls}"><span class="org-name" style="text-decoration:none;" onclick="orgShow(${m.id})">${escapeHtml(m.name)} ${escapeHtml(m.title)}</span></div>` : `<div class="org-bx ${cls} org-muted">공석</div>`; }
const ORG_NO_COL = ['임원', '비상근'];   // 부서별 조직도에 칸을 만들지 않는 하이웍스 부서 (2026-10-19 인사담당자) — 그 사람들은 구성원 검색에는 그대로 나온다
function orgChart(){
  const gate = orgGate(); if(gate) return gate;
  const live = AUTH.live;
  const hrBar = orgIsHr() && !live ? `<div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;"><button class="btn sm primary" onclick="orgEdit(null)">＋ 구성원 추가</button><button class="btn sm" onclick="orgAddTeam()">＋ 팀 추가</button><button class="btn sm" onclick="orgAddDivision()">＋ 본부 추가</button></div>` : '';
  const tree = orgTree().filter(d=>!ORG_NO_COL.includes(d.division));
  const teamBox = (div, t)=>{   // t '' = 하이웍스 맨 위에 있는 팀(부서 자체가 팀)
    const ms = orgPeople().filter(m=>m.division===div && (!t || m.team===t));
    return `<div class="org-bx org-teambx" onclick="orgShowTeam('${escapeHtml(div)}','${escapeHtml(t)}')" title="${escapeHtml(t || div)} 구성원 보기">${escapeHtml(orgShortTeam(t || div))}<small>${ms.length}명</small></div>${orgPerson(ms.find(m=>m.lead==='TEAM'),'org-leadbx')}`;
  };
  // 대표이사 직속 팀(지원팀 · 총무팀 — 2026-10-19 인사담당자): 본부 상자 없이 맨 오른쪽 한 칸에 위아래로 놓고, 선을 길게 내려 다른 본부의 팀 줄과 높이를 맞춘다.
  // 실제 명단은 하이웍스 맨 위에 있는 "…팀"(아래 팀이 없는 것), 시연은 '대표이사 직속부서'의 팀. 순서는 가나다(지원 → 총무)
  const isDirect = d=>d.division.includes('직속') || (!d.teams.length && /팀$/.test(d.division));
  const direct = tree.filter(isDirect).flatMap(d=>d.teams.length ? d.teams.map(t=>[d.division, t]) : [[d.division, '']]).sort((a,b)=>(a[1]||a[0]).localeCompare(b[1]||b[0], 'ko'));
  const divs = tree.filter(d=>!isDirect(d));
  const cols = divs.map(d=>{
    const all = orgPeople().filter(m=>m.division===d.division), head = all.find(m=>m.lead==='DIVISION');
    const teams = d.teams.map(t=>teamBox(d.division, t)).join('');
    return `<div class="org-col"><div class="org-vline"></div>
      <div class="org-bx org-divbx" onclick="orgShowTeam('${escapeHtml(d.division)}','')" style="cursor:pointer;" title="본부 전체 구성원 보기">${escapeHtml(d.division.replace('직속부서','직속'))}</div>
      ${!head && d.noHead ? '<div class="org-bx org-headbx org-muted">본부장 없음</div>' : orgPerson(head,'org-headbx')}
      ${teams}</div>`;
  }).join('') + (direct.length ? `<div class="org-col"><div class="org-vline org-vlong"></div>${direct.map(([v, t])=>teamBox(v, t)).join('')}</div>` : '');
  return `${live ? '' : roleSwitcher()}${kpiMsg ? kpiNote(kpiMsg.msg, kpiMsg.type) : ''}
    <div class="card" style="margin-bottom:14px;"><div class="card-title">조직도 <span style="font-weight:500; color:var(--text-muted); font-size:var(--fs-xs);">전 직원 ${orgPeople().length}명 · ${live ? '하이웍스 명단' : '가상 데이터'}</span></div>
      ${hrBar}
      <div class="org-chart"><div class="org-inner" style="--org-cols:${divs.length + (direct.length ? 1 : 0)};">
        <div style="display:flex; flex-direction:column; align-items:center;"><div class="org-bx org-ceo">대표이사</div><div class="org-vline"></div></div>
        <div class="org-hline"></div>
        <div class="org-grid">${cols}</div>
      </div></div>
      <div class="list-sub" style="margin-top:14px;">팀 상자를 누르면 구성원 명단이, 이름을 누르면 연락처와 전화·문자·메일 버튼이 나옵니다.</div>
    </div>`;
}
// 부서를 눌렀을 때 위에서부터 이 순서 (2026-10-19 인사담당자: 팀장 → 리더 → 조장 → 프로). 본부를 누르면 본부장 · 임원이 그 위.
// 구성원 설정의 직책(팀장 · 본부장 · 대표이사)이 있으면 직책으로, 없으면 직급으로 센다. 목록에 없는 직급은 맨 아래, 같으면 가나다
const ORG_RANK = ['대표이사', '본부장', '상무이사', '이사', '팀장', '리더', '조장', '프로'];
function orgRank(m){ const i = ORG_RANK.indexOf(m.lead ? MS_LEAD[m.lead] : String(m.title || '').replace(/\s+/g, '')); return i<0 ? ORG_RANK.length : i; }
function orgShowTeam(division, team){   // team '' = 본부 전체
  const ms = orgPeople().filter(m=>m.division===division && (!team || m.team===team)).sort((a,b)=>orgRank(a)-orgRank(b) || a.name.localeCompare(b.name, 'ko'));
  orgModal(`<div class="card-title"><span>${escapeHtml(team || division)} <span style="font-weight:500; color:var(--text-secondary);">${ms.length}명</span></span><button type="button" class="x-btn" onclick="orgCloseModal()" aria-label="닫기">${icon('x')}</button></div>
    ${team ? `<div class="list-sub" style="margin-bottom:8px;">${escapeHtml(division)}</div>` : ''}
    ${ms.map(orgMemberRow).join('') || '<div class="list-sub">등록된 구성원이 없습니다.</div>'}`);
}
function memberSearch(){
  const gate = orgGate(); if(gate) return gate;
  // 처음(빈 칸)에는 명단을 보이지 않고, 적으면 찾은 사람만 (2026-10-19 인사담당자). 직책(팀장·본부장·대표이사)으로도 찾는다 —
  // 직급이 "이사"여도 구성원 설정에서 팀장이면 "팀장"으로 나온다. 본부·팀 이름으로 찾기는 그대로 (인사담당자 선택)
  return `${AUTH.live ? '' : roleSwitcher()}${kpiMsg ? kpiNote(kpiMsg.msg, kpiMsg.type) : ''}<div class="card" style="margin-bottom:14px;"><div class="field"><input id="orgSearch" placeholder="이름, 직책(팀장 · 본부장 · 프로 등), 본부, 팀으로 검색" aria-label="구성원 검색" value="${escapeHtml(orgQuery)}" oninput="orgQuery=this.value; document.getElementById('orgSearchOut').innerHTML=orgSearchOut()"/></div></div>
    <div id="orgSearchOut">${orgSearchOut()}</div>`;
}
function orgSearchOut(){   // 검색 결과만 — 입력칸까지 다시 그리면 한글 조합이 끊겨 "황"이 "ㅎㅗㅏㅇ"으로 들어간다 (2026-10-20)
  const q = orgQuery.trim().toLowerCase();

    <div class="card"><div class="card-title">검색 결과 <span class="more">${rows.length}명</span></div><table class="org-list"><thead><tr><th>이름</th><th>직급</th><th>소속</th><th>내선</th><th>메일</th></tr></thead><tbody>
    ${rows.map(m=>`<tr><td><span class="org-name" onclick="orgShow(${m.id})">${escapeHtml(m.name)}</span> ${orgLeadBadge(m)}</td><td>${escapeHtml(m.title)}</td><td>${escapeHtml(m.division)}${m.team?' › '+escapeHtml(m.team):''}</td><td>${escapeHtml(m.ext)}</td><td>${m.email ? hwMailLink(escapeHtml(m.email), '', m) : ''}</td></tr>`).join('') || '<tr><td colspan="5" style="color:var(--text-muted);">찾는 분이 없습니다</td></tr>'}

/* ----- 규칙 (화면과 분리된 순수 로직, kpiSelfCheck가 검증) ----- */
function kpiValidate(goals){
  const items = goals.flatMap(g=>g.items), errs = [];
  if(items.length<3) errs.push('실행목표(KPI)는 최소 3개 이상이어야 합니다.');
  if(goals.some(g=>!g.team.trim()||!g.personal.trim())) errs.push('팀목표와 개인목표를 모두 입력해 주세요.');
  if(items.some(i=>!i.action.trim()||!i.formula.trim())) errs.push('실행목표와 측정식을 모두 입력해 주세요.');
  if(items.some(i=>KPI_GRADES.some(([g])=>!String(i[g]||'').trim()))) errs.push('S~D 달성 기준을 모두 입력해 주세요. 연말 평가의 기준이 됩니다.');   // 2026-10-13: 기준이 비면 연말에 기준 없이 평가하게 된다
  if(items.some(i=>!(i.weight>0))) errs.push('가중치는 모두 0보다 커야 합니다.');
  if(kpiSum(items)!==100) errs.push(`가중치 합계가 100이어야 합니다. (현재 ${kpiSum(items)})`);
  return errs;
}
function kpiSubmitSheet(sheet, reason, editOpen){
  if(!editOpen) return ['지금은 KPI 작성·수정 기간이 아닙니다.'];
  if(sheet.pending) return ['이미 승인 대기 중인 건이 있습니다.'];
  const errs = kpiValidate(sheet.draft);
  if(sheet.confirmed && !reason.trim()) errs.push('수정 사유를 입력해 주세요.');
  if(!errs.length){ sheet.pending = { rows:kpiClone(sheet.draft), reason:reason.trim(), step:0 }; sheet.rejectNote = null; }
  return errs;
}
function kpiDecide(sheet, approvers, actor, approve, reason, actorLabel){
  const p = sheet.pending;
  if(!p || approvers[p.step]!==actor) return '지금 이 건을 승인할 차례가 아닙니다.';
  if(!approve){
    if(!reason.trim()) return '반려 사유를 입력해 주세요.';
    sheet.draft = p.rows; sheet.pending = null; sheet.rejectNote = `${actorLabel} 반려: ${reason.trim()}`;
    return null;
  }
  // ponytail: 승인 대기 중 확정본에 입력한 진행률은 새 확정본으로 안 넘어간다. 실제 저장 땐 KPI 행 id에 묶는다.
  if(++p.step>=approvers.length){ sheet.confirmed = p.rows; sheet.draft = kpiClone(p.rows); sheet.pending = null; }
  return null;
}
function kpiSelfCheck(){   // 브라우저 콘솔에서 kpiSelfCheck() 실행
  const ok = (c,m)=>{ if(!c) throw new Error('kpiSelfCheck 실패: '+m); };
  const g = ws=>[{ team:'t', personal:'p', items:ws.map(w=>({...kpiNewItem('x'), action:'a', formula:'f', weight:w, S:'s', A:'a', B:'b', C:'c', D:'d'})) }];
  const sheet = ws=>({ confirmed:null, draft:g(ws), pending:null, rejectNote:null });
  ok(kpiValidate(g([50,50])).length===1, '2개는 거부');
  ok(kpiValidate(g([40,30,30])).length===0, '3개·합 100 통과');
  const noCrit = g([40,30,30]); noCrit[0].items[1].C = ' '; ok(kpiValidate(noCrit).length===1, 'S~D 달성 기준이 하나라도 비면 거부');
  ok(kpiValidate(g([40,30,29.99])).length===1, '합 99.99 거부');
  ok(kpiValidate(g(Array(10).fill(10))).length===0, '개수 상한 없음');
  ok(kpiProgress(kpiSeed)===51 && kpiProgress(g([100]))===0, '가중 달성률 = Σ(가중치×진행률)/100');
  ok(kpiInPeriod('2026-01-01','2026-01-31','2026-01-31') && !kpiInPeriod('2026-01-01','2026-01-31','2026-02-01') && !kpiInPeriod('','','2026-01-01'), '기간 판정');
  const s = sheet([40,30,30]), line = ['lead','head'];
  ok(kpiSubmitSheet(s,'',false).length===1 && !s.pending, '기간 밖 제출 차단');
  ok(kpiSubmitSheet(s,'',true).length===0 && s.pending, '제출');
  ok(kpiDecide(s,line,'head',true,'','')!==null, '1차를 건너뛴 승인 차단');
  kpiDecide(s,line,'lead',true,'',''); ok(!s.confirmed, '1차 승인만으로는 미확정');
  kpiDecide(s,line,'head',true,'',''); ok(s.confirmed && !s.pending, '2차 승인 후 확정');
  s.draft[0].items[0].weight = 50; s.draft[0].items[1].weight = 20;
  ok(kpiSubmitSheet(s,'',true).length===1, '수정은 사유 필수');
  kpiSubmitSheet(s,'사유',true);
  ok(kpiSubmitSheet(s,'사유',true).length===1, '미결 수정 요청은 1건만');
  ok(kpiDecide(s,line,'lead',false,' ','')!==null, '반려 사유 필수');
  kpiDecide(s,line,'lead',false,'근거 부족','팀장');
  ok(s.confirmed[0].items[0].weight===40 && s.rejectNote && !s.pending, '반려 시 기존 KPI 유지');
  const t = sheet([40,30,30]);
  kpiSubmitSheet(t,'',true); kpiDecide(t,['head'],'head',true,'',''); ok(t.confirmed, '팀장은 본부장 1단계로 확정');
  return 'kpiSelfCheck 통과';
}

function kpiDraft(){ return AUTH.live ? KPI_LIVE.me.plan.draft : kpiSheets[kpiRole].draft; }   // 실제 로그인: 서버 초안 (화면에서 고친 것은 임시 저장해야 남는다)
function kpiOwner(){ return AUTH.live ? AUTH.me.name : KPI_USERS[kpiRole].name; }   // 새 행의 담당자
function kpiFlash(msg, type){ kpiMsg = msg ? {msg, type:type||'success'} : null; renderContent(); }
function kpiStatus(key){
  const s = kpiSheets[key], u = KPI_USERS[key];
  if(s.pending) return [`${kpiApproverName(u.approvers[s.pending.step])} 승인대기${s.confirmed?' (수정요청)':''}`, 'warning'];
  if(s.rejectNote) return ['반려됨', 'danger'];
  if(s.confirmed) return ['확정', 'success'];
  return ['작성중', 'neutral'];
}
function kpiNote(html, type){
  const c = type ? `background:var(--bg-${type}); color:var(--${type});` : '';
  return `<div class="placeholder-note" style="margin:0 0 12px 0; ${c}">${html}</div>`;
}
function kpiTable(goals, o={}){   // o.edit 입력 모드 / o.own 내 확정본(진행률·늦어지는 이유 입력) / o.base 비교 기준. 증빙자료는 평가 진행 탭에서 올린다
  const prog = !AUTH.live;   // 진행률 칸 — 실제 로그인에는 아직 없다 (2단계)
  const txt = (v, path)=> o.edit ? `<textarea class="kpi-in" rows="2"${AUTH.live ? ` maxlength="${KPI_TEXT_MAX[path.split('.').pop()]}"` : ''} oninput="kpiDraft()${path}=this.value">${escapeHtml(v)}</textarea>` : escapeHtml(v);
  const lastCol = (gi,ii)=>`<td><button class="btn sm" onclick="kpiDelItem(${gi},${ii})">행 삭제</button></td>`;
  let flat = 0;
  const rows = goals.map((g,gi)=>g.items.map((it,ii)=>{
    const fi = flat++, b = o.base && o.base[gi], bi = b && b.items[ii];
    const changed = o.base && !(bi && b.team===g.team && b.personal===g.personal && kpiKey(bi)===kpiKey(it));
    const span = ` rowspan="${g.items.length}"`, p = `[${gi}].items[${ii}]`;
    const head = ii>0 ? '' : `<td${span}>${txt(g.team,`[${gi}].team`)}</td><td${span}>${txt(g.personal,`[${gi}].personal`)}`
      + (o.edit ? `<div style="margin:6px 0; font-size:var(--fs-xs); color:var(--text-secondary);">가중치 소계 <b id="kpiSub_${gi}">${kpiSum(g.items)}</b></div><button class="btn sm" onclick="kpiAddItem(${gi})">＋ 실행목표</button>` : '') + `</td>`;
    const weight = o.edit ? `<input type="number" class="kpi-in" min="0" max="100" step="0.01" value="${it.weight||''}" oninput="kpiDraft()${p}.weight=+this.value; kpiRecalc()">` : it.weight;
    return `<tr class="${changed?'changed':''}">${head}<td>${txt(it.action,p+'.action')}</td><td>${txt(it.formula,p+'.formula')}</td><td style="text-align:center;">${weight}</td><td>${txt(it.owner,p+'.owner')}</td>`
      + KPI_GRADES.map(([gr])=>`<td>${txt(it[gr],p+'.'+gr)}</td>`).join('')
      + (prog ? `<td style="text-align:center;">${o.own ? `<input type="number" class="kpi-in" min="0" max="100" step="1" value="${it.progress||0}" oninput="kpiSetProgress(${gi},${ii},this.value)" title="본인이 보는 진행 정도(%). 언제든 수정 가능">` : (it.progress||0)+'%'}</td>` : '')
      + (o.own ? `<td><textarea class="kpi-in" rows="2" maxlength="100" placeholder="팀장·본부장·HR이 봅니다" aria-label="늦어지는 이유" oninput="kpiSetWhy(${gi},${ii},this.value)">${escapeHtml(it.why||'')}</textarea>${kvMuteCell(fi, it)}</td>` : '')
      + (o.edit ? lastCol(gi,ii) : '') + `</tr>`;
  }).join('')).join('');
  const total = kpiSum(goals.flatMap(g=>g.items));
  return `<div class="kpi-wrap"><table class="kpi-table">
    <colgroup><col style="width:120px"><col style="width:130px"><col style="width:170px"><col style="width:140px"><col style="width:74px"><col style="width:84px">${'<col style="width:96px">'.repeat(5)}${prog ? '<col style="width:72px">' : ''}${o.own?'<col style="width:190px">':''}${o.edit?'<col style="width:110px">':''}</colgroup>
    <thead><tr><th>팀목표</th><th>개인목표</th><th>실행목표</th><th>측정식</th><th>가중치</th><th>담당자</th>${KPI_GRADES.map(([gr,pct])=>`<th>${gr}(${pct}%)</th>`).join('')}${prog ? '<th>진행률</th>' : ''}${o.own?'<th>늦어지는 이유 (선택) · 알람</th>':''}${o.edit?'<th>관리</th>':''}</tr></thead>
    <tbody>${rows}<tr><td colspan="4" style="text-align:center; font-weight:700;">합 계</td><td ${o.edit?'id="kpiTotal"':''} style="text-align:center; font-weight:700; color:var(--${total===100?'success':'danger'});">${total}</td><td colspan="${(o.edit||o.own?8:7) - !prog}"></td></tr></tbody>
  </table></div>`;
}
function kpiRecalc(){   // 입력 중에는 다시 그리지 않고(포커스 유지) 합계와 제출 버튼만 갱신
  const goals = kpiDraft(), items = goals.flatMap(g=>g.items), sum = kpiSum(items);
  goals.forEach((g,gi)=>{ const el = document.getElementById('kpiSub_'+gi); if(el) el.textContent = kpiSum(g.items); });
  const t = document.getElementById('kpiTotal');
  if(t){ t.textContent = sum; t.style.color = `var(--${sum===100?'success':'danger'})`; }
  const b = document.getElementById('kpiSubmitBtn');
  if(b) b.disabled = !(sum===100 && items.length>=3);
}
function kpiSetRole(r){ kpiRole = r; kpiEditing = false; kpiReviewKey = null; kpiReason = ''; kvReset(); kpiFlash(null); }
function kpiAddGoal(){ kpiEdited(); kpiDraft().push(kpiNewGoal(kpiOwner())); kpiFlash(null); }
function kpiAddItem(gi){ kpiEdited(); kpiDraft()[gi].items.push(kpiNewItem(kpiOwner())); kpiFlash(null); }
function kpiDelItem(gi, ii){
  kpiEdited();
  const goals = kpiDraft();
  goals[gi].items.splice(ii,1);
  if(!goals[gi].items.length) goals.splice(gi,1);
  if(!goals.length) goals.push(kpiNewGoal(kpiOwner()));
  kpiFlash(null);
}
function kpiCancelEdit(){ const s = kpiSheets[kpiRole]; s.draft = kpiClone(s.confirmed); kpiEditing = false; kpiReason = ''; kpiFlash(null); }
function kpiSubmit(){
  const s = kpiSheets[kpiRole];
  if(s.confirmed && evStarted()) return kpiFlash('올해 평가가 시작돼 KPI를 수정할 수 없습니다. 평가 항목이 바뀌면 이미 적은 실적·점수와 어긋납니다.', 'danger');
  const errs = kpiSubmitSheet(s, kpiReason, kpiInPeriod(kpiPeriod.editFrom, kpiPeriod.editTo) || !!s.rejectNote);   // 반려된 KPI는 작성 기간이 끝나도 고쳐서 다시 낼 수 있다
  if(errs.length) return kpiFlash(errs.map(escapeHtml).join('<br>'), 'danger');
  kpiEditing = false; kpiReason = '';
  kpiFlash(`제출했습니다. ${escapeHtml(kpiApproverName(KPI_USERS[kpiRole].approvers[0]))} 승인을 기다립니다.`);
}
function kpiReview(key, approve){
  const me = KPI_USERS[kpiRole], el = document.getElementById('kpiRejectReason'), s = kpiSheets[key];
  const actor = kpiIsApprover(key, kpiRole) ? KPI_USERS[key].approvers[s.pending.step] : kpiRole;   // 대표이사 차례를 맡은 HR이 대신 승인할 수 있다
  if(approve && s.confirmed && evStarted()) return kpiFlash('올해 평가가 시작된 뒤에는 KPI 수정을 반영할 수 없습니다. 반려해 주세요.', 'danger');
  const err = kpiDecide(s, KPI_USERS[key].approvers, actor, approve, el ? el.value : '', `${me.name} ${me.title}${actor!==kpiRole ? ' (대표이사 대신 입력)' : ''}`);
  if(err) return kpiFlash(escapeHtml(err), 'danger');
  kpiReviewKey = null;
  if(s.confirmed && !s.progAt) s.progAt = kpiDay(0);   // 처음 확정된 날부터 갱신일을 센다
  kpiFlash(!approve ? '반려했습니다. 기존 KPI는 그대로 유지됩니다.' : s.pending ? '승인했습니다. 다음 승인자에게 넘어갔습니다.' : '승인했습니다. KPI가 확정(잠금)되었습니다.');
}
function kpiSetProgress(gi, ii, v){ const s = kpiSheets[kpiRole]; s.confirmed[gi].items[ii].progress = Math.min(100, Math.max(0, Math.round(+v||0))); s.progAt = kpiDay(0); }   // 다시 그리지 않음(포커스 유지)
function kpiSetWhy(gi, ii, v){ const s = kpiSheets[kpiRole]; s.confirmed[gi].items[ii].why = v.trim().slice(0, 100); s.progAt = kpiDay(0); }   // 늦어지는 이유(선택) — 목표 변경이 아니라 기간·승인 제한이 없다

function kpiWaiting(){ return Object.keys(kpiSheets).filter(k=>kpiIsApprover(k, kpiRole)); }   // 지금 역할이 승인할 차례인 사람들
