<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인사 포털 - 사이트 구조 초안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* 배색: 사용자 지정 6색(#D2EEFA #A3D8F1 #54A6E1 #255DAA #DE525E #FCE0D4) 기준.
     글씨 색은 모두 배경 대비 4.5:1 이상. 글자 크기는 --fs-* 6단계만 쓴다. */
  :root{
    --accent:#255DAA; --accent-hover:#1E4C8F; --accent-light:#D2EEFA; --accent-soft:#EAF6FC;
    --sky:#A3D8F1; --sky-mid:#54A6E1; --alert:#DE525E; --coral-text:#C23A47;
    --sidebar-bg:#FFFFFF;
    --sidebar-hover:var(--accent-soft);
    --sidebar-active-bg:var(--accent-light);
    --sidebar-text:#556070;
    --sidebar-text-active:var(--accent);
    --bg-page:#F4F8FB;
    --surface:#FFFFFF;
    --border:#DCE8F0;
    --text-primary:#1B2433;
    --text-secondary:#556070;
    --text-muted:#66707F;
    --success:#11734D; --bg-success:#E3F4EC;
    --warning:#9A3A1F; --bg-warning:#FCE0D4;
    --danger:#A8323C; --bg-danger:#FDECEC;
    --radius-sm:6px; --radius:10px; --radius-lg:14px;
    --fs-xs:12px; --fs-sm:13px; --fs-md:14px; --fs-lg:16px; --fs-xl:20px; --fs-2xl:28px;
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",Roboto,sans-serif;
    background:var(--bg-page);
    color:var(--text-primary);
    display:flex;
    height:100vh; height:100dvh;
    overflow:hidden;
    font-size:var(--fs-sm);
    letter-spacing:-0.01em;
    font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased;
  }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:var(--radius-sm); }
  a{ color:var(--accent); }
  /* ---------- SIDEBAR ---------- */
  .sidebar{
    width:240px; flex-shrink:0; background:var(--sidebar-bg); border-right:1px solid var(--border);
    display:flex; flex-direction:column; height:100%;
  }
  .sidebar-logo{
    display:flex; align-items:center; gap:10px; flex-shrink:0;
    height:60px; padding:0 20px; color:var(--text-primary);
    border-bottom:1px solid var(--border);
  }
  .logo-word{ font-weight:800; font-size:var(--fs-lg); line-height:1.2; }
  .logo-sub{ font-size:var(--fs-xs); color:var(--text-muted); margin-top:1px; }
  .sidebar-nav{ flex:1; overflow-y:auto; padding:12px 10px; }
  .nav-item{
    display:flex; align-items:center; gap:11px;
    padding:10px 12px; margin-bottom:2px; border-radius:var(--radius-sm);
    color:var(--sidebar-text); cursor:pointer; user-select:none;
    transition:background .2s var(--ease), color .2s var(--ease);
  }
  .nav-item:hover{ background:var(--sidebar-hover); color:var(--text-primary); }
  .nav-item.active{
    background:var(--sidebar-active-bg); color:var(--sidebar-text-active); font-weight:600;
    box-shadow:inset 3px 0 0 var(--accent);
  }
  .nav-item svg{ width:18px; height:18px; flex-shrink:0; }
  .nav-item span{ font-size:var(--fs-md); }
  .sidebar-foot{
    padding:14px 20px; border-top:1px solid var(--border);
    color:var(--text-muted); font-size:var(--fs-xs); line-height:1.5;
  }
  /* ---------- MAIN ---------- */
  .main{ flex:1; display:flex; flex-direction:column; min-width:0; height:100%; }
  .topbar{
    height:60px; flex-shrink:0; background:var(--surface); border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between; padding:0 24px;
  }
  .topbar-title{ font-size:var(--fs-lg); font-weight:700; margin:0; }
  .topbar-search{
    display:flex; align-items:center; gap:8px; background:var(--bg-page);
    border:1px solid var(--border); border-radius:var(--radius-sm); padding:7px 12px; width:320px; color:var(--text-muted);
  }
  .topbar-search:focus-within{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-light); }
  .topbar-search svg{ width:15px;height:15px;flex-shrink:0; }
  .topbar-search input{
    border:none; background:transparent; outline:none; font:inherit; font-size:var(--fs-sm); width:100%; color:var(--text-primary);
  }
  .topbar-right{ display:flex; align-items:center; gap:16px; }
  .icon-btn{ width:34px; height:34px; border-radius:var(--radius-sm); display:flex; align-items:center; justify-content:center;
    color:var(--text-secondary); cursor:pointer; position:relative; border:0; background:none; padding:0;
    transition:background .2s var(--ease); }
  .icon-btn:hover{ background:var(--bg-page); }
  .icon-btn svg{ width:18px; height:18px; }
  .dot{ position:absolute; top:6px; right:6px; width:7px; height:7px; border-radius:50%; background:var(--alert); border:1.5px solid #fff; }
  .avatar{ width:32px; height:32px; border-radius:var(--radius); background:var(--accent-light); color:var(--accent);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:var(--fs-xs); }
  .subtabs{
    height:46px; flex-shrink:0; background:var(--surface); border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:4px; padding:0 24px; overflow-x:auto;
  }
  .subtab{
    padding:8px 14px; border-radius:var(--radius-sm); color:var(--text-secondary); font-size:var(--fs-md);
    cursor:pointer; white-space:nowrap; font-weight:500; transition:background .2s var(--ease), color .2s var(--ease);
  }
  .subtab:hover{ background:var(--bg-page); color:var(--text-primary); }
  .subtab.active{ background:var(--accent-light); color:var(--accent); font-weight:700; }
  .content{ flex:1; overflow-y:auto; padding:24px 28px 48px 28px; }
  .breadcrumb{ font-size:var(--fs-xs); color:var(--text-muted); margin-bottom:14px; }
  .breadcrumb b{ color:var(--text-secondary); font-weight:600; }

  /* ---------- CONTENT PRIMITIVES ---------- */
  .grid{ display:grid; gap:14px; }
  .g4{ grid-template-columns:repeat(4,1fr); }
  .g3{ grid-template-columns:repeat(3,1fr); }
  .g2{ grid-template-columns:repeat(2,1fr); }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; }
  .card-title{ font-size:var(--fs-md); font-weight:700; margin:0 0 12px 0; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .card-title .more{ font-size:var(--fs-xs); font-weight:600; color:var(--accent); cursor:pointer; }
  .more{ color:var(--accent); cursor:pointer; font-weight:600; }
  .stat-label{ font-size:var(--fs-xs); color:var(--text-secondary); margin-bottom:6px; }
  .stat-value{ font-size:var(--fs-2xl); font-weight:700; letter-spacing:-0.02em; }
  .stat-sub{ font-size:var(--fs-xs); color:var(--text-muted); margin-top:4px; }
  .bar-track{ height:6px; background:var(--bg-warning); border-radius:4px; margin-top:10px; overflow:hidden; }
  .bar-fill{ height:100%; background:var(--alert); border-radius:4px; transition:width .4s var(--ease); }
  table{ width:100%; border-collapse:collapse; font-size:var(--fs-sm); }
  th{ text-align:left; color:var(--text-muted); font-weight:600; font-size:var(--fs-xs); padding:8px 10px; border-bottom:1px solid var(--border); }
  td{ padding:10px 10px; border-bottom:1px solid var(--border); color:var(--text-primary); }
  tr:last-child td{ border-bottom:none; }
  .badge{ display:inline-block; padding:3px 8px; border-radius:var(--radius-sm); font-size:var(--fs-xs); font-weight:700; white-space:nowrap; }
  .badge.success{ background:var(--bg-success); color:var(--success); }
  .badge.warning{ background:var(--bg-warning); color:var(--warning); }
  .badge.danger{ background:var(--bg-danger); color:var(--danger); }
  .badge.neutral{ background:#EEF2F6; color:var(--text-secondary); }
  .btn{ display:inline-flex; align-items:center; gap:6px; padding:9px 16px; border-radius:var(--radius-sm); font-size:var(--fs-sm);
    font-weight:600; cursor:pointer; border:1px solid var(--border); background:var(--surface); color:var(--text-primary);
    text-decoration:none; transition:background .2s var(--ease), border-color .2s var(--ease), transform .1s var(--ease); }
  .btn:hover{ background:var(--accent-soft); border-color:var(--sky); }
  .btn:active{ transform:translateY(1px); }
  .btn svg{ width:15px; height:15px; flex-shrink:0; }
  .btn.primary{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .btn.primary:hover{ background:var(--accent-hover); border-color:var(--accent-hover); }
  .quick-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
  .quick-btn{ display:flex; flex-direction:column; align-items:center; gap:8px; padding:6px 0;
    text-align:center; cursor:pointer; border-radius:var(--radius); }
  .quick-btn .qicon{ width:64px; height:64px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; transition:transform .25s var(--ease); }
  .quick-btn .qicon img{ width:40px; height:40px; }
  .quick-btn:hover .qicon{ transform:translateY(-3px) scale(1.04); }
  .quick-btn .qlabel{ font-size:var(--fs-sm); font-weight:600; color:var(--text-primary); }
  .hero-banner{
    background:var(--accent-light);
    border-radius:var(--radius-lg); padding:28px 32px; margin-bottom:14px;
    position:relative; overflow:hidden;
  }
  .hero-banner::before, .hero-banner::after{ content:""; position:absolute; border-radius:50%; }
  .hero-banner::before{ width:220px; height:220px; right:-50px; top:-70px; background:var(--sky); }
  .hero-banner::after{ width:130px; height:130px; right:110px; bottom:-70px; background:var(--bg-warning); }
  .hero-title{ font-size:var(--fs-xl); font-weight:800; color:var(--text-primary); line-height:1.4; letter-spacing:-0.02em; margin:0 0 6px; position:relative; z-index:1; }
  .hero-sub{ font-size:var(--fs-sm); color:#3A4A5E; position:relative; z-index:1; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px; }
  .field label{ display:block; font-size:var(--fs-xs); font-weight:600; color:var(--text-secondary); margin-bottom:6px; }
  .field input, .field select, .field textarea{
    width:100%; border:1px solid var(--border); border-radius:var(--radius-sm); padding:9px 11px; font-size:var(--fs-sm);
    font-family:inherit; color:var(--text-primary); background:var(--surface); transition:border-color .2s var(--ease), box-shadow .2s var(--ease);
  }
  .field input:focus, .field select:focus, .field textarea:focus, .kpi-in:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-light); }
  .divider{ height:1px; background:var(--border); margin:18px 0; }
  .placeholder-note{ font-size:var(--fs-xs); color:var(--text-secondary); background:var(--bg-page); border-radius:var(--radius-sm); padding:10px 12px; margin-top:14px; line-height:1.6; }
  .hidden{ display:none !important; }
  .list-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 0; border-bottom:1px solid var(--border); }
  .list-row:last-child{ border-bottom:none; }
  .list-title{ font-size:var(--fs-md); font-weight:600; }
  .list-sub{ font-size:var(--fs-xs); color:var(--text-muted); margin-top:2px; }
  .ico{ width:15px; height:15px; vertical-align:-2px; }
  /* ---------- KPI ---------- */
  button.btn{ font-family:inherit; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn.sm{ font-size:var(--fs-xs); padding:5px 10px; }
  .kpi-wrap{ overflow-x:auto; }
  .kpi-table{ min-width:1400px; table-layout:fixed; }
  .kpi-table th, .kpi-table td{ vertical-align:top; border:1px solid var(--border); padding:6px; white-space:pre-wrap; word-break:break-word; }
  .kpi-table th{ background:var(--bg-page); text-align:center; }
  .kpi-table tr.changed td{ background:var(--bg-warning); }
  .kpi-in{ width:100%; border:1px solid var(--border); border-radius:var(--radius-sm); padding:6px 8px; font:inherit; font-size:var(--fs-xs); resize:vertical; background:var(--surface); color:var(--text-primary); }
  .kpi-file{ font-size:var(--fs-xs); color:var(--text-secondary); margin-bottom:4px; display:flex; align-items:center; gap:4px; }
  .kpi-file span{ color:var(--danger); cursor:pointer; font-weight:700; }
  /* ---------- ORG ---------- */
  .org-chart{ text-align:center; font-size:var(--fs-sm); line-height:1; }
  .org-grid{ display:grid; grid-template-columns:repeat(var(--org-cols,6),minmax(0,1fr)); gap:8px; }
  .org-col{ display:flex; flex-direction:column; align-items:center; min-width:0; }
  .org-bx{ width:100%; display:flex; align-items:center; justify-content:center; gap:5px; white-space:nowrap; overflow:hidden; padding:0 6px; border-radius:var(--radius-sm); }
  .org-ceo{ width:auto; height:38px; padding:0 28px; background:var(--bg-warning); color:var(--warning); font-weight:700; }
  .org-divbx{ height:44px; background:var(--accent); color:#fff; font-weight:700; font-size:var(--fs-xs); }
  .org-headbx{ height:32px; border:1px solid var(--border); background:var(--surface); margin-top:6px; }
  .org-teambx{ height:34px; background:var(--accent-light); color:var(--accent); font-weight:700; margin-top:10px; cursor:pointer; border-radius:var(--radius-sm) var(--radius-sm) 0 0; transition:filter .2s var(--ease); }
  .org-teambx:hover{ filter:brightness(.96); }
  .org-teambx small{ font-weight:500; color:var(--text-secondary); }
  .org-leadbx{ height:30px; border:1px solid var(--border); border-top:0; background:var(--surface); border-radius:0 0 var(--radius-sm) var(--radius-sm); color:var(--text-secondary); }
  .org-vline{ width:0; border-left:1px solid var(--border); height:12px; }
  .org-hline{ width:84%; border-top:1px solid var(--border); margin:0 auto; }
  .org-muted{ color:var(--text-muted); font-weight:500; }
  .org-member{ display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--border); font-size:var(--fs-sm); flex-wrap:wrap; }
  .org-member:last-child{ border-bottom:none; }
  .org-name{ color:var(--accent); font-weight:600; cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
  .org-modal{ position:fixed; inset:0; background:rgba(27,36,51,.45); z-index:60; display:flex; align-items:center; justify-content:center; padding:16px; }
  .org-modal .card{ width:100%; max-width:420px; max-height:90vh; overflow-y:auto; box-shadow:0 20px 40px -16px rgba(37,93,170,.35); }
  .org-contact{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 0; border-bottom:1px solid var(--border); font-size:var(--fs-sm); }
  .org-contact b{ min-width:64px; color:var(--text-secondary); font-weight:600; }
  .org-contact span{ flex:1; }
  .org-actions{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px; }
  .org-actions a{ text-decoration:none; justify-content:center; }
  .x-btn{ border:0; background:none; cursor:pointer; color:var(--text-secondary); width:32px; height:32px; border-radius:var(--radius-sm); display:inline-flex; align-items:center; justify-content:center; padding:0; }
  .x-btn:hover{ background:var(--bg-page); color:var(--text-primary); }
  .x-btn svg{ width:18px; height:18px; }

  /* ---------- 경조사 배너 ---------- */
  .celeb{ margin-bottom:14px; }
  .celeb-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px; }
  .celeb-head h3{ font-size:var(--fs-md); font-weight:700; margin:0; }
  .celeb-row{ display:flex; gap:12px; overflow-x:auto; padding:4px 2px 10px; scroll-snap-type:x mandatory; }
  .celeb-bn{ position:relative; flex:0 0 232px; aspect-ratio:670/290; border-radius:var(--radius-lg); overflow:hidden; cursor:pointer; border:0; padding:0; background:none; scroll-snap-align:start; transition:transform .25s var(--ease), box-shadow .25s var(--ease); }
  .celeb-bn:hover{ transform:translateY(-4px); box-shadow:0 10px 22px -10px rgba(37,93,170,.35); }
  .celeb-bn > img{ width:100%; height:100%; object-fit:cover; transform:scale(1.035); display:block; }
  .celeb-count{ position:absolute; right:10px; bottom:8px; font-size:var(--fs-xs); font-weight:700; color:var(--text-primary); background:rgba(255,255,255,.85); padding:2px 8px; border-radius:var(--radius-sm); }
  .fx{ position:absolute; pointer-events:none; }
  .fx-flame{ width:7%; height:17%; border-radius:50%; background:radial-gradient(ellipse at 50% 60%,rgba(255,245,180,.95) 0 22%,rgba(255,190,60,.55) 45%,rgba(255,150,40,0) 70%); mix-blend-mode:screen; transform-origin:50% 90%; animation:fxFlick .45s ease-in-out infinite alternate; }
  @keyframes fxFlick{ 0%{transform:translate(-50%,-55%) scale(.85,1) rotate(-5deg); opacity:.75} 100%{transform:translate(-50%,-60%) scale(1.1,1.25) rotate(5deg); opacity:1} }
  .fx-heart{ color:#FF6FA0; font-size:14px; opacity:0; text-shadow:0 1px 2px rgba(255,255,255,.7); animation:fxRise 3s ease-in infinite; }
  @keyframes fxRise{ 0%{transform:translateY(0) scale(.5); opacity:0} 20%{opacity:1} 100%{transform:translateY(-58px) scale(1.15) rotate(12deg); opacity:0} }
  .fx-spark{ width:12px; height:12px; background:#fff; opacity:0; clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%); animation:fxTwinkle 2.2s ease-in-out infinite; }
  @keyframes fxTwinkle{ 0%,100%{transform:scale(.3) rotate(0); opacity:0} 50%{transform:scale(1) rotate(45deg); opacity:1} }
  .fx-wave{ width:22px; height:30px; border:3px solid #FF7FA8; border-color:transparent transparent transparent #FF7FA8; border-radius:50%; opacity:0; animation:fxWave 1.5s ease-out infinite; }
  @keyframes fxWave{ 0%{transform:translate(-50%,-50%) scale(.5); opacity:0} 30%{opacity:.9} 100%{transform:translate(-130%,-50%) scale(1.5); opacity:0} }
  .fx-shine{ inset:0; background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%); background-size:250% 100%; animation:fxShine 3.6s ease-in-out infinite; }
  @keyframes fxShine{ 0%,40%{background-position:120% 0} 100%{background-position:-60% 0} }
  .celeb-person{ display:grid; grid-template-columns:40px minmax(0,1fr); gap:12px; padding:12px 0; border-bottom:1px solid var(--border); }
  .celeb-person:last-child{ border-bottom:none; }
  .celeb-av{ width:40px; height:40px; border-radius:var(--radius); background:var(--accent-light); color:var(--accent); display:flex; align-items:center; justify-content:center; font-weight:700; }
  .celeb-acts{ display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  @media (min-width:1100px){ .celeb-row{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); overflow:visible; } }
  @media (prefers-reduced-motion:reduce){ .fx{ display:none; } }

  /* ---------- 전자연봉계약서 ---------- */
  .ct-rates{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,2fr); gap:12px; }
  .ct-rates > div{ background:var(--bg-page); border-radius:var(--radius-sm); padding:10px 12px; }
  .ct-rate{ display:inline-flex; align-items:center; gap:4px; font-weight:600; font-size:var(--fs-sm); }
  .ct-rate input{ width:64px; border:1px solid var(--border); border-radius:var(--radius-sm); padding:5px 7px; font:inherit; text-align:right; background:var(--surface); }
  .ct-tbl{ overflow-x:auto; }
  td.num, th.num{ text-align:right; }
  .ct-scroll{ border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface); }
  .ct-scroll.gated{ max-height:560px; overflow-y:auto; }
  .ct-doc{ padding:24px 28px; line-height:1.75; font-size:var(--fs-sm); max-width:860px; margin:0 auto; }
  .ct-doc h4{ font-size:var(--fs-md); font-weight:700; margin:18px 0 4px; }
  .ct-doc p{ margin:0 0 2px; }
  .ct-doc table{ font-size:var(--fs-xs); margin:6px 0 8px; min-width:560px; }
  .ct-doc th, .ct-doc td{ border:1px solid var(--border); padding:6px; text-align:center; }
  .ct-doc th{ background:var(--bg-page); color:var(--text-secondary); }
  .ct-doc-title{ text-align:center; font-size:var(--fs-xl); font-weight:800; letter-spacing:.4em; margin-bottom:16px; }
  .ct-kv{ display:grid; grid-template-columns:80px minmax(0,1fr) 90px minmax(0,1fr); border:1px solid var(--border); border-radius:var(--radius-sm); overflow:hidden; font-size:var(--fs-xs); }
  .ct-kv > div{ padding:7px 9px; border-bottom:1px solid var(--border); }
  .ct-kv .k{ background:var(--bg-page); color:var(--text-secondary); font-weight:600; }
  .ct-kv .span3{ grid-column:span 3; }
  .ct-amt{ color:var(--accent); font-size:var(--fs-md); }
  .ct-center{ text-align:center; }
  .ct-signs{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px; align-items:center; }
  .ct-sigline{ display:inline-block; width:90px; border-bottom:1px solid var(--sky); margin-left:6px; vertical-align:middle; }

/* ---- 경비 산출기 로직 ---- */
let expDestinations = [''];
let expDistanceMode = 'auto';
let expLastResult = null;
let expSearchCache = {};
const EXP_PRESETS = { yongin: '경기도 용인시 처인구 처인성로41-16', suwon: '경기도 수원시 신원로88' };

function expSetPreset(target, key){
  const inputId = target==='departure' ? 'expDeparture' : `expDest_${target}`;
  const resultsId = target==='departure' ? 'expDepartureResults' : `expDestResults_${target}`;
  document.getElementById(inputId).value = EXP_PRESETS[key];
  if(target!=='departure'){ expDestinations[target] = EXP_PRESETS[key]; }
  document.getElementById(resultsId).innerHTML = '';
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function expErrorBox(msg){
  return `<div class="placeholder-note" style="background:var(--bg-danger); color:var(--danger);">${escapeHtml(msg)}</div>`;
}
function expRenderDestinations(){
  const wrap = document.getElementById('expDestWrap');
  if(!wrap) return;
  wrap.innerHTML = expDestinations.map((addr, i) => `
    <div class="field" style="margin-bottom:10px;">
      <label>출장지 ${i+1}${expDestinations.length>1?` <span style="font-size:var(--fs-xs); font-weight:600; color:var(--danger); cursor:pointer;" onclick="expRemoveDestination(${i})">삭제</span>`:''}</label>
      <div style="display:flex; gap:8px;">
        <input id="expDest_${i}" style="flex:1;" value="${escapeHtml(addr)}" oninput="expDestinations[${i}]=this.value" placeholder="예: 경기도 수원시 신원로 88"/>
        <span class="btn" style="flex-shrink:0; white-space:nowrap;" onclick="expSearchPlace(${i})">${icon('search')} 검색</span>
      </div>
      <div style="margin-top:6px; display:flex; gap:6px;">
        <span class="btn" style="font-size:var(--fs-xs); padding:5px 10px;" onclick="expSetPreset(${i},'yongin')">용인사무실</span>
        <span class="btn" style="font-size:var(--fs-xs); padding:5px 10px;" onclick="expSetPreset(${i},'suwon')">수원사무실</span>
      </div>
      <div id="expDestResults_${i}"></div>
    </div>`).join('');
}

async function expSearchPlace(target){
  const inputId = target==='departure' ? 'expDeparture' : `expDest_${target}`;
  const resultsId = target==='departure' ? 'expDepartureResults' : `expDestResults_${target}`;
  const inputEl = document.getElementById(inputId);
  const resultsEl = document.getElementById(resultsId);
  const query = inputEl.value.trim();
  if(!query){ resultsEl.innerHTML=''; return; }
  resultsEl.innerHTML = '<div class="placeholder-note">검색 중...</div>';
  try{
    const res = await fetch('/api/search-places', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({query})});
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || '검색에 실패했습니다.');
    expSearchCache[target] = data.results || [];
    if(!expSearchCache[target].length){ resultsEl.innerHTML = '<div class="placeholder-note">검색 결과가 없습니다. 도로명 주소를 직접 입력해 보세요.</div>'; return; }
    resultsEl.innerHTML = expSearchCache[target].map((r,i) => `
      <div class="list-row" style="cursor:pointer;" onclick='expPickPlace(${JSON.stringify(target)}, ${i})'>
        <div><div class="list-title">${escapeHtml(r.name)}</div><div class="list-sub">${escapeHtml(r.road_address)}</div></div>
      </div>`).join('');
  }catch(err){
    resultsEl.innerHTML = expErrorBox(err.message);
  }
}
function expPickPlace(target, idx){
  const place = expSearchCache[target][idx];
  const inputId = target==='departure' ? 'expDeparture' : `expDest_${target}`;
  const resultsId = target==='departure' ? 'expDepartureResults' : `expDestResults_${target}`;
  document.getElementById(inputId).value = place.road_address;
  if(target!=='departure'){ expDestinations[target] = place.road_address; }
  document.getElementById(resultsId).innerHTML = '';
}
async function expCalculate(){
  const msgEl = document.getElementById('expMessage');
  const resultEl = document.getElementById('expResult');
  msgEl.innerHTML=''; resultEl.innerHTML='';

  const payload = {
    trip_date: document.getElementById('expDate').value,
    vehicle_type: document.getElementById('expVehicle').value,
    fuel_type: document.getElementById('expFuel').value,
  };

  if(expDistanceMode==='manual'){
    const total = Number(document.getElementById('expManualTotal').value);
    const destCount = Number(document.getElementById('expManualDestCount').value) || 1;
    if(!total || total<=0){ msgEl.innerHTML = expErrorBox('총 이동거리를 입력해 주세요.'); return; }
    payload.manual_distance = { total_km: total, destination_count: destCount };
  } else {
    const departure = document.getElementById('expDeparture').value.trim();
    const destinations = expDestinations.map(d=>d.trim()).filter(Boolean);
    if(!departure){ msgEl.innerHTML = expErrorBox('출발지를 입력해 주세요.'); return; }
    if(!destinations.length){ msgEl.innerHTML = expErrorBox('출장지를 1곳 이상 입력해 주세요.'); return; }
    payload.departure = departure;
    payload.destinations = destinations;
  }

  msgEl.innerHTML = '<div class="placeholder-note">계산 중입니다... (지도·유가 조회에 몇 초 걸릴 수 있습니다)</div>';
  try{
    const res = await fetch('/api/calculate', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || '계산에 실패했습니다.');
    expLastResult = data;
    msgEl.innerHTML = '';
    resultEl.innerHTML = expRenderResult(data);
  }catch(err){
    msgEl.innerHTML = expErrorBox(err.message);
  }
}

async function expDownload(kind){
  if(!expLastResult){ return; }
  const payload = Object.assign({}, expLastResult);
  if(kind==='application-form'){
    const nameEl = document.getElementById('expApplicantName');
    payload.applicant_name = nameEl ? nameEl.value : '';
  }
  try{
    const res = await fetch(`/api/export/${kind}`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
    if(!res.ok){
      const data = await res.json().catch(()=>({}));
      throw new Error(data.error || '다운로드에 실패했습니다.');
    }
    const blob = await res.blob();
    const disposition = res.headers.get('Content-Disposition') || '';
    const starMatch = disposition.match(/filename\*=UTF-8''([^;]+)/);
    const plainMatch = disposition.match(/filename="?([^";]+)"?/);
    const filename = starMatch ? decodeURIComponent(starMatch[1]) : (plainMatch ? plainMatch[1] : `출장경비.${kind==='excel'?'xlsx':'pdf'}`);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }catch(err){
    document.getElementById('expMessage').innerHTML = expErrorBox(err.message);
  }
}

/* ----- 규칙 (순수 로직, orgSelfCheck가 검증) ----- */
function orgValidate(m, members){
  const errs = [], div = ORG_TREE.find(d=>d.division===m.division);
  if(!m.name.trim()) errs.push('이름을 입력해 주세요.');
  if(!m.title.trim()) errs.push('직급을 입력해 주세요.');
  if(!div) errs.push('본부를 선택해 주세요.');
  if(m.team && !orgTeamsOf(m.division).includes(m.team)) errs.push('선택한 본부에 없는 팀입니다.');
  if(m.lead==='TEAM' && !m.team) errs.push('팀장은 팀 소속이어야 합니다.');
  if(m.lead==='DIVISION' && div && div.noHead) errs.push('이 본부는 본부장을 두지 않습니다.');
  const others = members.filter(o=>o.id!==m.id);
  if(m.lead==='TEAM' && others.some(o=>o.lead==='TEAM' && o.division===m.division && o.team===m.team)) errs.push('이 팀에는 이미 팀장이 있습니다.');
  if(m.lead==='DIVISION' && others.some(o=>o.lead==='DIVISION' && o.division===m.division)) errs.push('이 본부에는 이미 본부장이 있습니다.');
  if(m.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m.email)) errs.push('메일 형식이 올바르지 않습니다.');
  if(m.birthday && !celebValidMd(m.birthday)) errs.push('생일은 월-일 형식으로 입력해 주세요. (예: 03-15)');
  return errs;
}
function orgUpsert(members, m, isHr){
  if(!isHr) return ['조직도 수정은 HR 관리자만 할 수 있습니다.'];
  const errs = orgValidate(m, members);
  if(errs.length) return errs;
  const i = members.findIndex(o=>o.id===m.id);
  if(i<0){ m.id = ++orgSeq; members.push(m); } else members[i] = m;
  return [];
}
function orgRemove(members, id, isHr){
  if(!isHr) return ['조직도 수정은 HR 관리자만 할 수 있습니다.'];
  const i = members.findIndex(o=>o.id===id);
  if(i>=0) members.splice(i,1);
  return [];
}
function orgVisibleContacts(m){ return { ext:m.ext, email:m.email, mobile: m.hideMobile ? null : m.mobile }; }
function orgSelfCheck(){   // 브라우저 콘솔에서 orgSelfCheck() 실행
  const ok = (c,msg)=>{ if(!c) throw new Error('orgSelfCheck 실패: '+msg); };
  const ms = orgMembers.map(m=>({...m}));
  const mk = o=>({ id:0, name:'테스트', title:'사원', division:'DR사업본부', team:'Device 개발팀', lead:'', hideMobile:false, mobile:'', ext:'', email:'', ...o });
  ok(orgUpsert(ms, mk({}), false).length===1, 'HR 아니면 등록 불가');
  ok(orgRemove(ms, ms[0].id, false).length===1 && ms.length===orgMembers.length, 'HR 아니면 삭제 불가');
  ok(orgUpsert(ms, mk({}), true).length===0 && ms.length===orgMembers.length+1, 'HR 등록');
  ok(orgUpsert(ms, mk({name:' '}), true).length===1, '이름 필수');
  ok(orgUpsert(ms, mk({lead:'TEAM'}), true).length===1, '팀장 중복 불가');
  ok(orgUpsert(ms, mk({team:'솔루션 개발팀', lead:'TEAM'}), true).length===1, '이미 팀장 있는 팀');
  ok(orgUpsert(ms, mk({division:'솔루션사업본부', team:'솔루션 제조팀', lead:'DIVISION'}), true).length===0, '본부장 없는 본부에 본부장 등록');
  ok(orgUpsert(ms, mk({division:'대표이사 직속부서', team:'지원팀', lead:'DIVISION'}), true).length===1, '대표이사 직속은 본부장 없음');
  ok(orgUpsert(ms, mk({team:'CsI팀'}), true).length===1, '다른 본부의 팀 선택 불가');
  ok(orgUpsert(ms, mk({email:'nope'}), true).length===1, '메일 형식');
  ok(orgVisibleContacts(mk({hideMobile:true, mobile:'x'})).mobile===null && orgVisibleContacts(mk({mobile:'x'})).mobile==='x', '휴대폰 비공개');
  const last = ms[ms.length-1]; orgRemove(ms, last.id, true); ok(!ms.some(o=>o.id===last.id), 'HR 삭제');
  return 'orgSelfCheck 통과';
}

/* ---------------- KPI 목표설정 ----------------
   시연용: 데이터는 브라우저 메모리에만 있고 새로고침하면 초기화된다.
   로그인·DB가 생기면 역할 전환 버튼을 없애고 backend/hr_eval 유스케이스에 연결한다.
   규칙 원본: docs/superpowers/specs/2026-09-21-kpi-goal-screen-design.md */
const KPI_YEAR = new Date().getFullYear();
const KPI_GRADES = [['S',110],['A',100],['B',90],['C',80],['D',70]];
const KPI_ACCEPT = '.pdf,.jpg,.jpeg,.png,.xlsx,.xls,.docx,.doc,.hwp,.hwpx';
const KPI_USERS = {   // approvers = 결재선 (순서대로)
  emp:  { name:'홍길동', title:'대리',    dept:'국내영업팀',   switchLabel:'직원',   approvers:['lead','head'] },
  lead: { name:'김영희', title:'팀장',    dept:'국내영업팀',   switchLabel:'팀장',   approvers:['head'] },
  head: { name:'이철수', title:'본부장',  dept:'전략마케팅본부', switchLabel:'본부장', approvers:['hr'] },
  hr:   { name:'박인사', title:'HR 담당', dept:'지원팀',       switchLabel:'HR',     approvers:[] },
};
function kpiDay(offset){
  const d = new Date(); d.setDate(d.getDate()+offset);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function kpiInPeriod(from, to, today=kpiDay(0)){ return !!from && !!to && from<=today && today<=to; }
function kpiClone(x){ return JSON.parse(JSON.stringify(x)); }
function kpiNewItem(owner){ return { action:'', formula:'', weight:0, owner, S:'', A:'', B:'', C:'', D:'', progress:0, files:[] }; }
function kpiNewGoal(owner, n=1){ return { team:'', personal:'', items:Array.from({length:n}, ()=>kpiNewItem(owner)) }; }
function kpiSum(items){ return Math.round(items.reduce((a,i)=>a+(+i.weight||0),0)*100)/100; }
function kpiKey(item){ return JSON.stringify({...item, files:undefined, progress:undefined}); }   // 증빙·진행률은 목표 변경이 아니다
function kpiProgress(goals){ const items = goals.flatMap(g=>g.items); return Math.round(items.reduce((a,i)=>a+(+i.weight||0)*(+i.progress||0),0)/100); }   // 가중 달성률 (가중치 합 100 전제)

const kpiPeriod = { editFrom:kpiDay(-7), editTo:kpiDay(7), evalFrom:KPI_YEAR+'-12-01', evalTo:KPI_YEAR+'-12-15' };
const kpiSeed = [
  { team:'신규 고객 채널 확대', personal:'온라인 리드 확보 체계 구축', items:[
    { ...kpiNewItem('홍길동'), action:'월 1회 타깃 콘텐츠 발행', formula:'연간 발행 건수', weight:40, progress:75, S:'14건 이상', A:'12건', B:'11건', C:'10건', D:'9건 이하' },
    { ...kpiNewItem('홍길동'), action:'분기별 웨비나 개최', formula:'연간 개최 횟수', weight:30, progress:50, S:'5회 이상', A:'4회', B:'3회', C:'2회', D:'1회 이하' },
  ]},
  { team:'브랜드 인지도 제고', personal:'전시회 성과 관리', items:[
    { ...kpiNewItem('홍길동'), action:'전시회 상담 리드 DB 등록 (전시 종료 후 2주 내)', formula:'DB 등록률(%)', weight:30, progress:57, S:'100%', A:'95%', B:'90%', C:'85%', D:'80% 미만' },
  ]},
];
const kpiSheets = {   // confirmed=확정본, draft=작성 중, pending=승인 대기 {rows,reason,step}
  emp:  { confirmed:kpiClone(kpiSeed), draft:kpiClone(kpiSeed), pending:null, rejectNote:null },
  lead: { confirmed:null, draft:[kpiNewGoal('김영희',3)], pending:null, rejectNote:null },
  head: { confirmed:null, draft:[kpiNewGoal('이철수',3)], pending:null, rejectNote:null },
};
let kpiRole = 'emp', kpiEditing = false, kpiReviewKey = null, kpiReason = '', kpiMsg = null;

/* ----- 규칙 (화면과 분리된 순수 로직, kpiSelfCheck가 검증) ----- */
function kpiValidate(goals){
  const items = goals.flatMap(g=>g.items), errs = [];
  if(items.length<3) errs.push('실행목표(KPI)는 최소 3개 이상이어야 합니다.');
  if(goals.some(g=>!g.team.trim()||!g.personal.trim())) errs.push('팀목표와 개인목표를 모두 입력해 주세요.');
  if(items.some(i=>!i.action.trim()||!i.formula.trim())) errs.push('실행목표와 측정식을 모두 입력해 주세요.');
  if(items.some(i=>!(i.weight>0))) errs.push('가중치는 모두 0보다 커야 합니다.');
  if(kpiSum(items)!==100) errs.push(`가중치 합계가 100이어야 합니다. (현재 ${kpiSum(items)})`);
  return errs;
}
function kpiSubmitSheet(sheet, reason, editOpen){
  if(!editOpen) return ['지금은 KPI 작성·수정 기간이 아닙니다.'];
  if(sheet.pending) return ['이미 승인 대기 중인 건이 있습니다.'];
  const errs = kpiValidate(sheet.draft);
  if(sheet.confirmed && !reason.trim()) errs.push('수정 사유를 입력해 주세요.');
  if(!errs.length){ sheet.pending = { rows:kpiClone(sheet.draft), reason:reason.trim(), step:0 }; sheet.rejectNote = null; }
  return errs;
}
function kpiDecide(sheet, approvers, actor, approve, reason, actorLabel){
  const p = sheet.pending;
  if(!p || approvers[p.step]!==actor) return '지금 이 건을 승인할 차례가 아닙니다.';
  if(!approve){
    if(!reason.trim()) return '반려 사유를 입력해 주세요.';
    sheet.draft = p.rows; sheet.pending = null; sheet.rejectNote = `${actorLabel} 반려: ${reason.trim()}`;
    return null;
  }
  // ponytail: 승인 대기 중 확정본에 올린 증빙·진행률은 새 확정본으로 안 넘어간다. 실제 저장 땐 KPI 행 id에 묶는다.
  if(++p.step>=approvers.length){ sheet.confirmed = p.rows; sheet.draft = kpiClone(p.rows); sheet.pending = null; }
  return null;
}
function kpiSelfCheck(){   // 브라우저 콘솔에서 kpiSelfCheck() 실행
  const ok = (c,m)=>{ if(!c) throw new Error('kpiSelfCheck 실패: '+m); };
  const g = ws=>[{ team:'t', personal:'p', items:ws.map(w=>({...kpiNewItem('x'), action:'a', formula:'f', weight:w})) }];
  const sheet = ws=>({ confirmed:null, draft:g(ws), pending:null, rejectNote:null });
  ok(kpiValidate(g([50,50])).length===1, '2개는 거부');
  ok(kpiValidate(g([40,30,30])).length===0, '3개·합 100 통과');
  ok(kpiValidate(g([40,30,29.99])).length===1, '합 99.99 거부');
  ok(kpiValidate(g(Array(10).fill(10))).length===0, '개수 상한 없음');
  ok(kpiProgress(kpiSeed)===62 && kpiProgress(g([100]))===0, '가중 달성률 = Σ(가중치×진행률)/100');
  ok(kpiInPeriod('2026-01-01','2026-01-31','2026-01-31') && !kpiInPeriod('2026-01-01','2026-01-31','2026-02-01') && !kpiInPeriod('','','2026-01-01'), '기간 판정');
  const s = sheet([40,30,30]), line = ['lead','head'];
  ok(kpiSubmitSheet(s,'',false).length===1 && !s.pending, '기간 밖 제출 차단');
  ok(kpiSubmitSheet(s,'',true).length===0 && s.pending, '제출');
  ok(kpiDecide(s,line,'head',true,'','')!==null, '1차를 건너뛴 승인 차단');
  kpiDecide(s,line,'lead',true,'',''); ok(!s.confirmed, '1차 승인만으로는 미확정');
  kpiDecide(s,line,'head',true,'',''); ok(s.confirmed && !s.pending, '2차 승인 후 확정');
  s.draft[0].items[0].weight = 50; s.draft[0].items[1].weight = 20;
  ok(kpiSubmitSheet(s,'',true).length===1, '수정은 사유 필수');
  kpiSubmitSheet(s,'사유',true);
  ok(kpiSubmitSheet(s,'사유',true).length===1, '미결 수정 요청은 1건만');
  ok(kpiDecide(s,line,'lead',false,' ','')!==null, '반려 사유 필수');
  kpiDecide(s,line,'lead',false,'근거 부족','팀장');
  ok(s.confirmed[0].items[0].weight===40 && s.rejectNote && !s.pending, '반려 시 기존 KPI 유지');
  const t = sheet([40,30,30]);
  kpiSubmitSheet(t,'',true); kpiDecide(t,['head'],'head',true,'',''); ok(t.confirmed, '팀장은 본부장 1단계로 확정');
  return 'kpiSelfCheck 통과';
}

/* ----- 화면 ----- */
function kpiDraft(){ return kpiSheets[kpiRole].draft; }
function kpiFlash(msg, type){ kpiMsg = msg ? {msg, type:type||'success'} : null; renderContent(); }
function kpiStatus(key){
  const s = kpiSheets[key], u = KPI_USERS[key];
  if(s.pending) return [`${KPI_USERS[u.approvers[s.pending.step]].title} 승인대기${s.confirmed?' (수정요청)':''}`, 'warning'];
  if(s.rejectNote) return ['반려됨', 'danger'];
  if(s.confirmed) return ['확정', 'success'];
  return ['작성중', 'neutral'];
}
function kpiNote(html, type){
  const c = type ? `background:var(--bg-${type}); color:var(--${type});` : '';
  return `<div class="placeholder-note" style="margin:0 0 12px 0; ${c}">${html}</div>`;
}
function kpiTable(goals, o={}){   // o.edit 입력 모드 / o.own 내 확정본(증빙 칸 활성 대상) / o.upload 평가 기간 / o.base 비교 기준
  const txt = (v, path)=> o.edit ? `<textarea class="kpi-in" rows="2" oninput="kpiDraft()${path}=this.value">${escapeHtml(v)}</textarea>` : escapeHtml(v);
  const lastCol = (it,gi,ii)=>{
    if(o.edit) return `<button class="btn sm" onclick="kpiDelItem(${gi},${ii})">행 삭제</button>`;
    const files = it.files.map((f,fi)=>`<div class="kpi-file">${icon('clip','ico')} ${escapeHtml(f)}${o.own&&o.upload?` <span onclick="kpiDelFile(${gi},${ii},${fi})" aria-label="첨부 삭제">${icon('x','ico')}</span>`:''}</div>`).join('');
    if(!o.own) return files || '—';
    return files + (o.upload
      ? `<label class="btn sm">＋ 자료 첨부<input type="file" multiple hidden accept="${KPI_ACCEPT}" onchange="kpiAddFiles(${gi},${ii},this.files)"></label>`
      : `<button class="btn sm" disabled title="평가 기간에만 업로드할 수 있습니다">＋ 자료 첨부</button>`);
  };
  const rows = goals.map((g,gi)=>g.items.map((it,ii)=>{
    const b = o.base && o.base[gi], bi = b && b.items[ii];
    const changed = o.base && !(bi && b.team===g.team && b.personal===g.personal && kpiKey(bi)===kpiKey(it));
    const span = ` rowspan="${g.items.length}"`, p = `[${gi}].items[${ii}]`;
    const head = ii>0 ? '' : `<td${span}>${txt(g.team,`[${gi}].team`)}</td><td${span}>${txt(g.personal,`[${gi}].personal`)}`
      + (o.edit ? `<div style="margin:6px 0; font-size:var(--fs-xs); color:var(--text-secondary);">가중치 소계 <b id="kpiSub_${gi}">${kpiSum(g.items)}</b></div><button class="btn sm" onclick="kpiAddItem(${gi})">＋ 실행목표</button>` : '') + `</td>`;
    const weight = o.edit ? `<input type="number" class="kpi-in" min="0" max="100" step="0.01" value="${it.weight||''}" oninput="kpiDraft()${p}.weight=+this.value; kpiRecalc()">` : it.weight;
    return `<tr class="${changed?'changed':''}">${head}<td>${txt(it.action,p+'.action')}</td><td>${txt(it.formula,p+'.formula')}</td><td style="text-align:center;">${weight}</td><td>${txt(it.owner,p+'.owner')}</td>`
      + KPI_GRADES.map(([gr])=>`<td>${txt(it[gr],p+'.'+gr)}</td>`).join('')
      + `<td style="text-align:center;">${o.own ? `<input type="number" class="kpi-in" min="0" max="100" step="1" value="${it.progress||0}" oninput="kpiSetProgress(${gi},${ii},this.value)" title="본인이 보는 진행 정도(%). 언제든 수정 가능">` : (it.progress||0)+'%'}</td>`
      + `<td>${lastCol(it,gi,ii)}</td></tr>`;
  }).join('')).join('');
  const total = kpiSum(goals.flatMap(g=>g.items));
  return `<div class="kpi-wrap"><table class="kpi-table">
    <colgroup><col style="width:120px"><col style="width:130px"><col style="width:170px"><col style="width:140px"><col style="width:74px"><col style="width:84px">${'<col style="width:96px">'.repeat(5)}<col style="width:72px"><col style="width:150px"></colgroup>
    <thead><tr><th>팀목표</th><th>개인목표</th><th>실행목표</th><th>측정식</th><th>가중치</th><th>담당자</th>${KPI_GRADES.map(([gr,pct])=>`<th>${gr}(${pct}%)</th>`).join('')}<th>진행률</th><th>${o.edit?'관리':'증빙자료'}</th></tr></thead>
    <tbody>${rows}<tr><td colspan="4" style="text-align:center; font-weight:700;">합 계</td><td ${o.edit?'id="kpiTotal"':''} style="text-align:center; font-weight:700; color:var(--${total===100?'success':'danger'});">${total}</td><td colspan="8"></td></tr></tbody>
  </table></div>`;
}
function kpiRecalc(){   // 입력 중에는 다시 그리지 않고(포커스 유지) 합계와 제출 버튼만 갱신
  const goals = kpiDraft(), items = goals.flatMap(g=>g.items), sum = kpiSum(items);
  goals.forEach((g,gi)=>{ const el = document.getElementById('kpiSub_'+gi); if(el) el.textContent = kpiSum(g.items); });
  const t = document.getElementById('kpiTotal');
  if(t){ t.textContent = sum; t.style.color = `var(--${sum===100?'success':'danger'})`; }
  const b = document.getElementById('kpiSubmitBtn');
  if(b) b.disabled = !(sum===100 && items.length>=3);
}
function kpiSetRole(r){ kpiRole = r; kpiEditing = false; kpiReviewKey = null; kpiReason = ''; kpiFlash(null); }
function kpiAddGoal(){ kpiDraft().push(kpiNewGoal(KPI_USERS[kpiRole].name)); kpiFlash(null); }
function kpiAddItem(gi){ kpiDraft()[gi].items.push(kpiNewItem(KPI_USERS[kpiRole].name)); kpiFlash(null); }
function kpiDelItem(gi, ii){
  const goals = kpiDraft();
  goals[gi].items.splice(ii,1);
  if(!goals[gi].items.length) goals.splice(gi,1);
  if(!goals.length) goals.push(kpiNewGoal(KPI_USERS[kpiRole].name));
  kpiFlash(null);
}
function kpiCancelEdit(){ const s = kpiSheets[kpiRole]; s.draft = kpiClone(s.confirmed); kpiEditing = false; kpiReason = ''; kpiFlash(null); }
function kpiSubmit(){
  const s = kpiSheets[kpiRole], errs = kpiSubmitSheet(s, kpiReason, kpiInPeriod(kpiPeriod.editFrom, kpiPeriod.editTo));
  if(errs.length) return kpiFlash(errs.map(escapeHtml).join('<br>'), 'danger');
  kpiEditing = false; kpiReason = '';
  kpiFlash(`제출했습니다. ${escapeHtml(KPI_USERS[KPI_USERS[kpiRole].approvers[0]].title)} 승인을 기다립니다.`);
}
function kpiReview(key, approve){
  const me = KPI_USERS[kpiRole], el = document.getElementById('kpiRejectReason');
  const err = kpiDecide(kpiSheets[key], KPI_USERS[key].approvers, kpiRole, approve, el ? el.value : '', `${me.name} ${me.title}`);
  if(err) return kpiFlash(escapeHtml(err), 'danger');
  kpiReviewKey = null;
  const s = kpiSheets[key];
  kpiFlash(!approve ? '반려했습니다. 기존 KPI는 그대로 유지됩니다.' : s.pending ? '승인했습니다. 다음 승인자에게 넘어갔습니다.' : '승인했습니다. KPI가 확정(잠금)되었습니다.');
}
function kpiAddFiles(gi, ii, files){
  if(!kpiInPeriod(kpiPeriod.evalFrom, kpiPeriod.evalTo)) return;
  const all = [...files], ok = all.filter(f=>f.size<=10*1024*1024);
  kpiSheets[kpiRole].confirmed[gi].items[ii].files.push(...ok.map(f=>f.name));
  if(ok.length<all.length) return kpiFlash(`10MB를 넘는 파일 ${all.length-ok.length}개는 제외했습니다.`, 'danger');
  kpiFlash('증빙자료를 첨부했습니다. (시연: 파일명만 표시되고 서버에는 저장되지 않습니다)');
}
function kpiSetProgress(gi, ii, v){ kpiSheets[kpiRole].confirmed[gi].items[ii].progress = Math.min(100, Math.max(0, Math.round(+v||0))); }   // 다시 그리지 않음(포커스 유지)
function kpiDelFile(gi, ii, fi){ kpiSheets[kpiRole].confirmed[gi].items[ii].files.splice(fi,1); kpiFlash(null); }

function kpiHrPanel(){
  const d = (k)=>`<input type="date" value="${kpiPeriod[k]}" onchange="kpiPeriod.${k}=this.value; kpiFlash('기간을 변경했습니다.')">`;
  const rows = Object.keys(kpiSheets).map(k=>{
    const u = KPI_USERS[k], s = kpiSheets[k], items = (s.confirmed||s.draft).flatMap(g=>g.items);
    return [`${u.name} ${u.title}`, u.dept, kpiStatus(k)[0], items.length+'개', items.reduce((a,i)=>a+i.files.length,0)+'건'];
  });
  return `<div class="card" style="margin-bottom:14px;">
    <div class="card-title">기간 설정 (HR)</div>
    <div class="field-row">
      <div class="field"><label>KPI 작성·수정 기간 — 이 기간에만 입력·수정 요청 가능</label><div style="display:flex; gap:8px; align-items:center;">${d('editFrom')} ~ ${d('editTo')}</div></div>
      <div class="field"><label>평가 기간 — 이 기간에만 증빙자료 업로드 가능</label><div style="display:flex; gap:8px; align-items:center;">${d('evalFrom')} ~ ${d('evalTo')}</div></div>
    </div>
  </div>
  <div style="margin-bottom:14px;">${simpleTableCard('전 직원 진행현황', ['이름','부서','상태','실행목표','증빙'], rows, r=>kpiStatus(Object.keys(kpiSheets)[rows.indexOf(r)])[1], 2)}</div>`;
}
function kpiInbox(){
  if(!Object.values(KPI_USERS).some(u=>u.approvers.includes(kpiRole))) return '';
  const keys = Object.keys(kpiSheets).filter(k=>{ const p = kpiSheets[k].pending; return p && KPI_USERS[k].approvers[p.step]===kpiRole; });
  const list = keys.map(k=>{
    const u = KPI_USERS[k], s = kpiSheets[k], open = kpiReviewKey===k;
    return `<div class="list-row"><div><div class="list-title">${u.name} ${u.title} · ${u.dept}</div>
        <div class="list-sub">${s.confirmed?'KPI 수정 요청':'KPI 최초 제출'}${s.pending.reason?' · 사유: '+escapeHtml(s.pending.reason):''}</div></div>
        <button class="btn sm" onclick="kpiReviewKey=${open?'null':`'${k}'`}; kpiFlash(null)">${open?'닫기':'검토'}</button></div>`
      + (!open ? '' : `<div style="padding:12px 0;">
        ${s.confirmed ? `<div class="card-title">기존 KPI (현재 유효)</div>${kpiTable(s.confirmed)}<div class="card-title" style="margin-top:16px;">수정안 <span class="badge warning">노란색 = 바뀐 행</span></div>` : ''}
        ${kpiTable(s.pending.rows, {base:s.confirmed})}
        <div class="field" style="margin-top:12px;"><label>반려 사유 (반려할 때만 필수)</label><textarea id="kpiRejectReason" rows="2"></textarea></div>
        <div style="display:flex; gap:8px; margin-top:10px;"><button class="btn primary" onclick="kpiReview('${k}',true)">승인</button><button class="btn" onclick="kpiReview('${k}',false)">반려</button></div>
      </div>`);
  }).join('');
  return `<div class="card" style="margin-bottom:14px;"><div class="card-title">승인 대기함 <span class="more">${keys.length}건</span></div>
    ${list || '<div class="list-sub">대기 중인 건이 없습니다.</div>'}</div>`;
}
function kpiMySheet(){
  const me = KPI_USERS[kpiRole], s = kpiSheets[kpiRole], [label, cls] = kpiStatus(kpiRole);
  const editOpen = kpiInPeriod(kpiPeriod.editFrom, kpiPeriod.editTo), evalOpen = kpiInPeriod(kpiPeriod.evalFrom, kpiPeriod.evalTo);
  const editing = editOpen && !s.pending && (kpiEditing || !s.confirmed);
  let body;
  if(editing){
    const items = s.draft.flatMap(g=>g.items), can = kpiSum(items)===100 && items.length>=3;
    body = kpiTable(s.draft, {edit:true})
      + `<div style="margin-top:10px;"><button class="btn sm" onclick="kpiAddGoal()">＋ 목표 추가</button></div>`
      + (s.confirmed ? `<div class="field" style="margin-top:14px;"><label>수정 사유 (필수)</label><textarea rows="2" oninput="kpiReason=this.value" placeholder="예: 조직 개편으로 담당 업무 변경">${escapeHtml(kpiReason)}</textarea></div>` : '')
      + `<div style="display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;">
          <button class="btn" onclick="kpiFlash('임시저장했습니다.')">임시저장</button>
          <button class="btn primary" id="kpiSubmitBtn" ${can?'':'disabled'} onclick="kpiSubmit()">${s.confirmed?'수정 요청 제출':'제출'}</button>
          ${s.confirmed ? '<button class="btn" onclick="kpiCancelEdit()">취소</button>' : ''}
        </div><div class="list-sub" style="margin-top:8px;">제출 버튼은 실행목표가 3개 이상이고 가중치 합계가 100일 때 활성화됩니다.</div>`;
  } else {
    body = kpiTable(s.confirmed || (s.pending ? s.pending.rows : s.draft), {own:!!s.confirmed, upload:evalOpen});
    if(s.pending && s.confirmed) body += `<div class="card-title" style="margin-top:18px;">승인 대기 중인 수정안 <span class="badge warning">노란색 = 바뀐 행</span></div>
      <div class="list-sub" style="margin-bottom:8px;">사유: ${escapeHtml(s.pending.reason)} · 승인 전까지는 위의 기존 KPI가 유효합니다.</div>${kpiTable(s.pending.rows, {base:s.confirmed})}`;
    if(s.pending) body += `<div class="list-sub" style="margin-top:12px;">승인 진행 중에는 수정할 수 없습니다.</div>`;
    else if(s.confirmed) body += `<div style="margin-top:14px;"><button class="btn primary" ${editOpen?'':'disabled title="수정 기간이 아닙니다"'} onclick="kpiEditing=true; kpiFlash(null)">수정 요청</button></div>`;
  }
  return `<div class="card">
    <div class="card-title"><span>${KPI_YEAR}년 KPI 계획서 <span style="font-weight:500; color:var(--text-secondary);">[${me.dept}_${me.name}_${me.title}]</span></span><span class="badge ${cls}">${label}</span></div>
    ${editOpen ? kpiNote(`KPI 작성·수정 기간입니다. (${kpiPeriod.editFrom} ~ ${kpiPeriod.editTo})`, 'success')
               : kpiNote(`지금은 KPI 작성·수정 기간이 아닙니다. 조회만 가능합니다. (설정된 기간: ${kpiPeriod.editFrom||'미정'} ~ ${kpiPeriod.editTo||'미정'})`)}
    ${evalOpen ? kpiNote(`평가 기간입니다. 맨 우측 칸에 증빙자료를 올릴 수 있습니다. (${kpiPeriod.evalFrom} ~ ${kpiPeriod.evalTo})`, 'success') : ''}
    ${s.rejectNote ? kpiNote(escapeHtml(s.rejectNote) + (s.confirmed?' — 기존 KPI는 그대로 유효합니다. 수정 기간 안에 고쳐서 다시 요청할 수 있습니다.':' — 고쳐서 다시 제출해 주세요.'), 'danger') : ''}
    <details style="margin-bottom:12px; font-size:var(--fs-xs); color:var(--text-secondary); line-height:1.7;"><summary style="cursor:pointer; font-weight:600;">※ 목표설정 방법</summary>
      1) 개인 KPI는 팀 목표와 직접 연결되도록 설정 (팀장님과 면담 후 목표 설정)<br>
      2) SMART 원칙에 따라 목표 설정<br>
      &nbsp;- Specific(구체적): 막연한 표현(X) → "월 1회 제안서 작성"처럼 구체적으로(O)<br>
      &nbsp;- Measurable(측정 가능): 고객만족 향상(X) → 고객 만족도 90% 이상 유지(월별 설문 결과 기준)(O)<br>
      &nbsp;- Achievable(달성 가능): 현실적인 수준에서 도전적인 목표 설정<br>
      &nbsp;- Relevant(관련성): 현재 역할과 팀 목표에 직접적으로 연관<br>
      &nbsp;- Time-bound(기한 설정): 언제까지 할 것인지 명확히 기재<br>
      3) 타 부서나 타인의 영향이 과도한 지표는 피하고, 본인이 책임지고 추진할 수 있는 업무로 범위 설정<br>
      4) 현재 진행 중인 업무가 아닌, 팀 목표 달성을 위한 새로운 업무목표로 설정 (실행목표 최소 3개, 가중치 합계 100)
    </details>
    ${body}
  </div>`;
}
function roleSwitcher(){
  const switcher = Object.keys(KPI_USERS).map(k=>`<button class="btn sm ${k===kpiRole?'primary':''}" onclick="kpiSetRole('${k}')">${KPI_USERS[k].switchLabel} (${KPI_USERS[k].name})</button>`).join('');
  return `<div class="card" style="margin-bottom:14px;">
      <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;"><b style="font-size:var(--fs-xs);">시연용 역할 전환</b>${switcher}</div>
      <div class="list-sub" style="margin-top:8px;">로그인 기능이 생기면 이 버튼은 사라집니다. 지금은 입력 내용이 저장되지 않고 새로고침하면 초기화됩니다.</div>
    </div>`;
}
function kpiContent(){
  return `${roleSwitcher()}
    ${kpiMsg ? kpiNote(kpiMsg.msg, kpiMsg.type) : ''}
    ${kpiRole==='hr' ? kpiHrPanel() : ''}${kpiInbox()}${kpiSheets[kpiRole] ? kpiMySheet() : ''}`;
}

    <div class="list-row"><div><div class="list-title">KPI 작성·수정 기간</div><div class="list-sub">${fmt(kpiPeriod.editFrom)} ~ ${fmt(kpiPeriod.editTo)}</div></div>${editOpen ? dday(kpiPeriod.editTo) : '<span class="badge neutral">기간 아님</span>'}</div>
    <div class="list-row"><div><div class="list-title">평가 기간 (증빙 업로드)</div><div class="list-sub">${fmt(kpiPeriod.evalFrom)} ~ ${fmt(kpiPeriod.evalTo)}</div></div>${evalOpen ? dday(kpiPeriod.evalTo) : '<span class="badge neutral">예정</span>'}</div>
  </div>`;
}
function kpiHomeCard(){
  const s = kpiSheets[kpiRole], me = KPI_USERS[kpiRole];
  const waiting = Object.keys(kpiSheets).filter(k=>{ const p = kpiSheets[k].pending; return p && KPI_USERS[k].approvers[p.step]===kpiRole; }).length;
  const inboxLine = waiting ? `<span style="color:var(--warning); font-weight:600; cursor:pointer;" onclick="goTo('perf','e1')">팀원 KPI 승인 대기 ${waiting}건 →</span>` : '';
  let body;
  if(!s || !s.confirmed){
    body = `<div class="placeholder-note" style="margin:0;">${!s ? '담당자 계정은 KPI 대상이 아닙니다.' : '아직 확정된 KPI가 없습니다. 목표를 작성해 제출해 주세요.'}</div>`;
  } else {
    const items = s.confirmed.flatMap(g=>g.items), total = kpiProgress(s.confirmed), files = items.reduce((a,i)=>a+i.files.length,0);
    const bar = (pct,h)=>`<div class="bar-track" style="margin-top:0; height:${h}px;"><div class="bar-fill" style="width:${pct}%;"></div></div>`;

      ${bar(total,8)}
      <div style="display:grid; grid-template-columns:minmax(0,1fr) 44px 110px 44px; gap:6px 10px; align-items:center; font-size:var(--fs-sm); margin-top:16px;">
        ${items.map(i=>`<span>${escapeHtml(i.action)}</span><span style="text-align:right; color:var(--text-muted); font-size:var(--fs-xs);">${i.weight}%</span>${bar(i.progress||0,6)}<span style="text-align:right;">${i.progress||0}%</span>`).join('')}
      </div>

      <div class="divider" style="margin:12px 0;"></div>
      <div style="display:flex; justify-content:space-between; align-items:center; font-size:var(--fs-sm); flex-wrap:wrap; gap:8px;">

      </div>`;
  }
  const [label, cls] = s ? kpiStatus(kpiRole) : ['해당 없음','neutral'];
  return `<div class="card" style="grid-column:span 2;">
    <div class="card-title"><span>나의 KPI 현황 <span style="font-weight:500; color:var(--text-secondary);">${KPI_YEAR}년 · ${me.name} ${me.title}</span></span><span class="badge ${cls}">${label}</span></div>
    ${body}${(!s || !s.confirmed) && inboxLine ? `<div style="margin-top:10px;">${inboxLine}</div>` : ''}
  </div>`;
}

/* ----- 규칙 (순수 로직, celebSelfCheck가 검증) ----- */
function celebParse(ymd){ const [y,m,d] = ymd.split('-').map(Number); return new Date(y, m-1, d); }
function celebMonday(t){ const d = new Date(t.getFullYear(), t.getMonth(), t.getDate()); d.setDate(d.getDate()-((d.getDay()+6)%7)); return d; }
function celebValidMd(md){ if(!/^\d{2}-\d{2}$/.test(md)) return false; const [m,d] = md.split('-').map(Number); const x = new Date(2000, m-1, d); return x.getMonth()===m-1 && x.getDate()===d; }
function celebIsWelcome(hireDate, t){ if(!hireDate) return false; const days = Math.round((new Date(t.getFullYear(),t.getMonth(),t.getDate()) - celebParse(hireDate))/864e5); return days>=0 && days<=30; }
function celebBirthdayThisWeek(md, t){
  if(!md || !celebValidMd(md)) return false;
  const mon = celebMonday(t);
  for(let i=0; i<7; i++){
    const d = new Date(mon); d.setDate(mon.getDate()+i);
    const leap = new Date(d.getFullYear(), 1, 29).getMonth()===1;
    const target = (md==='02-29' && !leap) ? '02-28' : md;   // 윤년 생일은 평년에 2월 28일
    if(String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')===target) return true;
  }
  return false;
}
function celebMilestone(y){ return y===1 || y===3 || y===5 || (y>=10 && y%5===0); }
function celebAnnivYears(hireDate, t){
  if(!hireDate) return 0;
  const h = celebParse(hireDate), y = t.getFullYear()-h.getFullYear();
  return h.getMonth()===t.getMonth() && celebMilestone(y) ? y : 0;
}
function celebEventActive(e, t){ return celebParse(e.until) >= new Date(t.getFullYear(), t.getMonth(), t.getDate()); }
function celebList(key, members, events, t){
  const md = s=>`${+s.slice(-5,-3)}월 ${+s.slice(-2)}일`;
  if(key==='welcome') return members.filter(m=>celebIsWelcome(m.hireDate, t)).map(m=>({ m, note:md(m.hireDate)+' 입사' }));
  if(key==='birthday') return members.filter(m=>!m.hideBirthday && celebBirthdayThisWeek(m.birthday, t)).sort((a,b)=>a.birthday.localeCompare(b.birthday)).map(m=>({ m, note:md(m.birthday)+' 생일' }));
  if(key==='anniversary') return members.map(m=>({ m, y:celebAnnivYears(m.hireDate, t) })).filter(x=>x.y).map(x=>({ m:x.m, note:`입사 ${x.y}주년 · ${md(x.m.hireDate)}` }));
  return events.filter(e=>e.type===key && celebEventActive(e, t)).map(e=>({ m:members.find(m=>m.id===e.memberId), note:e.label, ev:e })).filter(x=>x.m);
}
function celebValidateEvent(e, members, t){
  const errs = [];
  if(!['joy','condol'].includes(e.type)) errs.push('종류를 선택해 주세요.');
  if(!members.some(m=>m.id===e.memberId)) errs.push('대상자를 선택해 주세요.');
  if(!e.label.trim()) errs.push('내용을 입력해 주세요. (예: 결혼, 부친상)');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(e.until) || !celebEventActive(e, t)) errs.push('게시 종료일은 오늘이나 그 이후여야 합니다.');
  return errs;
}
function celebSelfCheck(){   // 브라우저 콘솔에서 celebSelfCheck() 실행
  const ok = (c,msg)=>{ if(!c) throw new Error('celebSelfCheck 실패: '+msg); };
  const t = new Date(2026, 9, 1);   // 2026-10-01 (목) → 이번 주 9/28(월)~10/4(일)
  ok(celebIsWelcome('2026-09-01', t) && !celebIsWelcome('2026-08-31', t) && celebIsWelcome('2026-10-01', t) && !celebIsWelcome('2026-10-02', t), '입사 환영 30일');
  ok(celebBirthdayThisWeek('09-28', t) && celebBirthdayThisWeek('10-04', t) && !celebBirthdayThisWeek('09-27', t) && !celebBirthdayThisWeek('10-05', t), '생일 이번 주 월~일');
  ok(celebBirthdayThisWeek('01-02', new Date(2026, 11, 31)) && celebBirthdayThisWeek('12-28', new Date(2027, 0, 1)), '연말연초 주');
  ok(celebBirthdayThisWeek('02-29', new Date(2027, 1, 28)), '윤일 생일은 평년 2/28');
  ok(!celebValidMd('13-01') && !celebValidMd('02-30') && celebValidMd('02-29') && !celebValidMd('3-5'), '생일 형식');
  ok([1,3,5,10,15,20].every(celebMilestone) && ![2,4,6,7,9,11,12].some(celebMilestone), '주년 1·3·5·10 이후 5년마다');
  ok(celebAnnivYears('2021-10-20', t)===5 && celebAnnivYears('2022-10-01', t)===0 && celebAnnivYears('2021-09-20', t)===0 && celebAnnivYears('2026-10-01', t)===0, 'N주년 이번 달');
  const ms = [{id:1, hideBirthday:true, birthday:'10-01', hireDate:''}, {id:2, hideBirthday:false, birthday:'10-01', hireDate:''}];
  ok(celebList('birthday', ms, [], t).length===1, '생일 숨김 존중');
  const evs = [{type:'joy', memberId:2, label:'결혼', until:'2026-10-01'}, {type:'joy', memberId:2, label:'출산', until:'2026-09-30'}];
  ok(celebList('joy', ms, evs, t).length===1 && celebList('condol', ms, evs, t).length===0, '경사 게시 기간');
  ok(celebValidateEvent({type:'joy', memberId:2, label:' ', until:'2026-10-05'}, ms, t).length===1, '내용 필수');
  ok(celebValidateEvent({type:'joy', memberId:9, label:'결혼', until:'2026-09-30'}, ms, t).length===2, '대상자·종료일');
  return 'celebSelfCheck 통과';
}

function ctRound100(x){ return Math.round(x/100)*100; }
function ctRaise(before, pct){ return ctRound100(before*(1+pct/100)); }
function ctCalc(c){   // 양식 계산식: 시급 = (기본급+능력급+직책수당+명절상여/12)/209, 시간외 = 시급×10×1.5
  const bonus = c.base, pos = c.pos||0, site = c.site||0, qual = c.qual||0;
  const hourly = (c.base + c.ability + pos + bonus/12) / 209;
  const ot = hourly*10*1.5;
  const monthly = c.base + ot + c.ability + pos + site + qual;
  const annual = (monthly - qual - pos)*12 + bonus;
  return { hourly:Math.round(hourly), ot:Math.round(ot), monthly:Math.round(monthly), annual:Math.round(annual), bonus };
}
function ctApplyRates(c, rates){   // 작성 중(DRAFT)이고 HR이 직접 조정하지 않은 계약만 인상률로 다시 계산
  if(c.status!=='DRAFT' || c.adjReason || c.newHire) return;
  c.base = ctRaise(c.baseBefore, rates.base);
  c.ability = ctRaise(c.abilityBefore, c.grade ? rates[c.grade] : 0);
}
function ctPerson(pid){ return CT_PEOPLE.find(p=>p.pid===pid); }
function ctActor(role){ return CT_PEOPLE.find(p=>p.key===role); }
function ctCanView(role, c){
  if(role==='hr') return true;
  const me = ctActor(role), p = ctPerson(c.pid);
  if(!me) return false;
  if(me.pid===p.pid) return c.status!=='DRAFT';   // 본인은 발송된 것부터
  return me.title==='본부장' && me.division===p.division && c.status!=='DRAFT';
}
function ctActive(list, pid){ return list.filter(c=>c.pid===pid && c.status!=='CANCELLED').sort((a,b)=>b.version-a.version)[0]; }
function ctAdjust(c, isHr, base, ability, reason, period){
  if(!isHr) return ['금액 조정은 HR만 할 수 있습니다.'];
  if(c.status!=='DRAFT') return ['발송한 계약서는 고칠 수 없습니다. 파기 후 재발송하세요.'];
  const errs = [];
  if(!(base>0) || !(ability>=0)) errs.push('기본급과 능력급을 올바르게 입력해 주세요.');
  if(!reason.trim() && !c.newHire) errs.push('조정 사유를 입력해 주세요.');
  if(period && !(period.start && period.end && period.start<period.end)) errs.push('계약 기간을 확인해 주세요.');
  if(errs.length) return errs;
  c.base = base; c.ability = ability; c.adjReason = reason.trim() || c.adjReason;
  if(period){ c.start = period.start; c.end = period.end; }
  return [];
}
function ctSend(c, isHr, today){
  if(!isHr) return '발송은 HR만 할 수 있습니다.';
  if(c.status!=='DRAFT') return '이미 발송된 계약서입니다.';
  c.status = 'SENT'; c.sentAt = today; return null;
}
function ctSign(c, actorPid, sig){   // sig = {consent, name, image, read}
  if(c.pid!==actorPid) return '본인 계약서만 서명할 수 있습니다.';
  if(c.status!=='SENT') return c.status==='SIGNED' ? '이미 서명한 계약서입니다.' : '서명할 수 있는 상태가 아닙니다.';
  const errs = [];
  if(!sig.read) errs.push('계약서 본문을 끝까지 읽어 주세요.');
  if(!sig.consent) errs.push('동의 체크를 해 주세요.');
  if(sig.name.trim()!==ctPerson(c.pid).name) errs.push('성명을 본인 이름과 똑같이 입력해 주세요.');
  if(!sig.image) errs.push('서명란에 서명해 주세요.');
  if(errs.length) return errs.join('\n');
  Object.assign(c, { status:'SIGNED', locked:true, signerName:sig.name.trim(), signature:sig.image, signedAt:sig.at });
  return null;
}
function ctCancel(c, isHr, reason, at){
  if(!isHr) return '파기는 HR만 할 수 있습니다.';
  if(!reason.trim()) return '파기 사유를 입력해 주세요.';
  if(c.status==='CANCELLED') return '이미 파기된 계약서입니다.';
  Object.assign(c, { status:'CANCELLED', cancelReason:reason.trim(), cancelledAt:at }); return null;
}
function ctResend(list, c, isHr, reason, at){   // 원본은 파기로 보존, 같은 조건의 새 버전을 발송
  const err = ctCancel(c, isHr, reason, at);
  if(err) return err;
  const n = { ...c, id:++ctSeq, version:c.version+1, resentFrom:c.id, status:'SENT', sentAt:at.slice(0,10), locked:false,
    signerName:null, signature:null, signedAt:null, hash:null, cancelReason:null, cancelledAt:null };
  list.push(n); return null;
}

  ok(!ctCanView('lead', mk({pid:1, status:'SENT'})) && ctCanView('head', mk({pid:1, status:'SENT'})) && !ctCanView('head', mk({pid:4, status:'SENT'})) && ctCanView('hr', mk({})) && !ctCanView('emp', mk({pid:1})), '열람 권한');
  const c = mk({}); ok(ctSend(c, false, 'd') && !ctSend(c, true, '2026-10-01') && c.status==='SENT', '발송은 HR만');

  ok(!ctSign(c, 1, sig) && c.status==='SIGNED' && c.locked && ctSign(c, 1, sig), '서명 → 잠금, 재서명 불가');
  ok(ctCancel(c, false, '오류', 't') && ctCancel(c, true, ' ', 't') && c.status==='SIGNED', '파기: HR·사유 필수');
  const list = [c]; ok(!ctResend(list, c, true, '금액 오류', '2026-10-02 10:00') && list.length===2 && c.status==='CANCELLED' && list[1].status==='SENT' && list[1].version===2 && ctActive(list, 1)===list[1], '재발송: 원본 보존 + 새 버전');

async function ctHash(c){   // 서명 시점 본문의 고유번호(SHA-256) — 나중에 본문이 바뀌었는지 확인하는 용도
  const text = ctDocHtml(c, true).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
  if(!(window.crypto && crypto.subtle)){ c.hash = '(이 브라우저에서는 계산 불가)'; return; }
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  c.hash = [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

  }).join('');
  const rate = (k, label)=>`<label class="ct-rate">${label}<input type="number" step="0.1" min="-100" max="100" value="${ctRates[k]}" onchange="ctSetRate('${k}', this.value)"> %</label>`;
  return `<div class="card" style="margin-bottom:14px;">
    <div class="card-title"><span>${per.year}년 연봉계약 <span style="font-weight:500; color:var(--text-secondary);">${ctKDate(per.start)} ~ ${ctKDate(per.end)} · 재직자 고정 기간</span></span></div>
    <div class="ct-rates"><div><div class="stat-label">기본급 인상률 (전 직원 동일)</div>${rate('base','')}</div>
      <div><div class="stat-label">능력급 인상률 (평가 등급별)</div><div style="display:flex; gap:10px; flex-wrap:wrap;">${CT_GRADES.map(g=>rate(g, g)).join('')}</div></div></div>
    <div class="ct-tbl" style="margin-top:12px;"><table><thead><tr><th></th><th>이름</th><th>등급</th><th class="num">기본급</th><th class="num">능력급</th><th class="num">새 연봉</th><th>상태</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
    <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-top:12px;">
      <span class="list-sub" style="margin:0;">인상률을 바꾸면 작성 중인 계약서가 다시 계산됩니다(HR이 조정한 건 제외). 인상 후 금액은 100원 단위 반올림.</span>
      <button class="btn primary" ${ctSelected.size?'':'disabled'} onclick="ctSendSelected()">선택한 ${ctSelected.size}명에게 발송</button>
    </div>
    <div class="list-sub">시연용 등급·인상률·금액은 가상 값입니다. 평가 결과(등급)는 평가 메뉴가 생기면 자동으로 연결됩니다.</div>
  </div>`;
}
function ctSetRate(k, v){ ctRates[k] = Math.round((+v||0)*10)/10; ctContracts.forEach(c=>ctApplyRates(c, ctRates)); kpiFlash('인상률을 바꿔 작성 중인 계약서를 다시 계산했습니다.'); }
function ctSendSelected(){
  const today = ctYmd(new Date()); let n = 0;
  ctSelected.forEach(id=>{ const c = ctContracts.find(x=>x.id===id); if(c && !ctSend(c, orgIsHr(), today)) n++; });
  ctSelected.clear(); kpiFlash(`${n}명에게 계약서를 발송했습니다. 직원이 서명하면 상태가 바뀝니다.`);
}
function ctEdit(id){
  const c = ctContracts.find(x=>x.id===id), p = ctPerson(c.pid);
  orgModal(`<div class="card-title"><span>금액 조정 · ${escapeHtml(p.name)} ${escapeHtml(p.title)}</span><button type="button" class="x-btn" onclick="orgCloseModal()" aria-label="닫기">${icon('x')}</button></div><div id="ctErr"></div>
    <div class="list-sub" style="margin-bottom:10px;">작년 기본급 ${c.baseBefore.toLocaleString('ko-KR')}원 · 능력급 ${c.abilityBefore.toLocaleString('ko-KR')}원${c.grade?` · 등급 ${c.grade}`:''}</div>
    <div class="field-row"><div class="field"><label>기본급 (원)</label><input id="ctF_base" type="number" step="100" value="${c.base}"></div><div class="field"><label>능력급 (원)</label><input id="ctF_ability" type="number" step="100" value="${c.ability}"></div></div>
    ${c.newHire ? `<div class="field-row"><div class="field"><label>계약 시작일 (입사일)</label><input id="ctF_start" type="date" value="${c.start}"></div><div class="field"><label>계약 종료일</label><input id="ctF_end" type="date" value="${c.end}"></div></div>` : ''}
    <div class="field" style="margin-bottom:14px;"><label>조정 사유 ${c.newHire?'(선택)':'(필수)'}</label><input id="ctF_reason" value="${escapeHtml(c.adjReason||'')}" placeholder="승진, 직무 변경 등"></div>
    <div style="display:flex; gap:8px;"><button class="btn primary" onclick="ctSaveEdit(${c.id})">저장</button><button class="btn" onclick="orgCloseModal()">취소</button></div>`);
}
function ctSaveEdit(id){
  const c = ctContracts.find(x=>x.id===id), v = k=>{ const el = document.getElementById('ctF_'+k); return el ? el.value : ''; };
  const errs = ctAdjust(c, orgIsHr(), Math.round(+v('base')), Math.round(+v('ability')), v('reason'), c.newHire ? { start:v('start'), end:v('end') } : null);
  if(errs.length){ document.getElementById('ctErr').innerHTML = kpiNote(errs.map(escapeHtml).join('<br>'), 'danger'); return; }
  orgCloseModal(); kpiFlash('금액을 조정했습니다.');
}
function ctCancelForm(id){
  const c = ctContracts.find(x=>x.id===id), p = ctPerson(c.pid);
  orgModal(`<div class="card-title"><span>파기 · 재발송 · ${escapeHtml(p.name)}</span><button type="button" class="x-btn" onclick="orgCloseModal()" aria-label="닫기">${icon('x')}</button></div><div id="ctErr"></div>
    ${kpiNote('파기해도 원본은 지워지지 않고 "파기" 상태로 보관됩니다. 재발송하면 같은 조건의 새 계약서(다음 차수)가 직원에게 갑니다.')}
    <div class="field" style="margin-bottom:14px;"><label>사유 (필수)</label><input id="ctF_cancel" placeholder="금액 오기재 등"></div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;"><button class="btn primary" onclick="ctDoCancel(${id}, true)">파기 후 재발송</button><button class="btn" onclick="ctDoCancel(${id}, false)">파기만</button><button class="btn" onclick="orgCloseModal()">취소</button></div>`);
}
function ctDoCancel(id, resend){
  const c = ctContracts.find(x=>x.id===id), reason = document.getElementById('ctF_cancel').value, at = ctYmd(new Date())+' '+new Date().toTimeString().slice(0,5);
  const err = resend ? ctResend(ctContracts, c, orgIsHr(), reason, at) : ctCancel(c, orgIsHr(), reason, at);
  if(err){ document.getElementById('ctErr').innerHTML = kpiNote(escapeHtml(err), 'danger'); return; }
  if(!resend){ const p = ctPerson(c.pid); const n = { ...c, id:++ctSeq, version:c.version+1, resentFrom:c.id, status:'DRAFT', sentAt:null, locked:false, signerName:null, signature:null, signedAt:null, hash:null, cancelReason:null, cancelledAt:null }; ctContracts.push(n); ctOpenId = null; orgCloseModal(); return kpiFlash(`${escapeHtml(p.name)} 님 계약서를 파기했습니다. 새 계약서(작성 중)를 고쳐서 다시 발송하세요.`); }
  ctOpenId = null; orgCloseModal(); kpiFlash('파기 후 새 계약서를 재발송했습니다. 원본은 보관됩니다.');
}
function ctViewer(c){
  const p = ctPerson(c.pid), me = ctActor(kpiRole), mine = me && me.pid===c.pid, signable = mine && c.status==='SENT';
  const history = ctContracts.filter(x=>x.pid===c.pid && x.id!==c.id && x.status==='CANCELLED').map(x=>`<div class="list-row"><div><div class="list-title">${x.version}차 계약서 ${ctBadge(x)}</div><div class="list-sub">파기 ${escapeHtml(x.cancelledAt||'')} · 사유: ${escapeHtml(x.cancelReason||'')}</div></div><button class="btn sm" onclick="ctOpenId=${x.id}; kpiFlash(null)">보기</button></div>`).join('');
  const signed = c.status==='SIGNED' ? kpiNote(`${escapeHtml(c.signedAt)} ${escapeHtml(c.signerName)} 서명 · 잠김(수정 불가) · 문서 고유번호 ${escapeHtml((c.hash||'계산 중').slice(0,12))}…`, 'success') : '';
  const cancelled = c.status==='CANCELLED' ? kpiNote(`파기된 계약서입니다 (${escapeHtml(c.cancelledAt||'')}, 사유: ${escapeHtml(c.cancelReason||'')}). 보관용으로만 볼 수 있습니다.`, 'danger') : '';
  const signBox = !signable ? '' : `<div class="ct-signbox" id="ctSignBox">
      <div class="list-sub" id="ctReadHint" style="margin:0 0 10px;">본문을 끝까지 내리면 서명할 수 있습니다.</div>
      <div class="ct-signgrid">
        <div><label class="ct-check"><input type="checkbox" id="ctConsent" disabled> 위 계약 내용을 모두 읽고 이해했으며 동의합니다</label>
          <div class="field" style="margin-top:10px;"><label>성명</label><input id="ctName" disabled placeholder="${escapeHtml(p.name)}" autocomplete="off"></div></div>
        <div><div class="stat-label">서명 (손가락·마우스로)</div><canvas id="ctPad" class="ct-pad" width="560" height="160" aria-label="서명 입력란"></canvas></div>
      </div>
      <div id="ctErr"></div>
      <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:10px;"><button class="btn" id="ctClear" disabled onclick="ctPadClear()">다시 쓰기</button><button class="btn primary" id="ctSubmit" disabled onclick="ctSubmitSign(${c.id})">서명하고 제출</button></div>
    </div>`;
  if(signable) setTimeout(ctInitSign, 0);
  return `<div class="card ct-print" style="margin-bottom:14px;">
    <div class="card-title"><span>${c.start.slice(0,4)}년 연봉계약서 <span style="font-weight:500; color:var(--text-secondary);">${escapeHtml(p.name)} ${escapeHtml(p.title)}</span></span><span style="display:flex; gap:8px; align-items:center;">${ctBadge(c)}<button class="btn sm no-print" onclick="ctPrint(${c.id})">${icon('download')} 인쇄 / PDF 저장</button>${kpiRole==='hr'||!mine?`<button class="btn sm no-print" onclick="ctOpenId=null; kpiFlash(null)">목록으로</button>`:''}</span></div>
    ${signed}${cancelled}
    <div class="ct-scroll${signable?' gated':''}" id="ctScroll" tabindex="0" aria-label="계약서 본문">${ctDocHtml(c)}</div>
    ${signBox}
  </div>${history ? `<div class="card no-print"><div class="card-title">이전 계약서 (파기·보관)</div>${history}</div>` : ''}`;
}
let ctPadDirty = false;
function ctInitSign(){
  const sc = document.getElementById('ctScroll'), pad = document.getElementById('ctPad');
  if(!sc || !pad) return;
  const unlock = ()=>{ if(sc.scrollTop + sc.clientHeight < sc.scrollHeight - 8) return;
    ['ctConsent','ctName','ctClear','ctSubmit'].forEach(id=>document.getElementById(id).disabled = false);
    pad.classList.add('on'); document.getElementById('ctReadHint').textContent = '본문을 끝까지 확인했습니다. 동의하고 서명해 주세요.'; sc.dataset.read = '1'; };
  sc.addEventListener('scroll', unlock); unlock();
  const g = pad.getContext('2d'); g.lineWidth = 3; g.lineCap = 'round'; g.strokeStyle = '#1B2433'; ctPadDirty = false;
  let drawing = false;
  const pos = e=>{ const r = pad.getBoundingClientRect(); return [(e.clientX-r.left)*pad.width/r.width, (e.clientY-r.top)*pad.height/r.height]; };
  pad.addEventListener('pointerdown', e=>{ if(!sc.dataset.read) return; drawing = true; pad.setPointerCapture(e.pointerId); g.beginPath(); g.moveTo(...pos(e)); });
  pad.addEventListener('pointermove', e=>{ if(!drawing) return; g.lineTo(...pos(e)); g.stroke(); ctPadDirty = true; });
  ['pointerup','pointercancel'].forEach(t=>pad.addEventListener(t, ()=>{ drawing = false; }));
}
function ctPadClear(){ const pad = document.getElementById('ctPad'); pad.getContext('2d').clearRect(0,0,pad.width,pad.height); ctPadDirty = false; }
async function ctSubmitSign(id){
  const c = ctContracts.find(x=>x.id===id), me = ctActor(kpiRole), pad = document.getElementById('ctPad');
  const now = new Date(), at = ctYmd(now)+' '+now.toTimeString().slice(0,5);
  const err = ctSign(c, me ? me.pid : -1, { read:!!document.getElementById('ctScroll').dataset.read, consent:document.getElementById('ctConsent').checked,
    name:document.getElementById('ctName').value, image:ctPadDirty ? pad.toDataURL() : null, at });
  if(err){ document.getElementById('ctErr').innerHTML = kpiNote(escapeHtml(err).replace(/\n/g,'<br>'), 'danger'); return; }
  await ctHash(c);
  kpiFlash('서명을 완료했습니다. 계약서가 잠겼고, 인쇄·PDF 저장으로 1부를 보관할 수 있습니다.');
}
function ctContent(){
  const role = kpiRole, me = ctActor(role);
  const open = ctOpenId && ctContracts.find(c=>c.id===ctOpenId);
  let body = '';
  if(open && ctCanView(role, open)) body = ctViewer(open);
  else {
    ctOpenId = null;
    if(role==='hr') body = ctHrPanel();
    else {
      const mine = ctActive(ctContracts, me.pid);
      body = mine && ctCanView(role, mine) ? ctViewer(mine) : `<div class="card" style="margin-bottom:14px;"><div class="card-title">연봉계약서</div><div class="placeholder-note" style="margin:0;">아직 받은 계약서가 없습니다. HR이 발송하면 여기에 표시됩니다.</div></div>`;
      if(me.title==='본부장'){
        const rows = CT_PEOPLE.filter(p=>p.pid!==me.pid).map(p=>ctActive(ctContracts, p.pid)).filter(c=>c && ctCanView(role, c));
        body += `<div class="card"><div class="card-title">우리 본부 계약 현황 <span class="more">${rows.length}명</span></div>${rows.map(c=>{ const p = ctPerson(c.pid); return `<div class="list-row"><div><div class="list-title">${escapeHtml(p.name)} ${escapeHtml(p.title)} ${ctBadge(c)}</div><div class="list-sub">${escapeHtml(p.team||p.division)} · 연봉 ${ctWon(ctCalc(c).annual)}</div></div><button class="btn sm" onclick="ctOpenId=${c.id}; kpiFlash(null)">보기</button></div>`; }).join('') || '<div class="list-sub">발송된 계약서가 없습니다.</div>'}
          <div class="list-sub" style="margin-top:8px;">본부장은 자기 본부 직원의 계약서를 볼 수만 있습니다. 팀장은 본인 계약서만 볼 수 있습니다.</div></div>`;
      }
    }
  }
  return `${roleSwitcher()}${kpiMsg ? kpiNote(kpiMsg.msg, kpiMsg.type) : ''}${body}`;
}

function renderSidebar(){

/* ---------------- 키보드·화면 읽기 보조 ----------------
   onclick이 달린 div/span을 Tab으로 갈 수 있는 버튼처럼 만들고, .field 안 이름표를 입력칸에 연결한다.
   화면을 innerHTML로 다시 그리므로 변화가 생길 때마다 한 번에 처리한다. */
let a11ySeq = 0;
function a11yEnhance(root){
  root.querySelectorAll('[onclick]:not(button):not(a):not(input):not(select):not(textarea):not(label):not([tabindex])').forEach(el=>{
    el.setAttribute('tabindex','0'); if(!el.getAttribute('role')) el.setAttribute('role','button');
  });
  root.querySelectorAll('.field').forEach(f=>{
    const lb = f.querySelector(':scope > label'), inp = f.querySelector('input, select, textarea');
    if(!lb || !inp || lb.htmlFor) return;
    if(!inp.id) inp.id = 'fld_'+(++a11ySeq);
    lb.htmlFor = inp.id;
  });
  root.querySelectorAll('.field > input:not([aria-label]):not([id]), .field > div > input:not([aria-label])').forEach(inp=>{
    if(!inp.labels || !inp.labels.length){ const ph = inp.getAttribute('placeholder'); if(ph) inp.setAttribute('aria-label', ph); }
  });
}
new MutationObserver(()=>a11yEnhance(document.body)).observe(document.body, {childList:true, subtree:true});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && document.getElementById('orgModal')) return orgCloseModal();
  const t = e.target;
  if((e.key==='Enter' || e.key===' ') && t.getAttribute && t.getAttribute('role')==='button' && t.tagName!=='BUTTON'){ e.preventDefault(); t.click(); }
});

renderSidebar(); renderSubtabs(); renderContent();
a11yEnhance(document.body);
</script>
