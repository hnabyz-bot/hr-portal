function whB64(u8){ let s = ''; for(let i = 0; i<u8.length; i += 0x8000) s += String.fromCharCode(...u8.subarray(i, i+0x8000)); return btoa(s); }   // Uint8Array → base64 (조각으로 — 한 번에 펼치면 인자 수 한도를 넘는다)
function whSize(x){ return 4*Math.ceil(x.g.pdfBytes.length/3) + JSON.stringify(x.g.sum).length + 48; }   // 한 사람의 본문 바이트를 만들지 않고 센다: base64 + 요약 + 칸 이름·번호(48). 모두 ASCII라 글자 수 = 바이트 수
function whWire(x){ return { userId:x.userId, sum:x.g.sum, pdf:whB64(x.g.pdfBytes) }; }   // 서버로 가는 한 사람 — 묶음을 보낼 때만 만든다(base64는 그 묶음 것만 메모리에)
function whBatches(items, size, max = WH_BODY, most = WH_BATCH){   // 사람을 본문 max바이트 · most명 이하 묶음으로 (nginx 본문 한도 5MB). 한 사람이 max를 넘으면 혼자 한 묶음 — 서버가 거절한다(whBlock이 3MB에서 먼저 막는다)
  const out = []; let cur = [], tot = 0;
  for(const p of items){
    const n = size(p);
    if(cur.length && (tot + n > max - 100 || cur.length>=most)){ out.push(cur); cur = []; tot = 0; }   // 100 = 묶음 겉 {"mode":…,"people":[]}
    cur.push(p); tot += n;
  }
  if(cur.length) out.push(cur);
  return out;
}
async function whUpload(){   // 확인 창의 올리기: 사람별 PDF를 만들고(whBuild) — 실제 = 서버에 묶음으로(첫 묶음에 해 전체면 reset), 시연 = wh.mem (서버와 같은 규칙)
  const k = wh.pick; if(!k || k.busy || whBlock()) return;
  k.busy = true; k.err = '';
  document.querySelectorAll('#orgModal .wh-cf :is(input, select, .ps-foot button)').forEach(e=>{ e.disabled = true; });   // 기다리는 동안 고치지 못하게 (닫기 X는 둔다)
  const go = document.getElementById('whGo'), ours = ()=>wh.pick===k && !!document.querySelector('#orgModal .wh-cf');   // 기다리는 사이 창을 닫았거나 다른 파일을 골랐으면 그 창은 건드리지 않는다
  if(go) go.textContent = 'PDF 나누는 중…';
  try { await whBuild(k); } catch(e){ k.busy = false; if(!ours()) return; k.err = 'PDF를 사람별로 나누지 못했습니다. 위하고에서 내려받은 PDF가 맞는지 확인해 주세요.'; return whConfirm(); }
  if(!ours()){ k.busy = false; return; }   // 나누는 사이 창을 닫았다 — 올리지 않는다
  if(whBlock()){ k.busy = false; return whConfirm(); }   // 사람별 PDF가 너무 큰 사람 — 단추 옆에 이유
  const sent = whSent(k), year = k.year, n = sent.length, now = k.mode==='some' && whYearOf(year)?.status==='OPEN';   // now = 공개 중인 해에 사람만 → 바로 보인다
  if(AUTH.live){
    const batches = whBatches(sent, whSize);
    let done = 0, fail = '';
    for(const [b, part] of batches.entries()){
      if(ours()) go.textContent = `올리는 중… ${done}/${n}명`;
      let r = null, j = {};
      try { r = await fetch(`/api/withholding/${year}`, { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ mode:k.mode, reset:k.mode==='all' && b===0, total:n, people:part.map(whWire) }) }); j = await r.json().catch(()=>({})); } catch(e){}
      if(!r || !r.ok){ fail = j.error || '올리지 못했습니다. 인터넷 연결을 확인하고 잠시 뒤 다시 해 주세요.'; break; }
      done += part.length;
    }
    k.busy = false; whLiveDone(); await whYearsLoad();   // 그사이 공개된 해일 수 있다 — 현황과 창의 안내를 새로 (공개 중인 해에 사람만 올렸으면 내 영수증 숫자도)
    if(fail){
      const msg = !done ? fail : k.mode==='all' ? `올리다 멈춤 — 다시 올려 주세요 (${done}/${n}명까지 올라갔습니다). ${fail}` : `${done}/${n}명까지 올라갔습니다 — 다시 올려 주세요. ${fail}`;   // 첫 묶음이 거절되면 서버는 아무것도 바꾸지 않았다
      if(!ours()) return kpiFlash(escapeHtml(msg), 'danger');
      k.err = msg; return whConfirm();   // 창은 그대로 — 파일을 다시 고르고 암호를 다시 넣지 않아도 되게
    }
  } else {
    const rows = wh.mem.rows[year] = k.mode==='all' ? {} : wh.mem.rows[year] || {}, y = wh.mem.years[year], opened = !!y?.openedAt;   // 해 전체 = 지우고 넣기 · 사람만 = 바꾸기·더하기 / 공개한 적 있는 해면 바뀐 사람은 수정됨(새로 더한 사람은 아님) — 서버와 같다
    sent.forEach(x=>{ rows[x.userId] = { sum:x.g.sum, pdf:x.g.pdfBytes, revised:opened && (k.mode==='all' || !!rows[x.userId]), seen:false }; });
    const all = Object.values(rows);
    wh.mem.years[year] = { year, status:y ? y.status : 'DRAFT', pending:0, people:all.length, revised:all.filter(r=>r.revised).length, uploadedAt:new Date().toISOString(), openedAt:y ? y.openedAt : null };
  }
  if(ours()) orgCloseModal();   // 읽은 자료도 버린다 (whDrop)
  kpiFlash(`${year}년 귀속 ${n}명 원천징수영수증을 올렸습니다. ${now ? '공개 중인 해라 바로 보입니다.' : '아직 공개 전입니다.'}`);
}

async function whSetOpen(year, open){   // 공개(직원 본인에게 보임) · 내리기

function whSumRows(s){   // 미리 보기의 요약 숫자 — 못 읽은 칸(null)은 "못 읽음" (직원 화면은 그 줄을 숨긴다)
  const w = n=>n===null ? '못 읽음' : payWon(n), two = (a, b)=>a===null || b===null ? '못 읽음' : `${payWon(a + b)} (소득세 ${payWon(a)} + 지방 ${payWon(b)})`;
  const st = s.taxSettle===null || s.localSettle===null ? null : s.taxSettle + s.localSettle;
  return [['총급여', w(s.gross)], ['결정세액', two(s.taxDecided, s.localDecided)], ['미리 낸 세금', two(s.taxPrepaid, s.localPrepaid)],
    [st===null ? '환급 · 추가 납부' : st<0 ? '돌려받는 돈 (환급)' : '더 낼 돈 (추가 납부)', st===null ? '못 읽음' : payWon(Math.abs(st))]].map(([k, v])=>`<div class="wh-row"><span>${k}</span><span>${v}</span></div>`).join('');
}

async function whDrawPdf(bytes, box){   // PDF 쪽을 차례로 캔버스에 (화면 안에서 — 새 탭으로 열지 않는다). 폭 = 상자 폭, 기기 화소 비율 반영. 직원 원본 보기도 이것을 쓴다
  const doc = await whPdfOpen(bytes);
  try {
    for(let n = 1; n<=doc.numPages && box.isConnected; n++){
      const pg = await doc.getPage(n), w = (box.clientWidth || 600) * (window.devicePixelRatio || 1), v = pg.getViewport({ scale:w/pg.getViewport({ scale:1 }).width });
      const c = Object.assign(document.createElement('canvas'), { className:'wh-page', width:v.width, height:v.height });
      c.setAttribute('aria-label', `${n}쪽`); box.appendChild(c);
      await pg.render({ canvasContext:c.getContext('2d'), viewport:v }).promise;
    }
  } finally { doc.destroy(); }
}

/* ---------------- 평가 진행 ----------------
   시연용: 가상 인원(전략마케팅본부 팀원 · 전사 팀장 · 직속부서)을 브라우저 메모리에서만 평가한다. 새로고침하면 초기화.
   규칙 (인사담당자 2026-10-01 결정 + 2026-10-13 변경 + 2026-08-24 설계 문서 §2·§5.1·§5.2)
   - 누가 평가받나 (2026-10-13): 본부장·대표이사는 평가하지 않는다. 등급 비율을 함께 쓰는 묶음이 셋이다 (evPool)
       본부 팀원      ① 자기평가 → ② 팀장: 점수 + 등급 의견 → ③ 본부장: 등급 배정(팀장 점수도 고칠 수 있다) → 마감 → ④ 대표이사 확인 → ⑤ HR 확정
       팀장 (전사)    ① 자기평가 → ② 본부장: 점수 + 등급 (직속부서 팀장은 대표이사) → ③ 대표이사 확인(고칠 수 있다. 전사 팀장 비율은 여기서 맞춘다) → ④ HR 확정
       직속부서 팀원  ① 자기평가 → ② 팀장: 점수 + 등급 의견 (HR 담당자는 HR 팀장) → ③ 대표이사: 등급 배정·확인 → ④ HR 확정
   - 마감·확인·확정은 묶음째로 한다. 본부장 마감 = 전원에게 등급이 있고 정원을 넘지 않을 때만. 대표이사 확인과 HR 확정은 목록에서 묶음을 체크해 한 번에 넘긴다 (evPoolCard)
   - 대표이사는 본부 팀원의 등급을 직접 고치지 않는다 — 이유를 적어 본부장에게 돌려보낸다 (evPoolBack). 팀장과 직속부서 팀원은 직접 고친다
   - 본부장이 마감하면 HR에게 알림이 뜬다 (evNewsFor — 대표이사 확인을 기다리는 동안, 확인을 누를 때까지). 대표이사에게는 "확인할 묶음"으로 뜬다
   - 대표이사가 하는 일은 대표이사가 포털에서 "HR에 맡기기"를 켜야 HR이 대신 넣는다 (evProxy — 넣은 사람 이름이 남고, 본인 것은 못 넣는다)
   - 평가자가 비는 경우: 팀장이 없는 팀의 팀원 · 팀 없이 본부장 바로 아래 있는 직원은 한 단계 위(본부장, 본부장도 없으면 대표이사)가 점수와 등급을 함께 정한다 — 명단의 evaluator를 그렇게 넣으면 된다
   - '평가 대상'을 끈 사람(수습·휴직 등)은 평가 명단과 묶음 인원에서 뺀다 — 조직도 명단과 평가 명단이 하나로 합쳐지는 로그인·DB 이후에 적용한다. 그 전에는 HR이 평가 명단에서 "평가에서 제외"로 뺀다(evExclude)
   2026-10-13 로직 검토에서 더한 규칙
   - 단계별 마감일 (HR이 진행표 evBoard에서 정한다): 자기평가는 마감일이 지나면 낼 수 없고(HR이 "자기평가 없이 진행" 또는 "평가에서 제외"), 나머지 단계는 지나도 할 수 있되 '기한 지남'으로 표시한다
   - 점수 기준 (evBands): 총점으로 받을 수 있는 가장 높은 등급이 정해진다 — S 100 초과 · A 90 초과 · B 80 초과 · C 70 초과 · 70 이하 D (기준을 '넘어야' 그 등급이다 — 90.5점은 A, 딱 90점은 B). 그보다 높게는 줄 수 없고(올리려면 점수를 고친다), 비율 때문에 낮게는 줄 수 있다. 평가자가 채점하면 그 등급이 자동으로 나온다
   - 결과 공개 전에는 평가자에게 윗사람이 고친 내용과 최종 등급을 보이지 않는다 (evHidden) — 고쳤다는 사실만 알린다
   - 근태(연차 초과일·지각)는 그 사람의 등급이 다음 단계로 넘어가면 잠근다 (evAttLocked). HR은 결과 공개 전까지 묶음을 한 단계 되돌릴 수 있다 (evPoolUndo)
   - 자기평가는 제출하면 고칠 수 없다(제출 전에 안내 창). 증빙은 평가자가 점수를 내기 전까지만 올린다
   - 평가 항목은 목표설정(KPI) 확정본을 그대로 읽는다: 팀목표·개인목표·실행목표·측정식·가중치·S~D 달성 기준
   - 점수: KPI별 달성 등급(S110·A100·B90·C80·D70%) × 가중치 합 + 가점(사유 필수), 총점 상한 110
   - 등급 쿼터: 묶음 인원 N≥5면 A·B·D 각 round_half_up(N×10%), C 나머지 / N≤4면 상위(A+B) 1명(N≥2), 하위 나머지
     S는 총점 100 초과만, S 상한 = A 정원(상위 정원), S가 K명이면 A(상위) 정원에서 K를 뺀다. 초과 = 제출 막힘, 미달 = 경고
   - 증빙자료: 목표설정이 아니라 여기서 KPI별로 올린다. 선택 사항. 올리고 고치기는 HR이 정한 증빙 마감일까지.
     열람은 본인·평가자·본부장·대표이사·HR (같은 팀 동료는 못 봄)
   - 평가자 코멘트 필수, 본부장(직속부서는 대표이사) 코멘트 선택 */
const EV_PCT = Object.fromEntries(KPI_GRADES);
const EV_STAGES = { SELF:'자기평가 중', SCORE:'평가자 점수 대기', GRADE:'본부장 등급 대기', HR:'HR 확정 대기', CEO:'대표이사 확인 대기', DONE:'확정' };
const EV_ORDER = ['SELF','SCORE','GRADE','CEO','HR','DONE'];   // 묶음마다 거치는 단계는 다르지만 앞뒤 순서는 같다
const EV_DIVISION = '전략마케팅본부', EV_DIRECT = '대표이사 직속부서';
const EV_RATERS = { head:'이철수 본부장', ceo:'천대표 대표이사' };   // 평가는 하지만 평가받지 않는 사람 (시연 역할)
const EV_POOL_NAME = { div:EV_DIVISION+' 팀원', lead:'전사 팀장', direct:'직속부서 팀원' };
const EV_POOLS = ['div','lead','direct'];   // 대표이사 확인·HR 확정 목록의 줄. ponytail: 시연 명단에 팀원이 있는 본부가 하나라 'div'도 하나다 — 실제로는 본부마다 한 줄
const evPoolLog = { div:{}, lead:{}, direct:{} };   // 묶음마다 남기는 기록: head = 본부장 마감 { at, seen:{역할:true} } — 대표이사 확인을 기다리는 동안 HR에게 알림으로 띄운다 · ceo = 대표이사 확인 { at, by } · back = 대표이사가 본부장에게 돌려보냄 { at, by, reason }
const evPoolSel = { ceo:new Set(), hr:new Set() }, evPoolOpen = { ceo:null, hr:null };   // 목록에서 체크한 묶음 / 명단을 펼친 묶음
let evOpen = null;   // 지금 펼친 평가 대상 pid
const EV_RANK = 'SABCD';   // 앞이 높은 등급
const evBands = { A:90, B:80, C:70 };   // 이 점수를 '넘어야' 그 등급을 받을 수 있다 (HR이 진행표에서 바꾼다). S는 100점 초과, C 기준 이하는 D — 인사담당자 2026-10-13: 합계에 소수점이 나올 수 있으니 90.5점은 윗등급(A)에 넣고 딱 90점부터 B
let evAttDone = null;   // HR이 "근태 입력을 마쳤습니다"를 누른 날

/* ----- 규칙 (순수 로직, evSelfCheck가 검증) ----- */
function evRoundHalfUp(x){ return Math.floor(x + 0.5 + 1e-9); }   // 0.5 → 1 (은행가 반올림 금지)
function evQuota(n){
  if(n <= 4){ const upper = n>=2 ? 1 : 0; return { mode:'GROUPED', upper, lower:n-upper, capS:upper }; }
  const q = evRoundHalfUp(n*0.1);
  return { mode:'INDIVIDUAL', A:q, B:q, D:q, C:n-3*q, capS:q };
}
function evScore(rows, bonus=0){   // rows: [{weight, grade}]
  const base = rows.reduce((a,r)=>a + (r.grade ? (+r.weight)*EV_PCT[r.grade]/100 : 0), 0);
  return Math.min(110, Math.round((base + (+bonus||0))*10)/10);
}
function evValidate(roster, assign, quota, full){   // roster:[{pid,name,score}], assign:{pid:grade}. full=false면 배정 누락·미달은 검사 안 함(본부장 단계)
  const errors = [], warnings = [], cnt = { S:0, A:0, B:0, C:0, D:0 };
  roster.forEach(r=>{
    const g = assign[r.pid];
    if(!g){ if(full) errors.push(`${r.name} 님의 등급이 없습니다.`); return; }
    cnt[g]++;
    if(r.kpi!==false && evAbove(g, evBand(r.score))) errors.push(`${r.name} 님은 총점 ${r.score}점이라 ${g}를 줄 수 없습니다. (${evBandText(g)})`);   // 점수 기준보다 높은 등급은 줄 수 없다. 현장직은 총점이 없어 제외
    if(r.blocked && 'SAB'.includes(g)) errors.push(`${r.name} 님은 연차 초과 ${EV_LEAVE_LIMIT}일 이상이라 S·A·B를 줄 수 없습니다.`);
  });
  const K = cnt.S;
  if(K > quota.capS) errors.push(`S는 최대 ${quota.capS}명입니다. (현재 ${K}명)`);
  if(quota.mode==='INDIVIDUAL'){
    const qa = quota.A - K;
    if(cnt.A > qa) errors.push(`A는 ${qa}명까지입니다${K?` (S ${K}명만큼 줄어듦)`:''}. 현재 ${cnt.A}명`);
    if(cnt.B > quota.B) errors.push(`B는 ${quota.B}명까지입니다. 현재 ${cnt.B}명`);
    if(cnt.D > quota.D) errors.push(`D는 ${quota.D}명까지입니다. 현재 ${cnt.D}명`);
    if(full){ if(cnt.A < qa) warnings.push(`A가 정원보다 ${qa-cnt.A}명 적습니다.`); if(cnt.B < quota.B) warnings.push(`B가 정원보다 ${quota.B-cnt.B}명 적습니다.`); if(cnt.D < quota.D) warnings.push(`D가 정원보다 ${quota.D-cnt.D}명 적습니다.`); }
  } else {
    const up = quota.upper - K;
    if(cnt.A + cnt.B > up) errors.push(`A·B 합계는 ${up}명까지입니다. 현재 ${cnt.A+cnt.B}명`);
    if(full && cnt.A + cnt.B < up) warnings.push(`A·B가 정원보다 ${up-cnt.A-cnt.B}명 적습니다.`);
  }
  return { errors, warnings, cnt };
}
function evCanUpload(p, role, today){ return p.key===role && kpiPeriod.evalFrom<=today && today<=kpiPeriod.evidDue && (p.stage==='SELF' || p.stage==='SCORE'); }   // 본인만, 평가 시작 ~ 증빙 마감일, 평가자가 점수를 내기 전까지
function evPool(p){ return p.title==='팀장' ? 'lead' : p.div===EV_DIRECT ? 'direct' : 'div'; }   // 등급 비율을 함께 쓰는 묶음. ponytail: 직급 글자로 팀장을 가린다 — 로그인 이후에는 구성원 설정의 직책(lead)으로 가린다
function evPoolList(k){ return evActive().filter(p=>evPool(p)===k); }
function evAt(p, stage){ return EV_ORDER.indexOf(p.stage) - EV_ORDER.indexOf(stage); }   // 0 = 그 단계, 음수 = 아직 앞 단계
function evCeoActs(p, role=kpiRole){ return role==='ceo' || (evProxy && kpiIsHr(role) && (!p || p.key!==role)); }   // 대표이사의 일을 할 수 있나: 대표이사, 또는 대신 입력을 켠 HR (본인 것은 제외)
function evBand(score){ return score>100 ? 'S' : score>evBands.A ? 'A' : score>evBands.B ? 'B' : score>evBands.C ? 'C' : 'D'; }   // 그 총점으로 받을 수 있는 가장 높은 등급 (기준 초과)
function evAbove(g, cap){ return EV_RANK.indexOf(g) < EV_RANK.indexOf(cap); }   // g가 cap보다 높은 등급인가
function evBandText(g){ return g==='S' ? '100점 초과만' : `${g}는 ${evBands[g]}점 초과`; }
function evCap(p){ const leave = evLeaveBlocked(p) ? 'C' : 'S', band = evIsLine(p) ? 'S' : evBand(evTotal(p)); return evAbove(band, leave) ? leave : band; }   // 이 사람에게 줄 수 있는 가장 높은 등급 = 점수 기준과 연차 규칙 중 낮은 쪽. 현장직은 점수가 없어 연차 규칙만
function evStarted(today=kpiDay(0)){ return !!kpiPeriod.evalFrom && kpiPeriod.evalFrom<=today; }   // 평가가 시작됐나. 자기평가를 뺀 단계는 마감일이 지나도 할 수 있다('기한 지남'으로 표시)
function evSelfOpen(today=kpiDay(0)){ return evStarted(today) && today<=kpiPeriod.selfTo; }   // 자기평가는 마감일이 지나면 낼 수 없다
function evLate(k, today=kpiDay(0)){ return !!kpiPeriod[k] && today>kpiPeriod[k]; }   // 그 단계의 마감일이 지났나
function evActive(){ return evPeople.filter(p=>!p.out); }   // 이번 평가에서 빠진 사람(HR이 제외)을 뺀 명단
function evAttLocked(p){ return !!p.out || evAt(p, evAssignStage(evPool(p)))>0; }   // 등급이 다음 단계로 넘어간 사람의 근태는 잠근다 — 넘어간 뒤 고치면 이미 준 등급이 틀어진다. 고치려면 먼저 되돌린다
function evHidden(p, role=kpiRole){   // 평가자가 낸 뒤의 변경(윗사람 수정·최종 등급)은 결과 공개 전까지 평가자에게 보이지 않는다. 등급을 정하는 사람·대표이사·HR은 본다
  return !evReleased(p) && evAt(p, 'SCORE')>0 && evEvaluatorOf(p)===role && !kpiIsHr(role) && role!=='ceo' && !(role==='head' && evPool(p)==='div');
}
function evAssignStage(k){ return k==='lead' ? 'CEO' : 'GRADE'; }   // 등급을 정하는(고치는) 단계: 본부 팀원 = 본부장 배정, 팀장 = 대표이사 확인, 직속부서 팀원 = 대표이사 배정
function evCanAssign(p, role=kpiRole){   // 지금 이 사람의 등급과 점수를 고칠 수 있나. 본부 팀원은 본부장(대표이사는 고치지 않고 돌려보낸다), 팀장·직속부서 팀원은 대표이사
  const k = evPool(p);
  return p.stage===evAssignStage(k) && (k==='div' ? role==='head' : evCeoActs(p, role));
}
function evPoolCheck(k){ const list = evPoolList(k); return evValidate(evRoster(k), Object.fromEntries(list.filter(p=>p.grade).map(p=>[p.pid,p.grade])), evQuota(list.length), true); }   // 묶음 전원 검사: 등급 누락·정원 초과
function evPoolState(k){   // 묶음이 어디까지 왔나: WAIT 아직 진행 중 / FIX 대표이사가 등급을 정하거나 비율을 맞춰야 함 / CEO 대표이사 확인 대기 / HR 확정 대기 / DONE 확정
  const list = evPoolList(k), ready = k==='direct' ? 'GRADE' : 'CEO';   // 직속부서 팀원은 대표이사가 등급을 정하면서 바로 확인한다
  if(list.every(p=>p.stage==='DONE')) return 'DONE';
  if(list.every(p=>p.stage==='HR')) return 'HR';
  if(list.some(p=>p.stage!==ready)) return 'WAIT';
  return evPoolCheck(k).errors.length ? 'FIX' : 'CEO';
}
function evPoolMove(ks, mode, by){   // 묶음째로 넘긴다: 'ceo' 대표이사 확인 → HR 확정 대기 / 'hr' HR 확정 → 확정. 넘긴 묶음을 돌려준다
  const need = mode==='ceo' ? 'CEO' : 'HR', done = ks.filter(k=>evPoolState(k)===need);
  done.forEach(k=>{ evPoolList(k).forEach(p=>{ p.stage = mode==='ceo' ? 'HR' : 'DONE'; }); if(mode==='ceo') evPoolLog[k].ceo = { at:kpiDay(0), by }; });
  return done;
}
function evPoolUndo(k, by){   // HR: 결과 공개 전에 묶음을 한 단계 뒤로. HR 확정 → HR 확정 대기 / 대표이사 확인 → 대표이사 확인 전. 기록을 남긴다
  const st = evPoolState(k);
  if(evRelease.at || (st!=='DONE' && st!=='HR')) return '되돌릴 수 있는 단계가 아닙니다.';
  evPoolList(k).forEach(p=>{ p.stage = st==='DONE' ? 'HR' : k==='direct' ? 'GRADE' : 'CEO'; });
  if(st==='HR') evPoolLog[k].ceo = null;
  evPoolLog[k].undo = { at:kpiDay(0), by, from:st==='DONE' ? 'HR 확정' : '대표이사 확인' }; return null;
}
function evPoolBack(k, reason, by){   // 대표이사가 본부 팀원 등급 배정을 본부장에게 돌려보낸다 (직접 고치지 않는다)
  if(k!=='div' || evPoolState(k)!=='CEO') return '돌려보낼 수 있는 단계가 아닙니다.';
  if(!reason.trim()) return '돌려보내는 이유를 적어 주세요.';
  evPoolList(k).forEach(p=>{ p.stage = 'GRADE'; });
  evPoolLog[k].back = { at:kpiDay(0), by, reason:reason.trim() }; return null;
}
function evEdited(p){   // 윗사람이 넘긴 뒤 평가자가 낸 점수·등급과 달라졌으면 무엇이 바뀌었는지(글자). 같거나 아직 안 넘겼으면 ''. 대표이사가 평가자인 직속부서 팀장은 고치는 사람도 대표이사라 따지지 않는다
  if(!p.proposed || p.evaluator==='ceo' || evAt(p, evAssignStage(evPool(p)))<=0) return '';
  const now = evIsLine(p) ? null : evTotal(p), parts = [];
  if(p.subScore!=null && now!==p.subScore) parts.push(`총점 ${p.subScore.toFixed(1)} → ${now.toFixed(1)}`);
  if(p.grade!==p.proposed) parts.push(`등급 ${p.proposed} → ${p.grade}`);
  return parts.join(' · ');
}
function evEditNews(role=kpiRole){ return evActive().filter(p=>evEvaluatorOf(p)===role && evEdited(p) && p.editSeen!==evEdited(p)); }   // 내가 평가한 사람 중 윗사람이 고쳤는데 아직 확인하지 않은 사람
function evCanSeeEvidence(p, role){   // 본인·평가자·본부장·대표이사·HR
  if(kpiIsHr(role) || p.key===role || role==='ceo') return true;
  if(role==='head') return p.div===EV_DIVISION;
  const me = evPeople.find(x=>x.key===role);
  return !!me && p.evaluator===me.pid;
}
function evSelfCheck(){   // 브라우저 콘솔에서 evSelfCheck() 실행
  const ok = (c,m)=>{ if(!c) throw new Error('evSelfCheck 실패: '+m); };

function evUpper(p){ return evPool(p)==='div' ? '본부장' : '대표이사'; }   // 등급을 정하는 윗사람
function evMark(p){ if(kpiIsHr() && !(p.stage==='SCORE' && evEvaluatorOf(p)===kpiRole)) p.proxy = `${KPI_USERS[kpiRole].name} ${KPI_USERS[kpiRole].title}`; }   // HR이 대표이사 대신 넣었다는 기록. HR 팀장이 평가자로서 HR 담당자의 점수를 매기는 것은 본인 일이라 남기지 않는다
// (evStarted · evSelfOpen · evLate는 위 규칙에 있다)
function evKpi(p){   // 목표설정 확정본이 있으면 그것을 실시간으로 읽고, 없으면 시연용 KPI
  // ponytail: 행 순서(index)로 평가 기록을 잇는다. 실제 저장 땐 KPI 행 id로 묶는다.
  const s = p.key && kpiSheets[p.key];
  if(s && s.confirmed) return s.confirmed.flatMap(g=>g.items.map(it=>({ ...it, team:g.team, personal:g.personal })));
  return p.demoKpi || [];
}
function evEntry(p, i){ return p.ev[i] || (p.ev[i] = { note:'', selfGrade:null, grade:null, files:[] }); }
function evRows(p){ return evKpi(p).map((k,i)=>({ weight:k.weight, grade:evEntry(p,i).grade })); }
function evTotal(p){ return evScore(evRows(p), p.bonus); }
function evRoster(k){ return evPoolList(k).map(p=>({ pid:p.pid, name:p.name, score:evTotal(p), kpi:!evIsLine(p), blocked:evLeaveBlocked(p) })); }
function evFileCount(p){ return evKpi(p).reduce((a,_,i)=>a + evEntry(p,i).files.length, 0); }

/* ----- 화면 조각 ----- */
function evGradeBtns(onclickFn, cur, self, editable){
  return `<span class="ev-grades" role="radiogroup">${KPI_GRADES.map(([g])=>`<button type="button" class="ev-g${g===cur?' on':''}${g===self?' self':''}" ${editable?`onclick="${onclickFn}('${g}')"`:'disabled'} aria-pressed="${g===cur}" title="${g===self?'본인 자기평가':''}">${g}</button>`).join('')}</span>`;
}
function evCriteria(k, mark, self){   // S~D 달성 기준. mark = 평가자가 고른 등급, self = 자기평가
  return `<div class="ev-crit">${KPI_GRADES.map(([g,pct])=>`<span class="${g===mark?'on':''}${g===self?' self':''}"><b>${g}</b> ${escapeHtml(k[g]||'—')}</span>`).join('')}</div>`;
}
function evKpiCell(k){
  return `<div class="ev-goal">${escapeHtml(k.team)} › ${escapeHtml(k.personal)}</div><div class="list-title">${escapeHtml(k.action)}</div><div class="list-sub">측정식: ${escapeHtml(k.formula)} · 가중치 ${k.weight}</div>`;
}
function evFiles(p, i, canEdit){
  const e = evEntry(p, i);
  const list = e.files.map((f,fi)=>`<div class="kpi-file">${icon('clip','ico')} ${f.url ? `<a href="${f.url}" download="${escapeHtml(f.name)}">${escapeHtml(f.name)}</a>` : `<span>${escapeHtml(f.name)}</span> <small class="list-sub" style="display:inline;">(시연 예시)</small>`}
      ${canEdit ? `<button type="button" class="x-btn" style="width:24px;height:24px;" onclick="evDelFile(${p.pid},${i},${fi})" aria-label="${escapeHtml(f.name)} 삭제">${icon('x')}</button>` : ''}</div>`).join('');
  return (list || '<span class="list-sub" style="margin:0;">증빙 없음</span>')
    + (canEdit ? `<label class="btn sm" style="margin-top:4px;">＋ 증빙 첨부<input type="file" multiple hidden accept="${KPI_ACCEPT}" onchange="evAddFiles(${p.pid},${i},this.files)"></label>` : '');
}
function evStageLabel(p){ return p.stage==='GRADE' && evPool(p)==='direct' ? '대표이사 등급 대기' : evIsLine(p) && p.stage==='SCORE' ? '팀장 평가 대기' : EV_STAGES[p.stage]; }
function evStageBadge(p){ const cls = { SELF:'neutral', SCORE:'warning', GRADE:'warning', HR:'warning', CEO:'warning', DONE:'success' }[p.stage]; return `<span class="badge ${cls}">${evStageLabel(p)}</span>`; }
function evSteps(p){   // 묶음마다 거치는 단계가 다르다
  const [order, labels] = { div:[['SELF','SCORE','GRADE','CEO','HR','DONE'], ['자기평가','팀장 평가','본부장 등급','대표이사 확인','HR 확정','확정']],
    lead:[['SELF','SCORE','CEO','HR','DONE'], ['자기평가', (p.evaluator==='ceo' ? '대표이사' : '본부장')+' 평가', '대표이사 확인', 'HR 확정', '확정']],
    direct:[['SELF','SCORE','GRADE','HR','DONE'], ['자기평가','팀장 평가','대표이사 등급·확인','HR 확정','확정']] }[evPool(p)], at = order.indexOf(p.stage);
  return `<ol class="ev-steps">${labels.map((l,i)=>`<li class="${i<at?'done':i===at?'now':''}">${l}</li>`).join('')}</ol>`;
}
function evSelfCard(p){
  const kpi = evKpi(p), today = kpiDay(0);
  const editable = p.stage==='SELF' && evSelfOpen(), upload = evCanUpload(p, kpiRole, today);
  if(!kpi.length) return `<div class="card" style="margin-bottom:14px;"><div class="card-title">나의 ${KPI_YEAR}년 자기평가</div>${kpiNote('확정된 KPI가 없어 평가할 항목이 없습니다. 목표설정(KPI)을 먼저 확정해 주세요.')}</div>`;
  const rows = kpi.map((k,i)=>{ const e = evEntry(p,i);
    return `<tr><td>${evKpiCell(k)}${evCriteria(k, null, e.selfGrade)}</td>
      <td>${editable ? `<textarea class="kpi-in" rows="3" placeholder="측정식 기준으로 실제 결과를 적어 주세요" oninput="evEntry(evFind(${p.pid}),${i}).note=this.value">${escapeHtml(e.note)}</textarea>` : escapeHtml(e.note) || '—'}
        <div style="margin-top:6px;">${evGradeBtns(`evSetSelf.bind(null,${p.pid},${i})`, e.selfGrade, null, editable)}</div></td>
      <td>${evFiles(p, i, upload)}</td></tr>`; }).join('');
  return `<div class="card" id="evSelf" style="margin-bottom:14px;">
    <div class="card-title"><span>나의 ${KPI_YEAR}년 자기평가</span>${evStageBadge(p)}</div>${evSteps(p)}
    ${!evStarted() ? kpiNote(`아직 평가 기간이 아닙니다. (${kpiPeriod.evalFrom}부터)`) : p.stage!=='SELF' ? '' : !evSelfOpen() ? kpiNote(`자기평가 마감일(${kpiPeriod.selfTo})이 지났습니다. HR 담당자에게 문의해 주세요.`, 'danger') : kpiNote(`자기평가 마감일은 <b>${kpiPeriod.selfTo}</b>입니다. 제출한 뒤에는 고칠 수 없습니다.`)}
    <div class="list-sub" style="margin-bottom:8px;">증빙자료는 선택이며 <b>${kpiPeriod.evidDue}</b>까지 올리고 고칠 수 있습니다 (자기평가를 낸 뒤에도, 평가자가 점수를 내기 전까지). 평가자·본부장·HR만 볼 수 있습니다. 연차를 ${EV_LEAVE_LIMIT}일 이상 초과 사용하면 S·A·B 등급을 받을 수 없습니다${p.leaveOver ? ` (지금 연차 초과 ${p.leaveOver}일)` : ''}.</div>
    <div class="ct-tbl"><table class="ev-table"><thead><tr><th style="width:44%;">확정 KPI · 달성 기준</th><th>실적 · 스스로 매긴 등급</th><th style="width:24%;">증빙자료</th></tr></thead><tbody>${rows}</tbody></table></div>
    ${editable ? `<div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; margin-top:12px;"><span class="list-sub" style="margin:0;">S 110% · A 100% · B 90% · C 80% · D 70%</span><button class="btn primary" onclick="evSubmitSelf(${p.pid})">자기평가 제출</button></div>` : ''}
  </div>`;
}
function evScorePanel(p){
  const lead = evPool(p)==='lead', scoring = p.stage==='SCORE' && evStarted() && evIsEvaluator(p), mine = evHidden(p);   // mine = 내가 낸 평가만 보는 평가자 (그 뒤의 변경은 결과 공개 뒤에 보인다)
  const editable = scoring || (evStarted() && evCanAssign(p)), see = evCanSeeEvidence(p, kpiRole);   // 등급을 정하는 윗사람(본부장 · 대표이사)은 평가자가 매긴 점수도 고칠 수 있다
  const total = mine ? (p.subScore ?? 0) : evTotal(p);
  const rows = evKpi(p).map((k,i)=>{ const e = evEntry(p,i), g = mine ? (p.subMarks||[])[i] : e.grade;
    return `<tr><td>${evKpiCell(k)}${evCriteria(k, g, e.selfGrade)}</td>
      <td><div class="ev-self">${e.note ? `<b>실적</b> ${escapeHtml(e.note)}` : '<span class="list-sub" style="margin:0;">실적 미입력</span>'}${e.selfGrade?`<div class="list-sub">자기평가 <b>${e.selfGrade}</b></div>`:''}</div>
        <div style="margin-top:6px;">${evGradeBtns(`evSetGrade.bind(null,${p.pid},${i})`, g, e.selfGrade, editable)}</div></td>
      <td>${see ? evFiles(p, i, false) : '<span class="list-sub" style="margin:0;">권한 없음</span>'}</td>
      <td class="num">${g ? ((+k.weight)*EV_PCT[g]/100).toFixed(1) : '—'}</td></tr>`; }).join('');
  const label = mine ? '내가 낸 등급 의견' : p.stage!=='SCORE' ? '등급 (점선 = 평가자가 넣은 등급)'
    : `${lead ? '등급' : '등급 의견'} — 채점을 마치면 점수에 맞는 등급이 자동으로 나옵니다. 더 높이려면 점수를 고쳐야 하고, 낮출 수는 있습니다${lead ? '' : ' (직원에게는 보이지 않습니다)'}`;
  return `<div class="ev-panel">
    <div class="list-sub" style="margin-bottom:6px;">평가자 ${escapeHtml(evEvaluatorName(p))} · 점선 = 본인 자기평가, 초록 = 평가자 선택 · 증빙은 눌러서 내려받기${p.noSelf ? ' · <b>자기평가 없이 진행 (HR 처리)</b>' : ''}${!mine && p.proxy ? ` · <b>대리 입력 ${escapeHtml(p.proxy)}</b>` : ''}</div>
    ${mine ? kpiNote('내가 낸 평가입니다. 그 뒤에 바뀐 내용과 최종 등급은 HR이 결과를 공개한 뒤에 보입니다.') : ''}
    <div class="ct-tbl"><table class="ev-table"><thead><tr><th style="width:40%;">KPI · 달성 기준</th><th>실적 · 달성 등급</th><th style="width:20%;">증빙자료</th><th class="num">점수</th></tr></thead>
      <tbody>${rows}<tr><td colspan="3"><b>총점</b> (가중치 × 달성 비율${!mine && p.bonus?` + 가점 ${p.bonus}`:''}) · 이 점수로 받을 수 있는 가장 높은 등급 <b>${evBand(total)}</b></td><td class="num"><b class="ev-total">${total.toFixed(1)}</b></td></tr></tbody></table></div>
    <div class="field" style="margin-top:10px;"><label>${label}</label><div>${mine ? `<b class="ev-final">${p.proposed||'—'}</b>` : evPickBtns(p, editable)}</div></div>
    <div class="field" style="margin-top:10px;"><label>평가자 코멘트 (직원에게 공개 · 필수)</label>${scoring ? `<textarea rows="3" oninput="evFind(${p.pid}).comment=this.value" placeholder="잘한 점과 다음 해에 기대하는 점">${escapeHtml(p.comment)}</textarea>` : `<div class="placeholder-note" style="margin:0;">${escapeHtml(p.comment)||'—'}</div>`}</div>
    ${!mine && (p.headComment || p.bonusReason) ? `<div class="list-sub" style="margin-top:6px;">${p.bonus?`가점 +${p.bonus} (${escapeHtml(p.bonusReason)}) · `:''}${p.headComment?`${evUpper(p)} 코멘트: ${escapeHtml(p.headComment)}`:''}</div>` : ''}
    ${scoring ? `<div style="text-align:right; margin-top:10px;">${lead ? `<button class="btn" onclick="evBonus(${p.pid})">가점</button> ` : ''}<button class="btn primary" onclick="evSubmitScore(${p.pid})">${lead ? '점수·등급 제출 (대표이사로)' : `점수·등급 의견 제출 (${evUpper(p)}${evPool(p)==='div' ? '으로' : '로'})`}</button></div>`
      : editable ? `<div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; margin-top:10px;"><span class="list-sub" style="margin:0;">고친 점수와 등급은 바로 반영됩니다. 등급은 고친 점수의 기준 안에서만 줄 수 있습니다.</span>${lead ? `<button class="btn sm" onclick="evBonus(${p.pid})">가점</button>` : ''}</div>` : ''}
  </div>`;
}
function evEditLine(p){   // 내가 평가한 사람을 윗사람이 고쳤을 때. 결과 공개 전에는 고쳤다는 사실만, 공개 뒤에 무엇이 바뀌었는지 보인다
  const ed = evEvaluatorOf(p)===kpiRole && evEdited(p);
  if(!ed) return '';
  const up = evUpper(p), text = evHidden(p) ? `${up}${up==='본부장' ? '이' : '가'} 평가를 고쳤습니다. 바뀐 내용은 결과 공개 뒤에 보입니다.` : `${up} 수정 · ${ed}`;
  return `<div class="list-sub" style="color:var(--coral-text);"><b>${text}</b>${p.editSeen!==ed ? ` <button class="btn sm" style="margin-left:6px;" onclick="evEditSeen(${p.pid})">확인</button>` : ' · 확인함'}</div>`;
}
function evMyTargets(part){   // part: 'mine' 내가 평가자인 사람만(HR의 내 화면) / 'proxy' 대표이사가 맡긴 사람만(HR의 관리 화면) / 없으면 모두
  const mine = evActive().filter(p=>evIsEvaluator(p) && (part==='proxy' ? evEvaluatorOf(p)!==kpiRole : part==='mine' ? evEvaluatorOf(p)===kpiRole : true));
  if(!mine.length) return '';
  return `<div class="card" style="margin-bottom:14px;"><div class="card-title"><span>${part==='proxy' ? '대표이사 대신 평가할 사람' : '내가 평가할 사람'} <span class="more">${mine.length}명</span></span></div>
    ${mine.map(p=>{ const open = evOpen===p.pid, hid = evHidden(p);
      return `<div class="list-row"><div><div class="list-title">${escapeHtml(p.name)} ${escapeHtml(p.title)} ${evStageBadge(p)}${evEvaluatorOf(p)!==kpiRole ? ' <span class="badge neutral">대표이사 대신</span>' : ''}${p.stage==='SCORE' && evLate('scoreTo') ? ' <span class="badge danger">기한 지남</span>' : ''}</div>
        <div class="list-sub">${escapeHtml(p.team||EV_DIVISION)} · ${evIsLine(p) ? `현장직 · ${evAttendance(p)}` : hid ? `내가 낸 점수 ${p.subScore!=null ? p.subScore.toFixed(1) : '—'} · 등급 의견 ${p.proposed||'—'}` : `현재 총점 ${evTotal(p).toFixed(1)} · 증빙 ${evFileCount(p)}건${evLeaveNote(p)}`}</div>${evEditLine(p)}</div>
        <button class="btn sm" onclick="evOpen=${open?'null':p.pid}; kpiFlash(null)" ${p.stage==='SELF'?'disabled title="자기평가 제출 전입니다"':''}>${open?'닫기':p.stage==='SCORE'?'평가하기':'보기'}</button></div>${open ? (evIsLine(p) ? evLinePanel(p) : evScorePanel(p)) : ''}`; }).join('')}
  </div>`;
}
function evPickBtns(p, can){   // 등급 고르기. 점선 = 평가자가 넣은 등급. 점수 기준·연차 규칙으로 줄 수 없는 등급은 막는다
  const cap = evCap(p);
  return `<span class="ev-grades">${KPI_GRADES.map(([g])=>{ const no = evAbove(g, cap);
    return `<button type="button" class="ev-g${p.grade===g?' on':''}${p.proposed===g?' self':''}${no?' no':''}" ${can && !no ? `onclick="evAssign(${p.pid},'${g}')"` : 'disabled'} aria-pressed="${p.grade===g}" title="${no ? (evLeaveBlocked(p) && 'SAB'.includes(g) ? `연차 초과 ${EV_LEAVE_LIMIT}일 이상이라 줄 수 없습니다` : `총점 ${evTotal(p).toFixed(1)}점으로는 줄 수 없습니다 (${evBandText(g)})`) : p.proposed===g ? '평가자가 넣은 등급' : ''}">${g}</button>`; }).join('')}</span>`;
}
function evCounts(cnt){ return ['S','A','B','C','D'].map(g=>`<span class="ev-count">${g} <b>${cnt[g]}</b></span>`).join(''); }
function evGradeTable(k, mode){   // 묶음 한 개의 명단 표. mode: 'head' 본부장 배정 / 'ceo' 대표이사 확인 / 'hr' HR 확정(보기만). { html, v, waiting }
  const list = evPoolList(k), quota = evQuota(list.length), stage = evAssignStage(k);
  const rows = list.slice().sort((a,b)=>evTotal(b)-evTotal(a)).map(p=>{
    const at = evAt(p, stage), can = mode!=='hr' && evStarted() && evCanAssign(p), open = evOpen===('g'+p.pid);
    const gradeCell = at===0 ? (evIsLine(p) ? evLineGradeBtns(p, can, 'evAssign') : evPickBtns(p, can))
      : (at>0 && p.grade ? `<b class="ev-final">${p.grade}</b>` : '<span class="list-sub" style="margin:0;">평가 대기</span>');
    const sub = [escapeHtml(p.team||'본부 직속'), evIsLine(p) ? `현장직 · ${evAttendance(p)}` : `증빙 ${evFileCount(p)}건${evLeaveNote(p)}`, at>=0 && p.proposed && `${escapeHtml(evEvaluatorName(p))} 의견 ${p.proposed}`, p.proxy && `대리 입력 ${escapeHtml(p.proxy)}`].filter(Boolean).join(' · ');
    return `<tr><td>${escapeHtml(p.name)} ${escapeHtml(p.title)}<div class="list-sub">${sub}</div></td><td>${evStageBadge(p)}</td>
      <td class="num">${evIsLine(p) ? '<span class="list-sub" style="margin:0;">팀장 평가</span>' : evTotal(p).toFixed(1)}${p.bonus?`<div class="list-sub">가점 +${p.bonus}</div>`:''}</td><td>${gradeCell}</td>
      <td style="white-space:nowrap;">${p.stage!=='SELF' ? `<button class="btn sm" onclick="evOpen=${open?'null':`'g${p.pid}'`}; kpiFlash(null)">${open?'닫기':'상세'}</button> ` : ''}${can && k!=='lead' ? `<button class="btn sm" onclick="evBonus(${p.pid})">가점·코멘트</button>` : ''}</td></tr>
      ${open ? `<tr><td colspan="5" style="padding:0;">${evIsLine(p) ? evLinePanel(p) : evScorePanel(p)}</td></tr>` : ''}`;
  }).join('');
  const waiting = list.filter(p=>evAt(p, stage)<0).length;
  const v = evValidate(evRoster(k), Object.fromEntries(list.filter(p=>p.grade && evAt(p, stage)>=0).map(p=>[p.pid, p.grade])), quota, !waiting);   // 다 도착하기 전에는 빠진 등급을 따지지 않는다
  const qText = quota.mode==='INDIVIDUAL' ? `S 최대 ${quota.capS}명 · A ${quota.A}명 (S만큼 줄어듦) · B ${quota.B}명 · D ${quota.D}명 · C 나머지` : `S 최대 ${quota.capS}명 · A·B 합계 ${quota.upper}명 (S만큼 줄어듦) · C·D 나머지`;
  const note = mode==='hr' ? '대표이사가 확인한 등급입니다' : k==='lead' ? '전사 팀장을 한 묶음으로 비율을 맞춥니다 · 점선 = 평가자(본부장)가 넣은 등급 · 등급을 누르거나 "상세"에서 점수를 고칩니다'
    : mode==='head' ? '점선 = 팀장 의견 · "상세"에서 팀장이 매긴 점수를 보고 고칠 수 있습니다 · 팀장은 여기서 빼고 따로 평가합니다'

function evHeadCard(){   // 본부장: 본부 팀원 등급 배정 → 마감하면 대표이사 확인으로 넘어간다

function evPoolText(k, st, mode){   // 목록 한 줄의 설명

  if(st==='DONE') return '확정했습니다';
  if(st==='HR') return (log.ceo ? `대표이사 확인 ${log.ceo.at} · ${escapeHtml(log.ceo.by)}` : '대표이사 확인을 마쳤습니다') + (log.undo && log.undo.from==='HR 확정' ? ` · HR이 확정을 되돌림 ${log.undo.at}` : '');
  if(log.undo && log.undo.from==='대표이사 확인' && (st==='CEO' || st==='FIX')) return `HR이 대표이사 확인을 되돌림 ${log.undo.at} · ${mode==='hr' ? '대표이사 확인을 기다립니다' : '다시 확인해 주세요'}`;

  if(st==='CEO') return k==='div' ? `${EV_RATERS.head} 마감${log.head ? ' '+log.head.at : ''} · 확인할 수 있습니다` : k==='lead' ? '모두 도착했고 비율이 맞습니다 · 확인할 수 있습니다' : '등급을 모두 정했습니다 · 확인할 수 있습니다';
  if(st==='FIX') return escapeHtml(evPoolCheck(k).errors[0]) + ' — 명단을 열어 맞춰 주세요';

  return (k==='div' && log.back ? `본부장에게 돌려보냈습니다 (${log.back.at}) · ` : '') + `아직 ${wait}명이 이전 단계에 있습니다`;
}
function evPoolCard(mode){   // 'ceo' = 대표이사 확인(또는 대신 입력하는 HR) → HR로 / 'hr' = HR 확정. 묶음(본부 팀원 · 전사 팀장 · 직속부서 팀원)을 체크해 한 번에 넘긴다

      <button class="btn primary" ${sel.size && actor ? '' : 'disabled'} onclick="evPoolDone('${mode}')">${ceo ? `선택한 ${sel.size}개 확인 (HR로)` : `선택한 ${sel.size}개 확정`}</button>
    </div>

function evNewsFor(role=kpiRole){ return kpiIsHr(role) ? EV_POOLS.filter(k=>{ const h = evPoolLog[k].head; return h && !h.seen[role] && evPoolState(k)==='CEO'; }) : []; }   // 본부장이 마감해 대표이사 확인을 기다리는 묶음 중 아직 확인을 누르지 않은 것 (HR 담당자·HR 팀장 따로). 대표이사가 확인하면 '확정할 묶음'으로 바뀌어 알림은 사라진다

function evSetBand(g, v){

/* ---------------- 현장직 (KPI 없는 직원) 평가 ----------------
   규칙 (인사담당자 2026-10-01): HR이 명단에서 "KPI 작성" 체크를 해제한 사람 = 현장직. 문항지 없음.
   팀장이 사람마다 S~D를 매기고 → 본부장 등급 배정 → HR 확정 (KPI 직원과 같은 흐름·같은 본부 정원).
   HR이 연말에 지각 횟수·연차 초과일수를 넣는다. 지각은 참고만, 연차 초과 5일 이상이면 S·A·B 불가. 이의 신청은 KPI 직원과 같다.
   연차 초과 규칙은 현장직만이 아니라 평가받는 모든 사람(팀원 · 팀장 · 직속부서)에게 같다 (인사담당자 2026-10-13) — HR이 전 직원의 연차 초과일을 넣고, 지각은 현장직만 넣는다 */
const EV_LEAVE_LIMIT = 5;
function evIsLine(p){ return p.kpi===false; }
function evLeaveBlocked(p){ return p.leaveOver >= EV_LEAVE_LIMIT; }   // 현장직·KPI 직원·팀장 모두 같다
function evLeaveNote(p){ return p.leaveOver ? ` · 연차 초과 ${p.leaveOver}일${evLeaveBlocked(p) ? ' <b class="evl-warn">→ S·A·B 불가</b>' : ''}` : ''; }   // KPI 직원 줄에 붙이는 근태 글자 (현장직은 evAttendance)
function evKpiLocked(p){ return !(p.stage==='SELF' || (evIsLine(p) && p.stage==='SCORE')); }
function evSetKpi(p, on){   // KPI 작성 여부는 평가 시작 전(자기평가 중 / 팀장 평가 대기)에만 바꾼다. 바꾸는 곳은 조직도 > 구성원 설정(msSave)
  if(evKpiLocked(p)) return '평가가 이미 진행 중이라 평가 방식을 바꿀 수 없습니다.';
  p.kpi = on; p.stage = on ? 'SELF' : 'SCORE'; if(!on) p.grade = null; return null;
}
function evSetAttendance(p, late, over){
  p.late = Math.max(0, Math.round(+late||0)); p.leaveOver = Math.max(0, Math.round((+over||0)*2)/2);
  if(evLeaveBlocked(p) && 'SAB'.includes(p.grade)) p.grade = null;   // 이미 매긴 S·A·B는 지운다
}
function evParseAttendance(text){   // 엑셀에서 복사한 "이름 ⇥ 지각 ⇥ 연차초과" 줄. 숫자가 아닌 줄(제목)은 건너뛴다
  const done = [], miss = [], lock = [];
  text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach(l=>{
    const [name, late, over] = l.split(/\t|,|\s+/);
    if(late===undefined || over===undefined || isNaN(+late) || isNaN(+over)) return;
    const p = evPeople.find(x=>x.name===name);   // 연차 초과일은 전 직원. 지각은 현장직만 화면에 쓴다
    if(!p) return miss.push(name);
    if(evAttLocked(p)) return lock.push(name);   // 등급이 넘어간 사람은 건너뛴다
    evSetAttendance(p, late, over); done.push(name);
  });
  return { done, miss, lock };
}
function evLineSelfCheck(){   // 브라우저 콘솔에서 evLineSelfCheck() 실행
  const ok = (c,m)=>{ if(!c) throw new Error('evLineSelfCheck 실패: '+m); };
  const R = Array.from({length:10}, (_,i)=>({ pid:i+1, name:'p'+(i+1), score:i<2?0:95, kpi:i>=2, blocked:i===0 })), q = evQuota(10);
  ok(evValidate(R, {1:'A'}, q, false).errors.some(e=>e.includes('연차')) && evValidate(R, {1:'S'}, q, false).errors.some(e=>e.includes('연차')), '연차 초과 5일 이상 → S·A 불가');
  ok(!evValidate(R, {1:'C'}, q, false).errors.length, '연차 초과자도 C는 가능');
  ok(!evValidate(R, {2:'S'}, q, false).errors.length, '현장직 S는 총점(100 초과) 규칙 없음');
  ok(evValidate(R, {3:'S'}, q, false).errors.some(e=>e.includes('100점')), 'KPI 직원 S는 100점 초과만');
  const line = evPeople.filter(evIsLine), keep = line.map(p=>({ p, k:{ late:p.late, leaveOver:p.leaveOver, grade:p.grade, kpi:p.kpi, stage:p.stage } }));
  try {
    const [a, b] = line; b.grade = 'A';
    const r = evParseAttendance(`이름\t지각\t연차초과\n${a.name}\t2\t0\n${b.name}\t1\t6\n없는사람\t1\t1`);
    ok(r.done.length===2 && r.miss.join()==='없는사람' && a.late===2 && b.leaveOver===6, '엑셀 붙여넣기: 제목 줄 건너뛰고 이름으로 반영');
    ok(b.grade===null, '연차 초과 5일 이상이 되면 매긴 A를 지움');
    ok(evLeaveBlocked(b) && !evLeaveBlocked(a), '5일 기준');
    b.stage = 'GRADE'; ok(evSetKpi(b, true), '진행 중엔 평가 방식 변경 불가');
    b.stage = 'SCORE'; ok(!evSetKpi(b, true) && b.stage==='SELF' && !evIsLine(b), 'KPI 작성으로 바꾸면 자기평가부터');
  } finally { keep.forEach(({p,k})=>Object.assign(p, k)); }
  ok(evLeaveBlocked({ kpi:true, leaveOver:5 }) && !evLeaveBlocked({ kpi:true, leaveOver:4.5 }) && evValidate([{ pid:1, name:'가', score:105, blocked:true }], { 1:'S' }, evQuota(5), false).errors.some(e=>e.includes('연차')), '연차 초과 규칙은 KPI 직원·팀장에게도 같다');
  return 'evLineSelfCheck 통과';
}

/* ----- 화면 ----- */
function evAttendance(p){
  return `지각 ${p.late}회 <small>(참고)</small> · 연차 초과 ${p.leaveOver}일${evLeaveBlocked(p) ? ` <b class="evl-warn">→ S·A·B 불가</b>` : ''}`;
}
function evLineGradeBtns(p, editable, fn){   // fn = 누르면 부를 함수 이름
  return `<span class="ev-grades" role="radiogroup">${KPI_GRADES.map(([g])=>{ const no = evLeaveBlocked(p) && 'SAB'.includes(g);
    return `<button type="button" class="ev-g${p.grade===g?' on':''}${no?' no':''}" ${editable && !no ? `onclick="${fn}(${p.pid},'${g}')"` : 'disabled'} aria-pressed="${p.grade===g}"${no?' title="연차 초과 5일 이상이라 줄 수 없습니다"':''}>${g}</button>`; }).join('')}</span>`;
}
function evLinePanel(p){
  const editable = p.stage==='SCORE' && evStarted() && evIsEvaluator(p);
  return `<div class="ev-panel">
    <div class="list-sub" style="margin-bottom:8px;">현장직 · KPI 없이 팀장이 등급을 매깁니다 · ${evAttendance(p)}</div>
    ${evLineGradeBtns(evHidden(p) ? { ...p, grade:p.proposed } : p, editable, 'evSetLine')}${evHidden(p) ? '<div class="list-sub" style="margin-top:6px;">내가 낸 등급 의견입니다. 최종 등급은 결과 공개 뒤에 보입니다.</div>' : ''}
    <div class="field" style="margin-top:10px;"><label>팀장 코멘트 (선택 · 직원에게 공개)</label>${editable ? `<textarea rows="2" oninput="evFind(${p.pid}).comment=this.value" placeholder="한 해 근무에 대한 한 줄 평">${escapeHtml(p.comment)}</textarea>` : `<div class="placeholder-note" style="margin:0;">${escapeHtml(p.comment)||'—'}</div>`}</div>
    ${editable ? `<div style="text-align:right; margin-top:10px;"><button class="btn primary" onclick="evSubmitLine(${p.pid})">등급 제출</button></div>` : ''}

}

    <div class="list-sub" style="margin:0 0 10px;">팀장 평가로 진행돼요. 따로 작성할 것은 없어요.</div>
    <div class="evl-chips"><span>지각 ${me.late}회</span><span${evLeaveBlocked(me)?' class="warn"':''}>연차 초과 ${me.leaveOver}일</span></div>
    ${res}
    <div class="stat-sub">연차를 ${EV_LEAVE_LIMIT}일 이상 초과 사용하면 S·A·B 등급을 받을 수 없어요. 숫자는 HR이 연말에 넣습니다.</div>
  </div>`;

function evRosterCard(){   // HR: 평가 방식 + 근태(연차 초과일은 전 직원, 지각은 현장직) + 자기평가를 안 낸 사람·평가에서 빠지는 사람 처리. 명단이 길어 화면 맨 아래에 둔다
  const rows = evPeople.map(p=>{ const line = evIsLine(p), lock = evAttLocked(p);
    const num = (f, v)=>`<input type="number" min="0" step="${f==='late'?1:0.5}" value="${v}" style="width:64px;" aria-label="${escapeHtml(p.name)} ${f==='late'?'지각 횟수':'연차 초과일수'}" ${lock ? 'disabled title="등급이 다음 단계로 넘어가 고칠 수 없습니다. 먼저 되돌려 주세요."' : ''} onchange="evAttSet(${p.pid},'${f}',this.value)">`;
    const act = p.out ? `<button class="btn sm" onclick="evInclude(${p.pid})">되돌리기</button>`
      : `${p.stage==='SELF' && !line ? `<button class="btn sm" onclick="evSkipSelf(${p.pid})">자기평가 없이 진행</button> ` : ''}${evAt(p, 'SCORE')<=0 ? `<button class="btn sm" onclick="evExclude(${p.pid})">평가에서 제외</button>` : ''}`;
    return `<tr${p.out ? ' style="opacity:.6;"' : ''}><td>${escapeHtml(p.name)} ${escapeHtml(p.title)}<div class="list-sub">${escapeHtml(p.team||'본부 직속')}${p.line?' · '+escapeHtml(p.line):''}</div></td>
      <td><span class="badge ${line?'success':'neutral'}">${line?'현장직':'KPI'}</span></td>
      <td>${line ? num('late', p.late) : '—'}</td><td>${num('leaveOver', p.leaveOver)+(evLeaveBlocked(p)?' <b class="evl-warn">S·A·B 불가</b>':'')}</td>
      <td>${p.out ? `<span class="badge neutral">제외</span><div class="list-sub" style="margin:2px 0 0;">${escapeHtml(p.out.why)}</div>` : evStageBadge(p) + (p.noSelf ? '<div class="list-sub" style="margin:2px 0 0;">자기평가 없이 진행</div>' : '')}</td>
      <td class="num">${line || p.out ? '—' : evTotal(p).toFixed(1)}</td><td>${p.out ? '—' : p.grade||'—'}</td><td style="white-space:nowrap;">${act}</td></tr>`; }).join('');
  const on = evActive();
  return `<div class="card" id="evRoster" style="margin-bottom:14px;"><div class="card-title"><span>평가 대상 명단 · 근태 (HR) <span class="more">KPI ${on.filter(p=>!evIsLine(p)).length}명 · 현장직 ${on.filter(evIsLine).length}명${evPeople.length>on.length ? ` · 제외 ${evPeople.length-on.length}명` : ''}</span></span></div>
    <div class="list-sub" style="margin-bottom:8px;">평가 방식(KPI 작성 여부)은 <span class="more" onclick="goTo('org','o3')">조직도 › 구성원 설정</span>에서 바꿉니다. <b>연차 초과일은 전 직원</b>, 지각은 현장직만 입력합니다(지각은 참고). 연차를 ${EV_LEAVE_LIMIT}일 이상 초과 사용한 사람은 S·A·B를 받을 수 없습니다. 등급이 다음 단계로 넘어간 사람의 근태는 잠깁니다. 자기평가를 내지 못하는 사람은 "자기평가 없이 진행", 수습·휴직처럼 평가하지 않는 사람은 "평가에서 제외"로 처리합니다.</div>
    <div class="ct-tbl"><table class="ev-table"><thead><tr><th>이름</th><th>평가 방식</th><th>지각(회)</th><th>연차 초과(일)</th><th>단계</th><th class="num">총점</th><th>등급</th><th>처리</th></tr></thead><tbody>${rows}</tbody></table></div>
    <details style="margin-top:10px;"><summary class="list-sub" style="cursor:pointer; margin:0;">엑셀에서 붙여넣기 (이름 · 지각 · 연차초과 세 칸 — 현장직이 아니면 지각은 0)</summary>
      <textarea id="evPaste" rows="4" style="margin-top:8px;" placeholder="최현장&#9;3&#9;1"></textarea>
      <div style="text-align:right; margin-top:6px;"><button class="btn sm" onclick="evPasteApply()">반영</button></div></details>
  </div>`;
}

/* ----- 동작 ----- */
function evSetLine(pid, g){ const p = evFind(pid); p.grade = p.grade===g ? null : g; kpiFlash(null); }
function evSubmitLine(pid){
  const p = evFind(pid);
  if(!p.grade) return kpiFlash('등급을 골라 주세요.', 'danger');
  if(evLeaveBlocked(p) && 'SAB'.includes(p.grade)) return kpiFlash('연차 초과 5일 이상이라 S·A·B를 줄 수 없습니다.', 'danger');
  p.proposed = p.grade; p.stage = 'GRADE'; evOpen = null; kpiFlash(`${escapeHtml(p.name)} 님 등급 의견(${p.grade})을 제출했습니다. ${evUpper(p)} 등급 배정으로 넘어갑니다.`);
}
function evAttSet(pid, f, v){
  const p = evFind(pid);
  if(evAttLocked(p)) return kpiFlash(`${escapeHtml(p.name)} 님은 등급이 다음 단계로 넘어가 근태를 고칠 수 없습니다. 먼저 되돌려 주세요.`, 'danger');
  evSetAttendance(p, f==='late'?v:p.late, f==='late'?p.leaveOver:v); kpiFlash(null);
}
function evPasteApply(){
  const r = evParseAttendance(document.getElementById('evPaste').value), warn = r.miss.length || r.lock.length;
  kpiFlash(`${r.done.length}명 반영했습니다.${r.miss.length ? ` 평가 명단에 없는 이름: ${escapeHtml(r.miss.join(', '))}.` : ''}${r.lock.length ? ` 등급이 넘어가 건너뛴 사람: ${escapeHtml(r.lock.join(', '))}.` : ''}`, warn ? 'warning' : 'success');
}
function evSkipSelf(pid){   // HR: 자기평가를 내지 않은 사람을 자기평가 없이 평가자에게 넘긴다
  const p = evFind(pid);
  if(!kpiIsHr() || p.stage!=='SELF' || p.out) return;
  if(!evKpi(p).length) return kpiFlash(`${escapeHtml(p.name)} 님은 확정된 KPI가 없습니다. 구성원 설정에서 "KPI 작성"을 꺼 팀장 평가로 바꾸거나, 평가에서 제외해 주세요.`, 'danger');
  if(!confirm(`${p.name} 님을 자기평가 없이 평가자에게 넘길까요? 본인은 더 이상 자기평가를 낼 수 없습니다.`)) return;
  p.noSelf = kpiDay(0); p.stage = 'SCORE'; kpiFlash(`${escapeHtml(p.name)} 님을 자기평가 없이 ${escapeHtml(evEvaluatorName(p))} 평가로 넘겼습니다.`);
}
function evExclude(pid){   // HR: 이번 평가에서 뺀다(수습·휴직 등). 평가자가 점수를 내기 전에만. 묶음 인원과 비율에서도 빠진다
  const p = evFind(pid);
  if(!kpiIsHr() || p.out || evAt(p, 'SCORE')>0) return;
  const why = (prompt(`${p.name} 님을 이번 평가에서 제외하는 이유를 적어 주세요. (예: 수습, 휴직)`) || '').trim();
  if(!why) return;
  p.out = { at:kpiDay(0), why }; evOpen = null; kpiFlash(`${escapeHtml(p.name)} 님을 이번 평가에서 제외했습니다. 묶음 인원과 등급 비율에서도 빠집니다.`);
}
function evInclude(pid){   // 제외를 되돌린다 — 그 사람의 묶음이 아직 넘어가지 않았을 때만
  const p = evFind(pid);
  if(!kpiIsHr() || !p.out) return;
  const st = evPoolState(evPool(p));
  if(st!=='WAIT' && st!=='FIX') return kpiFlash('이 묶음은 이미 다음 단계로 넘어가 되돌릴 수 없습니다. 먼저 묶음을 되돌려 주세요.', 'danger');
  p.out = null; kpiFlash(`${escapeHtml(p.name)} 님을 평가 대상으로 되돌렸습니다.`);
}

/* ---------------- 평가 결과 ----------------
   규칙 (인사담당자 2026-10-01): HR이 "결과 공개"를 눌러야 직원에게 보인다 · 공개일부터 7일 안에 이의 신청 1회
   · HR이 답변하고 등급 유지/변경 (변경하면 정원 다시 검사) · 등급 변경은 대표이사가 확인해야 반영된다(2026-10-13) · 이의 처리 중이면 연봉계약서 능력급 반영 대기 · 지난 연도는 연도 버튼 */
const evRelease = { at:null };   // 결과 공개일 (HR)
const EV_APPEAL_DAYS = 7;
const EV_HISTORY = {   // 시연용 지난 결과 (가상 값): [최종 등급, 평가자 코멘트, 본부장 코멘트, [[실행목표, 가중치, 자기평가, 최종]]]
  emp:  { 2025:['B', '거래처 발굴 성과가 좋았습니다. 회신 속도를 더 끌어올려 봅시다.', '', [['병원 신규 거래처 발굴',40,'A','A'],['견적 회신 시간 단축',30,'A','B'],['고객 만족도 개선',30,'B','B']]],
          2024:['C', '첫해 적응을 잘했습니다.', '', [['담당 지역 거래처 관리',40,'B','B'],['견적 회신 시간 단축',30,'B','C'],['제품 교육 이수',30,'B','C']]] },
  lead: { 2025:['A', '팀 목표를 안정적으로 달성했습니다.', '대리점 채널이 크게 늘었습니다.', [['신규 대리점 발굴',40,'S','S'],['팀 매출 목표 달성',40,'A','A'],['팀원 1:1 면담',20,'A','A']]] },
  line: { 2025:['B', '출하 라인에서 성실하게 근무했습니다.', '', []] },   // 현장직: 실행목표 없음
};
let evResYear = null, evResView = null;   // 보고 있는 연도 / 펼친 사람(pid)

/* ----- 규칙 (순수 로직, evrSelfCheck가 검증) ----- */
function evAddDays(ymd, n){ const [y,m,d] = ymd.split('-').map(Number); return ctYmd(new Date(y, m-1, d+n)); }
function evAppealDue(){ return evRelease.at ? evAddDays(evRelease.at, EV_APPEAL_DAYS) : null; }
function evReleased(p){ return !!evRelease.at && p.stage==='DONE'; }
function evCanAppeal(p, role, today){ return evReleased(p) && !!role && p.key===role && !p.appeal && today<=evAppealDue(); }
function evFinalGrade(p){ return !evReleased(p) ? null : p.appeal && p.appeal.status!=='DONE' ? 'WAIT' : p.grade; }   // 연봉계약서로 넘기는 등급 (WAIT = 이의 처리 대기)
function evAppeal(p, role, reason, today){
  if(!evCanAppeal(p, role, today)) return '이의 신청 기간이 아니거나 이미 신청했습니다.';
  if(!reason.trim()) return '이의 신청 사유를 적어 주세요.';
  p.appeal = { reason:reason.trim(), at:today, status:'OPEN', answer:'', before:p.grade, after:null }; return null;
}
function evMarksTotal(p, marks){ return evScore(evKpi(p).map((k,i)=>({ weight:k.weight, grade:marks[i] })), p.bonus); }   // 항목별 등급을 이렇게 고치면 나오는 총점
function evApplyMarks(p, marks){ marks.forEach((g,i)=>{ evEntry(p,i).grade = g; }); }
function evGradeFits(p, grade, total){   // 이의 신청으로 바꿀 수 있는 등급인가. 정원은 따지지 않는다 — 이미 공개된 다른 사람의 등급을 건드릴 수 없고 대표이사 확인을 거친다(2026-10-13). 점수 기준과 연차 규칙은 지킨다
  const errs = [];
  if(evLeaveBlocked(p) && 'SAB'.includes(grade)) errs.push(`${p.name} 님은 연차 초과 ${EV_LEAVE_LIMIT}일 이상이라 S·A·B를 줄 수 없습니다.`);
  if(!evIsLine(p) && evAbove(grade, evBand(total))) errs.push(`총점 ${total.toFixed(1)}점으로는 ${grade}를 줄 수 없습니다 (${evBandText(grade)}). 점수를 함께 고쳐 주세요.`);
  return errs;
}
function evAnswer(p, isHr, grade, answer, marks){   // HR 답변. marks = 고친 항목별 등급(안 고치면 생략). 등급을 유지하면 바로 끝나고(DONE), 바꾸면 대표이사 확인을 기다린다(CEO) — 등급 확정은 대표이사 권한
  if(!isHr) return 'HR만 답변할 수 있습니다.';
  if(!p.appeal || p.appeal.status!=='OPEN') return '답변할 이의 신청이 없습니다.';
  if(!answer.trim()) return '답변을 적어 주세요.';
  const cur = evIsLine(p) ? null : evKpi(p).map((_,i)=>evEntry(p,i).grade), m = marks && cur && marks.join()!==cur.join() ? marks : null;
  const errs = evGradeFits(p, grade, evIsLine(p) ? 0 : m ? evMarksTotal(p, m) : evTotal(p)); if(errs.length) return errs.join('\n');
  if(grade===p.grade){ if(m) evApplyMarks(p, m); Object.assign(p.appeal, { status:'DONE', answer:answer.trim(), after:grade, marks:null }); return null; }

function evAppealOk(p, can){   // 대표이사 확인 → 고친 점수와 등급이 반영되고 직원에게 답변이 간다

function evAppealBack(p, can){   // 대표이사가 동의하지 않으면 HR로 돌려보낸다 (HR이 다시 답변한다)

function evRaisePct(p, g){ const c = ctContracts.find(c=>ctPerson(c.pid).key===p.key && c.status!=='CANCELLED'); return ctAbilityPct(ctRates, c ? ctBefore(c) : 0, g); }   // 그 사람의 페이존·등급 칸. 계약 자료가 없는 시연 인물은 첫 구간으로 보여 준다

  ctContracts.forEach(c=>{
    const k = ctPerson(c.pid).key, p = k && evPeople.find(x=>x.key===k), g = p && evFinalGrade(p);
    if(!g || c.newHire) return;
    if(c.status!=='DRAFT'){ c.stale = c.status!=='CANCELLED' && g!=='WAIT' && c.grade!==g ? g : null; return; }   // 이미 보낸 계약서는 고치지 않는다. 그 뒤 등급이 달라졌으면 HR에게 "다시 보내야 함"을 알린다

function evDaysLeft(due){ return Math.round((Date.parse(due) - Date.parse(kpiDay(0)))/864e5); }
function evResultCard(p, r, past){

function evTeamResults(role){   // 본부장 = 자기 본부, 대표이사 = 전체(모든 묶음을 확인하는 사람), 팀장 = 자기 팀원
  const me = evMe(), list = role==='head' ? evActive().filter(p=>p.div===EV_DIVISION) : role==='ceo' ? evActive() : me ? evActive().filter(p=>p.evaluator===me.pid) : [];
  if(!list.length) return '';
  const body = evRelease.at ? `<div class="ct-tbl"><table><thead><tr><th>이름</th><th>최종 등급</th><th class="num">총점</th><th>이의 신청</th><th></th></tr></thead><tbody>${evPersonRows(list, false)}</tbody></table></div>`
    : '<div class="placeholder-note" style="margin:0;">HR이 결과를 공개하면 볼 수 있습니다.</div>';
  return `<div class="card" style="margin-bottom:14px;"><div class="card-title"><span>${role==='head' ? '본부' : role==='ceo' ? '전체' : '팀원'} 평가 결과 <span class="more">${list.length}명</span></span></div>${body}</div>`;
}
function evAppealCeoCard(){   // 대표이사(또는 맡은 HR): HR이 등급을 바꾸기로 답변한 이의 신청을 확인한다
  const list = evPeople.filter(p=>p.appeal && p.appeal.status==='CEO');
  if(!list.length) return '';
  return `<div class="card" style="margin-bottom:14px;"><div class="card-title"><span>이의 신청 — 등급 변경 확인 <span class="more">${list.length}건</span></span></div>
    <div class="list-sub" style="margin-bottom:8px;">HR이 검토해 등급을 바꾸기로 한 건입니다. 확인하면 등급이 바뀌고 직원에게 답변이 갑니다. 동의하지 않으면 HR로 돌려보냅니다.</div>
    ${list.map(p=>{ const a = p.appeal, can = evCeoActs(p);
      return `<div class="ev-panel"><div><b>${escapeHtml(p.name)} ${escapeHtml(p.title)}</b> · ${evrGrade(a.before)} → ${evrGrade(a.after)}${a.marks ? ` · 총점 ${evTotal(p).toFixed(1)} → ${evMarksTotal(p, a.marks).toFixed(1)}` : ''} · 신청 ${a.at}</div>
        <div class="list-sub">사유: ${escapeHtml(a.reason)}</div><div style="margin-top:4px;"><b>HR 답변</b> ${escapeHtml(a.answer)}</div>
        <div style="display:flex; gap:8px; justify-content:flex-end; align-items:center; margin-top:8px;">${can ? `<button class="btn sm" onclick="evAppealCeo(${p.pid},false)">HR로 돌려보내기</button><button class="btn primary sm" onclick="evAppealCeo(${p.pid},true)">확인 (등급 변경)</button>` : '<span class="list-sub" style="margin:0;">본인 것은 대신 확인할 수 없습니다.</span>'}</div></div>`; }).join('')}
  </div>`;
}
function evResHrPanel(){
  const done = evActive().filter(p=>p.stage==='DONE').length, appeals = evActive().filter(p=>p.appeal), open = appeals.filter(p=>p.appeal.status==='OPEN');
  const toCt = evActive().filter(p=>{ const g = evFinalGrade(p); return g && g!=='WAIT'; }).length;
  const stat = (l, v, warn)=>`<div class="evr-stat"><small>${l}</small><b${warn?' class="warn"':''}>${v}</b></div>`;
  const head = evRelease.at
    ? `<span class="list-sub" style="margin:0;">공개일 <b>${evRelease.at}</b> · 이의 신청 마감 <b>${evAppealDue()}</b></span>`
    : `<span style="display:flex; gap:8px; flex-wrap:wrap;">${done<evActive().length ? `<button class="btn sm" onclick="evDemoFill()">시연: 확정 상태로 채우기</button>` : ''}<button class="btn primary" onclick="evPublish()">전 직원에게 결과 공개</button></span>`;
  const answerForm = p=>`<div class="ev-panel" style="margin-top:8px;">
      <div><b>${escapeHtml(p.name)} ${escapeHtml(p.title)}</b> · 현재 ${evrGrade(p.grade)} · 신청 ${p.appeal.at}</div>
      <div class="list-sub">"${escapeHtml(p.appeal.reason)}"</div>
      ${evIsLine(p) ? '' : `<div class="list-sub" style="margin-top:8px;">점수를 고칠 항목이 있으면 바꿔 주세요. 등급은 고친 점수의 기준 안에서만 줄 수 있습니다 (지금 총점 ${evTotal(p).toFixed(1)}점 → ${evBand(evTotal(p))}까지). 정원은 따지지 않습니다.</div>
        <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:4px;">${evKpi(p).map((k,i)=>`<label style="display:inline-flex; gap:5px; align-items:center; margin:0; font-size:var(--fs-xs);">${escapeHtml(k.action)} <select id="evAnsM${p.pid}_${i}" aria-label="${escapeHtml(k.action)} 달성 등급">${KPI_GRADES.map(([g])=>`<option ${g===evEntry(p,i).grade?'selected':''}>${g}</option>`).join('')}</select></label>`).join('')}</div>`}
      <div class="field-row" style="margin-top:8px;">
        <div class="field" style="max-width:200px;"><label for="evAnsG${p.pid}">최종 등급 (그대로 두면 유지)</label><select id="evAnsG${p.pid}">${KPI_GRADES.map(([g])=>`<option ${g===p.grade?'selected':''}>${g}</option>`).join('')}</select></div>
        <div class="field"><label for="evAnsT${p.pid}">답변 (직원에게 공개)</label><textarea id="evAnsT${p.pid}" rows="2" placeholder="검토한 내용과 결론"></textarea></div>
      </div>
      <div style="text-align:right;"><button class="btn primary sm" onclick="evAnswerSubmit(${p.pid})">답변 보내기</button></div>
    </div>`;
  return `<div class="card" style="margin-bottom:14px;">
      <div class="card-title"><span>결과 공개 · 이의 신청 (HR)</span>${head}</div>
      <div class="evr-stats">${stat('확정', `${done}/${evActive().length}명`)}${stat('이의 신청', appeals.length+'건')}${stat('답변 대기', open.length+'건', open.length>0)}${stat('계약서 반영 가능', toCt+'명')}</div>
      ${!evRelease.at ? `<div class="list-sub">평가 진행 탭에서 대표이사 확인과 HR 확정을 모두 끝낸 뒤 공개합니다. 공개하면 모두 같은 날 결과를 보고, 그날부터 ${EV_APPEAL_DAYS}일 동안 이의 신청을 받습니다.</div>` : ''}
      ${appeals.some(p=>p.appeal.status==='CEO') ? kpiNote('등급 변경이 대표이사 확인을 기다립니다: ' + appeals.filter(p=>p.appeal.status==='CEO').map(p=>`${escapeHtml(p.name)} (${p.appeal.before} → ${p.appeal.after})`).join(', '), 'warning') : ''}
      ${open.map(answerForm).join('')}
    </div>
    <div class="card" style="margin-bottom:14px;"><div class="card-title"><span>전체 결과 <span class="more">시연 인원 ${evActive().length}명</span></span></div>
      <div class="ct-tbl"><table><thead><tr><th>이름</th><th>최종 등급</th><th class="num">총점</th><th>이의 신청</th><th></th></tr></thead><tbody>${evPersonRows(evActive(), true)}</tbody></table></div></div>`;
}

function evDemoFill(){ evDemoFillData(); EV_POOLS.forEach(k=>{ evPoolLog[k].ceo = evPoolLog[k].ceo || { at:kpiDay(0), by:EV_RATERS.ceo }; }); kpiFlash(`시연용으로 ${evPeople.length}명 모두 확정까지 끝난 상태로 채웠습니다. 이제 "전 직원에게 결과 공개"를 누르세요.`); }
function evPublish(){
  if(!orgIsHr()) return;
  if(evActive().some(p=>p.stage!=='DONE')) return kpiFlash('아직 확정되지 않은 사람이 있습니다. 평가 진행 탭에서 대표이사 확인과 HR 확정을 먼저 끝내 주세요.', 'danger');
  if(!confirm(`평가 결과를 전 직원에게 공개할까요? 오늘부터 ${EV_APPEAL_DAYS}일 동안 이의 신청을 받습니다.`)) return;
  evRelease.at = kpiDay(0);
  const park = evFind(4);   // 시연: 이의 신청 예시 1건 (박영업은 시연 역할이 없어 직접 신청할 수 없다)
  if(!park.appeal) park.appeal = { reason:'하반기 원격 상담 실적이 방문 횟수에 빠졌습니다. 상담일지를 첨부합니다.', at:kpiDay(0), status:'OPEN', answer:'', before:park.grade, after:null };
  evSyncContracts();
  kpiFlash('결과를 공개했습니다. 확정 등급은 작성 중인 연봉계약서 능력급에 반영됐고, 이의 신청 중인 사람은 처리 후 반영됩니다.');
}
function evAppealSubmit(pid){
  const err = evAppeal(evFind(pid), kpiRole, document.getElementById('evAp').value, kpiDay(0));
  if(err) return kpiFlash(escapeHtml(err), 'danger');
  evSyncContracts(); kpiFlash('이의 신청을 보냈습니다. HR 답변이 오면 이 화면에서 볼 수 있습니다.');
}
function evAppealCeo(pid, yes){
  const p = evFind(pid), err = yes ? evAppealOk(p, evCeoActs(p)) : evAppealBack(p, evCeoActs(p));
  if(err) return kpiFlash(escapeHtml(err).replace(/\n/g,'<br>'), 'danger');
  evSyncContracts(); kpiFlash(yes ? `${escapeHtml(p.name)} 님의 등급을 ${p.grade}(으)로 바꾸고 답변을 보냈습니다.` : 'HR로 돌려보냈습니다. HR이 다시 답변합니다.');
}
function evAnswerSubmit(pid){
  const p = evFind(pid), marks = evIsLine(p) ? null : evKpi(p).map((_,i)=>{ const el = document.getElementById(`evAnsM${pid}_${i}`); return el ? el.value : evEntry(p,i).grade; });
  const err = evAnswer(p, orgIsHr(), document.getElementById('evAnsG'+pid).value, document.getElementById('evAnsT'+pid).value, marks);
  if(err) return kpiFlash(escapeHtml(err).replace(/\n/g,'<br>'), 'danger');
  evSyncContracts(); kpiFlash(p.appeal.status==='CEO' ? `${escapeHtml(p.name)} 님 답변을 저장했습니다. 등급 변경(${p.appeal.before} → ${p.appeal.after})은 대표이사 확인을 거쳐 직원에게 갑니다.` : `${escapeHtml(p.name)} 님에게 답변을 보냈습니다. 최종 등급 ${p.grade} (유지).`);
}
function evResultContent(){
  const me = evMe();
  return `${roleSwitcher()}${hrSwitch()}${kpiMsg ? kpiNote(kpiMsg.msg, kpiMsg.type) : ''}
    ${hrAdmin() ? evResHrPanel() + (evProxy ? evAppealCeoCard() : '')   // HR 관리 화면: 결과 공개 · 이의 신청 · 전체 결과

    <div class="list-sub">시연용 가상 결과입니다. 결과를 보려면 HR 담당자로 바꿔 "직원 인사평가 관리" 화면에서 "시연: 확정 상태로 채우기" → "전 직원에게 결과 공개"를 누르세요. 지난 연도 결과도 가상 값입니다.</div>`;
}

/* ---------------- 휴대폰에 설치 (홈 화면에 바로가기) ----------------
   2026-10-08 인사담당자 지시. PC에서는 포털 주소 QR을, 휴대폰에서는 갤럭시·아이폰별 "홈 화면에 추가" 순서를 보여 준다.
   앱 장터에서 받는 앱이 아니라 사이트 바로가기다 — 아이콘·이름·여는 방식은 site.webmanifest 가 정한다.
   QR은 운영 주소 하나를 미리 바꿔 둔 무늬다(행마다 #=검은 칸 — 0·1로 적으면 개인정보 검사가 전화번호로 오인한다). 주소가 바뀌면 다시 만든다 — 만드는 법은 CLAUDE.md. */
const INSTALL_QR = '#######..###.##...#######|#.....#.#.#.#.....#.....#|#.###.#.####..###.#.###.#|#.###.#.##.###.##.#.###.#|#.###.#..###....#.#.###.#|#.....#....###..#.#.....#|#######.#.#.#.#.#.#######|........#.#.....#........|#.....#.######...##..###.|..##.#..#.##.#####.#####.|#.##..####.#.###..#..#.##|#..............#....##..#|####.########....###....#|#..##...###...###..#...#.|#.#######..#######.###.##|#....#.#...#....#..#.##.#|#.###.##.######.#####.#..|........#...##.##...#....|#######...##....#.#.#...#|#.....#....#..###...#..##|#.###.#...###########.#..|#.###.#...###....##....##|#.###.#..##..#.#.....##.#|#.....#...###...#.###...#|#######.#...#...#.#..#..#';
function installQrSvg(code=INSTALL_QR, label='인사포털 주소 QR'){
  const rows = code.split('|'), n = rows.length, q = 4;   // q = 둘레 흰 여백(칸). 없으면 카메라가 못 읽는다
  let d = ''; rows.forEach((row, r)=>[...row].forEach((b, c)=>{ if(b==='#') d += `M${c+q} ${r+q}h1v1h-1z`; }));
  return `<svg viewBox="0 0 ${n+2*q} ${n+2*q}" shape-rendering="crispEdges" role="img" aria-label="${label}"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#1B2433"/></svg>`;
}
const INSTALL_STEPS = {
  galaxy: ['갤럭시', [
    ['삼성 인터넷으로 열렸을 때', ['화면 아래쪽 <b>메뉴(≡)</b>를 누릅니다.', '<b>현재 페이지 추가</b>를 누릅니다.', '<b>홈 화면</b>을 고르고 <b>추가</b>를 누릅니다.']],
    ['크롬으로 열렸을 때', ['화면 오른쪽 위 <b>⋮</b>를 누릅니다.', '<b>홈 화면에 추가</b>(또는 앱 설치)를 누릅니다.', '<b>설치</b>(또는 추가)를 누릅니다.']],
  ]],
  iphone: ['아이폰', [
    ['사파리로 열렸을 때', ['화면 아래쪽 <b>공유 버튼</b>(네모에서 화살표가 위로 나가는 모양)을 누릅니다.', '목록을 위로 올려 <b>홈 화면에 추가</b>를 누릅니다.', '오른쪽 위 <b>추가</b>를 누릅니다.']],
  ]],
};
function installNotice(tab, fresh){   // fresh = QR 로 방금 등록한 휴대폰 (authBoot)
  const head = t=>`<div class="card-title"><span>${t}</span><button type="button" class="x-btn" onclick="orgCloseModal()" aria-label="닫기">${icon('x')}</button></div>`;
  const steps = list=>`<ol class="inst-steps">${list.map((t, i)=>`<li><i>${i+1}</i><span>${t}</span></li>`).join('')}</ol>`;
  const app = `<div class="inst-app"><figure><img src="android-chrome-192x192.png?v=3" alt="" width="52" height="52">인사포털</figure><span>설치하면 휴대폰 홈 화면에 <b>회사 리본 아이콘</b>이 생깁니다.</span></div>`;
  if(!isPhone()) return orgModal(`<div class="inst">${head('휴대폰에 인사포털 설치')}
    <div class="inst-body"><div class="inst-qr">${installQrSvg()}휴대폰 카메라로 찍어 주세요</div>
      ${steps(['휴대폰 <b>기본 카메라</b>로 왼쪽 QR을 찍습니다.', '열린 인사포털에서 <b>휴대폰에 설치</b>를 누릅니다. 갤럭시·아이폰에 맞는 순서가 나옵니다.', '홈 화면에 생긴 아이콘으로 바로 들어옵니다.'])}</div>
    ${app}<div class="inst-note">카카오톡으로 QR을 찍으면 설치가 되지 않습니다. 휴대폰 기본 카메라로 찍어 주세요.</div></div>`);
  tab = tab || (/iPhone|iPad|iPod/.test(navigator.userAgent) ? 'iphone' : 'galaxy');
  orgModal(`<div class="inst">${head(fresh ? '이 휴대폰이 등록됐습니다' : '이 휴대폰에 설치하기')}
    ${fresh ? `<div class="preg-who"><i>✓</i><div><b>${escapeHtml(AUTH.me.name)}</b> · ${escapeHtml(AUTH.me.department)}<small>30일 동안 로그인이 유지됩니다 (쓸 때마다 연장)</small></div></div>
      <p class="inst-sub" style="margin-bottom:10px;">홈 화면에 추가하면 다음부터 아이콘으로 바로 들어옵니다</p>` : ''}
    <div class="inst-tabs">${Object.keys(INSTALL_STEPS).map(k=>`<button type="button" aria-pressed="${k===tab}" onclick="installNotice('${k}', ${!!fresh})">${INSTALL_STEPS[k][0]}</button>`).join('')}</div>
    ${INSTALL_STEPS[tab][1].map(g=>`<p class="inst-sub">${g[0]}</p>${steps(g[1])}`).join('')}
    ${app}<div class="inst-note">${fresh ? '아이폰은 이 화면이 열린 <b>사파리</b>에서 바로 홈 화면에 추가해 주세요. ' : ''}카카오톡 안에서 열린 화면에서는 설치가 되지 않습니다. 메뉴에서 <b>다른 브라우저로 열기</b>를 먼저 눌러 주세요.</div>
    <button type="button" class="btn primary" style="width:100%; justify-content:center; margin-top:14px;" onclick="orgCloseModal()">확인</button></div>`);
}

/* ---------------- 휴대폰 등록 (로그인 설계 13.1, 2026-10-19 인사담당자 결정) ----------------
   PC(하이웍스로 들어온 창)에서 홈 배너의 "휴대폰 등록" → 서버가 3분짜리 1회용 값을 담은 QR 무늬를 준다(POST /api/phone/code).
   휴대폰 카메라로 찍으면 포털이 /#d=값 으로 열리고 authBoot 가 값을 서버로 보내 휴대폰 세션(마지막 사용 후 30일)을 받는다.
   한 사람에 한 대 — 새로 등록하면 앞 휴대폰은 끊긴다. 찍으면 바로 등록되고(PC 에서 허용하는 단계 없음) 이 창이 2초마다 확인해 바로 바꿔 보여 준다. */
const PHONE = { qr:'', since:'', end:0, cur:null, state:'qr', timer:null, busy:false };   // state: qr · done(방금 등록) · over(3분 지남) · off(해제함)
const phoneDay = iso=>{ const d = new Date(iso); return `${d.getMonth()+1}/${d.getDate()}`; };
async function phoneGet(){ try { return (await (await fetch('/api/phone')).json()).phone; } catch(e){ return null; } }
function phoneDraw(){
  const P = PHONE, head = `<div class="card-title"><span>휴대폰 등록</span><button type="button" class="x-btn" onclick="orgCloseModal()" aria-label="닫기">${icon('x')}</button></div>`;
  const left = P.state==='done' ? `<div class="preg-ok"><i>✓</i><b>등록됐습니다</b>${escapeHtml(P.cur.device)} · 방금<button type="button" class="btn sm" onclick="phoneRevoke()">내가 한 게 아니면 해제</button></div>`
    : P.state==='over' ? `<div class="preg-ok"><b>시간이 지났습니다</b>QR은 3분 동안 한 번만 쓸 수 있어요<button type="button" class="btn sm primary" onclick="phoneReg()">새 QR</button></div>`
    : P.state==='off' ? `<div class="preg-ok"><b>해제했습니다</b>그 휴대폰은 바로 로그아웃됩니다<button type="button" class="btn sm primary" onclick="phoneReg()">새 QR</button></div>`
    : `<div class="inst-qr">${installQrSvg(P.qr, '휴대폰 등록 QR')}<b class="preg-left" id="phoneLeft">3:00 남음</b>한 번만 쓸 수 있어요<br><button type="button" class="btn sm" style="margin-top:8px;" onclick="phoneReg()">새 QR</button></div>`;
  const row = P.cur ? `<div class="preg-row"><b>${escapeHtml(P.cur.device)}</b><span>${phoneDay(P.cur.created_at)} 등록 · 마지막 사용 ${phoneDay(P.cur.last_seen_at)}</span>${P.state==='done' ? '<em>방금 등록</em>' : ''}<button type="button" class="btn sm" onclick="phoneRevoke()">해제</button></div>`
    : '<div class="list-sub" style="margin:0;">등록된 휴대폰이 없습니다.</div>';
  orgModal(`<div class="inst preg">${head}
    <div class="inst-body">${left}<ol class="inst-steps">${['휴대폰 <b>기본 카메라</b>로 왼쪽 QR을 찍습니다.', '휴대폰에 인사포털이 열리고 <b>이 휴대폰이 등록</b>됩니다.', '안내대로 <b>홈 화면에 추가</b>하면 다음부터 아이콘만 누르면 바로 열립니다.'].map((t, i)=>`<li><i>${i+1}</i><span>${t}</span></li>`).join('')}</ol></div>
    <div class="preg-dev"><b>등록된 휴대폰<small>한 사람에 한 대 — 새로 등록하면 이전 휴대폰은 해제됩니다</small></b>${row}</div>
    <div class="inst-note">로그인은 <b>30일</b> 유지되고 쓸 때마다 늘어납니다. 휴대폰을 잃어버리면 여기서 해제하거나 지원팀에 알려 주세요. 카카오톡으로 QR을 찍으면 등록되지 않습니다 — 휴대폰 기본 카메라로 찍어 주세요.</div></div>`);
}
async function phoneReg(){   // 새 QR — 서버가 앞서 띄운 값은 지운다
  clearInterval(PHONE.timer);
  const r = await fetch('/api/phone/code', { method:'POST' }), j = await r.json().catch(()=>({}));
  if(!r.ok){ orgCloseModal(); return kpiFlash(escapeHtml(j.error || '휴대폰 등록 QR을 만들지 못했습니다. 잠시 뒤 다시 눌러 주세요.'), 'danger'); }
  Object.assign(PHONE, { qr:j.qr, since:j.since, end:Date.now() + j.seconds*1000, cur:await phoneGet(), state:'qr', busy:false });
  phoneDraw();
  let n = 0;
  PHONE.timer = setInterval(async ()=>{
    if(!document.querySelector('#orgModal .preg')) return clearInterval(PHONE.timer);   // 창을 닫으면 그만 묻는다
    const s = Math.max(0, Math.ceil((PHONE.end - Date.now())/1000)), el = document.getElementById('phoneLeft');
    if(el) el.textContent = `${Math.floor(s/60)}:${String(s%60).padStart(2, '0')} 남음`;
    if((++n % 2 && s) || PHONE.busy) return;   // 등록됐는지는 2초마다 (시간이 다 되면 바로)
    PHONE.busy = true;
    const p = await phoneGet();
    PHONE.busy = false;
    if(!document.querySelector('#orgModal .preg') || PHONE.state!=='qr') return;
    if(p && p.created_at >= PHONE.since){ clearInterval(PHONE.timer); Object.assign(PHONE, { cur:p, state:'done' }); phoneDraw(); }
    else if(!s){ clearInterval(PHONE.timer); PHONE.state = 'over'; phoneDraw(); }
  }, 1000);
}
async function phoneRevoke(){
  clearInterval(PHONE.timer);
  const r = await fetch('/api/phone/revoke', { method:'POST' });
  if(!r.ok){ orgCloseModal(); return kpiFlash('휴대폰 등록을 해제하지 못했습니다. 잠시 뒤 다시 해 주세요.', 'danger'); }
  Object.assign(PHONE, { cur:null, state:'off' });
  phoneDraw();
}

/* ---------------- 구성원 설정 (조직도 > 구성원 설정) ----------------
   2026-10-12 인사담당자 지시. 하이웍스 명단에는 직책이 없다 → HR이 사람마다 정한다.
   한 사람이 한 줄: 포털 사용(출입) · 직책(없음·팀장·본부장·대표이사 중 하나) · HR 권한 · KPI 작성 · 평가 대상 · 연봉계약서.
   역할을 하나로 고르지 않고 칸을 나눈 이유: 직책은 한 사람에 하나지만 HR 권한은 직책과 따로다(HR 팀장 = 팀장 + HR 권한).
   화면에서 바꾼 것은 초안(msDraft)에만 담기고, 저장을 눌러야 명단(orgMembers)에 반영된다. 숫자·걸러 보기는 저장된 값 기준이다.
   시연 모드에서 실제로 이어지는 것: 직책 → 조직도, KPI 작성 → 평가 명단(evPeople).
   포털 사용·HR 권한·평가 대상·연봉계약서는 값만 담아 둔다 — 로그인(#51)이 붙으면 이 값대로 화면이 달라진다. */
const MS_FIELDS = [['use','포털 사용','켜야 들어올 수 있음'],['lead','직책','관리 화면의 범위'],['hr','HR 권한','전 직원 관리'],['kpi','KPI 작성','끄면 팀장 평가(현장직)'],['ev','평가 대상','끄면 올해 평가 제외'],['ct','연봉계약서','끄면 계약서 안 만듦']];
const MS_LEAD = { '':'없음', TEAM:'팀장', DIVISION:'본부장', CEO:'대표이사' };
const MS_NEW = { use:false, hr:false, kpi:true, ev:true, ct:true, isNew:true };   // 명단에 새로 들어온 사람: 포털 사용만 꺼 두고 나머지는 일반 직원 기준
const MS_LAST_HR = 'HR 권한이 있는 사람이 한 명뿐입니다. 다른 HR을 먼저 지정해 주세요.';
const msDraft = {}, msSel = new Set();
let msFilter = 'all', msDiv = '', msQuery = '';
const MS_LIVE = { list:[], depts:[], state:'' };   // 실제 로그인일 때의 명단 (GET /api/members). depts = 부서 목록(맡은 부서 고르기용). state: '' 아직 · loading · ok · err
function msList(){ return AUTH.live ? MS_LIVE.list : orgMembers; }   // 시연이면 조직도 명단, 실제면 서버 명단(하이웍스에서 가져온 사람)

/* ----- 규칙 (순수 로직, msSelfCheck가 검증) ----- */
function msFix(m){ if(m.lead==='CEO') m.kpi = m.ev = m.ct = false; if(m.lead==='DIVISION') m.ev = m.ct = false; return m; }   // 대표이사는 KPI를 작성하지 않는다(경영계획 목표만). 본부장은 연말 평가·포털 연봉계약서 대상이 아니다(2026-10-13)
function msApply(members, draft){ return members.map(m=>draft[m.id] ? { ...m, ...draft[m.id] } : m); }   // 초안을 얹은 명단
function msLastHr(members, id){ const hrs = members.filter(m=>m.hr && m.use); return hrs.length===1 && hrs[0].id===id; }   // HR이 0명이 되면 아무도 설정을 못 한다
function msEvOf(m, evp){ return evp.find(p=>p.name===m.name); }   // ponytail: 평가 명단과 이름으로 잇는다. 로그인·DB 이후에는 한 명단(같은 사람 번호)으로 합친다
function msLinkEv(members, evp){ evp.forEach(p=>{ const m = members.find(o=>o.name===p.name); if(m) m.kpi = p.kpi; }); }   // 처음 한 번: 평가 명단의 KPI 작성 여부를 읽어 온다
function msLockWhy(m, k, members, evp){   // 이 칸을 바꿀 수 없는 이유 ('' = 바꿀 수 있다). m·members = 초안을 얹은 값
  if(k==='kpi'){
    if(m.lead==='CEO') return '대표이사는 KPI를 작성하지 않습니다(경영계획 목표만).';
    const p = msEvOf(m, evp);
    if(p && evKpiLocked(p)) return '평가가 이미 진행 중이라 KPI 작성 여부를 바꿀 수 없습니다.';
  }
  if(m.lead==='DIVISION' && (k==='ev' || k==='ct')) return k==='ev' ? '본부장은 연말 평가를 하지 않습니다(팀장을 평가합니다).' : '본부장은 포털에서 연봉계약서를 만들지 않습니다.';
  if(m.lead==='CEO' && (k==='ev' || k==='ct')) return k==='ev' ? '대표이사는 평가 대상이 아닙니다.' : '대표이사는 포털 연봉계약서 대상이 아닙니다.';
  if((k==='hr' || k==='use') && msLastHr(members, m.id)) return MS_LAST_HR;
  return '';
}
/* 맡은 부서 (2026-10-20) — 팀장 · 본부장이 실제로 이끄는 부서. 안 정했으면 본인 소속. 하이웍스에서 본부장이 '임원' 부서에 있어도 HR 이 맡은 본부를 따로 정한다.
   실제 명단에서는 직책 규칙을 "맡은 부서" 기준으로 따진다 — 부서 종류(팀장 = 팀, 본부장 = 본부)는 서버가 저장할 때 본다. */
function msLedId(m){ return m.ledDept || m.dept; }
function msDeptName(id){ return (MS_LIVE.depts.find(d=>d.id===id) || {}).name || '(알 수 없는 부서)'; }
function msLedOpts(m){ return MS_LIVE.depts.filter(d=>m.lead==='TEAM' ? d.kind==='TEAM' || d.kind==='DIRECT' : m.lead==='DIVISION' && d.kind==='DIVISION'); }   // 팀장 = 팀 · 직속 팀 / 본부장 = 본부
function msLiveLeadErrs(m, members, byLed){   // orgLeadErrs 의 실제 명단 판 (비활성인 사람은 세지 않음). 직책을 고를 때는 대표이사 한 명만 따진다 — 팀장 · 본부장은 맡은 부서를 고르기 전이라 서버가 받아 줄 선택(소속 팀에 팀장이 있어도 다른 팀을 맡는 것)을 막지 않는다. byLed = 맡은 부서를 고를 때: 같은 부서를 맡은 사람이 이미 있나
  const led = msLedId(m), same = members.filter(o=>o.id!==m.id && o.active!==false && o.lead===m.lead);
  if(m.lead==='CEO' && same.length) return ['대표이사는 이미 있습니다.'];
  if(!byLed) return [];
  if(m.lead==='TEAM' && same.some(o=>msLedId(o)===led)) return ['이 팀에는 이미 팀장이 있습니다.'];
  if(m.lead==='DIVISION' && same.some(o=>msLedId(o)===led)) return ['이 본부에는 이미 본부장이 있습니다.'];
  return [];
}
function msSet(members, draft, id, k, v, evp){   // 초안에 담는다. 바꿀 수 없으면 이유를 돌려주고 아무것도 바꾸지 않는다
  const eff = msApply(members, draft), m = eff.find(o=>o.id===id), base = members.find(o=>o.id===id);
  if(m[k]===v) return '';
  let why = msLockWhy(m, k, eff, evp);
  if(!why && k==='lead') why = (AUTH.live ? msLiveLeadErrs : orgLeadErrs)({ ...m, lead:v }, eff)[0] || (v==='CEO' && m.kpi ? msLockWhy({ ...m, lead:'' }, 'kpi', eff, evp) : '');   // 팀장은 팀에 한 명, 본부장은 본부에 한 명, 대표이사는 한 명
  if(!why && k==='ledDept' && AUTH.live) why = msLiveLeadErrs({ ...m, ledDept:v }, eff, true)[0] || '';
  if(why) return why;
  const d = { ...draft[id], [k]:v };
  if(k==='lead' && v==='CEO') d.kpi = d.ev = d.ct = false;
  if(k==='lead' && v==='DIVISION') d.ev = d.ct = false;
  Object.keys(d).forEach(f=>{ if(d[f]===base[f]) delete d[f]; });   // 원래 값으로 되돌린 칸은 초안에서 뺀다
  if(Object.keys(d).length) draft[id] = d; else delete draft[id];
  return '';
}
function msDiffs(members, draft){   // 저장 전 확인에 보여 줄 바뀐 칸
  const txt = (k, v)=>k==='lead' ? MS_LEAD[v] : (v ? '켜짐' : '꺼짐');
  const led = m=>draft[m.id] && 'ledDept' in draft[m.id] ? [{ m, label:'맡은 부서', from:escapeHtml(msDeptName(msLedId(m))), to:escapeHtml(msDeptName(msLedId({ ...m, ...draft[m.id] }))) }] : [];   // 실제 명단에만 생긴다
  return members.flatMap(m=>[...MS_FIELDS.filter(([k])=>draft[m.id] && k in draft[m.id]).map(([k, label])=>({ m, label, from:txt(k, m[k]), to:txt(k, draft[m.id][k]) })), ...led(m)]);
}
function msClear(draft){ Object.keys(draft).forEach(id=>delete draft[id]); }
function msSave(members, draft, evp){   // 초안을 명단에 반영한다. 돌려주는 값 = 바뀐 칸 수
  const n = msDiffs(members, draft).length;
  members.forEach(m=>{
    const d = draft[m.id]; if(!d) return;
    if('kpi' in d){ const p = msEvOf(m, evp); if(p) evSetKpi(p, d.kpi); }   // 평가 명단의 평가 방식도 함께 바꾼다
    Object.assign(m, d);
    if(m.use) m.isNew = false;   // 포털 사용을 한 번 켜면 "설정 필요"에서 빠진다
  });
  msClear(draft);
  return n;
}
function msDate(v){   // 엑셀에서 온 날짜 글자(2024-03-02 · 2024.3.2 · 2024/03/02 · 20240302 · 2024년 3월 2일)를 YYYY-MM-DD로. 읽지 못하면 ''
  const x = String(v||'').trim().match(/^(\d{4})\s*[-./년]?\s*(\d{1,2})\s*[-./월]?\s*(\d{1,2})\s*[.일]?$/);
  if(!x) return '';
  const y = +x[1], mo = +x[2], d = +x[3], dt = new Date(Date.UTC(y, mo-1, d));
  return dt.getUTCFullYear()===y && dt.getUTCMonth()===mo-1 && dt.getUTCDate()===d ? `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}` : '';
}
function msBirthMd(v){   // 생년월일 글자에서 월-일만 남긴다 — 연도는 버린다(생일 축하에는 월·일만 쓴다). 1990-03-15 · 1990.3.15 · 19900315 · 900315 · 900315-1****** · 90.03.15 · 3월 15일 · 03-15. 읽지 못하면 ''
  const t = String(v||'').trim(), full = msDate(t);   // 여섯 자리(주민번호 앞자리)를 먼저 본다 — msDate는 900315를 9003년 1월 5일로 읽는다
  const x = t.match(/^\d{2}(\d{2})(\d{2})(?:-[\d*]+)?$/) || (full && full.match(/-(\d{2})-(\d{2})$/)) || t.match(/^\d{2}[-./](\d{1,2})[-./](\d{1,2})$/) || t.match(/^(\d{1,2})\s*[-./월]\s*(\d{1,2})\s*일?$/);
  const md = x ? x[1].padStart(2,'0')+'-'+x[2].padStart(2,'0') : '';
  return celebValidMd(md) ? md : '';
}
function msParsePaste(text, members, birth){   // 엑셀에서 복사한 "이름 ⇥ 직급 ⇥ 입사일" 줄, birth면 "이름 ⇥ 생년월일" 줄. 빈 칸은 그대로 둔다(직급만, 입사일만 넣을 수도 있다)
  const out = { rows:[], miss:[], dup:[], bad:[] };
  String(text||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach(l=>{
    const c = l.split(/\t|,/).map(x=>x.trim()), name = c[0] || '';
    let title = birth ? '' : c[1] || '', date = (birth ? c[1] : c[2]) || '';
    if(!birth && !date && msDate(title)){ date = title; title = ''; }   // "이름 ⇥ 입사일" 두 칸만 붙여넣은 줄 — 날짜를 직급으로 넣지 않는다
    if(!name || name==='이름' || name==='성명') return;   // 제목 줄
    const hit = members.filter(m=>m.name===name), val = !date ? '' : birth ? msBirthMd(date) : msDate(date);
    if(!hit.length) return out.miss.push(name);
    if(hit.length > 1) return out.dup.push(name);   // ponytail: 이름으로 맞춘다. 같은 이름이 여러 명이면 건너뛴다 — 로그인·DB 이후에는 메일이나 사번으로 맞춘다
    if(date && !val) return out.bad.push(name);
    if(title || val) out.rows.push({ id:hit[0].id, name, title, [birth ? 'birthday' : 'hireDate']:val });
  });
  return out;

  return `${picked.length ? `<div class="ms-bulk"><b>${picked.length}명 선택</b>${bulk('use','포털 사용')}${bulk('kpi','KPI 작성')}${bulk('ev','평가 대상')}${bulk('ct','연봉계약서')}<button type="button" class="x" onclick="msSel.clear(); renderContent()">선택 해제</button></div>` : ''}
      <div class="ct-tbl ms-wrap"><table class="ms-tbl">
        <colgroup><col style="width:44px"><col><col style="width:104px"><col style="width:124px"><col style="width:92px"><col style="width:132px"><col style="width:116px"><col style="width:116px"></colgroup>
        <thead><tr><th class="c"><input class="ms-ck" type="checkbox" ${shown.length && picked.length===shown.length?'checked':''} aria-label="보이는 사람 모두 선택" onchange="msPick([${shown.map(m=>m.id)}], this.checked)"></th><th><b>이름</b><small>누르면 보이는 화면 확인</small></th>${MS_FIELDS.map(([k, l, sub])=>`<th class="c"><b>${l}</b><small>${sub}</small></th>`).join('')}</tr></thead>
        <tbody>${rows || '<tr><td colspan="8" class="c" style="color:var(--text-muted);">해당하는 사람이 없습니다.</td></tr>'}</tbody></table></div>`;
}

        <span class="sp"></span>
        <select aria-label="본부" onchange="msDiv=this.value; msSel.clear(); renderContent()"><option value="">본부 전체</option>${(live ? [...new Set(L.map(m=>m.division))].sort((a,b)=>a.localeCompare(b, 'ko')) : ORG_TREE.map(t=>t.division)).map(dv=>`<option ${msDiv===dv?'selected':''}>${escapeHtml(dv)}</option>`).join('')}</select>
        <input id="msQ" aria-label="이름 검색" placeholder="이름 검색" value="${escapeHtml(msQuery)}" oninput="msQuery=this.value; msSel.clear(); document.getElementById('msBody').innerHTML=msTable()">
        ${live ? `<button type="button" class="btn sm" style="height:32px;" onclick="msDataAsk()">${icon('clip')}자료 넣기</button>` : `<button type="button" class="btn sm" style="height:32px;" onclick="msPasteAsk(false)">${icon('clip')}엑셀에서 붙여넣기</button>`}</div>

    ${d ? `<div class="ms-save"><span>바꾼 내용 <b>${d}건</b><i> · 아직 저장되지 않았습니다</i></span><span class="sp"></span><button type="button" class="btn" onclick="msReset()">되돌리기</button><button type="button" class="btn coral" onclick="msAskSave()">저장</button></div>` : ''}

/* ----- 비상연락망 파일로 넣기 (실제 로그인 · HR, 2026-10-19 인사담당자 결정) -----
   HR 이 고른 엑셀을 브라우저 안에서 읽어(rzLoad — 암호가 걸려 있으면 묻는다) 하이웍스 명단과 이름으로 맞춘 뒤 서버에 보낸다.
   파일은 서버로 보내지 않고 맞춘 값(직급·내선·연락처·메일)만 보낸다. 엑셀 값이 하이웍스 값보다 먼저 보이고, 매일 아침 명단 가져오기는 이 값을 덮어쓰지 않는다.
   부서는 바꾸지 않는다(조직 구조는 하이웍스) — 엑셀과 다른 사람만 알려 준다. */
const MS_CT_HEAD = { name:/^(이름|성명)$/, title:/^(직책|직급|직위|호칭)$/, ext:/내선/, mobile:/연락처|휴대|핸드폰/, email:/mail|메일/i, dept:/부서|소속/ };
const msCtKey = s=>String(s ?? '').replace(/\(.*?\)/g, '').replace(/\s+/g, '').toLowerCase();   // "품질경영\n제조본부\n(MQ본부)\n(65명)" → "품질경영제조본부"
function msCtRead(rows, people){   // 순수 함수 — msCtSelfCheck 가 검증. people = 구성원 설정 명단(MS_LIVE.list)
  let at = -1, col = {};
  for(let r = 0; r < Math.min(15, rows.length) && at<0; r++){
    const row = (rows[r] || []).map(c=>String(c ?? '').replace(/\s+/g, ''));
    const c = Object.fromEntries(Object.entries(MS_CT_HEAD).map(([k, re])=>[k, row.findIndex(v=>v && re.test(v))]));
    if(c.name>=0 && (c.ext>=0 || c.mobile>=0)){ at = r; col = c; }
  }
  if(at<0) return { error:'HEAD' };
  if(col.email<0){ const n = i=>rows.slice(at+1, at+21).filter(r=>String((r || [])[i] ?? '').includes('@')).length; col.email = [...(rows[at] || []).keys()].reduce((b, i)=>n(i)>(b<0 ? 0 : n(b)) ? i : b, -1); }   // 메일 제목을 못 알아보면 @ 가 든 칸
  const team = col.dept>=0 && !String(rows[at][col.dept+1] ?? '').trim() ? col.dept+1 : -1;   // 부서명이 두 칸을 합친 제목이면 오른쪽 칸이 팀
  const byName = {}; people.filter(p=>p.active!==false).forEach(p=>(byName[msCtKey(p.name)] ||= []).push(p));
  const out = { total:0, rows:[], miss:[], dup:[], twice:[], diff:[], leadTitle:{}, count:{ title:0, ext:0, mobile:0, email:0 } }, taken = new Set(), cell = (row, i)=>i<0 ? '' : String(row[i] ?? '').trim();
  let div = '', tm = '';
  for(let r = at+1; r < rows.length; r++){
    const row = rows[r] || [], d = cell(row, col.dept), t = cell(row, team);
    if(d){ if(d!==div) tm = ''; div = d; }   // 합친 칸은 위 값으로 (본부가 바뀌면 팀은 비운다)
    if(t) tm = t;
    const name = cell(row, col.name); if(!name) continue;
    out.total++;
    const where = msCtKey(tm) || msCtKey(div), hw = p=>msCtKey(p.team) || msCtKey(p.division);
    let c = byName[msCtKey(name)] || [];
    if(c.length>1) c = c.filter(p=>where && (where.includes(hw(p)) || hw(p).includes(where)));
    if(!c.length){ out.miss.push(name); continue; }
    if(c.length>1){ out.dup.push(name); continue; }
    const p = c[0], lt = cell(row, col.title);
    if(MS_CT_LEAD[lt.replace(/\s+/g, '')] && !out.leadTitle[p.id]) out.leadTitle[p.id] = lt;   // 직책 초안용 — 임원 묶음(상무이사)과 본부(본부장)에 두 번 나오면 본부장 줄을 쓴다
    if(taken.has(p.id)){ out.twice.push(name); continue; }
    taken.add(p.id);
    // ponytail: 팀 칸이 정말 빈 줄(본부 직속)도 위 팀을 이어받는다 — rzXlsx 가 합친 칸을 모른다. 부서 다름 안내·같은 이름 가리기에만 쓰여 값에는 영향 없음
    if(where && msCtKey(div)!=='임원' && !(where.includes(hw(p)) || hw(p).includes(where) || (!p.team && msCtKey(div).includes(msCtKey(p.division))))) out.diff.push({ name, file:(tm || div).replace(/\s+/g, ' ').replace(/\(.*?\)/g, '').trim(), hw:p.team || p.division });
    const v = { id:p.id }, raw = { title:cell(row, col.title), ext:cell(row, col.ext), mobile:cell(row, col.mobile), email:cell(row, col.email) };
    if(/^1\d{9}$/.test(raw.mobile)) raw.mobile = '0'+raw.mobile;   // 숫자로 저장돼 앞의 0이 빠진 휴대폰
    if(raw.title && raw.title.length<=30) v.title = raw.title;
    if(raw.ext && raw.ext.length<=20) v.ext = raw.ext;
    if(/^[0-9+()\- ]{2,30}$/.test(raw.mobile)) v.mobile = raw.mobile;
    if(raw.email.length<=120 && /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(raw.email)) v.email = raw.email;

}

/* ---------------- 메뉴 숫자 (내가 처리할 일) ----------------
   탭 id → 지금 역할이 처리할 일 건수. 끝내면 0이 되어 숫자가 사라진다. 왼쪽 메뉴에는 탭 합계를 보인다.
   안 본 급여명세서(p1)는 누가 봤는지 서버가 기억하므로 실제 로그인에서만 센다. */
function evTodo(part){   // 평가 진행에서 처리할 일 (평가가 시작된 뒤). 'me' = 내 일: 자기평가 · 내가 평가할 사람 · 윗사람이 고친 내 평가 확인 · 본부장 등급 배정 · 대표이사 확인 / 'admin' = HR 관리: 확정할 묶음 · 마감 알림 · 근태 입력 · 대표이사가 맡긴 일 / 없으면 합
  if(!evStarted()) return 0;
  const me = evMe(), n = (...st)=>EV_POOLS.filter(k=>st.includes(evPoolState(k))).length;
  const mine = (me && !me.out && !evIsLine(me) && me.stage==='SELF' && evKpi(me).length && evSelfOpen() ? 1 : 0)
    + evActive().filter(p=>p.stage==='SCORE' && evEvaluatorOf(p)===kpiRole).length + evEditNews().length
    + (kpiRole==='head' && evPoolList('div').some(p=>p.stage==='GRADE') ? 1 : 0) + (kpiRole==='ceo' ? n('CEO','FIX') : 0);
  const admin = !kpiIsHr() ? 0 : n('HR') + evNewsFor().length + (evAttDone ? 0 : 1)
    + (evProxy ? n('CEO','FIX') + evActive().filter(p=>p.stage==='SCORE' && evEvaluatorOf(p)==='ceo' && evCeoActs(p)).length : 0);
  return part==='me' ? mine : part==='admin' ? admin : mine + admin;
}
const TODO = {
  p1: ()=>AUTH.live ? PAY_LIVE.mine.filter(s=>!s.seen).length : 0,   // 공개됐는데 아직 안 연 내 급여명세서 (실제 로그인만 — 시연에는 새 명세서가 없다)
  p2: ()=>{ const me = ctActor(kpiRole), c = me && ctActive(ctContracts, me.pid); return c && c.status==='SENT' ? 1 : 0; },   // 서명할 연봉계약서
  p3: ()=>AUTH.live ? WH_LIVE.mine.filter(y=>!y.seen).length : 0,   // 공개됐는데 아직 안 연 내 원천징수영수증 (실제 로그인만 — 급여명세서 p1과 같다)
