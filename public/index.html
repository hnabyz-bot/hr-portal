<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인사 포털 - 사이트 구조 초안</title>
<style>
  :root{
    --sidebar-bg:#FFFFFF;
    --sidebar-hover:#F3F1FE;
    --sidebar-active-bg:#1A1D29;
    --sidebar-text:#6B7080;
    --sidebar-text-active:#FFFFFF;
    --accent:#4F5BD5;
    --accent-light:#EEF0FD;
    --bg-page:#F5F5FC;
    --surface:#FFFFFF;
    --border:#E9E9F4;
    --text-primary:#1A1D29;
    --text-secondary:#6B7080;
    --text-muted:#9CA0AF;
    --success:#1E9E6B; --bg-success:#E6F7EF;
    --warning:#C9861A; --bg-warning:#FDF3E1;
    --danger:#D64550; --bg-danger:#FCEAEA;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",Roboto,sans-serif;
    background:var(--bg-page);
    color:var(--text-primary);
    display:flex;
    height:100vh;
    overflow:hidden;
    font-size:14px;
  }
  /* ---------- SIDEBAR ---------- */
  .sidebar{
    width:240px; flex-shrink:0; background:var(--sidebar-bg); border-right:1px solid var(--border);
    display:flex; flex-direction:column; height:100%;
  }
  .sidebar-logo{
    display:flex; align-items:center; gap:10px;
    padding:18px 20px 16px 20px; color:var(--text-primary);
    border-bottom:1px solid var(--border);
  }
  .logo-word{ font-weight:800; font-size:16px; line-height:1.2; }
  .logo-sub{ font-size:11px; color:var(--text-muted); margin-top:1px; }
  .sidebar-nav{ flex:1; overflow-y:auto; padding:12px 10px; }
  .nav-item{
    display:flex; align-items:center; gap:11px;
    padding:10px 12px; margin-bottom:2px; border-radius:8px;
    color:var(--sidebar-text); cursor:pointer; user-select:none;
    transition:background .12s ease;
  }
  .nav-item:hover{ background:var(--sidebar-hover); color:var(--text-primary); }
  .nav-item.active{
    background:var(--sidebar-active-bg); color:var(--sidebar-text-active); font-weight:600;
  }
  .nav-item svg{ width:18px; height:18px; flex-shrink:0; }
  .nav-item span{ font-size:13.5px; }
  .sidebar-foot{
    padding:14px 20px; border-top:1px solid var(--border);
    color:var(--text-muted); font-size:11.5px; line-height:1.5;
  }
  /* ---------- MAIN ---------- */
  .main{ flex:1; display:flex; flex-direction:column; min-width:0; height:100%; }
  .topbar{
    height:60px; flex-shrink:0; background:var(--surface); border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between; padding:0 24px;
  }
  .topbar-title{ font-size:16px; font-weight:700; }
  .topbar-search{
    display:flex; align-items:center; gap:8px; background:var(--bg-page);
    border:1px solid var(--border); border-radius:8px; padding:7px 12px; width:320px; color:var(--text-muted);
  }
  .topbar-search svg{ width:15px;height:15px;flex-shrink:0; }
  .topbar-search input{
    border:none; background:transparent; outline:none; font-size:13px; width:100%; color:var(--text-primary);
  }
  .topbar-right{ display:flex; align-items:center; gap:16px; }
  .icon-btn{ width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center;
    color:var(--text-secondary); cursor:pointer; position:relative; }
  .icon-btn:hover{ background:var(--bg-page); }
  .icon-btn svg{ width:18px; height:18px; }
  .dot{ position:absolute; top:6px; right:6px; width:7px; height:7px; border-radius:50%; background:var(--danger); border:1.5px solid #fff; }
  .avatar{ width:32px; height:32px; border-radius:50%; background:var(--accent-light); color:var(--accent);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; }
  .subtabs{
    height:46px; flex-shrink:0; background:var(--surface); border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:4px; padding:0 24px; overflow-x:auto;
  }
  .subtab{
    padding:8px 14px; border-radius:7px; color:var(--text-secondary); font-size:13.5px;
    cursor:pointer; white-space:nowrap; font-weight:500;
  }
  .subtab:hover{ background:var(--bg-page); color:var(--text-primary); }
  .subtab.active{ background:var(--accent-light); color:var(--accent); font-weight:700; }
  .content{ flex:1; overflow-y:auto; padding:24px 28px 48px 28px; }
  .breadcrumb{ font-size:12.5px; color:var(--text-muted); margin-bottom:14px; }
  .breadcrumb b{ color:var(--text-secondary); font-weight:600; }

  /* ---------- CONTENT PRIMITIVES ---------- */
  .grid{ display:grid; gap:14px; }
  .g4{ grid-template-columns:repeat(4,1fr); }
  .g3{ grid-template-columns:repeat(3,1fr); }
  .g2{ grid-template-columns:repeat(2,1fr); }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; }
  .card-title{ font-size:14px; font-weight:700; margin:0 0 12px 0; display:flex; align-items:center; justify-content:space-between; }
  .card-title .more{ font-size:12px; font-weight:600; color:var(--accent); cursor:pointer; }
  .stat-label{ font-size:12.5px; color:var(--text-secondary); margin-bottom:6px; }
  .stat-value{ font-size:24px; font-weight:700; }
  .stat-sub{ font-size:12px; color:var(--text-muted); margin-top:4px; }
  .bar-track{ height:6px; background:var(--bg-page); border-radius:4px; margin-top:10px; overflow:hidden; }
  .bar-fill{ height:100%; background:var(--accent); border-radius:4px; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:left; color:var(--text-muted); font-weight:600; font-size:12px; padding:8px 10px; border-bottom:1px solid var(--border); }
  td{ padding:10px 10px; border-bottom:1px solid var(--border); color:var(--text-primary); }
  tr:last-child td{ border-bottom:none; }
  .badge{ display:inline-block; padding:3px 9px; border-radius:20px; font-size:11.5px; font-weight:700; }
  .badge.success{ background:var(--bg-success); color:var(--success); }
  .badge.warning{ background:var(--bg-warning); color:var(--warning); }
  .badge.danger{ background:var(--bg-danger); color:var(--danger); }
  .badge.neutral{ background:var(--bg-page); color:var(--text-secondary); }
  .btn{ display:inline-flex; align-items:center; gap:6px; padding:9px 16px; border-radius:8px; font-size:13px;
    font-weight:600; cursor:pointer; border:1px solid var(--border); background:var(--surface); color:var(--text-primary); }
  .btn.primary{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .quick-grid{ display:grid; grid-template-columns:repeat(6,1fr); gap:10px; }
  .quick-btn{ display:flex; flex-direction:column; align-items:center; gap:8px;
    text-align:center; cursor:pointer; }
  .quick-btn .qicon{ width:48px; height:48px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; }
  .quick-btn svg{ width:20px;height:20px; }
  .quick-btn .qlabel{ font-size:12px; font-weight:600; color:var(--text-secondary); }
  .hero-banner{
    background:linear-gradient(135deg,#F1EEFC 0%,#FFFFFF 75%);
    border-radius:16px; padding:28px 32px; margin-bottom:14px;
    position:relative; overflow:hidden;
  }
  .hero-banner .hero-mark{ position:absolute; top:-10px; right:-10px; opacity:.5; }
  .hero-title{ font-size:21px; font-weight:800; color:var(--text-primary); line-height:1.35; margin:12px 0 6px; position:relative; }
  .hero-sub{ font-size:13px; color:var(--text-secondary); position:relative; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; font-weight:600; color:var(--text-secondary); margin-bottom:6px; }
  .field input, .field select, .field textarea{
    width:100%; border:1px solid var(--border); border-radius:8px; padding:9px 11px; font-size:13px;
    font-family:inherit; color:var(--text-primary); background:var(--surface);
  }
  .divider{ height:1px; background:var(--border); margin:18px 0; }
  .placeholder-note{ font-size:12px; color:var(--text-muted); background:var(--bg-page); border-radius:8px; padding:10px 12px; margin-top:14px;}
  .hidden{ display:none !important; }
  .list-row{ display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--border); }
  .list-row:last-child{ border-bottom:none; }
  .list-title{ font-size:13.5px; font-weight:600; }
  .list-sub{ font-size:12px; color:var(--text-muted); margin-top:2px; }

  /* ---------- MOBILE ---------- */
  .menu-btn{ display:none; width:34px; height:34px; border-radius:8px; align-items:center; justify-content:center;
    color:var(--text-secondary); cursor:pointer; flex-shrink:0; }
  .menu-btn svg{ width:20px; height:20px; }
  .sidebar-backdrop{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:40; }
  @media (max-width:768px){
    .menu-btn{ display:flex; }
    .sidebar{
      position:fixed; top:0; left:0; height:100%; z-index:50; width:250px;
      transform:translateX(-100%); transition:transform .2s ease;
      box-shadow:2px 0 16px rgba(0,0,0,.18);
    }
    .sidebar.open{ transform:translateX(0); }
    .sidebar.open ~ .sidebar-backdrop{ display:block; }
    .topbar{ padding:0 14px; gap:8px; }
    .topbar-search{ display:none; }
    .content{ padding:16px 14px 32px 14px; }
    .hero-banner{ padding:20px; }
    .hero-mark svg{ width:56px; height:56px; }
    .hero-title{ font-size:18px; }
    .quick-grid{ grid-template-columns:repeat(3,1fr); }
    .grid.g2, .grid.g3, .grid.g4{ grid-template-columns:1fr; }
    .field-row{ grid-template-columns:1fr; }
    .card[style*="grid-column:span 2"]{ grid-column:auto; }
    .card{ overflow-x:auto; }
    table{ min-width:420px; }
  }
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-logo">
    <svg width="30" height="30" viewBox="0 0 32 32">
      <path d="M16 16 C16 9 21 4 27 4 C27 11 22 16 16 16 Z" fill="#FF6B6B"/>

</div>

<div class="main">

    </div>

    <div class="topbar-right">
      <div class="icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><div class="dot"></div></div>

      <div class="avatar">홍</div>
    </div>
  </div>
  <div class="subtabs" id="subtabsRow"></div>
  <div class="content" id="contentArea"></div>
</div>

<script>
const ICONS = {
  home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
  wallet:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><circle cx="16.5" cy="14" r="1"/>',

  search:'<circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
  network:'<circle cx="12" cy="4" r="2"/><circle cx="5" cy="18" r="2"/><circle cx="19" cy="18" r="2"/><path d="M12 6v6M12 12L6 16.5M12 12l6 4.5"/>',

  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  flag:'<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/>',
};
function icon(name){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</svg>`; }
function logoMark(size){
  return `<svg width="${size}" height="${size}" viewBox="0 0 32 32">
    <path d="M16 16 C16 9 21 4 27 4 C27 11 22 16 16 16 Z" fill="#FF6B6B"/>
    <path d="M16 16 C23 16 28 21 28 27 C21 27 16 22 16 16 Z" fill="#4F5BD5"/>
    <path d="M16 16 C16 23 11 28 5 28 C5 21 10 16 16 16 Z" fill="#51CF66"/>
    <path d="M16 16 C9 16 4 11 4 5 C11 5 16 10 16 16 Z" fill="#FFB020"/>
  </svg>`;
}

/* ---------------- CONTENT RENDERERS ---------------- */
function homeContent(){
  const services = [
    ['wallet','급여명세서','#E6F7EF','#1E9E6B'],
    ['plane','출장 신청','#EAF1FF','#3B6FE0'],
    ['calc','경비 산출','#FDF3E1','#C9861A'],
    ['search','규정 검색','#EEF0FD','#4F5BD5'],
    ['target','KPI','#F2ECFB','#7C5CD1'],
    ['users','구성원 검색','#E7F7F7','#1D9A9A'],
  ];
  return `
  <div class="hero-banner">
    <div class="hero-mark">${logoMark(90)}</div>
    <div class="hero-title">함께 만드는 성장,<br>더 편리해지는 인사업무</div>
    <div class="hero-sub">H&abyz 인사 통합포털에서 급여·출장·평가·규정을 한 곳에서 확인하세요</div>
  </div>
  <div class="card" style="margin-bottom:14px;">
    <div class="card-title">빠른 서비스</div>
    <div class="quick-grid">
      ${services.map(s=>`
      <div class="quick-btn">
        <div class="qicon" style="background:${s[2]};color:${s[3]};">${icon(s[0])}</div>
        <div class="qlabel">${s[1]}</div>
      </div>`).join('')}
    </div>
  </div>
  <div class="grid g3">
    <div class="card" style="grid-column:span 2;">
      <div class="card-title">결재 대기함 <span class="more">1건</span></div>
      <div class="list-row"><div><div class="list-title">서울 출장 경비 신청</div><div class="list-sub">2026.07.24 제출 · 1차 승인 대기</div></div><span class="badge warning">대기</span></div>
    </div>
    <div class="card">
      <div class="card-title">공지사항 <span class="more">더보기</span></div>
      <div class="list-row"><div><div class="list-title">2026년 하반기 KPI 중간점검 안내</div><div class="list-sub">인사팀 · 07.20</div></div></div>
      <div class="list-row"><div><div class="list-title">전자연봉계약서 서명 요청</div><div class="list-sub">인사팀 · 07.18</div></div></div>
      <div class="list-row"><div><div class="list-title">여름 휴가 사용 촉진 안내</div><div class="list-sub">인사팀 · 07.15</div></div></div>
    </div>
  </div>`;
}

/* ---- 경비 산출기 로직 ---- */
let expDestinations = [''];
let expDistanceMode = 'auto';
let expLastResult = null;
let expSearchCache = {};

function expEscape(str){
  return String(str).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function expErrorBox(msg){
  return `<div class="placeholder-note" style="background:var(--bg-danger); color:var(--danger);">${expEscape(msg)}</div>`;
}
function expRenderDestinations(){
  const wrap = document.getElementById('expDestWrap');
  if(!wrap) return;
  wrap.innerHTML = expDestinations.map((addr, i) => `
    <div class="field" style="margin-bottom:10px;">
      <label>출장지 ${i+1}${expDestinations.length>1?` <span style="font-size:11px; font-weight:600; color:var(--danger); cursor:pointer;" onclick="expRemoveDestination(${i})">삭제</span>`:''}</label>
      <div style="display:flex; gap:8px;">
        <input id="expDest_${i}" value="${expEscape(addr)}" oninput="expDestinations[${i}]=this.value" placeholder="예: 경기도 수원시 신원로 88"/>
        <span class="btn" onclick="expSearchPlace(${i})">🔍 검색</span>
      </div>
      <div id="expDestResults_${i}"></div>
    </div>`).join('');
}
function expAddDestination(){
  if(expDestinations.length>=10){ return; }
  expDestinations.push('');
  expRenderDestinations();
}
function expRemoveDestination(i){
  expDestinations.splice(i,1);
  expRenderDestinations();
}
function expSetDistanceMode(mode){
  expDistanceMode = mode;
  document.getElementById('expManualPanel').style.display = mode==='manual' ? 'block' : 'none';
}
async function expSearchPlace(target){
  const inputId = target==='departure' ? 'expDeparture' : `expDest_${target}`;
  const resultsId = target==='departure' ? 'expDepartureResults' : `expDestResults_${target}`;
  const inputEl = document.getElementById(inputId);
  const resultsEl = document.getElementById(resultsId);
  const query = inputEl.value.trim();
  if(!query){ resultsEl.innerHTML=''; return; }
  resultsEl.innerHTML = '<div class="placeholder-note">검색 중...</div>';
  try{
    const res = await fetch('/api/search-places', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({query})});
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || '검색에 실패했습니다.');
    expSearchCache[target] = data.results || [];
    if(!expSearchCache[target].length){ resultsEl.innerHTML = '<div class="placeholder-note">검색 결과가 없습니다. 도로명 주소를 직접 입력해 보세요.</div>'; return; }
    resultsEl.innerHTML = expSearchCache[target].map((r,i) => `
      <div class="list-row" style="cursor:pointer;" onclick="expPickPlace(${JSON.stringify(target)}, ${i})">
        <div><div class="list-title">${expEscape(r.name)}</div><div class="list-sub">${expEscape(r.road_address)}</div></div>
      </div>`).join('');
  }catch(err){
    resultsEl.innerHTML = expErrorBox(err.message);
  }
}
function expPickPlace(target, idx){
  const place = expSearchCache[target][idx];
  const inputId = target==='departure' ? 'expDeparture' : `expDest_${target}`;
  const resultsId = target==='departure' ? 'expDepartureResults' : `expDestResults_${target}`;
  document.getElementById(inputId).value = place.road_address;
  if(target!=='departure'){ expDestinations[target] = place.road_address; }
  document.getElementById(resultsId).innerHTML = '';
}
async function expCalculate(){
  const msgEl = document.getElementById('expMessage');
  const resultEl = document.getElementById('expResult');
  msgEl.innerHTML=''; resultEl.innerHTML='';

  const departure = document.getElementById('expDeparture').value.trim();
  const destinations = expDestinations.map(d=>d.trim()).filter(Boolean);
  if(!departure){ msgEl.innerHTML = expErrorBox('출발지를 입력해 주세요.'); return; }
  if(!destinations.length){ msgEl.innerHTML = expErrorBox('출장지를 1곳 이상 입력해 주세요.'); return; }

  const payload = {
    trip_date: document.getElementById('expDate').value,
    departure, destinations,
    vehicle_type: document.getElementById('expVehicle').value,
    fuel_type: document.getElementById('expFuel').value,
  };
  if(expDistanceMode==='manual'){
    const total = Number(document.getElementById('expManualTotal').value);
    const oneWayRaw = document.getElementById('expManualOneWay').value;
    if(!total || total<=0){ msgEl.innerHTML = expErrorBox('총 이동거리를 입력해 주세요.'); return; }
    payload.manual_distance = { total_km: total, one_way_km: oneWayRaw ? Number(oneWayRaw) : null };
  }

  msgEl.innerHTML = '<div class="placeholder-note">계산 중입니다... (지도·유가 조회에 몇 초 걸릴 수 있습니다)</div>';
  try{
    const res = await fetch('/api/calculate', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || '계산에 실패했습니다.');
    expLastResult = data;
    msgEl.innerHTML = '';
    resultEl.innerHTML = expRenderResult(data);
  }catch(err){
    msgEl.innerHTML = expErrorBox(err.message);
  }
}
function expRenderResult(r){
  const warn = r.fuel_price_is_fallback ? `<div class="placeholder-note" style="background:var(--bg-warning); color:var(--warning); margin-bottom:10px;">${expEscape(r.fuel_price_source)}</div>` : '';
  const costLabel = r.fuel_type==='electric' ? '충전비' : '유류비';
  const segRows = (r.route_segments||[]).map(s=>[`구간 ${s.segment_no}`, s.start, s.goal, s.distance_km+' km', s.duration_min+'분']);
  return `
  <div style="background:linear-gradient(135deg,var(--accent) 0%,#6C7AE0 100%); color:#fff; padding:22px 24px; border-radius:12px; text-align:center; margin-bottom:14px;">
    <div style="font-size:13px; opacity:.9;">최종 지급금액</div>
    <div style="font-size:30px; font-weight:800; margin-top:4px;">${r.total_payment.toLocaleString('ko-KR')}원</div>
  </div>
  <div class="grid g4" style="margin-bottom:14px;">
    <div class="card"><div class="stat-label">총 이동거리</div><div class="stat-value" style="font-size:18px;">${r.total_distance_km} km</div></div>
    <div class="card"><div class="stat-label">${expEscape(r.fuel_type_label)} 단가</div><div class="stat-value" style="font-size:18px;">${Math.round(r.fuel_price).toLocaleString('ko-KR')}원/${r.fuel_price_unit}</div></div>
    <div class="card"><div class="stat-label">${costLabel}</div><div class="stat-value" style="font-size:18px;">${r.fuel_cost.toLocaleString('ko-KR')}원</div></div>
    <div class="card"><div class="stat-label">일비</div><div class="stat-value" style="font-size:18px;">${r.daily_allowance.toLocaleString('ko-KR')}원</div></div>
  </div>
  ${warn}
  <div class="placeholder-note">${expEscape(r.allowance_reason)}</div>
  ${segRows.length ? simpleTableCard('구간별 이동 상세', ['구간','출발','도착','거리','소요시간'], segRows, ()=>'neutral', -1) : ''}
  <div class="card" style="margin-top:14px;">
    <div class="card-title">결과 내려받기</div>
    <div class="field" style="margin-bottom:10px;"><label>신청자 이름 (출장신청서용)</label><input id="expApplicantName" placeholder="예: 홍길동"/></div>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <span class="btn" onclick="expDownload('excel')">📊 Excel 다운로드</span>
      <span class="btn" onclick="expDownload('pdf')">📄 PDF 다운로드</span>
      <span class="btn" onclick="expDownload('application-form')">📝 출장신청서 PDF</span>
    </div>
  </div>`;
}
async function expDownload(kind){
  if(!expLastResult){ return; }
  const payload = Object.assign({}, expLastResult);
  if(kind==='application-form'){
    const nameEl = document.getElementById('expApplicantName');
    payload.applicant_name = nameEl ? nameEl.value : '';
  }
  try{
    const res = await fetch(`/api/export/${kind}`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
    if(!res.ok){
      const data = await res.json().catch(()=>({}));
      throw new Error(data.error || '다운로드에 실패했습니다.');
    }
    const blob = await res.blob();
    const disposition = res.headers.get('Content-Disposition') || '';
    const starMatch = disposition.match(/filename\*=UTF-8''([^;]+)/);
    const plainMatch = disposition.match(/filename="?([^";]+)"?/);
    const filename = starMatch ? decodeURIComponent(starMatch[1]) : (plainMatch ? plainMatch[1] : `출장경비.${kind==='excel'?'xlsx':'pdf'}`);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }catch(err){
    document.getElementById('expMessage').innerHTML = expErrorBox(err.message);
  }
}

function renderSidebar(){
  document.getElementById('sidebarNav').innerHTML = NAV.map(n => `
    <div class="nav-item ${n.id===currentNav.id?'active':''}" onclick="selectNav('${n.id}')">
      ${icon(n.icon)}<span>${n.label}</span>
    </div>`).join('');
}
function renderSubtabs(){
  document.getElementById('subtabsRow').innerHTML = currentNav.tabs.map(t => `
    <div class="subtab ${t.id===currentTab.id?'active':''}" onclick="selectTab('${t.id}')">${t.label}</div>
  `).join('');
}
function renderContent(){
  document.getElementById('pageTitle').textContent = currentNav.label;
  document.getElementById('contentArea').innerHTML =
    `<div class="breadcrumb">${currentNav.label} <b>›</b> ${currentTab.label}</div>` + currentTab.render();
}
function selectNav(id){
  currentNav = NAV.find(n=>n.id===id);
  currentTab = currentNav.tabs[0];
  renderSidebar(); renderSubtabs(); renderContent();
  closeSidebar();
}
function selectTab(id){
  currentTab = currentNav.tabs.find(t=>t.id===id);
  renderSubtabs(); renderContent();
}
function toggleSidebar(){ document.querySelector('.sidebar').classList.toggle('open'); }
function closeSidebar(){ document.querySelector('.sidebar').classList.remove('open'); }

renderSidebar(); renderSubtabs(); renderContent();
</script>
</body>
</html>
