const KPI_HOWTO = `<details style="margin-bottom:12px; font-size:var(--fs-xs); color:var(--text-secondary); line-height:1.7;"><summary style="cursor:pointer; font-weight:600;">※ 목표설정 방법</summary>
      1) 개인 KPI는 팀 목표와 직접 연결되도록 설정 (팀장님과 면담 후 목표 설정)<br>
      2) SMART 원칙에 따라 목표 설정<br>
      &nbsp;- Specific(구체적): 막연한 표현(X) → "월 1회 제안서 작성"처럼 구체적으로(O)<br>
      &nbsp;- Measurable(측정 가능): 고객만족 향상(X) → 고객 만족도 90% 이상 유지(월별 설문 결과 기준)(O)<br>
      &nbsp;- Achievable(달성 가능): 현실적인 수준에서 도전적인 목표 설정<br>
      &nbsp;- Relevant(관련성): 현재 역할과 팀 목표에 직접적으로 연관<br>
      &nbsp;- Time-bound(기한 설정): 언제까지 할 것인지 명확히 기재<br>
      3) 타 부서나 타인의 영향이 과도한 지표는 피하고, 본인이 책임지고 추진할 수 있는 업무로 범위 설정<br>
      4) 현재 진행 중인 업무가 아닌, 팀 목표 달성을 위한 새로운 업무목표로 설정 (실행목표 최소 3개, 가중치 합계 100)
    </details>`;   // 목표설정 방법 (시연 · 실제 로그인 같이)
function kpiMySheet(){

        </div><div class="list-sub" style="margin-top:8px;">제출 버튼은 실행목표가 3개 이상이고 가중치 합계가 100일 때 활성화됩니다.</div>`;

    if(s.pending) body += `<div class="list-sub" style="margin-top:12px;">승인 진행 중에는 수정할 수 없습니다.</div>`;

    <div class="card-title"><span>${KPI_YEAR}년 KPI 계획서 <span style="font-weight:500; color:var(--text-secondary);">[${me.dept}_${me.name}_${me.title}]</span></span><span class="badge ${cls}">${label}</span></div>
    ${editOpen ? kpiNote(`KPI 작성·수정 기간입니다. (${kpiPeriod.editFrom} ~ ${kpiPeriod.editTo})`, 'success')
               : kpiNote(`지금은 KPI 작성·수정 기간이 아닙니다. 조회만 가능합니다. (설정된 기간: ${kpiPeriod.editFrom||'미정'} ~ ${kpiPeriod.editTo||'미정'})`)}
    ${evalOpen ? kpiNote(`평가 기간입니다. 자기평가와 증빙자료는 <span class="more" onclick="goTo('perf','e2')">평가 진행 탭</span>에서 올립니다. (${kpiPeriod.evalFrom} ~ ${kpiPeriod.evalTo})`, 'success') : ''}
    ${s.rejectNote ? kpiNote(escapeHtml(s.rejectNote) + (s.confirmed?' — 기존 KPI는 그대로 유효합니다. 수정 기간 안에 고쳐서 다시 요청할 수 있습니다.':' — 고쳐서 다시 제출해 주세요.'), 'danger') : ''}
    ${kpiTieNote()}

/* ---------------- KPI 계획서 — 실제 로그인 (2026-10-20 인사담당자 결정, 1단계) ----------------

const KPI_LIVE = { state:'', me:null, inbox:[], team:null, admin:null, deleg:null, yr:null, busy:false, dirty:false, yrDirty:false };   // state: '' 아직 · loading · ok · err. deleg: 대표이사만 true/false. yr: HR 기간 칸에 적는 중인 날짜. dirty · yrDirty: 저장 안 한 내 초안 · 기간 칸 (R21)
function kpiEdited(){ if(AUTH.live) KPI_LIVE.dirty = true; }   // 내 초안을 화면에서 고쳤다 — 저장하기 전에는 다시 불러도 지킨다 (R21)
addEventListener('beforeunload', e=>{ if(AUTH.live && (KPI_LIVE.dirty || KPI_LIVE.yrDirty)){ e.preventDefault(); e.returnValue = ''; } });   // 저장 안 한 내 초안 · 기간 칸이 있으면 창을 닫거나 나가기 전에 브라우저가 묻는다 (없으면 아무것도 안 함)
function kpiLiveBack(){ return KPI_LIVE.me?.plan?.noteKind==='RETURNED' ? 1 : 0; }   // 돌려보내진 내 계획서 = 다시 써서 낼 일 1건 (메뉴 숫자 · 홈 오늘의 업무 같은 규칙). 수정 요청 거절은 확정본이 그대로라 할 일이 아니다
function kpiLiveKeep(me, admin){   // R21: 새로 받은 것(상태 · 사유 · 기간 · 처리함 …) + 아직 저장 안 한 내 초안 · HR 기간 칸 → { me, yr }
  const old = KPI_LIVE.me && KPI_LIVE.me.plan, w = admin && admin.window;

  else KPI_LIVE.dirty = false;   // 서버가 작성 중이 아니면(제출 · 확정 …) 서버 것
  return { me, yr:KPI_LIVE.yrDirty && KPI_LIVE.yr ? KPI_LIVE.yr : w && { from:w.from || '', to:w.to || '', ev:w.evalStart || '' } };

async function kpiLivePost(path, body){   // path: 내 계획서 일('draft' …) 또는 '/api/kpi/…' 주소 → 응답 상태 번호 (0 = 못 보냄). 400 은 위쪽 붉은 칸(시연 제출 오류와 같은 자리, R17c) — 창이 떠 있으면 창 안, 403 · 409 는 아래쪽 알림 (R17d)

    else if(!r.ok) wsNotice(j.error || '처리하지 못했어요. 잠시 뒤 다시 해 주세요.');
    return r.status;
  } catch(e){ wsNotice('보내지 못했어요. 인터넷 연결을 확인해 주세요.'); return 0; }

async function kpiLiveDo(path, body, done=KPI_LIVE_DONE[path]){   // 내 계획서(임시 저장 · 제출 · 제출 취소 · 수정 요청) · 관리자 처리 · HR 기간 · 대표이사 맡기기. 한 번에 하나 — 끝나면 서버 것으로 다시 그린다 (R17d)

}
function kvPct(p){ const it = kvItems(p); return it ? Math.round(it.reduce((a,i)=>a+i.weight*i.progress, 0)/100) : null; }   // 종합 진행률 = Σ(가중치 × 진행률)/100 — kpiProgress와 같은 식
function kvState(p){ return p.key ? kpiStatus(p.key)[0] : p.prog===null ? 'KPI 대상 아님' : Array.isArray(p.prog) ? '확정' : p.prog; }
function kvDays(p){   // 진행률(또는 늦어지는 이유)을 마지막으로 고친 지 며칠. 기록이 없으면 null
  if(!p.key) return p.upd;
  const at = kpiSheets[p.key].progAt;
  return at ? Math.round((celebParse(kpiDay(0)) - celebParse(at))/864e5) : null;
}
function kvIsSlow(p){ return kvSlow(kvAlarmPct(kvItems(p)), kvExpect(), kpiAlarm.gap); }   // 알람을 끈 항목은 빼고 따진다
function kvIsStale(p){ return kvPct(p)!==null && kvStale(kvDays(p), kpiAlarm.stale); }
function kvAvg(list){ const v = list.map(kvPct).filter(x=>x!==null); return v.length ? Math.round(v.reduce((a,b)=>a+b, 0)/v.length) : null; }
function kvNames(list){ return !list.length ? '없음' : list.slice(0,2).map(p=>p.name).join(' · ') + (list.length>2 ? ` 외 ${list.length-2}명` : ''); }
function kvMemoWriter(p){ return p.kind==='member' ? kvTeam(p.team).lead : p.kind==='lead' ? kvDiv(p.div).head : null; }   // 그 사람의 확인 메모를 쓰는 사람
function kvMemoShown(p){ return !!kvMemoWriter(p); }   // 메모 칸이 있는 사람 = 바로 위에 쓸 사람이 있는 사람. 본인도 본다(2026-10-13 변경)
function kvCanUse(){ const me = kvMe(); return kpiIsHr() || kpiRole==='ceo' || (!!me && me.kind!=='member'); }   // KPI 현황 탭을 쓰는 사람

/* ----- 확인 메모 주고받기 · 알람 끄기 (2026-10-13 인사담당자 지시) -----
   확인 메모는 팀장과 팀원(본부장과 팀장)이 "서로 확인했다"는 기록이다. 그래서 본인도 본다.
   - 쓰는 사람: 바로 위 관리자(kvCanMemo). 쓴 당일에만 고치거나 지운다. 고치면 본인의 확인 표시가 풀린다.
   - 본인: 메모마다 "확인했습니다"를 누른다(취소 없음). 답글을 달면 확인한 것으로 본다.
   - 답글: 본인과 쓴 사람만. 쓴 사람이 답글을 달면 본인이 다시 확인한다. 답글은 쓴 당일에만 지운다.
   - 쓴 사람이 아직 못 본 본인 답글은 "새 답글"로 표시하고, 그 사람을 열어 보면 본 것으로 한다(seen).
   부진 알람은 본인 화면에도 뜬다. 대신 본인이 KPI 항목마다 알람을 끌 수 있다(연말·특정 달에 끝나는 일 등).
   - 끈 항목은 빼고 나머지 항목의 가중 평균으로 부진을 따진다(kvAlarmPct). 화면의 종합 진행률 숫자는 그대로다.
   - 고른 달의 말일까지 꺼 두고 다음 달 1일부터 저절로 다시 켜진다. 본인과 바로 위 관리자가 다시 켤 수 있다. */
function kvMemoNew(at, by, text){ return { id:++kvMemoSeq, at, by, text, ack:null, replies:[], seen:0 }; }
function kvMuted(mute, today=kpiDay(0)){ return !!mute && today.slice(0,7) <= mute.until; }
function kvMuteWhy(mute){ return mute.why==='etc' ? mute.text : mute.why==='month' ? `${+mute.until.slice(5)}월에 끝나는 일` : KV_MUTE[mute.why]; }
function kvMuteUntil(mute){ const m = +mute.until.slice(5); return m===12 ? '올해 말까지' : `${m}월 말까지`; }
function kvMuteMake(why, month, text, today=kpiDay(0)){   // 끄는 기록을 만든다. 입력이 모자라면 이유(글자)를 돌려준다
  if(!KV_MUTE[why]) return '이유를 하나 골라 주세요.';
  const m = why==='year' ? 12 : +month;
  if(!(m >= +today.slice(5,7) && m <= 12)) return '이번 달부터 12월 사이에서 골라 주세요.';
  if(why==='etc' && !String(text||'').trim()) return '이유를 한 줄 적어 주세요.';
  return { why, text: why==='etc' ? String(text).trim().slice(0, 50) : '', until:`${today.slice(0,4)}-${String(m).padStart(2,'0')}`, at:today };
}
function kvAlarmPct(items, today=kpiDay(0)){   // 부진을 따질 진행률. 남는 항목이 없으면 null(알람 없음)
  if(!items) return null;
  const on = items.filter(i=>!kvMuted(i.mute, today)), w = on.reduce((a,i)=>a+i.weight, 0);
  return w ? Math.round(on.reduce((a,i)=>a+i.weight*i.progress, 0)/w) : null;
}
function kvMuteSet(p, idx, mute){   // idx = kvItems(p)에서의 순서
  const s = p.key && kpiSheets[p.key];
  if(s) s.confirmed.flatMap(g=>g.items)[idx].mute = mute; else (p.mutes = p.mutes || [])[idx] = mute;
}
function kvMemoRole(me, p){ return !me ? '' : me===p ? 'owner' : kvCanMemo(me, p) ? 'writer' : ''; }   // 이 사람의 메모에서 내 자리: 본인 / 쓴 사람(바로 위 관리자) / 그 밖은 보기만
function kvMemoCanEdit(m, role, today=kpiDay(0)){ return role==='writer' && m.at===today; }
function kvReplyCanDel(r, role, today=kpiDay(0)){ return !!role && r.who===role && r.at===today; }
function kvMemoUnread(m){ return m.replies.filter(r=>r.who==='owner').length - m.seen; }   // 쓴 사람이 아직 못 본 본인 답글 수
function kvMemoTodo(p){ return p && kvMemoShown(p) ? p.memos.filter(m=>!m.ack).length : 0; }   // 본인이 확인할 메모 수
function kvReplyTodo(me){ return me ? kvPeople.filter(p=>kvCanMemo(me, p) && p.memos.some(m=>kvMemoUnread(m) > 0)).length : 0; }   // 새 답글이 온 사람 수
function kvMemoAck(m, role, today=kpiDay(0)){ if(role!=='owner' || m.ack) return false; m.ack = today; return true; }
function kvMemoEdit(m, role, text, today=kpiDay(0)){
  text = String(text||'').trim().slice(0, 200);
  if(!kvMemoCanEdit(m, role, today) || !text) return false;
  m.text = text; m.ack = null; return true;
}
function kvMemoReply(m, role, by, text, today=kpiDay(0)){
  text = String(text||'').trim().slice(0, 200);
  if(!role || !text) return false;
  m.replies.push({ at:today, who:role, by, text });
  if(role==='owner') m.ack = m.ack || today; else m.ack = null;
  return true;
}
function kvReplyDel(m, ri, role, today=kpiDay(0)){
  if(!m.replies[ri] || !kvReplyCanDel(m.replies[ri], role, today)) return false;
  m.replies.splice(ri, 1); m.seen = Math.min(m.seen, m.replies.filter(r=>r.who==='owner').length); return true;
}
function kvSeeReplies(me, p){ if(p && kvMemoRole(me, p)==='writer') p.memos.forEach(m=>{ m.seen = m.replies.filter(r=>r.who==='owner').length; }); }

/* ----- 메모 한 묶음 (본인 화면·KPI 현황이 같이 쓴다) ----- */
function kvMd(ymd){ return `${+ymd.slice(5,7)}월 ${+ymd.slice(8)}일`; }
function kvMemoOne(p, m, role){
  const pid = p.id, edit = kvMemoUi.edit===m.id, reply = kvMemoUi.reply===m.id, owners = m.replies.filter(r=>r.who==='owner').length;
  let seenOwner = 0;
  const replies = m.replies.map((r, ri)=>{
    const fresh = role==='writer' && r.who==='owner' && ++seenOwner > m.seen;
    return `<div class="kv-reply${r.who==='owner'?' own':''}"><b>${escapeHtml(r.by)} · ${kvMd(r.at)}${fresh ? '<span class="kv-new">새 답글</span>' : ''}</b><span>${escapeHtml(r.text)}</span>${kvReplyCanDel(r, role) ? `<button type="button" class="kv-link" onclick="kvMemoDo('rdel','${pid}',${m.id},${ri})">삭제</button>` : ''}</div>`;
  }).join('');
  const state = role==='owner' ? (m.ack ? `<span class="kv-ack">${icon('check')}확인함 · ${kvMd(m.ack)}</span>` : `<button type="button" class="btn sm coral" onclick="kvMemoDo('ack','${pid}',${m.id})">${icon('check')}확인했습니다</button>`)
    : (m.ack ? `<span class="kv-ack">${icon('check')}${escapeHtml(p.name)} 확인함 · ${kvMd(m.ack)}</span>` : `<span class="kv-wait">${icon('clock')}${escapeHtml(p.name)} 아직 확인 전</span>`);
  const box = (id, val, ph, act, label)=>`<div class="kv-memo-in"><input id="${id}" maxlength="200" value="${escapeHtml(val)}" placeholder="${ph}" aria-label="${label}" onkeydown="if(event.key==='Enter' && !event.isComposing) kvMemoDo('${act}','${pid}',${m.id})"><button type="button" class="btn sm" onclick="kvMemoDo('${act}','${pid}',${m.id})">${label}</button><button type="button" class="btn sm" onclick="kvMemoOpen()">취소</button></div>`;
  return `<div class="kv-memo" data-owners="${owners}"><div class="kv-memo-h"><b>${kvMd(m.at)} · ${escapeHtml(m.by)}</b>${kvMemoCanEdit(m, role) && !edit ? `<span><button type="button" class="kv-link" onclick="kvMemoOpen('edit',${m.id})">수정</button><button type="button" class="kv-link" onclick="kvMemoDo('del','${pid}',${m.id})">삭제</button><small>오늘까지 고칠 수 있음</small></span>` : ''}</div>
    ${edit ? box('kvMemoEdit', m.text, '메모를 고쳐 주세요', 'edit', '저장') : `<div class="kv-memo-t">${escapeHtml(m.text)}</div>`}
    ${replies}
    <div class="kv-memo-f">${state}${role && !reply ? `<button type="button" class="kv-link" onclick="kvMemoOpen('reply',${m.id})">${icon('message')}답글</button>` : ''}</div>
    ${reply ? box('kvMemoReply', '', '답글을 적어 주세요', 'reply', '답글 남기기') : ''}</div>`;
}
function kvThread(p){   // 새 메모·확인할 메모·새 답글이 온 메모는 펼쳐 두고, 나머지는 "지난 메모"로 접는다
  const role = kvMemoRole(kvMe(), p);
  const front = (m, i)=>i===0 || (role==='owner' && !m.ack) || (role==='writer' && kvMemoUnread(m) > 0) || kvMemoUi.edit===m.id || kvMemoUi.reply===m.id;
  const a = p.memos.filter(front), b = p.memos.filter((m, i)=>!front(m, i));
  return a.map(m=>kvMemoOne(p, m, role)).join('') + (b.length ? `<details class="kv-old"><summary>지난 메모 ${b.length}건</summary>${b.map(m=>kvMemoOne(p, m, role)).join('')}</details>` : '');
}
function kvMyMemoCard(){   // 본인 화면(목표설정 탭): 내 KPI 아래에 붙는다
  const me = kvMe(), w = me && kvMemoWriter(me);
  if(!w || (!kvItems(me) && !me.memos.length)) return '';
  const n = kvMemoTodo(me), also = me.kind==='lead' ? '대표이사·HR' : kvDiv(me.div).head ? '본부장·HR' : 'HR';
  return `<div class="card" id="kvMyMemo" style="margin-top:14px;"><div class="card-title"><span>${w.title} 확인 메모</span>${n ? `<span class="badge danger">확인할 메모 ${n}건</span>` : ''}</div>
    <div class="list-sub" style="margin:-6px 0 4px;">${escapeHtml(w.name)} ${w.title}이 KPI 진행을 확인하고 남기는 메모입니다. 확인했다고 누르거나 답글을 달 수 있습니다. ${also}도 함께 봅니다.</div>
    ${me.memos.length ? kvThread(me) : '<div class="list-sub" style="padding:8px 0 0;">아직 받은 메모가 없습니다.</div>'}</div>`;
}
function kvMySlowNote(){   // 본인 화면: 부진 알람
  const me = kvMe(), it = me && kvItems(me);
  if(!it || !kvIsSlow(me)) return '';
  const off = it.filter(i=>kvMuted(i.mute)).length, a = kvAlarmPct(it), e = kvExpect();
  return `<div class="kv-alert" id="kpiSlow" style="margin:0 0 12px;">${icon('bell')}<span>진행이 기대보다 늦습니다 · ${off ? `알람을 끈 ${off}개 항목을 빼고 ${a}%` : `종합 ${a}%`} (오늘 기준 기대 ${e}%)</span></div>`;
}
function kvMuteCell(fi, it){   // 본인 KPI 표의 마지막 칸 아래
  return kvMuted(it.mute) ? `<div class="kv-mute">${icon('bellOff')}<span>알람 꺼짐 · ${escapeHtml(kvMuteWhy(it.mute))} (${kvMuteUntil(it.mute)}) <button type="button" class="kv-link" onclick="kvUnmute('${kvMe().id}',${fi})">다시 켜기</button></span></div>`
    : `<button type="button" class="kv-link kv-mute-btn" onclick="kvMuteAsk(${fi})">${icon('bellOff')}알람 끄기</button>`;
}

/* ----- 메모·알람 동작 ----- */
function kvMemoOpen(kind, id){
  kvMemoUi = { reply:kind==='reply' ? id : null, edit:kind==='edit' ? id : null }; renderContent();
  const el = document.getElementById(kind==='edit' ? 'kvMemoEdit' : 'kvMemoReply'); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}
function kvMemoDo(act, pid, mid, ri){
  const p = kvNode(pid), me = kvMe(), role = kvMemoRole(me, p), m = p.memos.find(x=>x.id===mid), val = id=>(document.getElementById(id) || {}).value;
  if(!m || !role) return;
  let done = false, msg = null;
  if(act==='ack') done = kvMemoAck(m, role);
  else if(act==='reply') done = kvMemoReply(m, role, `${me.name} ${me.title}`, val('kvMemoReply'));
  else if(act==='edit') done = kvMemoEdit(m, role, val('kvMemoEdit'));
  else if(act==='rdel') done = kvReplyDel(m, ri, role);
  else if(act==='del' && kvMemoCanEdit(m, role) && confirm('이 메모를 지울까요? 달린 답글도 함께 지워집니다.')){ p.memos.splice(p.memos.indexOf(m), 1); done = true; msg = '메모를 지웠습니다.'; }
  if(!done) return;
  kvMemoUi = { reply:null, edit:null }; kpiFlash(msg);
}
function kvMuteAsk(fi){
  const it = kvItems(kvMe())[fi], now = +kpiDay(0).slice(5,7);
  kvMuteUi = { fi, why:'' };
  orgModal(`<div class="card-title"><span>알람 끄기</span><button type="button" class="x-btn" onclick="orgCloseModal()" aria-label="닫기">${icon('x')}</button></div>
    <div style="font-weight:600;">${escapeHtml(it.action)}</div>
    <div class="list-sub" style="margin:2px 0 14px;">끈 항목은 빼고 나머지 항목으로 늦는지 따집니다. 팀장·본부장·HR이 이유를 함께 봅니다.</div>
    <div class="field" style="margin-bottom:10px;"><label id="kvMuteLab">왜 끄나요</label><div class="kv-chips" role="group" aria-labelledby="kvMuteLab">${Object.entries(KV_MUTE).map(([k, l])=>`<button type="button" class="kv-chip" aria-pressed="false" data-k="${k}" onclick="kvMutePick('${k}')">${l}</button>`).join('')}</div></div>
    <div class="field" id="kvMuteMonRow" style="display:none; margin-bottom:10px;"><label for="kvMuteMon" id="kvMuteMonLab">끝나는 달</label><select id="kvMuteMon" style="max-width:130px;" onchange="kvMutePick()">${Array.from({ length:13-now }, (x, i)=>now+i).map(m=>`<option value="${m}" ${m===Math.min(12, now+1)?'selected':''}>${m}월</option>`).join('')}</select></div>
    <div class="field" id="kvMuteTextRow" style="display:none; margin-bottom:10px;"><label for="kvMuteText">이유</label><input id="kvMuteText" maxlength="50" placeholder="이유를 한 줄로 적어 주세요" oninput="document.getElementById('kvMuteErr').textContent=''"></div>
    <div class="list-sub" id="kvMuteWhen" style="min-height:18px; margin:0;"></div>
    <div id="kvMuteErr" role="alert" style="min-height:18px; font-size:var(--fs-xs); color:var(--danger); font-weight:600;"></div>
    <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:6px;"><button type="button" class="btn" onclick="orgCloseModal()">취소</button><button type="button" class="btn coral" onclick="kvMuteSave()">알람 끄기</button></div>`);
}
function kvMutePick(k){   // 창을 다시 그리지 않고 고른 것만 표시한다
  if(k) kvMuteUi.why = k;
  const why = kvMuteUi.why, mon = document.getElementById('kvMuteMon');
  document.querySelectorAll('.kv-chip').forEach(c=>c.setAttribute('aria-pressed', c.dataset.k===why));
  document.getElementById('kvMuteMonRow').style.display = why && why!=='year' ? '' : 'none';
  document.getElementById('kvMuteMonLab').textContent = why==='month' ? '끝나는 달' : '언제까지 꺼 둘까요';
  document.getElementById('kvMuteTextRow').style.display = why==='etc' ? '' : 'none';
  const m = why==='year' ? 12 : +mon.value;
  document.getElementById('kvMuteWhen').textContent = !why ? '' : m===12 ? '올해 말까지 꺼 둡니다. 연말 평가에서 확인합니다.' : `${m}월 말까지 꺼 두고, ${m+1}월 1일부터 저절로 다시 켜집니다.`;
  document.getElementById('kvMuteErr').textContent = '';
}
function kvMuteSave(){
  const mute = kvMuteMake(kvMuteUi.why, document.getElementById('kvMuteMon').value, document.getElementById('kvMuteText').value);
  if(typeof mute==='string'){ document.getElementById('kvMuteErr').textContent = mute; return; }
  kvMuteSet(kvMe(), kvMuteUi.fi, mute); orgCloseModal();
  kpiFlash(`알람을 껐습니다 (${kvMuteUntil(mute)}). 팀장·본부장·HR 화면에 이유가 함께 보입니다.`);
}
function kvUnmute(pid, fi){
  const p = kvNode(pid), me = kvMe();
  if(!kvMemoRole(me, p)) return;   // 본인과 바로 위 관리자만 다시 켠다
  kvMuteSet(p, fi, null); kpiFlash('알람을 다시 켰습니다.');
}

/* ----- 줄 ----- */
function kvBar(v, slow){ const e = kvExpect(); return v===null ? '<span></span>' : `<div class="kv-bar${(slow ?? kvSlow(v, e, kpiAlarm.gap))?' slow':''}"><i style="width:${Math.min(100, v)}%"></i><u style="left:${e}%" title="오늘 기준 기대 ${e}%"></u></div>`; }
function kvMarks(p){
  if(!p) return '';
  return (kvIsSlow(p) ? `<span class="kv-mk bell" title="부진 — 기대 진행률보다 ${kvExpect()-kvAlarmPct(kvItems(p))}%p 낮음">${icon('bell')}</span>` : '')
    + (kvIsStale(p) ? `<span class="kv-mk clock" title="${kvDays(p)}일째 진행률을 고치지 않음">${icon('clock')}</span>` : '')
    + (!(kvMemoShown(p) && p.memos.length) ? '' : kvMemoRole(kvMe(), p)==='writer' && p.memos.some(m=>kvMemoUnread(m) > 0) ? `<span class="kv-mk memo new" title="새 답글이 있습니다">${icon('message')}</span>`
      : `<span class="kv-mk memo" title="확인 메모 ${p.memos.length}건">${icon('message')}</span>`);
}
function kvCnt(list){ const n = list.filter(kvIsSlow).length; return n ? `<span class="kv-cnt">부진 ${n}명</span>` : ''; }
function kvRow({ key, back='', lv=0, caret, name, small='', mk='', sub, v, tag, slow }){   // slow를 주지 않으면 진행률 숫자로 따진다(부서·본부 줄)
  return `<div class="kv-row lv${lv}${kvSel===key||kvBack===key?' on':''}" onclick="kvPick('${key}','${back}')">
    <span class="kv-caret">${caret===undefined ? '' : icon(caret?'chevD':'chevR')}</span>
    <div style="min-width:0;"><div class="kv-name"><span>${escapeHtml(name)}</span>${small ? `<small>${escapeHtml(small)}</small>` : ''}${mk}</div><div class="kv-sub">${escapeHtml(sub)}</div></div>

function kvPRow(p, lv=0, o={}){

    const filt = kvOnlySlow || kvQuery, keep = p=>(!kvOnlySlow || kvIsSlow(p)) && (!kvQuery || p.name.includes(kvQuery)), opened = k=>filt || kvOpen[k];
    const teamBlock = (t, lv, dept)=>!kvTeamAll(t).some(keep) ? '' : kvTRow(t, lv, { caret:!!opened(t.id), dept }) + (opened(t.id) ? kvTeamAll(t).filter(keep).map(p=>kvPRow(p, lv+1)).join('') : '');
    if(kvView==='person') return kvPeople.filter(keep).sort((a,b)=>(kvPct(a)??999)-(kvPct(b)??999)).map(p=>kvPRow(p, 0, { dept:true })).join('') || none;   // 진행률 낮은 순, 확정 전·현장직은 맨 뒤
    if(kvView==='team') return kvTeams.map(t=>teamBlock(t, 0, true)).join('') || none;
    return KV_ORG.map(d=>!kvDivAll(d).some(keep) ? '' : kvDRow(d, !!opened(d.id)) + (opened(d.id) ? d.teams.map(t=>teamBlock(t, 1)).join('') : '')).join('') || none;

function kvRenderList(){ const el = document.getElementById('kvList'); if(el) el.innerHTML = kvList(); }   // 검색어를 적는 동안에는 명단만 다시 그린다(입력칸을 다시 그리면 한글 조합이 끊긴다)

function kvItemsTable(p){

function kvBlock(p, title, sub){
  const v = kvPct(p), e = kvExpect(), days = kvDays(p), it = kvItems(p) || [], a = kvAlarmPct(it), off = it.filter(i=>kvMuted(i.mute)).length, slow = kvIsSlow(p);
  if(v===null) return `<div class="kv-head"><div><h3>${escapeHtml(title)}</h3><div class="list-sub">${escapeHtml(sub)}</div></div><span class="badge neutral">${escapeHtml(kvState(p))}</span></div>
    <div class="placeholder-note">${kvIsLine(p) ? '현장직은 KPI를 작성하지 않습니다. 팀장이 평가 진행 탭에서 등급을 매깁니다.' : '아직 확정된 KPI가 없습니다. 확정되면 항목과 진행률이 여기에 나옵니다.'}</div>`;
  return `<div class="kv-head"><div><h3>${escapeHtml(title)}${kvMarks(p)}</h3><div class="list-sub">${escapeHtml(sub)}</div></div><div class="kv-big${slow?' slow':''}">${v}<small>%</small></div></div>

    ${kvIsStale(p) ? `<div class="kv-alert amber">${icon('clock')}${days}일째 진행률을 고치지 않았습니다.</div>` : ''}

function kvMemoBlock(p){

function kvDetail(){

  const rows = kvPeople.map(p=>{ const v = kvPct(p), it = kvItems(p) || [];

/* ----- 화면 ----- */
function kvTiles(){
  const role = kpiRole, me = kvMe(), hr = kpiIsHr(role);
  const T = (c, label, val, em)=>`<div class="hm-tile ${c}"><span>${label}</span><b>${val}</b><em>${escapeHtml(em)}</em></div>`;
  const pc = v=>v===null ? '–' : `${v}<small>%</small>`, cnt = l=>`${l.length}<small>명</small>`;
  let scope, a, tail = '';
  if(hr){ scope = kvPeople; const wait = kvPeople.filter(p=>!kvIsLine(p) && kvPct(p)===null);
    a = T('blue','전 직원 평균 진행률', pc(kvAvg(kvPeople)), `KPI 대상 ${kvPeople.filter(p=>!kvIsLine(p)).length}명`) + T('slate','아직 확정 전', cnt(wait), kvNames(wait)); }
  else if(role==='ceo'){ const heads = KV_ORG.map(d=>d.head).filter(Boolean), leads = kvTeams.map(t=>t.lead); scope = [...heads, ...leads]; tail = ' (본부장·팀장)';
    a = T('blue','본부 KPI 평균', pc(kvAvg(heads)), `${heads.length}개 본부`) + T('green','부서 KPI 평균', pc(kvAvg(leads)), `${leads.length}개 부서`); }
  else if(me.kind==='head'){ const d = kvDiv(me.div); scope = kvDivAll(d).filter(p=>p!==me);
    a = T('blue','우리 본부 KPI', pc(kvPct(me)), '내 KPI = 본부 KPI') + T('green','부서 KPI 평균', pc(kvAvg(d.teams.map(t=>t.lead))), `${d.teams.length}개 부서`); }
  else { scope = kvTeam(me.team).members;
    a = T('blue','우리 부서 KPI', pc(kvPct(me)), '내 KPI = 부서 KPI') + T('green','팀원 평균 진행률', pc(kvAvg(scope)), `KPI 대상 ${scope.filter(p=>kvPct(p)!==null).length}명`); }
  const slow = scope.filter(kvIsSlow), stale = scope.filter(kvIsStale), memoed = slow.filter(p=>kvMemoShown(p) && p.memos.length).length;

}

/* 시연용 입사일·생일 — 오늘 기준으로 만들어 배너가 늘 보이게 한다 (가상 값) */
(function celebSeed(){
  const t = new Date(), ymd = d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const md = d=>ymd(d).slice(5), shift = (days, years=0)=>{ const d = new Date(t); d.setFullYear(d.getFullYear()-years); d.setDate(d.getDate()+days); return d; };
  const other = new Date(t.getFullYear()-6, (t.getMonth()+4)%12, 12);   // 이번 달·이번 주와 겹치지 않는 날
  orgMembers.forEach(m=>{ if(!m.isNew) m.hireDate = ymd(other); m.birthday = md(new Date(2000, (t.getMonth()+6)%12, 20)); });   // 새로 들어온 사람의 입사일은 비워 둔다
  const set = (name, o)=>Object.assign(orgMembers.find(m=>m.name===name), o);
  set('신에스', { hireDate:ymd(shift(-10)) });
  set('문해외', { hireDate:ymd(shift(-21)) });
  set('홍길동', { birthday:md(t) });
  set('김영희', { birthday:md(shift(3)) });
  set('오디바', { birthday:md(shift(6)) });
  set('최지원', { birthday:md(t), hideBirthday:true });   // 본인이 숨김 → 배너에 안 나옴
  set('이철수', { hireDate:ymd(new Date(t.getFullYear()-5, t.getMonth(), 1)) });
  set('정씨에', { hireDate:ymd(new Date(t.getFullYear()-1, t.getMonth(), 15)) });
  celebEvents.push({ id:1, type:'joy', memberId:orgMembers.find(m=>m.name==='서솔루').id, label:'결혼', until:ymd(shift(10)) });
  celebEvents.push({ id:2, type:'condol', memberId:orgMembers.find(m=>m.name==='강총무').id, label:'부친상', until:ymd(shift(3)) });
})();

/* ----- 규칙 (순수 로직, celebSelfCheck가 검증) ----- */
function celebParse(ymd){ const [y,m,d] = ymd.split('-').map(Number); return new Date(y, m-1, d); }
function celebValidMd(md){ if(!/^\d{2}-\d{2}$/.test(md)) return false; const [m,d] = md.split('-').map(Number); const x = new Date(2000, m-1, d); return x.getMonth()===m-1 && x.getDate()===d; }
function celebIsWelcome(hireDate, t){ if(!hireDate) return false; const days = Math.round((new Date(t.getFullYear(),t.getMonth(),t.getDate()) - celebParse(hireDate))/864e5); return days>=0 && days<=30; }
function celebBirthdaySoon(md, t){   // 오늘부터 7일 안의 생일이면 그날(Date), 아니면 null (2026-10-20 인사담당자 — 전에는 이번 주 월~일)
  if(!md || !celebValidMd(md)) return null;
  for(let i=0; i<7; i++){
    const d = new Date(t.getFullYear(), t.getMonth(), t.getDate()+i);
    const leap = new Date(d.getFullYear(), 1, 29).getMonth()===1;
    const target = (md==='02-29' && !leap) ? '02-28' : md;   // 윤년 생일은 평년에 2월 28일
    if(String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')===target) return d;
  }
  return null;
}
function celebMilestone(y){ return y===1 || y===3 || y===5 || (y>=10 && y%5===0); }
function celebAnnivYears(hireDate, t){
  if(!hireDate) return 0;
  const h = celebParse(hireDate), y = t.getFullYear()-h.getFullYear();
  return h.getMonth()===t.getMonth() && celebMilestone(y) ? y : 0;
}
function celebEventActive(e, t){ return celebParse(e.until) >= new Date(t.getFullYear(), t.getMonth(), t.getDate()); }
function celebList(key, members, events, t){
  const md = s=>`${+s.slice(-5,-3)}월 ${+s.slice(-2)}일`;
  if(key==='welcome') return members.filter(m=>celebIsWelcome(m.hireDate, t)).map(m=>({ m, note:md(m.hireDate)+' 입사' }));
  if(key==='birthday') return members.map(m=>({ m, d:!m.hideBirthday && celebBirthdaySoon(m.birthday, t) })).filter(x=>x.d).sort((a,b)=>a.d-b.d).map(({m})=>({ m, note:md(m.birthday)+' 생일' }));
  if(key==='anniversary') return members.map(m=>({ m, y:celebAnnivYears(m.hireDate, t) })).filter(x=>x.y).map(x=>({ m:x.m, note:`입사 ${x.y}주년 · ${md(x.m.hireDate)}` }));
  return events.filter(e=>e.type===key && celebEventActive(e, t)).map(e=>({ m:members.find(m=>m.id===e.memberId), note:e.label, ev:e })).filter(x=>x.m);
}
function celebValidateEvent(e, members, t){
  const errs = [];
  if(!['joy','condol'].includes(e.type)) errs.push('종류를 선택해 주세요.');
  if(!members.some(m=>m.id===e.memberId)) errs.push('대상자를 선택해 주세요.');
  if(!e.label.trim()) errs.push('내용을 입력해 주세요. (예: 결혼, 부친상)');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(e.until) || !celebEventActive(e, t)) errs.push('게시 종료일은 오늘이나 그 이후여야 합니다.');
  return errs;
}
function celebSelfCheck(){   // 브라우저 콘솔에서 celebSelfCheck() 실행
  const ok = (c,msg)=>{ if(!c) throw new Error('celebSelfCheck 실패: '+msg); };
  const t = new Date(2026, 9, 1);   // 2026-10-01 (목) → 이번 주 9/28(월)~10/4(일)
  ok(celebIsWelcome('2026-09-01', t) && !celebIsWelcome('2026-08-31', t) && celebIsWelcome('2026-10-01', t) && !celebIsWelcome('2026-10-02', t), '입사 환영 30일');
  ok(celebBirthdaySoon('10-01', t) && celebBirthdaySoon('10-07', t) && !celebBirthdaySoon('09-30', t) && !celebBirthdaySoon('10-08', t), '생일 오늘부터 7일 (지난 날 빼고)');
  ok(celebBirthdaySoon('01-02', new Date(2026, 11, 31)) && !celebBirthdaySoon('12-28', new Date(2027, 0, 1)), '연말연초 7일');
  ok(celebBirthdaySoon('02-29', new Date(2027, 1, 28)), '윤일 생일은 평년 2/28');
  ok(celebList('birthday', [{id:1, birthday:'01-02', hireDate:''}, {id:2, birthday:'12-31', hireDate:''}], [], new Date(2026, 11, 30)).map(x=>x.m.id).join()==='2,1', '날짜순 (해를 넘겨도)');
  ok(!celebValidMd('13-01') && !celebValidMd('02-30') && celebValidMd('02-29') && !celebValidMd('3-5'), '생일 형식');
  ok([1,3,5,10,15,20].every(celebMilestone) && ![2,4,6,7,9,11,12].some(celebMilestone), '주년 1·3·5·10 이후 5년마다');
  ok(celebAnnivYears('2021-10-20', t)===5 && celebAnnivYears('2022-10-01', t)===0 && celebAnnivYears('2021-09-20', t)===0 && celebAnnivYears('2026-10-01', t)===0, 'N주년 이번 달');
  const ms = [{id:1, hideBirthday:true, birthday:'10-01', hireDate:''}, {id:2, hideBirthday:false, birthday:'10-01', hireDate:''}];
  ok(celebList('birthday', ms, [], t).length===1, '생일 숨김 존중');
  const evs = [{type:'joy', memberId:2, label:'결혼', until:'2026-10-01'}, {type:'joy', memberId:2, label:'출산', until:'2026-09-30'}];
  ok(celebList('joy', ms, evs, t).length===1 && celebList('condol', ms, evs, t).length===0, '경사 게시 기간');
  ok(celebValidateEvent({type:'joy', memberId:2, label:' ', until:'2026-10-05'}, ms, t).length===1, '내용 필수');
  ok(celebValidateEvent({type:'joy', memberId:9, label:'결혼', until:'2026-09-30'}, ms, t).length===2, '대상자·종료일');
  return 'celebSelfCheck 통과';
}

/* 실제 로그인이면 이번 주 소식은 서버(GET /api/news)가 고른 줄이다 (2026-10-19 인사담당자 결정) — 생일·입사일 원본은 오지 않고,
   이름·연락처는 조직도 명단(ORG_LIVE)에서 찾는다. 대상은 조직도에 보이는 전원, 생일 알림을 끈 사람은 빠진다. 경사·조사는 HR 이 서버에 올린다. */
const NEWS_LIVE = { state:'', items:[] };   // state: '' 아직 · loading · ok · err
async function newsLoad(){
  NEWS_LIVE.state = 'loading';
  try {
    const r = await fetch('/api/news'); if(!r.ok) throw new Error(r.status);
    NEWS_LIVE.items = (await r.json()).items; NEWS_LIVE.state = 'ok';
  } catch(e){ NEWS_LIVE.state = 'err'; }
  renderContent();
}
function celebItems(key){   // [{ m, note, ev }] — 시연은 celebList(브라우저 안 가상 명단)
  if(!AUTH.live) return celebList(key, orgMembers, celebEvents, new Date());
  if(!NEWS_LIVE.state) newsLoad();
  if(!ORG_LIVE.state) orgLoad();
  if(NEWS_LIVE.state!=='ok' || !orgLive()) return [];
  return NEWS_LIVE.items.filter(x=>x.kind===key).map(x=>({ m:ORG_LIVE.people.find(p=>p.uid===x.id), note:x.note, ev:x.event ? { id:x.event } : null })).filter(x=>x.m);
}

async function celebSave(){
  const v = k=>document.getElementById('celebF_'+k).value, err = t=>{ document.getElementById('celebErr').innerHTML = kpiNote(t, 'danger'); };
  const e = { id:celebSeq+1, type:v('type'), memberId:+v('member'), label:v('label').trim(), until:v('until') };
  const errs = celebValidateEvent(e, orgPeople(), new Date());
  if(errs.length) return err(errs.map(escapeHtml).join('<br>'));
  if(AUTH.live){   // 실제 로그인: 서버에 저장 → 모두에게 보임
    const r = await fetch('/api/news/events', { method:'POST', headers:{ 'Content-Type':'application/json' },
      body:JSON.stringify({ user_id:orgFind(e.memberId).uid, kind:e.type, label:e.label, until:e.until }) }), j = await r.json().catch(()=>({}));
    if(!r.ok) return err(escapeHtml(j.error || '등록하지 못했습니다. 잠시 뒤 다시 해 주세요.'));
    orgCloseModal(); kpiFlash('이번 주 소식에 올렸습니다. 게시 종료일이 지나면 저절로 내려갑니다.');
    return newsLoad();
  }
  celebSeq++; celebEvents.push(e); orgCloseModal(); renderContent();
}
async function celebDelete(id){
  if(!orgIsHr() || !confirm('이 소식을 배너에서 내릴까요?')) return;
  if(AUTH.live){
    const r = await fetch(`/api/news/events/${id}/remove`, { method:'POST' });
    orgCloseModal();
    if(!r.ok) return kpiFlash('내리지 못했습니다. 잠시 뒤 다시 해 주세요.', 'danger');
    return newsLoad();
  }
  const i = celebEvents.findIndex(e=>e.id===id); if(i>=0) celebEvents.splice(i,1);
  orgCloseModal(); renderContent();
}

/* ---------------- 전자연봉계약서 ----------------
   시연용: 사람·금액·주민번호(앞자리만)는 전부 가상 값이고 브라우저 메모리에만 있다. 새로고침하면 초기화.
   계약서 본문·계산식: 인사담당자가 준 회사 양식(2026 연봉계약서 샘플) 그대로. 대표이사 실명은 넣지 않는다.
   규칙 원본: docs/superpowers/specs/2026-08-24-hr-evaluation-contract-design.md §2·§5.4~5.6
   - 기본급은 전 직원 같은 인상률, 능력급은 페이존(작년 총 계약 연봉 구간) × 평가 등급별 인상률(2026-10-13), 인상 후 100원 단위 반올림. HR은 사유를 적고 금액 조정 가능
   - 인상률은 "연봉 인상 계산" 탭에서 정한다(ctRates 하나를 함께 쓴다)
   - 재직자 계약기간 3/1 ~ 다음 해 2월 말일 고정, 신규 입사자는 HR이 입력
   - 본인만 서명(본문 끝까지 읽어야 서명 가능). 서명 즉시 잠금. 파기는 HR만(사유 필수), 재발송은 원본 보존 + 새 버전
   - 열람: 본인 · HR(담당자·팀장)만. 팀장·본부장·대표이사는 남의 계약서를 못 본다 (인사담당자 2026-10-15 — 처음에는 본부장이 자기 본부를 봤다)
   - 본부장은 자기 본부의 "계약 현황"만 본다 — 이름·팀·상태·서명한 날. 금액·본문·등급은 없다 (ctCanSeeStatus, 같은 날 인사담당자)
   - 본부장 본인은 포털에서 계약서를 만들지 않는다 (인사담당자 2026-10-13 — 평가 등급이 없다) */

async function ctHash(c){   // 서명 시점 본문의 고유번호(SHA-256) — 나중에 본문이 바뀌었는지 확인하는 용도

  if(!(window.crypto && crypto.subtle)){ c.hash = '(이 브라우저에서는 계산 불가)'; return; }
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  c.hash = [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

    <p>1) 임금 산정기간 및 지급일 : 당월 1일 ~ 당월 말일까지 기간으로 하여 익월 20일에 지급한다.</p>
    <p>2) 임금 지급방법 : 본인 명의 통장 입금</p>
    <h4>제3조 (기밀유지)</h4>
    <p>1) 근로계약 내용 및 급여명세서는 절대 비밀을 유지하며, 이를 위반 시는 이로 인한 모든 민·형사상의 불이익을 감수한다.</p>
    <p>2) 재직하는 동안 취득한 업무상 기밀 및 회사의 중요한 정보를 누설함으로써 회사에 피해를 끼치는 일이 없도록 할 것이며, 만일 이를 위반함으로써 발생하는 법적, 사회적 문제에 대해 근로자(을)은 민·형사상 책임을 진다.</p>
    <h4>제4조 (계약기간)</h4>
    <p>1) 계약기간 : <b>${ctKDate(c.start)}부터 ${ctKDate(c.end)}</b>로 한다. 단, 회사 경영상의 이유가 있을 때에는 영업 종료일로 한다.</p>
    <p>2) 입사일로부터 3개월 간은 수습기간으로 하며, 이 기간 중 사고를 유발하거나 직원으로 부적격하다고 판단될 때는 중도에 해고예고 없이 계약을 해지할 수 있다. 이 기간의 임금은 회사가 정한 지급기준에 의거하여 지급한다.</p>
    <p>3) 근무 중 고의로 회사에 손해를 끼치거나, 불성실한 태도로 근무 또는 잘못이 있을 시는 그에 따른 이 계약을 해지(해고)한다.</p>
    <h4>제5조 (그 밖의 사항)</h4>
    <p>1) 이 계약서에 명시되지 않은 사항은 취업규칙 및 근로기준법의 관련 조항을 준용하도록 한다.</p>
    <p>2) 이 계약서는 2부를 작성하여 각자 1부씩 보관한다. ※ 근로계약의 내용을 이해하고 1부를 교부받았음을 확인함.</p>
    <p>3) 사업주와 근로자의 계약 내용에 관한 모든 법적 문제는 사업주의 관할 법원을 원칙으로 한다.</p>
    <p>4) 이 계약을 연장 또는 갱신한 때에 이 계약의 내용은 조정·변경한 사항을 제외하고 계속 유효하다.</p>
    <p class="ct-center" style="margin-top:18px;">위와 같이 연봉 계약을 체결합니다.</p>
    <p class="ct-center list-sub">${ctKDate(c.sentAt) || '(발송일)'}</p>
    <div class="ct-signs"><div>사업주 : ${CT_COMPANY.name} 대표이사 ${CT_COMPANY.ceo} <span class="list-sub" style="display:inline;">(인)</span></div><div>근로자 : ${escapeHtml(p.name)} ${sign}</div></div>
  </div>`;
}

function ctHold(c){   // 발송을 미루는 이유 ('' = 보낼 수 있다). 평가받는 사람은 결과가 공개되고 이의 신청 처리가 끝나야 등급(능력급)이 정해진다 (2026-10-13). 평가 명단에 없는 사람·신규 입사자는 막지 않는다
  const k = ctPerson(c.pid).key, p = k && evPeople.find(x=>x.key===k && !x.out);
  if(!p || c.newHire) return '';
  return !evReleased(p) ? '평가 결과 공개 전' : evFinalGrade(p)==='WAIT' ? '이의 신청 처리 중' : '';
}
function ctSendSelected(){
  const today = ctYmd(new Date()), held = []; let n = 0;
  ctSelected.forEach(id=>{ const c = ctContracts.find(x=>x.id===id); if(!c) return;
    const why = ctHold(c); if(why) return held.push(`${ctPerson(c.pid).name} (${why})`);
    if(!ctSend(c, orgIsHr(), today)) n++; });
  ctSelected.clear();
  kpiFlash(`${n}명에게 계약서를 발송했습니다. 직원이 서명하면 상태가 바뀝니다.${held.length ? `<br>보내지 않은 사람: ${held.map(escapeHtml).join(', ')} — 등급이 정해진 뒤에 보낼 수 있습니다.` : ''}`, held.length ? 'warning' : 'success');
}

function ctViewer(c){

  const cancelled = c.status==='CANCELLED' ? kpiNote(`파기된 계약서입니다 (${escapeHtml(c.cancelledAt||'')}, 사유: ${escapeHtml(c.cancelReason||'')}). 보관용으로만 볼 수 있습니다.`, 'danger') : '';
  const signBox = !signable ? '' : `<div class="ct-signbox" id="ctSignBox">

          <div class="field" style="margin-top:10px;"><label>성명</label><input id="ctName" disabled placeholder="${escapeHtml(p.name)}" autocomplete="off"></div></div>

    </div>`;
  if(signable) setTimeout(ctInitSign, 0);
  return `<div class="card ct-print" style="margin-bottom:14px;">

    ${signed}${cancelled}
    <div class="ct-scroll${signable?' gated':''}" id="ctScroll" tabindex="0" aria-label="계약서 본문">${ctDocHtml(c)}</div>

  </div>${history ? `<div class="card no-print"><div class="card-title">이전 계약서 (파기·보관)</div>${history}</div>` : ''}`;

let ctPadDirty = false;
function ctInitSign(){
  const sc = document.getElementById('ctScroll'), pad = document.getElementById('ctPad');
  if(!sc || !pad) return;
  const unlock = ()=>{ if(sc.scrollTop + sc.clientHeight < sc.scrollHeight - 8) return;
    ['ctConsent','ctName','ctClear','ctSubmit'].forEach(id=>document.getElementById(id).disabled = false);
    pad.classList.add('on'); document.getElementById('ctReadHint').textContent = '본문을 끝까지 확인했습니다. 동의하고 서명해 주세요.'; sc.dataset.read = '1'; };
  sc.addEventListener('scroll', unlock); unlock();
  const g = pad.getContext('2d'); g.lineWidth = 3; g.lineCap = 'round'; g.strokeStyle = '#1B2433'; ctPadDirty = false;
  let drawing = false;
  const pos = e=>{ const r = pad.getBoundingClientRect(); return [(e.clientX-r.left)*pad.width/r.width, (e.clientY-r.top)*pad.height/r.height]; };
  pad.addEventListener('pointerdown', e=>{ if(!sc.dataset.read) return; drawing = true; pad.setPointerCapture(e.pointerId); g.beginPath(); g.moveTo(...pos(e)); });
  pad.addEventListener('pointermove', e=>{ if(!drawing) return; g.lineTo(...pos(e)); g.stroke(); ctPadDirty = true; });
  ['pointerup','pointercancel'].forEach(t=>pad.addEventListener(t, ()=>{ drawing = false; }));
}
function ctPadClear(){ const pad = document.getElementById('ctPad'); pad.getContext('2d').clearRect(0,0,pad.width,pad.height); ctPadDirty = false; }
async function ctSubmitSign(id){
  const c = ctContracts.find(x=>x.id===id), me = ctActor(kpiRole), pad = document.getElementById('ctPad');
  const now = new Date(), at = ctYmd(now)+' '+now.toTimeString().slice(0,5);
  const err = ctSign(c, me ? me.pid : -1, { read:!!document.getElementById('ctScroll').dataset.read, consent:document.getElementById('ctConsent').checked,
    name:document.getElementById('ctName').value, image:ctPadDirty ? pad.toDataURL() : null, at });
  if(err){ document.getElementById('ctErr').innerHTML = kpiNote(escapeHtml(err).replace(/\n/g,'<br>'), 'danger'); return; }
  await ctHash(c);
  kpiFlash('서명을 완료했습니다. 계약서가 잠겼고, 인쇄·PDF 저장으로 1부를 보관할 수 있습니다.');
}
function ctContent(){
  const role = kpiRole, me = ctActor(role);
  const open = ctOpenId && ctContracts.find(c=>c.id===ctOpenId);
  let body = '';
  if(open && ctCanView(role, open)) body = ctViewer(open);
  else {
    ctOpenId = null;
    if(kpiIsHr(role)) body = ctHrPanel();
    else {
      const mine = me && ctActive(ctContracts, me.pid);   // 계약 명단에 없는 역할(대표이사)은 받은 계약서 없음
      body = mine && ctCanView(role, mine) ? ctViewer(mine) : `<div class="card" style="margin-bottom:14px;"><div class="card-title">연봉계약서</div><div class="placeholder-note" style="margin:0;">${me && me.title==='본부장' ? '본부장은 포털에서 연봉계약서를 만들지 않습니다. 아래에서 우리 본부 직원의 서명 진행 상황을 볼 수 있습니다.' : '아직 받은 계약서가 없습니다. HR이 발송하면 여기에 표시됩니다.'}</div></div>`;
      if(me && me.title==='본부장'){
        const rows = CT_PEOPLE.filter(p=>p.pid!==me.pid).map(p=>ctActive(ctContracts, p.pid)).filter(c=>c && ctCanSeeStatus(role, c)), n = st=>rows.filter(c=>c.status===st).length;
        body += `<div class="card"><div class="card-title">우리 본부 계약 현황 <span class="more">${rows.length}명 · 서명 완료 ${n('SIGNED')} · 서명 대기 ${n('SENT')}</span></div>${rows.map(c=>{ const p = ctPerson(c.pid); return `<div class="list-row"><div><div class="list-title">${escapeHtml(p.name)} ${escapeHtml(p.title)}</div><div class="list-sub">${escapeHtml(p.team||p.division)}</div></div><div style="width:132px; flex:none; display:flex; align-items:center; gap:6px;">${ctStatusOnly(c)}</div></div>`; }).join('') || '<div class="list-sub">계약 대상자가 없습니다.</div>'}
          <div class="list-sub" style="margin-top:8px;">연봉 금액과 계약서 본문은 HR만 볼 수 있습니다.</div></div>`;
      }
    }
  }
  return `${roleSwitcher()}${kpiMsg ? kpiNote(kpiMsg.msg, kpiMsg.type) : ''}${body}`;

/* ----- 파일 고르기 → 읽은 내용 확인 ----- */
function rzPick(kind){ const i = document.createElement('input'); i.type = 'file'; i.accept = kind==='wh' ? '.zip' : '.xlsx'; i.onchange = ()=>i.files[0] && rzLoad(kind, i.files[0]); i.click(); }
async function rzLoad(kind, file, pw){   // 암호가 걸린 파일이면 암호를 물은 뒤(rzAskPw → rzUnlock) pw와 함께 다시 온다
  if(kind==='wh') return whLoad(file, pw);   // 원천징수영수증 암호 zip (엑셀이 아니다 — 읽기·안내는 whLoad가 다 한다)
  try{
    let buf = await file.arrayBuffer();
    if(rzLocked(buf)){ if(pw==null) return rzAskPw(kind, file); buf = await rzUnlockBuf(buf, pw); }
    if(kind==='contact'){ const c = await rzXlsx(buf); rz.lock = null; return msCtConfirm(file.name, c.rows); }   // 비상연락망 (구성원 설정)
    if(kind==='slip'){ const c = await rzXlsx(buf); rz.lock = null; return await psStage(file.name, c.rows, pw!=null); }   // 급여대장 (급여명세서 올리기, HR) — 암호는 넘기지 않고 풀었는지만
    const x = await rzXlsx(buf), fields = kind==='pay' ? RZ_PAY : RZ_GRADE, h = rzHead(x.rows, fields);
    rz.lock = null; rz.pick = { kind, file:file.name, sheet:x.sheet, rows:x.rows, at:h.at, head:h.head, map:rzGuess(h.head, fields) }; rzConfirm();
  }catch(e){
    if(e.message==='PW') return rzAskPw(kind, file, '암호가 맞지 않습니다. 다시 넣어 주세요.');
    rz.lock = null; orgCloseModal();
    kpiFlash({ OLD:'옛 형식(.xls) 파일이라 읽지 못했습니다. 엑셀에서 열어 <b>.xlsx로 다시 저장</b>한 뒤 골라 주세요.',
      ENC:'이 파일에 걸린 암호 방식은 읽지 못합니다. 엑셀에서 열어 <b>파일 → 정보 → 통합 문서 보호 → 암호 설정</b>으로 암호를 다시 걸어 저장해 주세요.',
      BIG:'파일이 너무 커서 읽지 못했습니다. 필요 없는 시트를 지우고 다시 저장해 주세요.' }[e.message] || (kind==='contact' ? '엑셀 파일(.xlsx)을 읽지 못했습니다. 비상연락망 파일이 맞는지 확인해 주세요.' : kind==='slip' ? '엑셀 파일(.xlsx)을 읽지 못했습니다. 급여 프로그램에서 내려받은 급여대장이 맞는지 확인해 주세요.' : '엑셀 파일(.xlsx)을 읽지 못했습니다. 급여 프로그램에서 내려받은 파일이 맞는지 확인해 주세요.'), 'danger');
  }
}
function rzAskPw(kind, file, err){   // 암호를 묻는 창. 틀리면 err와 함께 다시 뜬다

  const zip = kind==='wh';
  orgModal(`<div class="card-title"><span>${zip ? '암호가 걸린 압축 파일입니다' : '암호가 걸린 파일입니다'}</span><button type="button" class="x-btn" onclick="orgCloseModal()" aria-label="닫기">${icon('x')}</button></div>

}
function rzUnlock(){   // 푸는 데 몇 초 걸린다 — 그동안 단추와 입력칸을 잠근다
  const k = rz.lock, el = document.getElementById('rzPw'), go = document.getElementById('rzPwGo');

  const col = i=>{ let s = '', n = i+1; while(n){ s = String.fromCharCode(64 + (n-1)%26 + 1) + s; n = Math.floor((n-1)/26); } return s; };

/* ----- 인상률 · 조정 · 저장 ----- */
function rzRows(){ if(!rz.pay) return []; const g = rz.grade ? rzGradeMap(rz.pay.people, rz.grade.list).g : {}; return rz.pay.people.map(p=>rzRow(p, ctRates, g[p.id] || '', rz.adj[p.id])); }
function rzPctIn(v){ return Math.max(-100, Math.min(100, Math.round((+v||0)*10)/10)); }
function rzSet(what, i, v){   // 인상률 표의 한 칸. 글자를 적는 칸은 다시 그리지 않는다 — Tab으로 옆 칸에 넘어갈 때 초점이 사라지지 않게 결과만 다시 그린다(rzSync)
  if(what==='base') ctRates.base = rzPctIn(v); else if(what==='max') ctRates.zones[i].max = Math.max(0, Math.round(+v||0)); else ctRates.zones[i].pct[what] = rzPctIn(v);
  rzRated(); rzSync();
}
function rzRated(){ rz.edited = true; ctContracts.forEach(c=>ctApplyRates(c, ctRates)); }   // 작성 중인 계약서(전자연봉계약서 화면)도 같은 표로 다시 계산
function rzZoneAdd(){ const z = ctRates.zones; z.splice(z.length-1, 0, { max:(z.length>1 ? z[z.length-2].max : 0) + 1000, pct:{ ...z[z.length-1].pct } }); rzRated(); renderContent(); }
function rzZoneDel(i){ ctRates.zones.splice(i, 1); rzRated(); renderContent(); }
function rzAdjAsk(id){

    <div class="list-sub" style="margin-bottom:10px;">지금 기본급 ${n(p.base)}원 · 능력급 ${n(p.ability)}원 · 등급 ${r.grade||'없음'} · ${r.zone+1}구간</div>
    <div class="field-row"><div class="field"><label>새 기본급 (원)</label><input id="rzF_base" type="number" step="100" value="${r.base}"></div><div class="field"><label>새 능력급 (원)</label><input id="rzF_ability" type="number" step="100" value="${r.ability}"></div></div>
    <div class="field" style="margin-bottom:14px;"><label>조정 사유 (필수)</label><input id="rzF_reason" value="${escapeHtml(r.adj ? r.adj.reason : '')}" placeholder="승진, 직무 변경 등"></div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;"><button class="btn primary" onclick="rzAdjSave(${id})">저장</button>${r.adj ? `<button class="btn" onclick="delete rz.adj[${id}]; orgCloseModal(); kpiFlash('조정을 풀고 인상률대로 다시 계산했습니다.')">조정 풀기 (인상률대로)</button>` : ''}<button class="btn" onclick="orgCloseModal()">취소</button></div>`);

function rzAdjSave(id){
  const v = k=>document.getElementById('rzF_'+k).value, base = Math.round(+v('base')), ability = Math.round(+v('ability')), errs = rzAdjust(base, ability, v('reason'));
  if(errs.length){ document.getElementById('rzErr').innerHTML = kpiNote(errs.map(escapeHtml).join('<br>'), 'danger'); return; }
  rz.adj[id] = { base, ability, reason:v('reason').trim() }; orgCloseModal(); kpiFlash('금액을 조정했습니다.');

function csvText(lines){   // 엑셀에서 바로 열리는 CSV. 글자가 수식으로 읽히지 않게 = + - @ 로 시작하는 칸에는 ' 를 붙인다
  const cell = v=>{ let s = String(v ?? ''); if(typeof v==='string' && /^[=+\-@\t\r]/.test(s)) s = "'"+s; return `"${s.replace(/"/g, '""')}"`; };
  return '﻿' + lines.map(r=>r.map(cell).join(',')).join('\r\n');
}
async function rzSave(name, lines){   // 저장할 곳을 묻는다(크롬·엣지) — NAS 폴더를 고르면 PC에 파일이 남지 않는다. 물을 수 없는 브라우저에서는 내려받기 폴더로 간다
  const blob = new Blob([csvText(lines)], { type:'text/csv;charset=utf-8' });
  if(window.showSaveFilePicker){
    try{ const w = await (await showSaveFilePicker({ suggestedName:name, types:[{ description:'엑셀에서 열리는 표 (CSV)', accept:{ 'text/csv':['.csv'] } }] })).createWritable(); await w.write(blob); await w.close(); return kpiFlash('고른 곳에 저장했습니다.'); }
    catch(e){ if(e.name==='AbortError') return; }   // 저장 창을 닫음
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); URL.revokeObjectURL(a.href);
}
function rzRateLines(rows){ const z = ctRates.zones;
  return [['기본급 인상률(%)', ctRates.base], ['페이존','작년 총 계약 연봉', ...CT_GRADES.map(g=>g+'(%)'), '인원'], ...z.map((x, i)=>[`${i+1}구간`, rzZoneLabel(ctRates, i), ...CT_GRADES.map(g=>x.pct[g]), rows.filter(r=>r.zone===i).length])]; }
function rzExport(kind){
  if(!kpiIsHr() || !rz.pay) return;
  const rows = rzRows(), y = ctPeriod(new Date()).year, pc = (a, b)=>b ? Math.round((a/b-1)*1000)/10 : 0;
  if(kind==='list') return rzSave(`연봉인상내역_${y}년.csv`, [['사번','이름','부서','본부','직급','등급','페이존','지금 기본급','새 기본급','지금 능력급','능력급 인상률(%)','새 능력급','직책수당','현장관리수당','자격수당','지금 기본급에 든 연구보조비','인상 전 총 계약 연봉','인상 후 총 계약 연봉','인상액','인상률(%)','비고'],
    ...rows.map(r=>[r.p.no, r.p.name, r.p.dept, r.div, r.p.title, r.grade, `${r.zone+1}구간`, r.p.base, r.base, r.p.ability, r.adj ? '' : r.pct, r.ability, r.p.pos, r.p.site, r.p.qual, r.p.rnd||0, r.before, r.after, r.diff, pc(r.after, r.before), r.adj ? '조정: '+r.adj.reason : r.grade ? '' : '등급 없음'])]);
  const sum = (title, list)=>[[], [title,'인원','인상 전','인상 후','늘어나는 금액','인상률(%)'], ...list.map(x=>[x.n, x.c, x.b, x.a, x.a-x.b, pc(x.a, x.b)])];
  rzSave(`연봉인상요약_${y}년.csv`, [...rzRateLines(rows), ...sum('본부', rzGroup(rows, r=>r.div, [...ORG_TREE.map(d=>d.division), '그 외'])), ...sum('등급', rzGroup(rows, r=>r.grade||'없음', [...CT_GRADES, '없음'])),
    ...sum('합계', [{ n:'전체', c:rows.length, b:rows.reduce((t, r)=>t+r.before, 0), a:rows.reduce((t, r)=>t+r.after, 0) }])]);
}

/* ----- 화면 ----- */
function rzN(n){ return Math.round(n).toLocaleString('ko-KR'); }
function rzEok(w){ const man = Math.round(w/10000), e = Math.floor(man/10000); return (e ? e+'억 ' : '') + (man%10000).toLocaleString('ko-KR') + '만원'; }
function rzPct(a, b){ const x = b ? Math.round((a/b-1)*1000)/10 : 0; return (x>=0 ? '+' : '') + x + '%'; }
function rzTiles(rows){
  const has = !!rz.pay, b = rows.reduce((t, r)=>t+r.before, 0), a = rows.reduce((t, r)=>t+r.after, 0);
  const T = (c, label, val, em)=>`<div class="hm-tile ${c}"><span>${label}</span><b>${val}</b><em>${em}</em></div>`;
  return T('slate', '대상 인원', has ? `${rows.length}<small>명</small>` : '–', has ? `등급 없음 ${rows.filter(r=>!r.grade).length}명 · 직접 조정 ${rows.filter(r=>r.adj).length}명` : '급여 자료 파일을 고르면 채워집니다')
    + T('blue', '인상 전 총 계약 연봉', has ? rzEok(b) : '–', '지금 금액의 합계') + T('green', '인상 후 총 계약 연봉', has ? rzEok(a) : '–', '인상률을 적용한 합계')
    + T('amber', '늘어나는 금액', has ? '+'+rzEok(a-b) : '–', has ? `전체 ${rzPct(a, b)}` : '&nbsp;');
}
function rzShown(rows){ const q = rz.q.trim(); return rows.filter(r=>(!rz.div || r.div===rz.div) && (!rz.g || (rz.g==='-' ? !r.grade : r.grade===rz.g)) && (!q || r.p.name.includes(q))); }
function rzBody(rows){
  return rzShown(rows).map(r=>{ const p = r.p;
    return `<tr><td><b>${escapeHtml(p.name)} <span style="font-weight:500;">${escapeHtml(p.title)}</span></b><small>${escapeHtml(p.dept)}</small></td>
      <td class="c">${r.grade ? `<b>${r.grade}</b>` : '<span class="badge neutral">없음</span>'}</td><td class="c">${r.zone+1}구간</td>
      <td class="num"><b>${rzN(r.base)}</b><small>${rzN(p.base)} · ${rzPct(r.base, p.base)}</small></td>
      <td class="num"><b>${rzN(r.ability)}</b><small>${rzN(p.ability)} · ${rzPct(r.ability, p.ability)}</small></td>
      <td class="num"><b>${rzN(r.after)}</b><small>${rzN(r.before)}</small></td>
      <td class="num up"><b>${r.diff<0 ? '−' : '+'}${rzN(Math.abs(r.diff))}</b><small>${rzPct(r.after, r.before)}</small></td>
      <td>${r.adj ? `<span class="badge warning">조정</span> <span class="list-sub" style="display:inline; margin:0;">${escapeHtml(r.adj.reason)}</span>` : r.grade ? '' : '<span class="list-sub" style="display:inline; margin:0;">능력급 0%</span>'}</td>
      <td class="c"><button class="btn sm" onclick="rzAdjAsk(${p.id})">조정</button></td></tr>`; }).join('') || `<tr><td colspan="9" class="list-sub" style="text-align:center;">조건에 맞는 사람이 없습니다.</td></tr>`;
}
function rzList(){ const rows = rzRows(); document.getElementById('rzBody').innerHTML = rzBody(rows); document.getElementById('rzCnt').textContent = rzShown(rows).length+'명'; }   // 검색어를 적는 동안에는 표만 다시 그린다(입력칸을 다시 그리면 한글 조합이 끊긴다)

      <div class="ct-tbl rz-tbl"><table><colgroup><col style="width:17%"><col style="width:6%"><col style="width:7%"><col style="width:12%"><col style="width:12%"><col style="width:12%"><col style="width:11%"><col><col style="width:7%"></colgroup>
        <thead><tr><th>이름</th><th class="c">등급</th><th class="c">페이존</th><th class="num">새 기본급</th><th class="num">새 능력급</th><th class="num">새 총 계약 연봉</th><th class="num">인상액</th><th>비고</th><th></th></tr></thead><tbody id="rzBody">${rzBody(rows)}</tbody></table></div>
      <div class="list-sub" style="margin-top:10px;">굵은 숫자가 새 금액, 아래 작은 숫자가 지금 금액입니다. 기본급 · 능력급은 월 금액, 총 계약 연봉은 계약서 맨 위에 적히는 금액입니다.</div></div>
    <div class="card" id="rzSum"><div class="card-title"><span><i class="rz-step">4</i>인건비 요약 <span style="font-weight:500; color:var(--text-secondary);">총 계약 연봉 합계 기준</span></span><button class="btn sm" onclick="rzExport('sum')">${icon('download')} 요약 엑셀 저장</button></div>
      <div class="rz-sum">${tbl('본부별', '본부', rzGroup(rows, r=>r.div, [...ORG_TREE.map(d=>d.division), '그 외']), true)}${tbl('등급별', '등급', rzGroup(rows, r=>r.grade||'없음', [...CT_GRADES, '없음']), false)}</div>
      <div class="list-sub" style="margin-top:10px;">직책수당 · 자격수당과 4대 보험 · 퇴직금은 들어 있지 않습니다(계약서의 총 계약 연봉과 같은 기준).</div></div>`;
}
function rzSync(){   // 인상률·걸러 보기를 바꿨을 때: 인상률 입력칸은 그대로 두고 결과만 다시 그린다

      <div class="rz-in">${src('pay', '급여 자료', has ? `${escapeHtml(rz.pay.file)} · ${rows.length}명` : '급여 프로그램에서 내려받은 엑셀 파일(.xlsx)을 그대로 고릅니다', has)}

      <div class="list-sub" style="margin-top:10px;">파일은 이 화면에서 읽기만 합니다 — PC에 복사하지 않고 서버로 보내지 않으며, 화면을 닫거나 새로 고치면 읽은 내용도 사라집니다. 암호가 걸린 파일은 고른 뒤 암호를 묻습니다.</div></div>

/* ---------------- 급여명세서 ----------------
   시연(서버 없음): 명세서 금액·사원정보는 전부 가상 값(브라우저 메모리) — 서버와 같은 모양(head · pay/ded = [[항목, 원]])이라 같은 화면 코드를 쓴다.
   실제 로그인(2026-10-20 급여명세서 실제화): 본인은 HR이 공개한 달만(GET /api/payslips), HR은 "볼 직원"을 골라 공개 전 달까지(?user=). 0원 항목은 감춘다(psShow).
   성별을 몰라 캐릭터는 처음 한 번 고른다(payChar). 공개됐는데 아직 안 연 명세서 수가 메뉴 숫자(TODO.p1). 급여대장 읽기(psRead)는 아래 "급여대장 읽기" 블록.
   화면 규칙 (인사담당자 2026-10-01 결정)
   - 위쪽: 지난 급여일에 0원 → 다음 급여일에 세전 금액(지급액 계) 전액. 화면을 보고 있으면 계속 늘어남
     (2026-10-08: 소수 둘째 자리까지 보이고 0.05초마다 바뀐다 — 원 단위는 그대로 1초에 1~2원, 소수점이 빠르게 돌아 속도감을 준다)
   - 급여일 = 매월 20일, 주말·공휴일이면 바로 앞 평일
   - 금액은 처음에 가리고, 눈 버튼을 누르면 보임

function payIsOff(d){ return d.getDay()===0 || d.getDay()===6 || PAY_HOLIDAYS.has(ctYmd(d)); }
function payDayOf(y, m){ const d = new Date(y, m, 20); while(payIsOff(d)) d.setDate(d.getDate()-1); return d; }   // m: 0~11
function payWindow(now){   // 지난 급여일(그날 0시) ~ 다음 급여일(그날 0시). 급여일 당일은 도착 상태

  if(next < today) next = payDayOf(now.getFullYear(), now.getMonth()+1);
  const prev = payDayOf(next.getFullYear(), next.getMonth()-1);
  return { prev, next, isPayday: +next===+today };
}
function payProgress(now, w){ if(w.isPayday) return 1; return Math.min(1, Math.max(0, (now - w.prev) / (w.next - w.prev))); }

/* ----- 급여대장 읽기 (실제 명세서, 순수 로직 — psSelfCheck가 검증) -----

const PS_HEAD = [['no','사원코드',['사원코드','사번','사원번호']], ['name','사원명',['사원명','성명','이름']], ['dept','부서',['부서','부서명','소속']], ['title','직급',['직급','직위']], ['job','직종',['직종']]];   // 머리 칸 (rzGuess 모양)

function psIsNum(c){ return typeof c==='number' || /^[+-]?\d[\d,]*(\.\d+)?$/.test(rzNorm(c)); }   // 숫자로 적힌 칸인가 ('abc'·빈 칸은 아니다)
function psRead(rows){   // 급여대장 → 사람별 지급·공제 + 합계 줄. err: HEAD = 사원명 칸을 못 찾음 · GROUP = 수당·공제 묶음을 못 찾음 · TOTAL = 지급액계·공제액계·차인지급액 칸을 못 찾음 (빈 명세서를 만들지 않고, 합계 검사를 건너뛰지도 않는다)
  const fail = err=>({ err, pay:[], ded:[], people:[], total:null, totalBad:[], skip:0 });
  rows = Array.isArray(rows) ? rows : [];
  const hits = r=>Array.isArray(r) ? PS_HEAD.filter(f=>r.some(c=>f[2].some(k=>rzNorm(c).includes(k)))).length : 0;
  let top = 0; rows.slice(0, 15).forEach((r, i)=>{ if(hits(r) > hits(rows[top])) top = i; });   // 머리 칸 이름이 가장 많은 줄 (rzHead와 달리 아래 줄은 합치지 않는다)
  const hm = rzGuess(Array.from(rows[top] || [], rzNorm), PS_HEAD);

  if(cells.filter(c=>!psIsNum(c)).length < 3 || rows[top+1].some(psIsNum)) return fail('GROUP');   // 다음 줄이 항목 이름 줄이 아니면 묶음이 없는 것
  const pay = [], ded = [], sum = { pay:-1, ded:-1 }; let netCol = -1, grp = null;
  for(let c = 0, w = Math.max(gr.length, it.length); c < w; c++){   // 왼쪽부터: 윗줄 글자만 있으면 세로로 합친 칸(묶음 끊김), 둘 다 있으면 묶음 시작, 아랫줄만 있으면 앞 묶음이 이어짐
    const g = gr[c] || '', l = it[c] || '';

  const extra = [['gross', sum.pay], ['deduct', sum.ded], ['net', netCol]].map(([k, i])=>[k, i, k==='net' ? (gr[i] || it[i]) : it[i]]);   // 지급액계·공제액계·차인지급액 칸

    let nan = false; const val = i=>{ const n = Math.round(rzNum(r[i])); if(Number.isFinite(n)) return n; nan = true; return 0; };
    const o = { pay:pay.map(x=>[x.label, val(x.i)]), ded:ded.map(x=>[x.label, val(x.i)]) };
    extra.forEach(([k, i])=>{ o[k] = val(i); });
    return { ...o, nan };
  };
  const text = (r, k)=>hm[k] >= 0 ? String(r[hm[k]] ?? '').trim() : '';
  const flat = o=>[...o.pay, ...o.ded, ...extra.map(([k, , l])=>[l, o[k]])];   // 합계 줄과 견줄 (칸 이름, 금액) 목록
  const lab = s=>/^(합계|총계|소계|계)$/.test(rzNorm(s)), people = []; let total = null, tf = null, skip = 0;
  rows.slice(top+2).forEach(r=>{
    r = Array.isArray(r) ? r : [];
    const name = text(r, 'name');
    if(name && !lab(name) && !lab(text(r, 'no'))){   // 사원명이 비었거나 사원명·사원코드 칸이 '합계' 같은 말이면 사람이 아니다
      const o = read(r);
      const bad = o.nan ? '숫자가 아닌 칸이 있습니다' : add(o.pay)!==o.gross ? '지급 합계가 맞지 않습니다' : add(o.ded)!==o.deduct ? '공제 합계가 맞지 않습니다' : o.gross - o.deduct!==o.net ? '차인지급액이 맞지 않습니다' : '';
      people.push({ head:{ code:text(r, 'no'), name, dept:text(r, 'dept'), title:text(r, 'title'), job:text(r, 'job') }, pay:o.pay, ded:o.ded, gross:o.gross, deduct:o.deduct, net:o.net, bad });
    } else if(pay.concat(ded).some(x=>psIsNum(r[x.i]))){ if(tf) skip++; tf = flat(read(r)); total = Object.fromEntries(tf); }   // 사람이 아니고 숫자가 있는 줄 = 합계 줄. 여러 줄이면 마지막 줄을 쓰고 앞 줄은 skip (사원명이 빠진 사람 줄이 합계 줄을 가로채지 않게)
    else skip++;

}
function psYm(fileName){   // 파일 이름의 YYYYMM → 귀속 월 'YYYY-MM' (앞뒤가 숫자가 아닌 6자리, 월 01~12). 없으면 ''
  const m = String(fileName ?? '').match(/(?:^|\D)(20\d{2})(0[1-9]|1[0-2])(?!\d)/);
  return m ? m[1]+'-'+m[2] : '';
}
function psPayDate(ym){   // 귀속 월 'YYYY-MM' → 다음 달 20일(주말·공휴일이면 앞 평일). payDayOf의 월은 0부터라 귀속 월 숫자 그대로가 다음 달이다. 'YYYY-MM'이 아니면 ''
  const m = /^(\d{4})-(0[1-9]|1[0-2])$/.exec(String(ym ?? '')); return m ? ctYmd(payDayOf(+m[1], +m[2])) : '';
}
function psMatch(people, members){   // 급여대장 사람 → 포털 직원. 사원코드가 붙은 직원 → 이름이 하나뿐인 직원 → 같은 이름이면 부서로. 못 가리면 id:null + why (NONE 없음 · SAME 같은 이름 · CODE 다른 사원코드가 붙어 있음 · TWICE 둘 이상이 같은 직원으로 맞음)
  const cut = s=>rzDeptKey(RZ_DEPT[rzDeptKey(s)] || s);
  const res = people.map(p=>{
    const { code, name, dept } = p.head, byCode = code ? members.find(m=>String(m.no || '').trim()===code) : null;
    if(byCode) return { id:byCode.id, why:'' };
    const same = members.filter(m=>rzNorm(m.name)===rzNorm(name)), k = cut(dept);
    const cand = same.length > 1 ? same.filter(m=>k && (rzDeptKey(m.team)===k || rzDeptKey(m.division)===k)) : same;
    if(!same.length) return { id:null, why:'NONE' };
    if(cand.length!==1) return { id:null, why:'SAME' };
    return code && cand[0].no ? { id:null, why:'CODE' } : { id:cand[0].id, why:'' };
  });
  const hit = {}; res.forEach(x=>{ if(x.id!==null) hit[x.id] = (hit[x.id] || 0) + 1; });
  return res.map(x=>x.id!==null && hit[x.id] > 1 ? { id:null, why:'TWICE' } : x);   // 한 직원에 둘 이상이 맞으면 줄 순서와 상관없이 모두 TWICE — 어느 쪽이 맞는지 사람이 가린다
}

/* ----- 시연 데이터: 지급일이 지난 최근 24개월 + HR이 올려 공개한 달(ps.mem — 같은 달 시연 값을 덮는다). ps.mem이 바뀌면 paySlips = null ----- */
function paySlipsFor(key){
  paySlips = paySlips || {};
  if(!paySlips[key]){
    const today = ctYmd(new Date()), list = [];
    for(let i=1; list.length<24 && i<27; i++){ const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()-i); const s = paySlip(PAY_PEOPLE[key], d.getFullYear(), d.getMonth()); if(s.payday<=today) list.push(s); }
    const mem = Object.values(ps.mem.months).filter(m=>m.status==='OPEN' && ps.mem.slips[m.ym][key]).map(m=>({ ...ps.mem.slips[m.ym][key], revised:m.revised }));
    paySlips[key] = [...mem, ...list.filter(s=>!mem.some(x=>x.ym===s.ym))].sort((a, b)=>b.ym.localeCompare(a.ym));
  }
  return paySlips[key];
}
function payList(){ return AUTH.live ? PAY_LIVE.slips : PAY_PEOPLE[payViewKey] ? paySlipsFor(payViewKey) : []; }   // 지금 화면의 명세서 (최근 달부터). 시연 명단에 없는 열쇠(로그아웃 뒤의 null · 대표이사)는 빈 목록

function payWon2(n){ return (Math.floor(n*100)/100).toLocaleString('ko-KR', {minimumFractionDigits:2, maximumFractionDigits:2})+'원'; }   // 쌓이는 금액용: 소수 둘째 자리까지(버림)

function payContent(){
  const role = kpiRole, live = AUTH.live;
  let picker = '', head = (live ? '' : roleSwitcher()) + paySwitch() + (kpiIsHr(role) && kpiMsg ? kpiNote(kpiMsg.msg, kpiMsg.type) : '');   // 실제 로그인에는 시연용 역할 전환 줄이 없다 (이 화면은 실제 자료). HR은 두 화면을 오간다
  if(kpiIsHr(role) && ps.view==='admin') return head + psAdmin();
  if(live){
    if(typeof payViewKey!=='number' || !kpiIsHr(role)) payViewKey = null;   // 시연 열쇠(원천징수영수증 화면이 넣는다)나 직원이 남의 번호를 가진 경우는 본인으로
    if(kpiIsHr(role)){ if(!MS_LIVE.state) msLoad(); picker = payPickerLive(payViewKey); }
    if(!PAY_LIVE.state || PAY_LIVE.who!==payViewKey) payLoad(payViewKey);
    if(PAY_LIVE.state!=='ok') return `${head}${picker}${kpiNote(PAY_LIVE.state==='err' ? '명세서를 불러오지 못했습니다. 잠시 뒤 새로 고쳐 주세요.' : '명세서를 불러오는 중입니다…', PAY_LIVE.state==='err' ? 'danger' : 'info')}`;
  } else {
    if(!payViewKey || !payCanView(role, payViewKey) || !PAY_PEOPLE[payViewKey]) payViewKey = role;   // 급여 명단에 없는 열쇠(대표이사 → HR로 바꾼 뒤의 'ceo')도 본인으로
    if(!PAY_PEOPLE[payViewKey]) return `${head}<div class="card"><div class="placeholder-note" style="margin:0;">아직 등록된 급여명세서가 없습니다.</div></div>`;   // 급여 명단에 없는 역할(대표이사)
    picker = kpiIsHr(role) ? `<div class="card" style="margin-bottom:14px;"><div class="field" style="max-width:320px;"><label>볼 직원 (HR)</label><select onchange="payViewKey=this.value; payOpen=null; payYear=null; renderContent()">${Object.keys(PAY_PEOPLE).map(k=>`<option value="${k}" ${k===payViewKey?'selected':''}>${escapeHtml(KPI_USERS[k].name)} ${escapeHtml(KPI_USERS[k].title)}</option>`).join('')}</select></div></div>` : '';
  }
  const slips = payList();
  if(!slips.length) return `${head}${picker}<div class="card"><div class="placeholder-note" style="margin:0;">${payViewKey===null ? '아직 공개된 급여명세서가 없습니다.' : '이 직원의 급여명세서가 없습니다.'}</div></div>`;   // 히어로는 그리지 않는다
  const years = [...new Set(slips.map(s=>s.y))].sort((a,b)=>b-a);
  if(!years.includes(payYear)) payYear = years[0];
  if(!slips.some(s=>s.label===payOpen && s.y===payYear)) payOpen = null;
  const yearBtns = years.map(y=>`<button type="button" class="pay-year${y===payYear?' on':''}" onclick="payYear=${y}; payOpen=null; renderContent()" aria-pressed="${y===payYear}">${y}년</button>`).join('');
  const bym = Object.fromEntries(slips.filter(s=>s.y===payYear).map(s=>[s.m, s]));
  const monthBtns = Array.from({length:12}, (_,m)=>{ const sl = bym[m];
    const tags = sl ? payBadges(sl) + (live && payViewKey===null && sl.seen===false ? '<span class="badge info">새 명세서</span>' : '') : '';   // 새 명세서 = 내 것 중 공개됐는데 아직 안 연 달 (메뉴 숫자와 같은 것). HR이 남의 것을 볼 때는 그 직원의 열람 여부라 표시하지 않는다
    return sl ? `<button type="button" class="pay-mbtn${sl.label===payOpen?' on':''}" aria-expanded="${sl.label===payOpen}" onclick="payPick('${sl.label}', true)"><b>${m+1}월</b><small>지급 ${sl.payday.slice(5).replace('-','/')}</small>${tags ? `<span class="pay-tags">${tags}</span>` : ''}</button>`
      : `<button type="button" class="pay-mbtn" disabled><b>${m+1}월</b><small>명세서 없음</small></button>`; }).join('');
  const open = slips.find(s=>s.label===payOpen);
  if(!payTimer) payTimer = setInterval(payTick, PAY_TICK_MS);
  setTimeout(payTick, 0);
  return `${head}${picker}${payHero(slips)}
    <div class="card" style="margin-bottom:14px;">
      <div class="card-title"><span>급여명세서 <span style="font-weight:500; color:var(--text-secondary);">${escapeHtml(slips[0].head.name)}</span></span><span class="pay-years" role="group" aria-label="연도 선택">${yearBtns}</span></div>
      <div class="pay-mgrid">${monthBtns}</div>
      <div class="list-sub">${live ? '월을 누르면 아래에 명세서가 열립니다. 금액은 급여대장 그대로이고, 0원인 항목은 감춥니다.' + (payViewKey===null ? '' : ' 다른 직원을 고르면 열람 기록이 남고, 공개 전인 달도 보입니다.') : '월을 누르면 아래에 명세서가 열립니다. 시연용 가상 금액이며, 실제 명세서는 위하고 자료를 올리면 표시됩니다.'}</div>
    </div>
    <div class="card" style="margin-bottom:14px;"><div class="card-title">${payYear}년 급여 수령 현황</div>${payYearChart(slips, payYear)}</div>
    ${open ? payDetail(open) : ''}`;
}
async function liveWake(L, loadMine, tab, sig){   // 실제 로그인: 화면을 다시 볼 때 — 그사이 HR이 공개한 것을 메뉴 숫자와 열려 있는 내 화면에 (오래 열어 둔 휴대폰·PC). L = PAY_LIVE · WH_LIVE
  const key = ()=>JSON.stringify(L.mine.map(sig)), was = key();
  await loadMine();
  if(key()===was) return;   // 바뀐 것이 없으면 다시 그리지 않는다
  renderSidebar();
  if(L.who!==null) return;
  L.state = '';   // 내 화면은 새로 받는다
  if(currentTab.id===tab && !document.activeElement?.matches('input, textarea')) renderContent();   // 적는 중에는 다시 그리지 않는다
}
function payWake(){ return liveWake(PAY_LIVE, payLoadMine, 'p1', s=>[s.ym, s.revised, s.seen]); }
function whWake(){ return liveWake(WH_LIVE, whFetchMine, 'p3', y=>[y.year, y.revised, y.seen]); }

/* ----- HR: 급여대장 올리기 · 확인 · 공개 (2026-10-20 인사담당자 — 급여명세서 실제화) -----
   HR이 고른 급여대장(암호 엑셀)을 이 PC 화면 안에서 읽어(psRead) 직원과 맞추고(psMatch) 사람별 숫자만 서버에 올린다 — 파일과 암호는 보내지 않는다.
   올린 달은 "공개"를 눌러야 직원에게 보이고, 공개 중인 달은 내린 뒤에만 다시 올린다(서버도 409). 시연(서버 없음)은 ps.mem에만 둔다 — 새로 고치면 사라진다 */
const ps = { view:'me', months:[], ready:true, state:'', pick:null, mem:{ months:{}, slips:{} }, prev:null };   // view: HR 화면 'me' 내 급여명세서 · 'admin' 올리기·공개 / months·ready·state: 실제 달 목록(MS_LIVE와 같은 방식) / pick: 확인 창의 급여대장 / mem: 시연 기억 — months[ym] · slips[ym][시연 열쇠] = 명세서 / prev: 미리 보기 창
const PS_ERR = {   // psRead의 err → 확인 창 대신 띄우는 문구
  HEAD:'급여대장에서 사원명 칸을 찾지 못했습니다. 급여 프로그램에서 내려받은 급여대장이 맞는지 확인해 주세요.',
  GROUP:'급여대장 제목 윗줄에서 "수당"·"공제" 묶음을 찾지 못했습니다. 급여 프로그램에서 내려받은 급여대장이 맞는지 확인해 주세요.',
  TOTAL:'급여대장에서 지급액계·공제액계·차인지급액 칸을 찾지 못했습니다. 급여 프로그램에서 내려받은 급여대장이 맞는지 확인해 주세요.' };
const PS_WHY = { NONE:'명단에 같은 이름 없음', CODE:'사원코드가 다름', TWICE:'다른 줄과 같은 직원' };   // psMatch의 why (SAME은 같은 이름이 몇 명인지 센다)
function psMon(ym){ return `${+ym.slice(5)}월분`; }
function psYmName(ym){ return `${ym.slice(0, 4)}년 ${psMon(ym)}`; }
function psMonths(){ return AUTH.live ? ps.months : Object.values(ps.mem.months).sort((a, b)=>b.ym.localeCompare(a.ym)); }   // 최근 달부터
function psMembers(){   // 맞출 명단 — 실제는 구성원 설정 명단(비활성 포함: 달 중간에 퇴사한 사람도 그달 명세서는 받는다), 시연은 시연 인물
  return AUTH.live ? MS_LIVE.list : Object.keys(PAY_PEOPLE).map(k=>({ id:k, name:KPI_USERS[k].name, team:PAY_PEOPLE[k].dept, division:'', no:PAY_PEOPLE[k].code }));
}
async function psLoad(){   // 실제 로그인 HR: 올린 달 목록 + 서버에 잠금 열쇠가 있는지
  ps.state = 'loading';
  try {
    const r = await fetch('/api/payslips/months');
    if(!r.ok) throw new Error(r.status);
    const j = await r.json(); ps.months = j.months; ps.ready = j.ready; ps.state = 'ok';
  } catch(e){ ps.state = 'err'; }
  if(currentTab.id==='p1') renderContent();
}
async function psLiveDone(){ ps.state = ''; PAY_LIVE.state = ''; await payLoadMine(); renderSidebar(); }   // 실제: 올리기·공개·내리기 뒤 — 달 목록 · HR이 고른 직원 화면 · 내 메뉴 숫자를 새로
function paySwitch(){   // HR에게만: 내 급여명세서 / 명세서 올리기 · 공개 (평가·성과의 hrSwitch와 같은 모양)
  if(!kpiIsHr()) return '';
  const btn = (v, label)=>`<button type="button" class="${ps.view===v ? 'on' : ''}" onclick="ps.view='${v}'; kpiFlash(null)" aria-pressed="${ps.view===v}">${label}</button>`;
  return `<div class="hr-seg" id="paySeg" role="group" aria-label="화면 고르기">${btn('me', '내 급여명세서')}${btn('admin', '명세서 올리기 · 공개')}
    <span class="list-sub" style="margin:0 0 0 6px;">${ps.view==='me' ? '내 명세서와 직원별 명세서를 보는 화면입니다.' : '급여대장을 올리고 직원에게 공개하는 화면입니다.'}</span></div>`;
}
function psAdmin(){   // HR "명세서 올리기 · 공개" — 올린 달마다 한 줄 (귀속 월 · 지급일 · 인원 · 상태 · 단추)
  const live = AUTH.live;
  if(live){
    if(!ps.state) psLoad();
    if(!MS_LIVE.state) msLoad();   // 미리 보기의 직원 고르기
    if(ps.state!=='ok') return kpiNote(ps.state==='err' ? '명세서 현황을 불러오지 못했습니다. 잠시 뒤 새로 고쳐 주세요.' : '명세서 현황을 불러오는 중입니다…', ps.state==='err' ? 'danger' : 'info');
  }
  const ready = !live || ps.ready, pd = s=>`${+s.slice(5, 7)}/${+s.slice(8, 10)}`, od = s=>{ const d = new Date(s); return `${d.getMonth()+1}/${d.getDate()}`; };
  const rows = psMonths().map(m=>{ const open = m.status==='OPEN';
    return `<div class="ps-row"><b>${psYmName(m.ym)}</b><span>${pd(m.payDate)}</span><span>${m.people}명</span>
      <span class="ps-st"><span class="ps-pill ${open ? 'open' : 'draft'}">${open ? `공개됨 · ${od(m.openedAt)}` : '공개 전'}</span>${m.revised ? '<span class="badge warning">수정됨</span>' : ''}</span>
      <span class="ps-act"><button type="button" class="btn sm" onclick="psPreview('${m.ym}')">미리 보기</button>${open ? `<button type="button" class="btn sm" onclick="psOpenAsk('${m.ym}', false)">공개 내리기</button>`
        : `${ready ? `<button type="button" class="btn sm" onclick="rzPick('slip')">다시 올리기</button>` : ''}<button type="button" class="btn sm coral" onclick="psOpenAsk('${m.ym}', true)">공개</button>`}</span></div>`; }).join('');
  const tools = (live ? '' : '<button type="button" class="btn sm" onclick="psDemo()">시연: 예시 자료로 올려 보기</button>') + (ready ? `<button type="button" class="btn sm coral" id="psUp" onclick="rzPick('slip')">${icon('clip')} 명세서 올리기</button>` : '');
  return `${ready ? '' : kpiNote('서버에 명세서 잠금 열쇠가 없어 아직 올릴 수 없습니다. 개발본부장께 서버 설정(HR_PAY_KEY)을 부탁해 주세요.', 'warning')}
    <div class="card" id="psMonths"><div class="card-title"><span>명세서 현황</span><span class="ps-tools">${tools}</span></div>
      <div class="list-sub" style="margin:-4px 0 12px;">올린 명세서는 "공개"를 눌러야 직원에게 보입니다.</div>
      ${rows ? `<div class="ps-row head"><span>귀속 월</span><span>지급일</span><span>인원</span><span>상태</span><span></span></div>${rows}` : '<div class="placeholder-note" style="margin:0;">아직 올린 명세서가 없습니다.</div>'}
    </div>`;
}
async function psStage(fileName, rows, locked){   // 급여대장 줄 → 확인 창. 파일 고르기(rzLoad 'slip')·시연·검사가 부른다. locked = 암호를 풀어 읽었나(암호 자체는 받지 않는다)
  const r = psRead(rows);
  if(r.err){ ps.pick = null; orgCloseModal(); return kpiFlash(PS_ERR[r.err], 'danger'); }
  if(AUTH.live){   // 맞출 명단 · 그 달이 이미 올라가 있는지
    if(MS_LIVE.state!=='ok') await msLoad();
    if(ps.state!=='ok') await psLoad();
    if(MS_LIVE.state!=='ok' || ps.state!=='ok'){ ps.pick = null; orgCloseModal(); return kpiFlash('직원 명단이나 명세서 현황을 불러오지 못했습니다. 잠시 뒤 다시 해 주세요.', 'danger'); }
  }
  const members = psMembers(), auto = psMatch(r.people, members), ym = psYm(fileName);
  ps.pick = { file:fileName, locked:!!locked, ym, payDate:psPayDate(ym), r, auto, to:auto.map(x=>x.id), members };   // to: 줄마다 올릴 직원 — 직원 번호(시연은 열쇠) · null 아직 · 'skip' 이번 달에서 빼기
  psConfirm();
}
const PS_YM = /^20\d\d-(0[1-9]|1[0-2])$/, PS_CODE = /^[0-9A-Za-z-]{1,20}$/;   // 서버(payslip.py)와 같은 모양
function psRealDay(s){ const m = /^(20\d\d)-(\d\d)-(\d\d)$/.exec(s || ''), d = m && new Date(+m[1], m[2]-1, +m[3]); return !!m && d.getMonth()===m[2]-1 && d.getDate()===+m[3]; }   // 2026-02-30 같은 없는 날은 거짓
function psBlock(){   // 올릴 수 없는 이유 하나 (빈 글자 = 올릴 수 있다). 확인 창의 단추와 안내가 이것만 본다. 서버가 거절할 모양(사원코드 · 글자 수 · 칸 수 · 금액)도 미리 막는다
  const k = ps.pick;
  if(!k) return '고른 급여대장이 없습니다.';
  if(!PS_YM.test(k.ym)) return '귀속 월을 골라 주세요.';
  if(!psRealDay(k.payDate)) return '지급일을 골라 주세요.';
  if(psMonths().some(m=>m.ym===k.ym && m.status==='OPEN')) return `${psYmName(k.ym)}은 공개 중인 달이라 올릴 수 없습니다. 현황에서 "공개 내리기"를 한 뒤 다시 올려 주세요.`;
  const bad = k.r.people.filter(p=>p.bad).length;
  if(bad) return `금액이 맞지 않는 사람이 ${bad}명 있어 올릴 수 없습니다. 급여대장을 고친 뒤 다시 골라 주세요.`;
  const sent = k.r.people.filter((p, i)=>k.to[i]!=='skip'), won = n=>Number.isInteger(n) && Math.abs(n)<=1e9;   // 이번 달에서 뺀 줄은 보지 않는다
  const who = a=>a.slice(0, 3).map(p=>p.head.name).join(', ') + (a.length>3 ? ` 외 ${a.length-3}명` : '');
  const shape = [[p=>!PS_CODE.test(p.head.code), '사원코드가 없거나 모양이 다른 사람'], [p=>Object.values(p.head).some(v=>String(v).length>40), '사원명·부서·직급·직종이 40자를 넘는 사람'],
    [p=>![...p.pay, ...p.ded].every(x=>won(x[1])) || ![p.gross, p.deduct, p.net].every(won), '금액이 10억 원을 넘는 칸이 있는 사람']].map(([f, l])=>[sent.filter(f), l]).find(([a])=>a.length);
  if(shape) return `${shape[1]}(${who(shape[0])})이 있어 올릴 수 없습니다. 급여대장을 고치거나 그 사람을 이번 달에서 빼 주세요.`;
  const long = [...k.r.pay, ...k.r.ded].filter(x=>x.label.length>30).map(x=>x.label);
  if(long.length) return `항목 이름이 30자를 넘는 칸(${long.join(', ')})이 있어 올릴 수 없습니다.`;
  if(k.r.pay.length>40 || k.r.ded.length>40) return `지급·공제 항목은 각각 40칸까지 올릴 수 있습니다 (지금 지급 ${k.r.pay.length}칸 · 공제 ${k.r.ded.length}칸).`;
  if(k.to.includes(null)) return '못 맞춘 사람은 직원을 고르거나 "이번 달에서 빼기"를 골라 주세요.';
  if(k.to.every(t=>t==='skip')) return '올릴 사람이 없습니다.';
  return '';
}
function psPick(i, v){   // 못 맞춘 줄의 고르기: '' 아직 · 'skip' 이번 달에서 빼기 · 직원 번호(시연은 열쇠)
  const k = ps.pick, m = k.members.find(x=>String(x.id)===v);
  k.to[i] = m ? m.id : v==='skip' ? 'skip' : null; k.err = '';   // 고르기를 바꾸면 지난 서버 답(빨간 글)은 지운다
  psConfirm();
}
function psNote(){   // 확인 창: 고른 귀속 월이 이미 올라가 있으면 (공개 중 = 막음 · 공개 전 = 바뀜)
  const k = ps.pick, m = psMonths().find(x=>x.ym===k.ym);
  return !m ? '' : m.status==='OPEN' ? kpiNote(`<b>${psYmName(k.ym)}은 지금 공개 중인 달입니다.</b> 직원이 보고 있어 바로 바꿀 수 없습니다. 현황에서 "공개 내리기"를 한 뒤 다시 올려 주세요.`, 'danger') : kpiNote('이미 올린 달입니다. 올리면 바뀝니다.', 'warning');

function whLines(items){   // pdf.js 글자 조각 → 줄. 그 줄 맨 위 조각과 높이(y) 차이 2 이하 = 한 줄, 왼쪽(x)부터, 조각 사이 공백 하나. y는 위로 갈수록 크다 → 위 줄부터

    const l = lines[lines.length-1];

function whSplit(files){   // 스펙 4.4 — 사람의 첫 쪽 = '원천징수영수증' + '차감징수세액'. 한 사람 = 첫 쪽부터 다음 첫 쪽 앞까지, PDF 파일을 넘지 않는다. 첫 쪽보다 앞의 쪽 = 주인 없는 쪽(올리기를 막는다)

function whDeduct(g){   // 근로소득공제 (소득세법 제47조) — 원 단위 버림, 한도 2,000만. 법이 바뀌면 여기 (정수로 곱한 뒤 나눠 실수 오차 없게)

function whGross(a, b){   // 둘째 쪽 근로소득공제 줄 첫 금액(a) · 근로소득금액 줄 첫 금액(b) → 총급여. 해석 ① a = 공제(총급여 = a + b) · ② a = 총급여(공제 = a − b) 중 공제 계산식과 맞는 것이 정확히 하나일 때만

function whRrnMd(flat){   // 주민번호 모양이 한 가지 값일 때만 그 월-일 — 생일 비교용. 화면 안에서만 쓰고 어디에도 보내거나 저장하지 않는다

function whMatch(groups, members){   // 스펙 4.6 — 사람 묶음(첫 쪽 flat) → 직원. 못 가리면 id:null + why (NONE 이름 없음 · SAME 이름 여럿·같은 이름 · OUT 퇴사한 직원만 · TWICE 둘 이상이 같은 직원). bday = 주민번호 월-일 ≠ 구성원 설정 생일이면 'diff'

/* ----- 화면 -----

let whYear = null, whViewKey = null, whOrig = null;   // whViewKey: 시연 = 역할 열쇠 · 실제 = null(본인) 또는 HR이 고른 직원 번호 (payViewKey와 같다) / whOrig: 열어 둔 원본 { year, who, bytes, state } — 열려 있는 동안만 PDF를 기억한다(다시 그릴 때 또 받지 않게)

function whSum(s){ const t10 = x=>Math.trunc(x/10)*10; return { gross:s.gross, taxDecided:s.decided, localDecided:s.decidedLocal, taxPrepaid:s.prepaid, localPrepaid:s.prepaidLocal, taxSettle:t10(s.decided - s.prepaid), localSettle:t10(s.decidedLocal - s.prepaidLocal) }; }   // 시연 요약(whSummary) → 서버 요약 모양 (차감은 칸마다 10원 미만 절사 — whSummary.settle과 같다)
function whRows(key){   // 시연: 가상 해(WH_DATA) + 시연 올리기로 올려 공개한 해(같은 해면 올린 것) — 최근 해부터
  const mem = Object.values(wh.mem.years).filter(y=>y.status==='OPEN' && wh.mem.rows[y.year]?.[key]).map(y=>({ year:y.year, ...wh.mem.rows[y.year][key] }));
  const demo = whYears(key).filter(y=>!mem.some(m=>m.year===y)).map(y=>{ const s = whSummary(y, WH_DATA[key][y]); return { year:y, sum:whSum(s), demo:s }; });

function whContent(){

function whBody(r, who){   // 한 해의 요약 + 원본. r = { year, sum, revised, seen, status?, pdf?(시연에서 올린 것), demo?(whSummary — 공제 항목) }. 못 읽은 칸(null)은 그 줄을 숨기고 짐작해 채우지 않는다

async function whFetch(who){   // 실제 로그인: 지금 화면의 해 목록 — who = null 본인(공개된 해만) · 직원 번호 = HR이 고른 직원(공개 전 해도, 서버가 열람 기록). 끝나면 다시 그린다 (payLoad와 같은 방식)
  WH_LIVE.state = 'loading'; WH_LIVE.who = who; WH_LIVE.years = [];
  try {
    const r = await fetch('/api/withholding' + (who===null ? '' : '?user='+who));
    if(!r.ok) throw new Error(r.status);
    const years = (await r.json()).years;
    if(WH_LIVE.who!==who) return;   // 기다리는 사이 다른 직원을 골랐다 — 늦게 온 답은 버린다
    WH_LIVE.years = years; WH_LIVE.state = 'ok';
    if(who===null) WH_LIVE.mine = years;
  } catch(e){ if(WH_LIVE.who!==who) return; WH_LIVE.state = 'err'; }
  if(currentTab.id==='p3') renderContent();
}
async function whFetchMine(){   // 메뉴 숫자용: 내 공개된 해 (로그인 직후 · 화면을 다시 볼 때). 못 받으면 숫자만 0이다
  try {
    const r = await fetch('/api/withholding');
    if(r.ok) WH_LIVE.mine = (await r.json()).years;
  } catch(e){}
}
function whSeen(r){   // 내 영수증의 해를 처음 열면 — paySeen과 같다: 낙관적으로 봤음(화면 목록 · 내 목록) → 메뉴 숫자를 바로 줄이고 서버에는 알리기만. 화면을 그리는 중에 불러서 메뉴는 renderContent가 다시 그린다

}
function whLiveDone(){ wh.state = ''; WH_LIVE.state = ''; whOrig = null; whFetchMine().then(renderSidebar); }   // 실제: 올리기 · 공개 · 내리기 뒤 — 현황 · 고른 직원 화면 · 내 메뉴 숫자를 새로 (psLiveDone과 같다)
async function whPdfBytes(year, who){   // 원본 PDF 바이트 — 실제는 서버(HR이 고른 직원은 ?user= — 열람 기록), 시연은 올린 바이트

}
async function whViewer(year, who){   // "원본 PDF 보기": 누를 때 받아 화면 안에 쪽마다 그린다(새 탭은 아이폰 홈 화면 앱에서 로그인 밖으로 나간다 — 스펙 4.2). 다시 누르면 닫는다

async function whDown(year, who){   // 내려받기 — 파일 이름에 실명을 넣지 않는다(PC에 남는 이름). 열어 둔 원본이 있으면 그 바이트로

function whStart(mode, year){ wh.ask = { mode, year:year ?? null }; rzPick('wh'); }   // 현황의 단추: 해 전체(해 줄의 "다시 올리기"는 그 해로) · 사람만
async function whLoad(file, pw){   // rzLoad('wh') — zip을 이 화면 안에서 풀어 PDF만 whStage로. 암호(pw)는 whZipRead에 넘기기만 하고 어디에도 두지 않는다
  const fail = msg=>{ rz.lock = null; orgCloseModal(); kpiFlash(msg, 'danger'); };
  let buf;
  try { buf = await file.arrayBuffer(); } catch(e){ return fail('파일을 읽지 못했습니다. 다시 골라 주세요.'); }
  const kind = whKind(new Uint8Array(buf));   // 첫 바이트로 본다 — 확장자는 믿지 않는다
  if(kind==='pdf') return fail('PDF를 암호 zip으로 묶어 올려 주세요.');
  if(kind!=='zip') return fail('zip 파일이 아니라 읽지 못했습니다(7z · 알집 등). 반디집에서 <b>zip</b> 형식으로 다시 압축해 주세요.');
  const pdfs = []; let other = 0;
  try {
    const ents = whZipList(buf).filter(f=>!f.name.endsWith('/')), want = ents.filter(f=>/\.pdf$/i.test(f.name));   // PDF만 푼다 — 다른 파일은 열지 않고 센다
    other = ents.length - want.length;
    if(want.some(f=>f.encrypted) && pw==null) return rzAskPw('wh', file);
    for(const f of want){ const u8 = await whZipRead(buf, f, pw); if(whKind(u8)==='pdf') pdfs.push({ name:f.name, bytes:u8, f }); else other++; }
  } catch(e){
    if(e.message==='PW') return rzAskPw('wh', file, '암호가 맞지 않습니다. 다시 넣어 주세요.');

  }

}
async function whStage(fileName, files, how = {}){   // PDF(files: [{ name, bytes }]) → 쪽 글자 → 사람 · 숫자 · 직원 → 확인 창. 시연은 bytes 없이 pages(글자 견본)를 바로 넘긴다. how = { encrypted, zipcrypto, other, demo } (암호 자체는 받지 않는다)
  whDrop();
  orgModal(`<div id="whRead"><div class="card-title"><span>원천징수영수증 읽는 중</span></div><div class="list-sub" id="whReadN" role="status" style="margin:0;">PDF를 여는 중입니다…</div>
    <div style="display:flex; justify-content:flex-end; margin-top:12px;"><button type="button" class="btn" onclick="orgCloseModal()">취소</button></div></div>`);   // 취소 = 바깥 · Esc와 같다 (창이 없어지면 그만 읽는다)

  try {
    for(const f of files) docs.push(f.bytes ? await whPdfOpen(f.bytes) : null);
    const total = docs.reduce((t, d)=>t + (d ? d.numPages : 0), 0); let n = 0;
    for(const [i, f] of files.entries()){
      if(!docs[i]){ out.push({ name:f.name, bytes:null, pages:f.pages }); continue; }
      const pages = [];

        if(stop()) throw new Error('STOP');
        document.getElementById('whReadN').textContent = `읽는 중… ${++n}/${total}쪽`;
        pages.push({ lines:whLines((await (await docs[i].getPage(p)).getTextContent()).items) });
      }

    return { file:p.file, from:p.from, to:p.to, flat:whFlat(pg[p.from].lines.join('')), name:'', ...whNums(pg[p.from].lines, p.to>p.from ? pg[p.from+1].lines : null), pdfBytes:null }; });

    auto:auto.map(x=>x.id), to:auto.map(x=>x.id ?? (x.why==='OUT' ? 'skip' : null)), why:auto.map(x=>x.why), bday:auto.map(x=>x.bday), orphans:sp.orphans, skipped:{ other:how.other || 0 },   // to: 사람마다 올릴 직원 — 번호(시연은 열쇠) · null 아직 · 'skip' 이번에서 빼기 (퇴사자는 처음부터 빼기)
    encrypted:!!how.encrypted, zipcrypto:!!how.zipcrypto, demo:!!how.demo, seenAll:false, members, thumbs:[], err:'', busy:false };
  whConfirm();
}
function whDrop(){ const k = wh.pick; wh.pick = null; k?.docs.forEach(d=>d?.destroy()); }   // 확인 창을 닫으면 읽은 자료를 버리고 pdf.js 문서(워커)도 닫는다
function whSettle(g){ const s = g.sum; return s.taxSettle===null || s.localSettle===null ? null : s.taxSettle + s.localSettle; }   // 환급(−) · 추가 납부(+) — 하나라도 못 읽었으면 null
function whUnread(g){ return Object.values(g.sum).some(v=>v===null) || g.check.decided2===false; }   // 숫자를 못 읽었거나 둘째 쪽 결정세액과 다른 사람
function whSent(k){ return k.groups.map((g, i)=>({ g, i, userId:k.to[i] })).filter(x=>x.userId!==null && x.userId!=='skip'); }   // 올릴 사람

function whHuge(g){ return Object.values(g.sum).some(v=>v!==null && Math.abs(v)>1e11); }   // 서버가 거절할 금액 (1,000억 원 넘게 읽힘)
function whBig(g){ return !!g.pdfBytes && g.pdfBytes.length>WH_PDF_MAX; }   // 사람별 PDF가 서버 한도를 넘음 — PDF는 올리기를 누를 때 만들어서(whBuild) 그 뒤에 안다
function whBlock(){   // 올릴 수 없는 이유 하나 (빈 글자 = 올릴 수 있다). 확인 창의 단추와 안내가 이것만 본다 — 서버가 거절할 모양(해 · 크기 · 금액)도 미리 막는다

  if(k.mode==='some' && y?.pending>0) return `${k.year}년 귀속은 해 전체 올리기가 끝나지 않은 해입니다. 해 전체를 다시 올려 주세요.`;
  if(k.to.includes(null)) return '못 맞춘 사람은 직원을 고르거나 "이번에서 빼기"를 골라 주세요.';
  const sent = whSent(k), ids = sent.map(x=>String(x.userId)), who = a=>a.slice(0, 3).map(x=>x.g.name || `${x.i+1}번째 사람`).join(', ') + (a.length>3 ? ` 외 ${a.length-3}명` : '');

async function whThumbs(){   // 첫 쪽 작은 그림 (pdf.js — HR 화면에서만, 폭 160px · 눌러서 크게). 한 번 그린 캔버스는 기억해 두고 창을 다시 그리면 옮겨 붙인다

    if(wh.pick!==k) return;
    if(!el.isConnected) continue;   // 그리는 사이 창을 다시 그렸다 — 새 창의 whThumbs가 맡는다
    const i = +el.dataset.whThumb, g = k.groups[i];
