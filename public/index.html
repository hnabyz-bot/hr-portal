function todoSelfCheck(){   // 브라우저 콘솔에서 todoSelfCheck() 실행 (시연 상태는 끝나면 되돌린다)
  const ok = (c,m)=>{ if(!c) throw new Error('todoSelfCheck 실패: '+m); };
  const s = kpiSheets.emp, keep = [kpiRole, s.pending, s.rejectNote, AUTH.live];
  try {
    AUTH.live = false;   // 시연 숫자를 본다 (실제 로그인 숫자는 kpiLiveSelfCheck)
    s.pending = { rows:[], reason:'', step:0 }; s.rejectNote = null;
    kpiRole = 'lead'; ok(TODO.e1()===1, '팀장: 승인할 KPI 1건');
    kpiRole = 'head'; ok(TODO.e1()===0, '본부장: 아직 차례가 아니면 0');
    s.pending = null; s.rejectNote = '반려';
    const memo = kvMemoTodo(kvPeople.find(p=>p.key==='emp'));
    kpiRole = 'emp'; ok(TODO.e1()===1+memo, '직원: 반려된 내 KPI 1건 + 확인할 메모');
    const lead = kvPeople.find(p=>p.key==='lead'), m = kvMemoNew(kpiDay(0), '김영희 팀장', '검사용'), who = kvPeople.find(p=>kvCanMemo(lead, p));
    who.memos.unshift(m); kvMemoReply(m, 'owner', who.name, '답글');
    kpiRole = 'lead'; ok(TODO.e4()===1, '팀장: 내가 쓴 메모에 새 답글 1명');
    kvSeeReplies(lead, who); ok(TODO.e4()===0, '열어 보면 사라진다');
    kpiRole = 'emp'; ok(TODO.e4()===0, '직원에게는 KPI 현황 숫자가 없다');
    who.memos.shift();
    kpiRole = 'line'; ok(TODO.e1()===0 && todoCount({id:'r1'})===0, 'KPI 없는 역할·숫자 없는 탭은 0');
  } finally { [kpiRole, s.pending, s.rejectNote, AUTH.live] = keep; }
  return 'todoSelfCheck 통과';
}

function navTabs(n){ return n.tabs.filter(t=>!t.show || t.show()); }   // 역할에 따라 안 보이는 탭(KPI 현황)을 뺀다
const TOP_PC = matchMedia('(min-width:769px)');   // PC에는 맨 위 메뉴 이름 줄이 없다(CSS) — "이 화면 사용법"을 탭 줄에 둔다
function renderSubtabs(){   // 탭이 하나뿐이면 비워 둔다. 단 PC에서 "이 화면 사용법"이 있는 화면이면 그 탭 하나를 보여 주고 단추를 그 줄 오른쪽 끝에 둔다
  const tabs = navTabs(currentNav), row = document.getElementById('subtabsRow'), help = document.getElementById('tourHelp'), show = tabs.length>1 || (TOP_PC.matches && tourHelpOn());   // help는 줄을 다시 그리기 전에 잡아 둔다 — PC에서는 이 줄 안에 있어서 다시 그리면 함께 지워진다
  row.innerHTML = !show ? '' : tabs.map(t => `<div class="subtab ${t.id===currentTab.id?'active':''}" onclick="selectTab('${t.id}')" role="tab" aria-selected="${t.id===currentTab.id}">${typeof t.label==='function' ? t.label() : t.label}${navBadge(todoCount(t))}</div>`).join('');
  row.classList.toggle('none', !show);
  (TOP_PC.matches ? row : document.querySelector('.topbar')).appendChild(help);   // 휴대폰에서는 예전처럼 맨 위 줄 오른쪽
}
TOP_PC.addEventListener('change', ()=>{ renderSubtabs(); tourHelpSync(); });   // 창 폭이 PC ↔ 휴대폰으로 바뀌면 단추 자리도 옮긴다
function renderContent(){   // 화면을 다시 그릴 때마다 메뉴·탭 숫자도 맞춘다 (승인·서명 직후 바로 줄어들게)
  if(AUTH.locked) return;   // 로그인 안내가 덮은 뒤에는 늦게 온 답(payLoad 등)이 화면을 다시 채우지 않게
  if(currentTab.show && !currentTab.show()) currentTab = navTabs(currentNav)[0];   // 역할을 바꿔 지금 탭이 안 보이게 되면 첫 탭으로
  document.getElementById('pageTitle').textContent = currentNav.label;
  document.getElementById('contentArea').innerHTML = currentTab.render();
  renderSidebar(); renderSubtabs(); tourHelpSync();
}
function selectNav(id){
  if(pcOnlyBlocked(id)){ pcOnlyNotice(); return false; }
  currentNav = NAV.find(n=>n.id===id);
  currentTab = currentNav.tabs[0];
  kpiLiveFresh();
  renderContent();
  closeSidebar();
  tourAuto();
}
function selectTab(id){
  currentTab = currentNav.tabs.find(t=>t.id===id);
  kpiLiveFresh();
  renderContent();
  tourAuto();
}
function goTo(navId, tabId){
  if(navId==='pay' && tabId==='p1') ps.view = 'me';   // 홈 "새 급여명세서 확인" · 빠른 서비스 · 원천징수영수증의 "급여명세서 보기"는 HR도 내 명세서 화면으로
  if(navId==='pay' && tabId==='p3'){ wh.view = 'me'; whViewKey = null; }   // 홈 "새 원천징수영수증 확인"(이 길뿐): HR도 전에 고른 직원이 아니라 내 영수증으로 — 그래야 내 숫자가 줄어든다 (시연은 null이면 내 역할)
  if(selectNav(navId) === false) return;   // 휴대폰에서 막힌 메뉴 — 안내창만 뜬다
  if(tabId) selectTab(tabId);
}

function closeSidebar(){ document.querySelector('.sidebar').classList.remove('open'); }

const tour = { key:null, steps:null, i:0, from:null };
let tourTimer = 0;

/* ----- 규칙 (순수 로직, tourSelfCheck가 검증) ----- */
function tourShould(key, seen, busy){ return !busy && !seen.includes(key); }   // 자동으로 띄울까: 처음이고, 다른 안내·창이 떠 있지 않을 때
function tourSelfCheck(){   // 브라우저 콘솔에서 tourSelfCheck() 실행
  const ok = (c,m)=>{ if(!c) throw new Error('tourSelfCheck 실패: '+m); }, list = Object.values(TOURS), tabs = list.map(t=>t.tab).filter(Boolean);
  ok(tourShould('ws', [], false) && !tourShould('ws', ['ws'], false) && !tourShould('ws', [], true) && tourShould('ws', ['menu'], false), '처음 한 번만, 다른 안내·창이 떠 있으면 미룬다');
  ok(NAV.every(n=>TOUR_MENU[n.id]) && Object.keys(TOUR_MENU).length===NAV.length, '모든 메뉴에 둘러보기 설명이 있다');
  ok(tabs.every(id=>NAV.some(n=>n.tabs.some(t=>t.id===id))) && new Set(tabs).size===tabs.length, '사용법은 실제로 있는 탭에, 탭 하나에 하나');
  ok(list.every(t=>t.label && t.steps().every(s=>s.title && s.body && (s.center || s.el))), '모든 단계에 제목·설명·가리킬 곳');
  ok(TOURS.menu.steps().filter(s=>!s.intro).length===NAV.length+3, '둘러보기 = 메뉴마다 한 단계 + 오늘의 업무 + 일정 + 다시 보는 곳');
  return 'tourSelfCheck 통과';
}

/* ----- 기억 ----- */
function tourSeen(){ try{ return (localStorage.getItem('tourSeen') || '').split(',').filter(Boolean); }catch(_){ return []; } }
function tourMark(key){ try{ localStorage.setItem('tourSeen', [...new Set([...tourSeen(), key])].join(',')); }catch(_){} }
function tourBusy(){ return !!tour.steps || !!document.getElementById('orgModal') || document.documentElement.classList.contains('wc-on'); }
function tourTabKey(){ return Object.keys(TOURS).find(k=>TOURS[k].tab===currentTab.id); }

/* ----- 화면 ----- */
function tourEls(st){   // 그 단계가 가리키는 칸들(화면에 보이는 것만)
  for(const sel of [].concat(st.el || [])){
    const els = [...document.querySelectorAll(sel)].filter(e=>e.getClientRects().length);
    if(els.length) return st.one ? els.slice(0, 1) : els;
  }
  return [];
}
function tourSteps(key){ return TOURS[key].steps().filter(s=>s.center || tourEls(s).length); }   // 지금 화면에서 안내할 수 있는 단계
function tourHelpOn(){ const key = tourTabKey(); return !!key && tourSteps(key).length>0; }   // "이 화면 사용법"을 보일까: 안내할 칸이 있는 화면에서만
function tourHelpSync(){ document.getElementById('tourHelp').hidden = !tourHelpOn(); }   // PC는 탭 줄 오른쪽 끝, 휴대폰은 맨 위 줄 오른쪽 (renderSubtabs)
function tourStart(key){
  const t = TOURS[key];
  if(tour.steps) tourEnd();
  if(document.getElementById('orgModal')) orgCloseModal();
  if(t.open) t.open();
  const steps = tourSteps(key);
  if(!steps.length) return false;
  tourMark(key);
  Object.assign(tour, { key, steps, i:0, from:document.activeElement });
  document.body.insertAdjacentHTML('beforeend', '<div class="tr-mask" id="trMask"></div><div class="tr-hole" id="trHole"></div><div class="tr-pop" id="trPop" role="dialog" aria-modal="true" aria-labelledby="trTitle"></div>');
  addEventListener('resize', tourPlace); document.addEventListener('scroll', tourPlace, true); document.addEventListener('keydown', tourKey, true);
  tourGo(0);
  return true;
}
function tourEnd(){
  if(!tour.steps) return;
  ['trMask','trHole','trPop'].forEach(id=>document.getElementById(id)?.remove());
  removeEventListener('resize', tourPlace); document.removeEventListener('scroll', tourPlace, true); document.removeEventListener('keydown', tourKey, true);
  if(isPhone()) closeSidebar();
  const from = tour.from; Object.assign(tour, { key:null, steps:null, i:0, from:null });
  if(from && from.isConnected && from.focus) from.focus({ preventScroll:true });
}
function tourGo(i){
  if(!tour.steps || i<0) return;
  if(i>=tour.steps.length) return tourEnd();
  tour.i = i;
  if(isPhone()) document.querySelector('.sidebar').classList.toggle('open', !!tour.steps[i].menu);   // 휴대폰: 메뉴를 가리킬 때만 메뉴를 열어 놓는다
  tourDraw(); tourPlace();
  setTimeout(tourPlace, 350);   // 화면이 바뀐 직후(메뉴가 열리는 동안 등) 한 번 더 맞춘다
}
function tourKey(e){   // → 다음 · ← 이전 · Esc 건너뛰기. Tab은 말풍선 안에서만 돈다
  if(!tour.steps) return;
  if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); tourEnd(); }
  else if(e.key==='ArrowRight'){ e.stopPropagation(); tourGo(tour.i+1); }
  else if(e.key==='ArrowLeft'){ e.stopPropagation(); if(tour.i>0 && !tour.steps[tour.i-1].intro) tourGo(tour.i-1); }
  else if(e.key==='Tab'){
    const b = [...document.querySelectorAll('#trPop button')], at = b.indexOf(document.activeElement);
    e.preventDefault(); b[(at + (e.shiftKey ? b.length-1 : 1)) % b.length].focus();
  }
}
function tourDraw(){   // 말풍선 내용 + 가리킬 곳이 보이게 화면을 옮긴다 (단계가 바뀔 때 한 번)
  const st = tour.steps[tour.i], i = tour.i, t = TOURS[tour.key], pop = document.getElementById('trPop');
  const count = tour.steps.filter(s=>!s.intro).length, no = i + 1 - (tour.steps[0].intro ? 1 : 0), last = i===tour.steps.length-1;
  pop.innerHTML = st.intro
    ? `<img class="tr-logo" src="img/logo-mark-clear.png" alt=""><h3 id="trTitle">${st.title}</h3><p>${st.body}</p>
       <div class="tr-facts"><span>메뉴 ${NAV.length}개</span><span>${count}단계</span><span>약 1분</span></div>
       <div class="tr-nav"><button type="button" class="btn" onclick="tourEnd()">나중에 볼게요</button><button type="button" class="btn primary" id="trNext" onclick="tourGo(${i+1})">둘러보기 시작</button></div>
       <div class="tr-foot">왼쪽 메뉴 아래 "사이트 둘러보기"에서 언제든 다시 볼 수 있어요</div>`
    : `<div class="tr-bar"><i style="width:${no/count*100}%"></i></div><div class="tr-step">${t.label} · ${no} / ${count}</div><h3 id="trTitle">${st.title}</h3><p>${st.body}</p>
       <div class="tr-nav"><button type="button" class="tr-skip" onclick="tourEnd()">건너뛰기</button>${i>0 && !tour.steps[i-1].intro ? `<button type="button" class="btn sm" onclick="tourGo(${i-1})">이전</button>` : ''}<button type="button" class="btn primary sm" id="trNext" onclick="tourGo(${i+1})">${last ? '끝내기' : '다음'}</button></div>`;
  const first = tourEls(st)[0];
  if(first) first.scrollIntoView({ block:'center', inline:st.inline || 'nearest' });
  document.getElementById('trNext').focus({ preventScroll:true });
}
function tourPlace(){   // 밝은 칸과 말풍선의 자리 (스크롤·창 크기가 바뀔 때마다)
  if(!tour.steps) return;
  const st = tour.steps[tour.i], hole = document.getElementById('trHole'), pop = document.getElementById('trPop'), mask = document.getElementById('trMask');
  const els = tourEls(st);
  if(!els.length){ hole.style.display = 'none'; mask.classList.add('dim'); pop.className = 'tr-pop center'; pop.style.left = pop.style.top = ''; return; }   // 가리킬 곳이 없는 단계(시작 카드)는 한가운데
  const rs = els.map(e=>e.getBoundingClientRect()), pad = 6, vw = innerWidth, vh = innerHeight;
  const x1 = Math.max(4, Math.min(...rs.map(r=>r.left)) - pad), y1 = Math.max(4, Math.min(...rs.map(r=>r.top)) - pad);
  const x2 = Math.min(vw-4, Math.max(...rs.map(r=>r.right)) + pad), y2 = Math.min(vh-4, Math.max(...rs.map(r=>r.bottom)) + pad);
  mask.classList.remove('dim'); hole.style.display = '';
  Object.assign(hole.style, { left:x1+'px', top:y1+'px', width:Math.max(0, x2-x1)+'px', height:Math.max(0, y2-y1)+'px' });
  pop.className = 'tr-pop';
  const pw = pop.offsetWidth, ph = pop.offsetHeight, gap = 16, fit = { right:vw-x2 >= pw+gap+8, bottom:vh-y2 >= ph+gap+8, top:y1 >= ph+gap+8, left:x1 >= pw+gap+8 };
  const side = ['right','bottom','top','left'].find(s=>fit[s]) || 'bottom';
  let left, top;
  if(side==='right' || side==='left'){ left = side==='right' ? x2+gap : x1-gap-pw; top = Math.min(Math.max(8, y1), vh-ph-8); pop.style.setProperty('--ar', Math.min(ph-28, Math.max(14, (y1+y2)/2 - top - 7))+'px'); }
  else { top = Math.min(Math.max(8, side==='bottom' ? y2+gap : y1-gap-ph), vh-ph-8); left = Math.min(Math.max(8, x1), vw-pw-8);   // 자리가 모자라면(휴대폰의 큰 칸) 화면 안쪽에 겹쳐 놓는다
    pop.style.setProperty('--ar', Math.min(pw-28, Math.max(14, (x1+x2)/2 - left - 7))+'px'); }
  pop.classList.add(side); pop.style.left = left+'px'; pop.style.top = top+'px';
}

/* ----- 자동으로 띄우기 ----- */
function tourFirst(){ return tourShould('menu', tourSeen(), !!tour.steps) && tourStart('menu'); }   // 처음 들어온 브라우저: 사이트 둘러보기 (환영 페이지에서 들어온 직후, 또는 환영 페이지가 없는 날에는 바로)
function tourAuto(){   // 화면을 옮긴 뒤: 그 화면에 처음이면 사용법을 한 번 띄운다. 화면이 마저 그려지도록 한 박자 늦춘다
  clearTimeout(tourTimer);
  tourTimer = setTimeout(()=>{ const key = tourTabKey(); if(key && tourShould(key, tourSeen(), tourBusy())) tourStart(key); }, 250);
}

/* ---------------- 키보드·화면 읽기 보조 ----------------
   onclick이 달린 div/span을 Tab으로 갈 수 있는 버튼처럼 만들고, .field 안 이름표를 입력칸에 연결한다.
   화면을 innerHTML로 다시 그리므로 변화가 생길 때마다 한 번에 처리한다. */
let a11ySeq = 0;
function a11yEnhance(root){
  root.querySelectorAll('[onclick]:not(button):not(a):not(input):not(select):not(textarea):not(label):not([tabindex])').forEach(el=>{
    el.setAttribute('tabindex','0'); if(!el.getAttribute('role')) el.setAttribute('role','button');
  });
  root.querySelectorAll('.field').forEach(f=>{
    const lb = f.querySelector(':scope > label'), inp = f.querySelector('input, select, textarea');
    if(!lb || !inp || lb.htmlFor) return;
    if(!inp.id) inp.id = 'fld_'+(++a11ySeq);
    lb.htmlFor = inp.id;
  });
  root.querySelectorAll('.field > input:not([aria-label]):not([id]), .field > div > input:not([aria-label])').forEach(inp=>{
    if(!inp.labels || !inp.labels.length){ const ph = inp.getAttribute('placeholder'); if(ph) inp.setAttribute('aria-label', ph); }
  });
}
new MutationObserver(()=>a11yEnhance(document.body)).observe(document.body, {childList:true, subtree:true});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && document.getElementById('orgModal')) return orgCloseModal();
  const t = e.target;
  if((e.key==='Enter' || e.key===' ') && t.getAttribute && t.getAttribute('role')==='button' && t.tagName!=='BUTTON'){ e.preventDefault(); t.click(); }
});

/* ---------------- 로그인 (하이웍스 SSO, 로그인 설계 5단계) ----------------
   서버(/api/me)가 누구인지 알려 주면 실제 모드 — 역할은 구성원 설정의 직책·HR 권한대로, 시연용 역할 전환은 없다.
   401 이면 화면 전체를 가리고 하이웍스에서 들어오라고 안내한다(휴대폰 폭이면 PC 안내 — 1차는 PC 전용, §3).
   안내일 뿐 보안이 아니다 — 데이터는 서버가 막는다(8월 설계 §8 "세 겹").
   PC는 하이웍스 메뉴로 연 창에서만 쓴다(2026-10-19 인사담당자 결정, 설계 §3) — 주소를 직접 쳐서 연 창은 세션이 남아 있어도 로그아웃하고 안내한다(authEntered).
   서버가 없으면(PC 미리보기 — /api/me 가 404·연결 실패) 지금처럼 시연 모드다. */
const AUTH_TEXT = {
  login:['하이웍스에서 들어와 주세요', '하이웍스에 로그인한 뒤 <b>인사포털</b> 메뉴를 눌러 들어와 주세요.'],
  phone:['휴대폰 등록이 필요합니다', 'PC의 하이웍스에서 <b>인사포털</b>을 열고 홈 배너의 <b>휴대폰 등록</b>을 누른 뒤, 나온 QR을 이 휴대폰 카메라로 찍어 주세요. 한 번 등록하면 30일 동안 로그인이 유지됩니다.'],
  qr:['QR을 다시 띄워 주세요', 'QR은 <b>3분 동안 한 번만</b> 쓸 수 있습니다. PC 화면의 <b>새 QR</b>을 눌러 다시 찍어 주세요.'],
  out:['로그아웃했습니다', '공용 PC라면 하이웍스도 로그아웃해 주세요. 다시 들어올 때는 하이웍스의 <b>인사포털</b> 메뉴를 누르면 됩니다.'],
};
function authRole(me){   // 서버의 직책·HR 권한 → 화면이 쓰는 역할 이름 (KPI_USERS 의 열쇠)
  if(me.position==='CEO') return 'ceo';
  if(me.position==='DIVISION_HEAD') return 'head';
  if(me.is_hr) return me.position==='TEAM_LEADER' ? 'hrl' : 'hr';
  if(me.position==='TEAM_LEADER') return 'lead';
  return me.writes_kpi===false ? 'line' : 'emp';
}
function authLock(kind){   // 로그아웃 · 세션 끝(401)에도 부른다 — 가린 화면 밑에 급여 금액 · 명단이 남지 않게 지우고 다시 그리지 않는다(renderContent)
  AUTH.locked = true;
  document.getElementById('contentArea').innerHTML = '';   // #payAmt 도 사라져 payTick 이 멈춘다
  orgCloseModal(true);   // 급여대장 확인 창 · 미리 보기 등
  ps.pick = null; ps.prev = null; Object.assign(PAY_LIVE, { state:'', who:null, slips:[], mine:[] });
  Object.assign(WH_LIVE, { state:'', who:null, years:[], mine:[] }); whOrig = null; whDrop(); wh.prev = null; wh.run = null;   // 받아 둔 원천징수영수증 원본 · 확인 창의 사람별 PDF(주민등록번호가 있다) · 미리 보기 · 읽는 중인 것도 버린다 (orgCloseModal(true)는 whDrop을 건너뛴다)
  if(kind==='login' && isPhone()) kind = 'phone';
  const [title, body] = AUTH_TEXT[kind];
  let el = document.getElementById('authLock');
  if(!el){
    el = document.createElement('div'); el.id = 'authLock'; el.className = 'auth-lock';
    el.setAttribute('role','dialog'); el.setAttribute('aria-modal','true'); el.setAttribute('aria-labelledby','authTitle');
    document.body.appendChild(el);
  }
  el.innerHTML = `<div class="auth-card"><div class="brand"><img src="img/logo-mark-clear.png" alt="" width="34" height="34"><span>H&abyz<small>인사포털</small></span></div>
    <h1 id="authTitle">${title}</h1><p>${body}</p>
    ${kind==='phone' || kind==='qr' ? '' : '<a class="btn primary" href="https://login.office.hiworks.com/" rel="noopener">하이웍스 열기</a>'}
    <p class="note">인사포털은 하이웍스 계정으로만 들어올 수 있습니다.</p></div>`;
}
async function authBoot(){
  const code = (location.hash.match(/^#d=([\w-]{20,100})$/) || [])[1];   // 휴대폰이 PC 의 QR 로 열렸다 (휴대폰 등록)
  if(code){
    history.replaceState(null, '', location.pathname + location.search);   // 1회용 값을 주소창·방문 기록에서 지운다
    const ok = await fetch('/api/phone/register', { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ code }) }).then(x=>x.ok, ()=>false);
    if(!ok) return authLock('qr');
  }
  let r;
  try { r = await fetch('/api/me', { headers:{ Accept:'application/json' } }); } catch(e){ return; }   // 서버 없음 = 시연
  if(r.status===401) return authLock('login');
  if(!r.ok || !(r.headers.get('content-type')||'').includes('application/json')) return;   // PC 미리보기(정적 서버) = 시연
  const me = await r.json();
  if(me.kind!=='phone' && !authEntered()){ await fetch('/api/auth/logout', { method:'POST' }).catch(()=>{}); return authLock('login'); }   // 주소로 연 PC 창 — 공용 PC의 다음 사람이 앞사람 세션을 이어 쓰지 않게 끊는다. 등록한 휴대폰은 창을 닫아도 유지
  AUTH.live = true; AUTH.me = me;
  kpiSetRole(authRole(AUTH.me));
  await wsPull(true);   // 나의 업무 · 나의 일상을 서버에서 (이 기기에 적어 둔 것은 처음 한 번 합친다)
  await Promise.all([payLoadMine(), whFetchMine()]);   // 메뉴 숫자용: 공개됐는데 아직 안 연 내 급여명세서 · 원천징수영수증
  kpiLiveLoad();   // 메뉴 · 홈의 처리할 KPI 숫자 — 기다리지 않는다 (다 오면 다시 그린다)
  renderSidebar(); renderContent();
  if(code) installNotice(null, true);   // 방금 등록한 휴대폰: 홈 화면에 추가하는 순서
}
// ponytail: 창을 닫았는지는 서버가 알 수 없어 화면이 판단한다. 개발자 도구로 표시를 만들면 넘어갈 수 있다 — 세션 쿠키는 브라우저를 끄면 사라지고, 서버 만료(4시간·12시간)는 그대로
function authEntered(){   // 하이웍스 메뉴로 연 창인가. 표시는 창마다 따로(sessionStorage) — 창을 닫으면 사라지고 새로 고침에는 남는다
  const fresh = document.cookie.split('; ').includes('hr_entry=1');   // 서버가 로그인 때 주는 1분짜리 신호 (auth.py ENTRY_COOKIE)
  if(fresh) document.cookie = 'hr_entry=; Max-Age=0; path=/; secure';
  try { if(fresh) sessionStorage.setItem('hrEntry', '1'); return sessionStorage.getItem('hrEntry')==='1'; }
  catch(e){ return true; }   // 창 저장소를 못 쓰는 브라우저는 막지 않는다
}
function authLogout(){
  fetch('/api/auth/logout', { method:'POST' }).catch(()=>{}).finally(()=>{ AUTH.live = false; authLock('out'); });
}
const authFetch = window.fetch.bind(window);   // 쓰는 도중 로그인이 끝나면(4시간 쉼 · HR이 꺼 둠 등) 다음 요청에서 바로 안내한다
window.fetch = async (...a)=>{ const r = await authFetch(...a); if(r.status===401 && AUTH.live && String(a[0]).startsWith('/api/')) authLock('login'); return r; };

renderContent();
a11yEnhance(document.body);
wcOpen(orgMembers.find(m=>m.name===KPI_USERS[kpiRole].name)?.hireDate || '');   // 환영 페이지: 신규 입사자(입사 후 7일)에게도 — 맨 위 script에서는 입사일을 몰라 여기서 한 번 더 본다
if(!document.documentElement.classList.contains('wc-on')) tourFirst();   // 환영 페이지가 뜨지 않는 날에 처음 온 브라우저: 바로 사이트 둘러보기
authBoot();
</script>
