/* ---------------- 전자연봉계약서 ----------------
   시연용: 사람·금액·주민번호(앞자리만)는 전부 가상 값이고 브라우저 메모리에만 있다. 새로고침하면 초기화.
   계약서 본문·계산식: 인사담당자가 준 회사 양식(2026 연봉계약서 샘플) 그대로. 대표이사 실명은 넣지 않는다.
   규칙 원본: docs/superpowers/specs/2026-08-24-hr-evaluation-contract-design.md §2·§5.4~5.6
   - 기본급은 전 직원 같은 인상률, 능력급은 평가 등급별 인상률, 인상 후 100원 단위 반올림. HR은 사유를 적고 금액 조정 가능
   - 재직자 계약기간 3/1 ~ 다음 해 2월 말일 고정, 신규 입사자는 HR이 입력
   - 본인만 서명(본문 끝까지 읽어야 서명 가능). 서명 즉시 잠금. 파기는 HR만(사유 필수), 재발송은 원본 보존 + 새 버전
   - 열람: 본인 · 자기 본부 본부장 · HR (팀장은 본인 것만) */
const CT_COMPANY = { name:'㈜에이치앤아비즈', ceo:'○○○', kind:'제조업', addr:'경기도 용인시 처인구 처인성로 41-16' };
const CT_PEOPLE = [   // key = 시연 역할(kpiRole). null이면 시연에서 로그인 불가
  { pid:1, key:'emp',  name:'홍길동', title:'대리',   team:'국내영업팀', division:'전략마케팅본부', rrn:'900315-1******' },
  { pid:2, key:'lead', name:'김영희', title:'팀장',   team:'국내영업팀', division:'전략마케팅본부', rrn:'850702-2******' },
  { pid:3, key:'head', name:'이철수', title:'본부장', team:'',           division:'전략마케팅본부', rrn:'780911-1******' },
  { pid:4, key:null,   name:'신에스', title:'사원',   team:'SCM팀',      division:'연구개발본부',   rrn:'990120-1******' },
  { pid:5, key:'line', name:'최현장', title:'사원',   team:'국내영업팀', division:'전략마케팅본부', rrn:'960805-1******' },
];
const CT_GRADES = ['S','A','B','C','D'];
const ctRates = { base:3, S:8, A:6, B:4, C:2, D:0 };   // 시연용 인상률(%) — 실제 값은 HR이 화면에서 입력
let ctSeq = 0, ctSelected = new Set(), ctOpenId = null;

/* ----- 규칙 (순수 로직, ctSelfCheck가 검증) ----- */
function ctYmd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function ctFebEnd(year){ return ctYmd(new Date(year, 2, 0)); }   // 3월 0일 = 2월 말일 (윤년 자동)
function ctPeriod(t){ const y = t.getMonth()>=2 ? t.getFullYear()+1 : t.getFullYear(); return { start:`${y}-03-01`, end:ctFebEnd(y+1), year:y }; }   // 다음 3월 시작 계약
function ctNewHirePeriod(hireDate){ const [y,m] = hireDate.split('-').map(Number); const endY = m>=3 ? y+1 : y; return { start:hireDate, end:ctFebEnd(endY) }; }
function ctRound100(x){ return Math.round(x/100)*100; }
function ctRaise(before, pct){ return ctRound100(before*(1+pct/100)); }
function ctCalc(c){   // 양식 계산식: 시급 = (기본급+능력급+직책수당+명절상여/12)/209, 시간외 = 시급×10×1.5
  const bonus = c.base, pos = c.pos||0, site = c.site||0, qual = c.qual||0;
  const hourly = (c.base + c.ability + pos + bonus/12) / 209;
  const ot = hourly*10*1.5;
  const monthly = c.base + ot + c.ability + pos + site + qual;
  const annual = (monthly - qual - pos)*12 + bonus;
  return { hourly:Math.round(hourly), ot:Math.round(ot), monthly:Math.round(monthly), annual:Math.round(annual), bonus };
}
function ctApplyRates(c, rates){   // 작성 중(DRAFT)이고 HR이 직접 조정하지 않은 계약만 인상률로 다시 계산
  if(c.status!=='DRAFT' || c.adjReason || c.newHire) return;
  c.base = ctRaise(c.baseBefore, rates.base);
  c.ability = ctRaise(c.abilityBefore, c.grade ? rates[c.grade] : 0);
}
function ctPerson(pid){ return CT_PEOPLE.find(p=>p.pid===pid); }
function ctActor(role){ return CT_PEOPLE.find(p=>p.key===role); }
function ctCanView(role, c){
  if(role==='hr') return true;
  const me = ctActor(role), p = ctPerson(c.pid);
  if(!me) return false;
  if(me.pid===p.pid) return c.status!=='DRAFT';   // 본인은 발송된 것부터
  return me.title==='본부장' && me.division===p.division && c.status!=='DRAFT';
}
function ctActive(list, pid){ return list.filter(c=>c.pid===pid && c.status!=='CANCELLED').sort((a,b)=>b.version-a.version)[0]; }
function ctAdjust(c, isHr, base, ability, reason, period){
  if(!isHr) return ['금액 조정은 HR만 할 수 있습니다.'];
  if(c.status!=='DRAFT') return ['발송한 계약서는 고칠 수 없습니다. 파기 후 재발송하세요.'];
  const errs = [];
  if(!(base>0) || !(ability>=0)) errs.push('기본급과 능력급을 올바르게 입력해 주세요.');
  if(!reason.trim() && !c.newHire) errs.push('조정 사유를 입력해 주세요.');
  if(period && !(period.start && period.end && period.start<period.end)) errs.push('계약 기간을 확인해 주세요.');
  if(errs.length) return errs;
  c.base = base; c.ability = ability; c.adjReason = reason.trim() || c.adjReason;
  if(period){ c.start = period.start; c.end = period.end; }
  return [];
}
function ctSend(c, isHr, today){
  if(!isHr) return '발송은 HR만 할 수 있습니다.';
  if(c.status!=='DRAFT') return '이미 발송된 계약서입니다.';
  c.status = 'SENT'; c.sentAt = today; return null;
}
function ctSign(c, actorPid, sig){   // sig = {consent, name, image, read}
  if(c.pid!==actorPid) return '본인 계약서만 서명할 수 있습니다.';
  if(c.status!=='SENT') return c.status==='SIGNED' ? '이미 서명한 계약서입니다.' : '서명할 수 있는 상태가 아닙니다.';
  const errs = [];
  if(!sig.read) errs.push('계약서 본문을 끝까지 읽어 주세요.');
  if(!sig.consent) errs.push('동의 체크를 해 주세요.');
  if(sig.name.trim()!==ctPerson(c.pid).name) errs.push('성명을 본인 이름과 똑같이 입력해 주세요.');
  if(!sig.image) errs.push('서명란에 서명해 주세요.');
  if(errs.length) return errs.join('\n');
  Object.assign(c, { status:'SIGNED', locked:true, signerName:sig.name.trim(), signature:sig.image, signedAt:sig.at });
  return null;
}
function ctCancel(c, isHr, reason, at){
  if(!isHr) return '파기는 HR만 할 수 있습니다.';
  if(!reason.trim()) return '파기 사유를 입력해 주세요.';
  if(c.status==='CANCELLED') return '이미 파기된 계약서입니다.';
  Object.assign(c, { status:'CANCELLED', cancelReason:reason.trim(), cancelledAt:at }); return null;
}
function ctResend(list, c, isHr, reason, at){   // 원본은 파기로 보존, 같은 조건의 새 버전을 발송
  const err = ctCancel(c, isHr, reason, at);
  if(err) return err;
  const n = { ...c, id:++ctSeq, version:c.version+1, resentFrom:c.id, status:'SENT', sentAt:at.slice(0,10), locked:false,
    signerName:null, signature:null, signedAt:null, hash:null, cancelReason:null, cancelledAt:null };
  list.push(n); return null;
}
function ctSelfCheck(){   // 브라우저 콘솔에서 ctSelfCheck() 실행
  const ok = (c,m)=>{ if(!c) throw new Error('ctSelfCheck 실패: '+m); };
  const s = ctCalc({ base:2418900, ability:1211000, pos:300000 });
  ok(s.annual===49535908 && s.monthly===4226417 && s.hourly===19768 && s.ot===296517, '양식 샘플 금액과 일치');
  ok(ctPeriod(new Date(2026,9,1)).end==='2028-02-29' && ctPeriod(new Date(2027,0,10)).start==='2027-03-01' && ctPeriod(new Date(2027,0,10)).end==='2028-02-29', '3/1 ~ 다음 해 2월 말일(윤년)');
  ok(ctNewHirePeriod('2026-09-14').end==='2027-02-28' && ctNewHirePeriod('2027-01-05').end==='2027-02-28', '신규 입사자 기간');
  ok(ctRaise(2418900,3)===2491500 && ctRaise(1211000,6)===1283700, '인상 후 100원 단위 반올림');
  const mk = o=>({ id:1, pid:1, version:1, status:'DRAFT', grade:'A', baseBefore:2418900, abilityBefore:1211000, base:0, ability:0, pos:0, adjReason:'', newHire:false, ...o });
  const a = mk({}); ctApplyRates(a, ctRates); ok(a.base===2491500 && a.ability===1283700, '인상률 적용');
  const adj = mk({ adjReason:'승진', base:1, ability:1 }); ctApplyRates(adj, ctRates); ok(adj.base===1, 'HR 조정분은 인상률로 덮어쓰지 않음');
  ok(ctAdjust(mk({}), false, 1, 1, 'x').length===1 && ctAdjust(mk({}), true, 1, 1, ' ').length===1 && ctAdjust(mk({status:'SENT'}), true, 1, 1, 'x').length===1, '조정: HR·사유·발송 전만');
  ok(!ctCanView('lead', mk({pid:1, status:'SENT'})) && ctCanView('head', mk({pid:1, status:'SENT'})) && !ctCanView('head', mk({pid:4, status:'SENT'})) && ctCanView('hr', mk({})) && !ctCanView('emp', mk({pid:1})), '열람 권한');
  const c = mk({}); ok(ctSend(c, false, 'd') && !ctSend(c, true, '2026-10-01') && c.status==='SENT', '발송은 HR만');
  const sig = { consent:true, name:'홍길동', image:'x', read:true, at:'t' };
  ok(ctSign(c, 2, sig) && c.status==='SENT', '남의 계약서 서명 불가');
  ok(ctSign(c, 1, {...sig, read:false}) && ctSign(c, 1, {...sig, consent:false}) && ctSign(c, 1, {...sig, name:'홍길'}) && ctSign(c, 1, {...sig, image:null}), '서명 조건 4가지');
  ok(!ctSign(c, 1, sig) && c.status==='SIGNED' && c.locked && ctSign(c, 1, sig), '서명 → 잠금, 재서명 불가');
  ok(ctCancel(c, false, '오류', 't') && ctCancel(c, true, ' ', 't') && c.status==='SIGNED', '파기: HR·사유 필수');
  const list = [c]; ok(!ctResend(list, c, true, '금액 오류', '2026-10-02 10:00') && list.length===2 && c.status==='CANCELLED' && list[1].status==='SENT' && list[1].version===2 && ctActive(list, 1)===list[1], '재발송: 원본 보존 + 새 버전');
  return 'ctSelfCheck 통과';
}

/* ----- 시연 데이터 ----- */
const ctContracts = [];
(function ctSeed(){
  const t = new Date(), per = ctPeriod(t), today = ctYmd(t);
  const mk = (pid, o)=>{ const c = { id:++ctSeq, pid, version:1, status:'DRAFT', grade:null, baseBefore:2418900, abilityBefore:1000000, base:0, ability:0, pos:0, site:0, qual:0,
    adjReason:'', newHire:false, start:per.start, end:per.end, sentAt:null, locked:false, signerName:null, signature:null, signedAt:null, hash:null, cancelReason:null, cancelledAt:null, resentFrom:null, ...o };
    ctApplyRates(c, ctRates); if(!c.base){ c.base = c.baseBefore; c.ability = c.abilityBefore; } ctContracts.push(c); return c; };
  mk(1, { grade:'A', abilityBefore:1211000 }).status = 'SENT';
  const lead = mk(2, { grade:'S', abilityBefore:1500000, pos:300000 });
  mk(3, { grade:'B', abilityBefore:1900000, pos:500000 });
  const hire = (orgMembers.find(m=>m.name==='신에스')||{}).hireDate || today;
  mk(4, { newHire:true, abilityBefore:1100000, ...ctNewHirePeriod(hire), adjReason:'신규 입사' });
  mk(5, { abilityBefore:1050000 });
  ctContracts.forEach(c=>{ if(c.status==='SENT') c.sentAt = today; });
  // 김영희 팀장: 서명 완료 예시 (손글씨 서명 그림을 코드로 그림)
  lead.status = 'SENT'; lead.sentAt = today;
  const cv = document.createElement('canvas'); cv.width = 240; cv.height = 80; const g = cv.getContext('2d');
  g.strokeStyle = '#1B2433'; g.lineWidth = 2.4; g.lineCap = 'round'; g.beginPath(); g.moveTo(20,55);
  [[40,20],[55,60],[75,25],[90,58],[120,30],[140,52],[170,28],[200,50],[220,40]].forEach(([x,y])=>g.lineTo(x,y)); g.stroke();
  ctSign(lead, 2, { consent:true, name:'김영희', image:cv.toDataURL(), read:true, at:today+' 09:12' });
  ctHash(lead);
})();
async function ctHash(c){   // 서명 시점 본문의 고유번호(SHA-256) — 나중에 본문이 바뀌었는지 확인하는 용도
  const text = ctDocHtml(c, true).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
  if(!(window.crypto && crypto.subtle)){ c.hash = '(이 브라우저에서는 계산 불가)'; return; }
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  c.hash = [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

let ctPadDirty = false;
function ctInitSign(){
  const sc = document.getElementById('ctScroll'), pad = document.getElementById('ctPad');
  if(!sc || !pad) return;
  const unlock = ()=>{ if(sc.scrollTop + sc.clientHeight < sc.scrollHeight - 8) return;
    ['ctConsent','ctName','ctClear','ctSubmit'].forEach(id=>document.getElementById(id).disabled = false);
    pad.classList.add('on'); document.getElementById('ctReadHint').textContent = '본문을 끝까지 확인했습니다. 동의하고 서명해 주세요.'; sc.dataset.read = '1'; };
  sc.addEventListener('scroll', unlock); unlock();
  const g = pad.getContext('2d'); g.lineWidth = 3; g.lineCap = 'round'; g.strokeStyle = '#1B2433'; ctPadDirty = false;
  let drawing = false;
  const pos = e=>{ const r = pad.getBoundingClientRect(); return [(e.clientX-r.left)*pad.width/r.width, (e.clientY-r.top)*pad.height/r.height]; };
  pad.addEventListener('pointerdown', e=>{ if(!sc.dataset.read) return; drawing = true; pad.setPointerCapture(e.pointerId); g.beginPath(); g.moveTo(...pos(e)); });
  pad.addEventListener('pointermove', e=>{ if(!drawing) return; g.lineTo(...pos(e)); g.stroke(); ctPadDirty = true; });
  ['pointerup','pointercancel'].forEach(t=>pad.addEventListener(t, ()=>{ drawing = false; }));
}
function ctPadClear(){ const pad = document.getElementById('ctPad'); pad.getContext('2d').clearRect(0,0,pad.width,pad.height); ctPadDirty = false; }

   - 급여일 = 매월 20일, 주말·공휴일이면 바로 앞 평일
   - 금액은 처음에 가리고, 눈 버튼을 누르면 보임

// ponytail: 공휴일 목록은 코드에 고정. 매년 HR이 확인해서 추가해야 한다 (급여일 앞뒤 날짜만 영향).

/* ----- 규칙 (순수 로직, paySelfCheck가 검증) ----- */
function payIsOff(d){ return d.getDay()===0 || d.getDay()===6 || PAY_HOLIDAYS.has(ctYmd(d)); }
function payDayOf(y, m){ const d = new Date(y, m, 20); while(payIsOff(d)) d.setDate(d.getDate()-1); return d; }   // m: 0~11
function payWindow(now){   // 지난 급여일(그날 0시) ~ 다음 급여일(그날 0시). 급여일 당일은 도착 상태
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  let next = payDayOf(now.getFullYear(), now.getMonth());
  if(next < today) next = payDayOf(now.getFullYear(), now.getMonth()+1);
  const prev = payDayOf(next.getFullYear(), next.getMonth()-1);
  return { prev, next, isPayday: +next===+today };
}
function payProgress(now, w){ if(w.isPayday) return 1; return Math.min(1, Math.max(0, (now - w.prev) / (w.next - w.prev))); }
function payRound10(x){ return Math.floor(x/10)*10; }   // 공제액은 10원 미만 절사
function paySlip(p, y, m){   // m: 귀속 월(0~11). 시연용 공제율 — 실제 값은 위하고 명세서를 그대로 쓴다
  const raise = (y>2026 || (y===2026 && m>=2)) ? 1 : 0.97;   // 3월분부터 새 연봉
  const pay = { '기본급':Math.round(p.base*raise), '능력급':Math.round(p.ability*raise), '고정연장근로수당':Math.round(p.ot*raise) };
  if(p.pos) pay['직책수당'] = p.pos;
  const gross = Object.values(pay).reduce((a,b)=>a+b, 0), taxable = gross - (p.pos||0);
  const health = payRound10(taxable*0.03545);
  const ded = { '국민연금':payRound10(taxable*0.045), '건강보험':health, '고용보험':payRound10(gross*0.009), '장기요양보험료':payRound10(health*0.1295), '소득세':payRound10(gross*0.068) };
  ded['지방소득세'] = payRound10(ded['소득세']*0.1);
  const deduct = Object.values(ded).reduce((a,b)=>a+b, 0);
  const hourly = Math.round((pay['기본급'] + pay['능력급'] + (p.pos||0) + pay['기본급']/12) / 209);
  return { y, m, label:`${y}년 ${String(m+1).padStart(2,'0')}월분`, payday:ctYmd(payDayOf(y, m+1)), pay, ded, gross, deduct, net:gross-deduct, hourly };
}
function payTarget(slips, w){   // 다음 급여일에 받을 명세서가 있으면 그 금액, 없으면 가장 최근 명세서 금액(예상)
  const due = slips.find(s=>s.payday===ctYmd(w.next));
  return due ? { amount:due.gross, estimate:false, slip:due } : { amount:slips.length ? slips[0].gross : 0, estimate:true, slip:slips[0] };
}
function payCanView(role, key){ return role==='hr' || role===key; }
function paySelfCheck(){   // 브라우저 콘솔에서 paySelfCheck() 실행
  const ok = (c,msg)=>{ if(!c) throw new Error('paySelfCheck 실패: '+msg); };
  ok(ctYmd(payDayOf(2026, 8))==='2026-09-18', '9/20(일) → 9/18(금)');
  ok(ctYmd(payDayOf(2026, 9))==='2026-10-20', '10/20(화) 그대로');
  ok(ctYmd(payDayOf(2026, 11))==='2026-12-18', '12/20(일) → 12/18(금)');
  ok(ctYmd(payDayOf(2027, 1))==='2027-02-19', '2027-02-20(토) → 2/19(금)');
  const w = payWindow(new Date(2026, 9, 1, 12));
  ok(ctYmd(w.prev)==='2026-09-18' && ctYmd(w.next)==='2026-10-20' && !w.isPayday, '10/1의 구간 = 9/18 ~ 10/20');
  const pd = payWindow(new Date(2026, 9, 20, 9));
  ok(pd.isPayday && payProgress(new Date(2026, 9, 20, 9), pd)===1, '급여일 당일은 전액');
  ok(ctYmd(payWindow(new Date(2026, 9, 21)).next)==='2026-11-20', '급여일 다음 날 새 구간');
  ok(payProgress(w.prev, w)===0 && Math.abs(payProgress(new Date((+w.prev + +w.next)/2), w)-0.5)<1e-9, '진행률 0 → 0.5');
  const s = paySlip(PAY_PEOPLE.emp, 2026, 7);
  ok(s.gross===Object.values(s.pay).reduce((a,b)=>a+b,0) && s.net===s.gross-s.deduct && s.payday==='2026-09-18', '명세서 합계·지급일');
  ok(payTarget([s], payWindow(new Date(2026, 8, 1))).estimate===false && payTarget([s], w).estimate===true, '명세서 없으면 예상 금액');
  ok(payCanView('emp','emp') && !payCanView('lead','emp') && payCanView('hr','head'), '본인과 HR만 열람');
  return 'paySelfCheck 통과';
}

/* ----- 시연 데이터: 지급일이 지난 최근 12개월 ----- */
function paySlipsFor(key){
  paySlips = paySlips || {};
  if(!paySlips[key]){
    const today = ctYmd(new Date()), list = [];
    for(let i=1; list.length<24 && i<27; i++){ const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()-i); const s = paySlip(PAY_PEOPLE[key], d.getFullYear(), d.getMonth()); if(s.payday<=today) list.push(s); }
    paySlips[key] = list;
  }
  return paySlips[key];
}

function whSummary(year, row){   // 지방소득세 = 소득세의 10% (원 단위 절사), 차감 = 결정 − 기납부 (음수면 환급)
  const [salary, bonus, decided, prepaid, deductions, prepaidLocalActual] = row;   // 6번째 = 실제 기납부 지방소득세(있으면 그 값)
  const local = n=>Math.floor(n/10);
  const prepaidLocal = prepaidLocalActual ?? local(prepaid);
  const gross = salary + bonus, t10 = x=>Math.trunc(x/10)*10;   // 차감징수세액은 10원 미만 절사
  const settle = t10(decided - prepaid) + t10(local(decided) - prepaidLocal);
  return { year, salary, bonus, gross, decided, prepaid, decidedLocal:local(decided), prepaidLocal, settle,
    refund: settle<0, rate: Math.round(decided/gross*1000)/10, deductions, settleMonth:`${year+1}년 2월분 급여` };
}

/* ---------------- 평가 진행 ----------------
   시연용: 전략마케팅본부 6명(가상)을 브라우저 메모리에서만 평가한다. 새로고침하면 초기화.
   규칙 (인사담당자 2026-10-01 결정 + 2026-08-24 설계 문서 §2·§5.1·§5.2)
   - 순서: ① 자기평가(직원) → ② 평가자 점수(팀장, 팀장은 본부장, 본부장은 HR) → ③ 본부장 등급 배정 → ④ HR 확정
   - 평가 항목은 목표설정(KPI) 확정본을 그대로 읽는다: 팀목표·개인목표·실행목표·측정식·가중치·S~D 달성 기준
   - 점수: KPI별 달성 등급(S110·A100·B90·C80·D70%) × 가중치 합 + 가점(사유 필수), 총점 상한 110
   - 등급 쿼터: 본부 인원 N≥5면 A·B·D 각 round_half_up(N×10%), C 나머지 / N≤4면 상위(A+B) 1명(N≥2), 하위 나머지
     S는 총점 100 초과만, S 상한 = A 정원(상위 정원), S가 K명이면 A(상위) 정원에서 K를 뺀다. 초과 = 제출 막힘, 미달 = 경고
   - 증빙자료: 목표설정이 아니라 여기서 KPI별로 올린다. 선택 사항. 올리고 고치기는 HR이 정한 증빙 마감일까지.
     열람은 본인·평가자·본부장·HR (같은 팀 동료는 못 봄)
   - 평가자 코멘트 필수, 본부장 코멘트 선택. 본부장 본인 등급은 HR이 배정 */
const EV_PCT = Object.fromEntries(KPI_GRADES);
const EV_STAGES = { SELF:'자기평가 중', SCORE:'평가자 점수 대기', GRADE:'본부장 등급 대기', HR:'HR 확정 대기', DONE:'확정' };
const EV_DIVISION = '전략마케팅본부';
let evOpen = null;   // 지금 펼친 평가 대상 pid
if(!kpiPeriod.evidDue) kpiPeriod.evidDue = kpiPeriod.evalTo;   // 증빙 마감일 (HR이 정함)

/* ----- 규칙 (순수 로직, evSelfCheck가 검증) ----- */
function evRoundHalfUp(x){ return Math.floor(x + 0.5 + 1e-9); }   // 0.5 → 1 (은행가 반올림 금지)
function evQuota(n){
  if(n <= 4){ const upper = n>=2 ? 1 : 0; return { mode:'GROUPED', upper, lower:n-upper, capS:upper }; }
  const q = evRoundHalfUp(n*0.1);
  return { mode:'INDIVIDUAL', A:q, B:q, D:q, C:n-3*q, capS:q };
}
function evScore(rows, bonus=0){   // rows: [{weight, grade}]
  const base = rows.reduce((a,r)=>a + (r.grade ? (+r.weight)*EV_PCT[r.grade]/100 : 0), 0);
  return Math.min(110, Math.round((base + (+bonus||0))*10)/10);
}
function evValidate(roster, assign, quota, full){   // roster:[{pid,name,score}], assign:{pid:grade}. full=false면 배정 누락·미달은 검사 안 함(본부장 단계)
  const errors = [], warnings = [], cnt = { S:0, A:0, B:0, C:0, D:0 };
  roster.forEach(r=>{
    const g = assign[r.pid];
    if(!g){ if(full) errors.push(`${r.name} 님의 등급이 없습니다.`); return; }
    cnt[g]++;
    if(g==='S' && r.kpi!==false && !(r.score > 100)) errors.push(`${r.name} 님은 총점 ${r.score}점이라 S를 줄 수 없습니다. (100점 초과만)`);   // 현장직은 총점이 없어 제외
    if(r.blocked && 'SAB'.includes(g)) errors.push(`${r.name} 님은 연차 초과 ${EV_LEAVE_LIMIT}일 이상이라 S·A·B를 줄 수 없습니다.`);
  });
  const K = cnt.S;
  if(K > quota.capS) errors.push(`S는 최대 ${quota.capS}명입니다. (현재 ${K}명)`);
  if(quota.mode==='INDIVIDUAL'){
    const qa = quota.A - K;
    if(cnt.A > qa) errors.push(`A는 ${qa}명까지입니다${K?` (S ${K}명만큼 줄어듦)`:''}. 현재 ${cnt.A}명`);
    if(cnt.B > quota.B) errors.push(`B는 ${quota.B}명까지입니다. 현재 ${cnt.B}명`);
    if(cnt.D > quota.D) errors.push(`D는 ${quota.D}명까지입니다. 현재 ${cnt.D}명`);
    if(full){ if(cnt.A < qa) warnings.push(`A가 정원보다 ${qa-cnt.A}명 적습니다.`); if(cnt.B < quota.B) warnings.push(`B가 정원보다 ${quota.B-cnt.B}명 적습니다.`); if(cnt.D < quota.D) warnings.push(`D가 정원보다 ${quota.D-cnt.D}명 적습니다.`); }
  } else {
    const up = quota.upper - K;
    if(cnt.A + cnt.B > up) errors.push(`A·B 합계는 ${up}명까지입니다. 현재 ${cnt.A+cnt.B}명`);
    if(full && cnt.A + cnt.B < up) warnings.push(`A·B가 정원보다 ${up-cnt.A-cnt.B}명 적습니다.`);
  }
  return { errors, warnings, cnt };
}

  if(role==='hr' || p.key===role) return true;
  const me = evPeople.find(x=>x.key===role);
  return !!me && (p.evaluator===me.pid || me.title==='본부장');
}
function evSelfCheck(){   // 브라우저 콘솔에서 evSelfCheck() 실행
  const ok = (c,m)=>{ if(!c) throw new Error('evSelfCheck 실패: '+m); };
  ok(evQuota(5).A===1 && evQuota(5).C===2, 'N=5 → A·B·D 1명 (0.5 반올림 = 1)');
  ok(evQuota(14).A===1 && evQuota(15).A===2 && evQuota(15).C===9, 'N=14 → 1, N=15 → 2');
  for(let n=0; n<60; n++){ const q = evQuota(n); ok((q.mode==='GROUPED' ? q.upper+q.lower : q.A+q.B+q.C+q.D)===n && (q.C===undefined || q.C>=0), '정원 합계 = N ('+n+')'); }
  ok(evQuota(4).upper===1 && evQuota(1).upper===0 && evQuota(4).mode==='GROUPED', 'N≤4 그룹 정원');
  const rows = [{weight:40,grade:'S'},{weight:30,grade:'A'},{weight:30,grade:'B'}];
  ok(evScore(rows)===101 && evScore(rows, 20)===110 && evScore([{weight:100,grade:null}])===0, '총점 = 가중치×비율 + 가점, 상한 110');
  const R = [1,2,3,4,5,6].map((pid,i)=>({ pid, name:'p'+pid, score:[101,99,96,92,88,80][i] })), q6 = evQuota(6);
  ok(!evValidate(R, {1:'S',3:'B',6:'D',2:'C',4:'C',5:'C'}, q6, true).errors.length, 'S 1명이면 A 0명으로 통과');
  ok(evValidate(R, {1:'S',2:'A'}, q6, false).errors.length===1, 'S가 있는데 A까지 주면 초과');
  ok(evValidate(R, {2:'S'}, q6, false).errors.some(e=>e.includes('100점')), '총점 100 이하 S 불가');
  ok(evValidate(R, {1:'S',2:'S'}, q6, false).errors.some(e=>e.includes('최대')), 'S 상한');
  const part = evValidate(R, {2:'A'}, q6, false); ok(!part.errors.length && !part.warnings.length, '본부장 단계는 누락·미달을 막지 않음');
  const w = evValidate(R, {1:'C',2:'C',3:'C',4:'C',5:'C',6:'C'}, q6, true); ok(!w.errors.length && w.warnings.length===3, '미달은 경고만');
  ok(evValidate(R, {1:'A'}, q6, true).errors.some(e=>e.includes('등급이 없')), 'HR 확정은 누락 막음');
  ok(evValidate(R.slice(0,3), {2:'A',3:'B'}, evQuota(3), false).errors.length===1, 'N≤4는 A·B 합계로 검사');
  // KPI 연동: 홍길동 평가 항목 = 목표설정 확정본(측정식·S~D 기준 포함)
  const hong = evFind(1), kpi = kpiSheets.emp.confirmed.flatMap(g=>g.items);
  ok(evKpi(hong).length===kpi.length && evKpi(hong).every((k,i)=>k.action===kpi[i].action && k.formula===kpi[i].formula && k.S===kpi[i].S), '평가 항목 = 확정 KPI');
  // 증빙 열람·업로드 권한
  const save = kpiPeriod.evidDue, from = kpiPeriod.evalFrom;
  kpiPeriod.evalFrom = '2026-12-01'; kpiPeriod.evidDue = '2026-12-10';
  ok(evCanUpload(hong,'emp','2026-12-10') && !evCanUpload(hong,'emp','2026-12-11') && !evCanUpload(hong,'lead','2026-12-05') && !evCanUpload(hong,'emp','2026-11-30'), '증빙 업로드: 본인만, 평가 시작 ~ 증빙 마감일');
  kpiPeriod.evidDue = save; kpiPeriod.evalFrom = from;
  ok(evCanSeeEvidence(hong,'emp') && evCanSeeEvidence(hong,'lead') && evCanSeeEvidence(hong,'head') && evCanSeeEvidence(hong,'hr'), '증빙 열람: 본인·평가자·본부장·HR');
  ok(!evCanSeeEvidence(evFind(6),'lead'), '다른 팀 평가자는 못 봄');
  return 'evSelfCheck 통과';
}

    ${p.headComment || p.bonusReason ? `<div class="list-sub" style="margin-top:6px;">${p.bonus?`가점 +${p.bonus} (${escapeHtml(p.bonusReason)}) · `:''}${p.headComment?`본부장 코멘트: ${escapeHtml(p.headComment)}`:''}</div>` : ''}
    ${editable ? `<div style="text-align:right; margin-top:10px;"><button class="btn primary" onclick="evSubmitScore(${p.pid})">점수 제출</button></div>` : ''}
  </div>`;
}
function evMyTargets(){

function evGradeCard(hrMode){   // 본부장: 본인 제외 배정 / HR: 본부장 포함 전체 확정
  const quota = evQuota(evPeople.length), roster = evRoster();

      : (p.grade ? `<b class="ev-final">${p.grade}</b>` : '<span class="list-sub" style="margin:0;">점수 대기</span>');
    return `<tr><td>${escapeHtml(p.name)} ${escapeHtml(p.title)}<div class="list-sub">${escapeHtml(p.team||'본부 직속')} · ${evIsLine(p) ? `현장직 · ${evAttendance(p)}` : `증빙 ${evFileCount(p)}건`}</div></td><td>${evStageBadge(p)}</td>
      <td class="num">${evIsLine(p) ? '<span class="list-sub" style="margin:0;">팀장 평가</span>' : evTotal(p).toFixed(1)}${p.bonus?`<div class="list-sub">가점 +${p.bonus}</div>`:''}</td><td>${gradeCell}</td>
      <td style="white-space:nowrap;">${p.stage!=='SELF' ? `<button class="btn sm" onclick="evOpen=${open?'null':`'g${p.pid}'`}; kpiFlash(null)">${open?'닫기':'상세'}</button> ` : ''}${can && !hrMode ? `<button class="btn sm" onclick="evBonus(${p.pid})">가점·코멘트</button>` : ''}</td></tr>
      ${open ? `<tr><td colspan="5" style="padding:0;">${evIsLine(p) ? evLinePanel(p) : evScorePanel(p)}</td></tr>` : ''}`;

/* ----- 동작 ----- */
function evSetSelf(pid, i, g){ evEntry(evFind(pid), i).selfGrade = g; kpiFlash(null); }

const evFileStore = {};   // 시연: 올린 파일은 이 화면이 열려 있는 동안만 내려받을 수 있다 (서버 저장은 로그인 이후)
function evAddFiles(pid, i, files){
  const p = evFind(pid);
  if(!evCanUpload(p, kpiRole, kpiDay(0))) return kpiFlash('증빙 마감일이 지났거나 올릴 권한이 없습니다.', 'danger');

}

}

  p.stage = 'SCORE'; kpiFlash(`자기평가를 제출했습니다. ${escapeHtml(evEvaluatorName(p))} 평가를 기다립니다. 증빙은 ${kpiPeriod.evidDue}까지 더 올릴 수 있습니다.`);
}

}

    <div class="list-sub" style="margin-bottom:10px;">현재 총점 ${evScore(evRows(p)).toFixed(1)}점 · 가점을 더해도 110점을 넘지 않습니다.</div>

function evSaveBonus(pid){

function evContent(){

/* ---------------- 현장직 (KPI 없는 직원) 평가 ----------------
   규칙 (인사담당자 2026-10-01): HR이 명단에서 "KPI 작성" 체크를 해제한 사람 = 현장직. 문항지 없음.
   팀장이 사람마다 S~D를 매기고 → 본부장 등급 배정 → HR 확정 (KPI 직원과 같은 흐름·같은 본부 정원).
   HR이 연말에 지각 횟수·연차 초과일수를 넣는다. 지각은 참고만, 연차 초과 5일 이상이면 S·A·B 불가. 이의 신청은 KPI 직원과 같다. */
const EV_LEAVE_LIMIT = 5;
function evIsLine(p){ return p.kpi===false; }
function evLeaveBlocked(p){ return evIsLine(p) && p.leaveOver >= EV_LEAVE_LIMIT; }
function evSetKpi(p, on){   // KPI 작성 여부는 평가 시작 전(자기평가 중 / 팀장 평가 대기)에만 바꾼다
  if(!(p.stage==='SELF' || (evIsLine(p) && p.stage==='SCORE'))) return '평가가 이미 진행 중이라 평가 방식을 바꿀 수 없습니다.';
  p.kpi = on; p.stage = on ? 'SELF' : 'SCORE'; if(!on) p.grade = null; return null;
}
function evSetAttendance(p, late, over){
  p.late = Math.max(0, Math.round(+late||0)); p.leaveOver = Math.max(0, Math.round((+over||0)*2)/2);
  if(evLeaveBlocked(p) && 'SAB'.includes(p.grade)) p.grade = null;   // 이미 매긴 S·A·B는 지운다
}
function evParseAttendance(text){   // 엑셀에서 복사한 "이름 ⇥ 지각 ⇥ 연차초과" 줄. 숫자가 아닌 줄(제목)은 건너뛴다
  const done = [], miss = [];
  text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach(l=>{
    const [name, late, over] = l.split(/\t|,|\s+/);
    if(late===undefined || over===undefined || isNaN(+late) || isNaN(+over)) return;
    const p = evPeople.find(x=>x.name===name && evIsLine(x));
    if(!p) return miss.push(name);
    evSetAttendance(p, late, over); done.push(name);
  });
  return { done, miss };
}
function evLineSelfCheck(){   // 브라우저 콘솔에서 evLineSelfCheck() 실행
  const ok = (c,m)=>{ if(!c) throw new Error('evLineSelfCheck 실패: '+m); };
  const R = Array.from({length:10}, (_,i)=>({ pid:i+1, name:'p'+(i+1), score:i<2?0:95, kpi:i>=2, blocked:i===0 })), q = evQuota(10);
  ok(evValidate(R, {1:'A'}, q, false).errors.some(e=>e.includes('연차')) && evValidate(R, {1:'S'}, q, false).errors.some(e=>e.includes('연차')), '연차 초과 5일 이상 → S·A 불가');
  ok(!evValidate(R, {1:'C'}, q, false).errors.length, '연차 초과자도 C는 가능');
  ok(!evValidate(R, {2:'S'}, q, false).errors.length, '현장직 S는 총점(100 초과) 규칙 없음');
  ok(evValidate(R, {3:'S'}, q, false).errors.some(e=>e.includes('100점')), 'KPI 직원 S는 100점 초과만');
  const line = evPeople.filter(evIsLine), keep = line.map(p=>({ p, k:{ late:p.late, leaveOver:p.leaveOver, grade:p.grade, kpi:p.kpi, stage:p.stage } }));
  try {
    const [a, b] = line; b.grade = 'A';
    const r = evParseAttendance(`이름\t지각\t연차초과\n${a.name}\t2\t0\n${b.name}\t1\t6\n없는사람\t1\t1`);
    ok(r.done.length===2 && r.miss.join()==='없는사람' && a.late===2 && b.leaveOver===6, '엑셀 붙여넣기: 제목 줄 건너뛰고 이름으로 반영');
    ok(b.grade===null, '연차 초과 5일 이상이 되면 매긴 A를 지움');
    ok(evLeaveBlocked(b) && !evLeaveBlocked(a), '5일 기준');
    b.stage = 'GRADE'; ok(evSetKpi(b, true), '진행 중엔 평가 방식 변경 불가');
    b.stage = 'SCORE'; ok(!evSetKpi(b, true) && b.stage==='SELF' && !evIsLine(b), 'KPI 작성으로 바꾸면 자기평가부터');
  } finally { keep.forEach(({p,k})=>Object.assign(p, k)); }
  return 'evLineSelfCheck 통과';
}

/* ----- 화면 ----- */
function evAttendance(p){
  return `지각 ${p.late}회 <small>(참고)</small> · 연차 초과 ${p.leaveOver}일${evLeaveBlocked(p) ? ` <b class="evl-warn">→ S·A·B 불가</b>` : ''}`;
}
function evLineGradeBtns(p, editable, fn){   // fn = 누르면 부를 함수 이름
  return `<span class="ev-grades" role="radiogroup">${KPI_GRADES.map(([g])=>{ const no = evLeaveBlocked(p) && 'SAB'.includes(g);
    return `<button type="button" class="ev-g${p.grade===g?' on':''}${no?' no':''}" ${editable && !no ? `onclick="${fn}(${p.pid},'${g}')"` : 'disabled'} aria-pressed="${p.grade===g}"${no?' title="연차 초과 5일 이상이라 줄 수 없습니다"':''}>${g}</button>`; }).join('')}</span>`;
}
function evLinePanel(p){

/* ---------------- 평가 결과 ----------------
   규칙 (인사담당자 2026-10-01): HR이 "결과 공개"를 눌러야 직원에게 보인다 · 공개일부터 7일 안에 이의 신청 1회
   · HR이 답변하고 등급 유지/변경 (변경하면 정원 다시 검사) · 이의 처리 중이면 연봉계약서 능력급 반영 대기 · 지난 연도는 연도 버튼 */
const evRelease = { at:null };   // 결과 공개일 (HR)
const EV_APPEAL_DAYS = 7;
const EV_HISTORY = {   // 시연용 지난 결과 (가상 값): [최종 등급, 평가자 코멘트, 본부장 코멘트, [[실행목표, 가중치, 자기평가, 최종]]]
  emp:  { 2025:['B', '거래처 발굴 성과가 좋았습니다. 회신 속도를 더 끌어올려 봅시다.', '', [['병원 신규 거래처 발굴',40,'A','A'],['견적 회신 시간 단축',30,'A','B'],['고객 만족도 개선',30,'B','B']]],
          2024:['C', '첫해 적응을 잘했습니다.', '', [['담당 지역 거래처 관리',40,'B','B'],['견적 회신 시간 단축',30,'B','C'],['제품 교육 이수',30,'B','C']]] },
  lead: { 2025:['A', '팀 목표를 안정적으로 달성했습니다.', '대리점 채널이 크게 늘었습니다.', [['신규 대리점 발굴',40,'S','S'],['팀 매출 목표 달성',40,'A','A'],['팀원 1:1 면담',20,'A','A']]] },
  line: { 2025:['B', '출하 라인에서 성실하게 근무했습니다.', '', []] },   // 현장직: 실행목표 없음
  head: { 2025:['A', '본부 매출 목표를 달성했습니다.', '', [['본부 매출 달성',50,'A','A'],['해외 신규 시장 진출',30,'A','B'],['핵심 인재 유지율',20,'A','A']]] },
};
let evResYear = null, evResView = null;   // 보고 있는 연도 / 펼친 사람(pid)

/* ----- 규칙 (순수 로직, evrSelfCheck가 검증) ----- */
function evAddDays(ymd, n){ const [y,m,d] = ymd.split('-').map(Number); return ctYmd(new Date(y, m-1, d+n)); }
function evAppealDue(){ return evRelease.at ? evAddDays(evRelease.at, EV_APPEAL_DAYS) : null; }
function evReleased(p){ return !!evRelease.at && p.stage==='DONE'; }
function evCanAppeal(p, role, today){ return evReleased(p) && !!role && p.key===role && !p.appeal && today<=evAppealDue(); }
function evFinalGrade(p){ return !evReleased(p) ? null : p.appeal && p.appeal.status==='OPEN' ? 'WAIT' : p.grade; }   // 연봉계약서로 넘기는 등급 (WAIT = 이의 처리 대기)
function evAppeal(p, role, reason, today){
  if(!evCanAppeal(p, role, today)) return '이의 신청 기간이 아니거나 이미 신청했습니다.';
  if(!reason.trim()) return '이의 신청 사유를 적어 주세요.';
  p.appeal = { reason:reason.trim(), at:today, status:'OPEN', answer:'', before:p.grade, after:null }; return null;
}
function evAnswer(p, isHr, grade, answer){
  if(!isHr) return 'HR만 답변할 수 있습니다.';
  if(!p.appeal || p.appeal.status!=='OPEN') return '답변할 이의 신청이 없습니다.';
  if(!answer.trim()) return '답변을 적어 주세요.';
  if(grade!==p.grade){   // 바꾸면 본부 정원을 다시 검사 (미달은 경고라 막지 않음)
    const v = evValidate(evRoster(), Object.fromEntries(evPeople.map(x=>[x.pid, x===p ? grade : x.grade])), evQuota(evPeople.length), true);
    if(v.errors.length) return v.errors.join('\n');
  }
  Object.assign(p.appeal, { status:'DONE', answer:answer.trim(), after:grade }); p.grade = grade; return null;
}
function evSyncContracts(){   // 공개된 확정 등급 → 작성 중인 연봉계약서 능력급. 계약서와 평가 인원은 시연 역할(key)로 잇는다
  ctContracts.forEach(c=>{
    const k = ctPerson(c.pid).key, p = k && evPeople.find(x=>x.key===k), g = p && evFinalGrade(p);
    if(!g || c.status!=='DRAFT' || c.newHire) return;
    c.gradeWait = g==='WAIT'; c.grade = c.gradeWait ? null : g; ctApplyRates(c, ctRates);
  });
}
function evDemoFillData(){   // 시연: 모든 단계를 끝낸 확정 상태 (8명 정원 = A·B·D 1명, C 5명)
  const fin = { 1:'A', 2:'C', 3:'C', 4:'D', 5:'B', 6:'C', 7:'C', 8:'C' };
  evPeople.forEach(p=>{
    evKpi(p).forEach((_,i)=>{ const e = evEntry(p,i); e.grade = fin[p.pid]; e.selfGrade = e.selfGrade || (i===1 ? 'S' : fin[p.pid]); e.note = e.note || '시연 실적'; });
    p.comment = p.comment || '목표를 성실히 수행했습니다. 내년에는 한 단계 더 도전해 봅시다.'; p.grade = fin[p.pid]; p.stage = 'DONE';
  });
}
function evResultNow(p){ return { year:KPI_YEAR, grade:p.grade, comment:p.comment, head:p.headComment, bonus:p.bonus, bonusReason:p.bonusReason,
  rows:evKpi(p).map((k,i)=>({ action:k.action, weight:k.weight, self:evEntry(p,i).selfGrade, grade:evEntry(p,i).grade })) }; }
function evResultPast(key, y){
  const h = EV_HISTORY[key] && EV_HISTORY[key][y]; if(!h) return null;
  const [grade, comment, head, rows] = h;
  return { year:y, grade, comment, head, bonus:0, rows:rows.map(([action, weight, self, g])=>({ action, weight, self, grade:g })) };
}
function evrSelfCheck(){   // 브라우저 콘솔에서 evrSelfCheck() 실행 (시연 상태는 끝나면 되돌린다)
  const ok = (c,m)=>{ if(!c) throw new Error('evrSelfCheck 실패: '+m); };
  const snap = { at:evRelease.at, people:evPeople.map(p=>({ p, keep:kpiClone({ stage:p.stage, grade:p.grade, appeal:p.appeal||null, comment:p.comment, ev:p.ev }) })),
    ct:ctContracts.map(c=>({ c, keep:{ grade:c.grade, gradeWait:c.gradeWait, base:c.base, ability:c.ability } })) };
  try {
    ok(evAddDays('2027-01-15',7)==='2027-01-22' && evAddDays('2027-02-25',7)==='2027-03-04', '7일 뒤 (월말 넘김)');
    const hong = evFind(1), park = evFind(4), lee = evFind(3);
    evRelease.at = null; evDemoFillData();
    ok(evFinalGrade(hong)===null && !evCanAppeal(hong,'emp','2027-01-16'), '공개 전엔 결과·이의 신청 없음');
    ok(!evValidate(evRoster(), Object.fromEntries(evPeople.map(p=>[p.pid,p.grade])), evQuota(evPeople.length), true).errors.length, '시연 확정 등급은 정원 규칙 통과');
    evRelease.at = '2027-01-15';
    ok(evCanAppeal(hong,'emp','2027-01-22') && !evCanAppeal(hong,'emp','2027-01-23') && !evCanAppeal(hong,'lead','2027-01-20'), '이의 신청: 본인만, 공개일부터 7일');
    ok(evAppeal(hong,'emp',' ','2027-01-16') && !hong.appeal, '사유 필수');
    ok(!evAppeal(hong,'emp','실적 누락','2027-01-16') && hong.appeal.status==='OPEN' && evFinalGrade(hong)==='WAIT', '신청 → 처리 대기');
    ok(evAppeal(hong,'emp','또','2027-01-17'), '이의 신청은 1회');
    ok(evAnswer(hong,false,'A','x') && evAnswer(hong,true,'A',' '), '답변: HR만, 내용 필수');
    ok(evAnswer(hong,true,'B','검토 결과 상향') && hong.grade==='A', 'B 정원이 차 있으면 변경 불가');
    ok(!evAnswer(hong,true,'A','검토 결과 유지') && hong.appeal.status==='DONE' && evFinalGrade(hong)==='A', '유지 → 확정');
    park.appeal = null; evAppeal(park, null, '', '2027-01-16');   // key 없는 시연 인원은 본인 신청 불가
    ok(!park.appeal, '시연 인원은 직접 신청 못 함');
    park.appeal = { reason:'x', at:'2027-01-16', status:'OPEN', answer:'', before:'D', after:null };
    ok(!evAnswer(park,true,'C','상담 실적 반영') && park.grade==='C', 'D → C 변경은 미달 경고만이라 통과');
    const lc = ctContracts.find(c=>ctPerson(c.pid).key==='head');
    evSyncContracts(); ok(lc.grade==='C' && lc.ability===ctRaise(lc.abilityBefore, ctRates.C), '공개 등급 → 계약서 능력급');
    evAppeal(lee,'head','재검토 요청','2027-01-16'); evSyncContracts();
    ok(lc.gradeWait && lc.grade===null && lc.ability===lc.abilityBefore, '이의 처리 중이면 계약서 대기');
    const r = evResultPast('emp', 2025); ok(r.grade==='B' && evScore(r.rows)===94, '지난 결과 점수 = 가중치 × 등급 비율');
  } finally {
    evRelease.at = snap.at;
    snap.people.forEach(({p, keep})=>Object.assign(p, keep));
    snap.ct.forEach(({c, keep})=>Object.assign(c, keep));
  }
  return 'evrSelfCheck 통과';
}

/* ----- 화면 ----- */
function evrGrade(g){ return `<span class="evr-g${g==='C'||g==='D'?' low':''}">${g||'—'}</span>`; }
function evDaysLeft(due){ return Math.round((Date.parse(due) - Date.parse(kpiDay(0)))/864e5); }
function evResultCard(p, r, past){
  const fg = past ? r.grade : evFinalGrade(p), wait = fg==='WAIT';
  const score = evScore(r.rows, r.bonus), self = evScore(r.rows.map(x=>({ weight:x.weight, grade:x.self })));
  const diff = Math.round((score-self)*10)/10, line = !r.rows.length;   // 실행목표가 없으면 현장직(팀장 평가)
  const rows = r.rows.map(x=>`<tr><td>${escapeHtml(x.action)}</td><td class="num">${x.weight}%</td><td>${x.self||'—'}</td><td>${evrGrade(x.grade)}</td><td class="num">${x.grade?((+x.weight)*EV_PCT[x.grade]/100).toFixed(1):'—'}</td></tr>`).join('');
  const changed = !past && p.appeal && p.appeal.status==='DONE' && p.appeal.before!==p.appeal.after ? ` · 이의 신청으로 ${p.appeal.before} → ${p.appeal.after}` : '';
  const note = past ? `${r.year}년 확정 결과` : `공개일 ${evRelease.at}${changed} · 이 등급이 ${ctPeriod(new Date()).year}년 3월 연봉계약서 능력급에 반영됩니다${wait?' (이의 처리 후)':''}`;
  return `<section class="evr-hero" aria-label="${r.year}년 최종 등급">
      <div><div class="evr-grade${wait?' wait':''}">${wait ? '처리 중' : r.grade}</div><div class="evr-cap">${wait ? '이의 신청 처리 중' : '최종 등급'}</div></div>
      <div class="evr-tiles">
        ${line ? `<div class="evr-tile"><small>평가 방식</small><b>팀장 평가</b></div><div class="evr-tile"><small>근태</small><b class="evr-att">지각 ${past?'—':p.late+'회'} · 연차 초과 ${past?'—':p.leaveOver+'일'}</b></div>`
          : `<div class="evr-tile"><small>총점</small><b>${score.toFixed(1)}점</b></div><div class="evr-tile"><small>자기평가 대비</small><b>${diff===0 ? '같음' : (diff>0?'+':'')+diff+'점'}</b></div>`}
        <div class="evr-tile"><small>능력급 인상률</small><b>${past ? '—' : wait ? '대기' : '+'+ctRates[fg]+'%'}</b></div>
        <div class="evr-note">${note}</div>
      </div>
    </section>
    ${line ? '' : `<div class="ct-tbl" style="margin-top:12px;"><table><thead><tr><th>실행목표</th><th class="num">가중치</th><th>자기평가</th><th>최종</th><th class="num">점수</th></tr></thead>
      <tbody>${rows}${r.bonus?`<tr><td colspan="4">가점 (${escapeHtml(r.bonusReason||'')})</td><td class="num">+${r.bonus}</td></tr>`:''}</tbody></table></div>`}
    <div class="evr-comments">
      <div class="evr-comment"><small>${line?'팀장':'평가자'}${past?'':' '+escapeHtml(evEvaluatorName(p))}</small>${escapeHtml(r.comment)||'—'}</div>
      ${r.head ? `<div class="evr-comment"><small>본부장</small>${escapeHtml(r.head)}</div>` : ''}
    </div>`;
}
function evAppealBox(p, own){
  const a = p.appeal, due = evAppealDue();
  if(a) return `<div class="evr-appeal"><b>이의 신청</b> · ${a.at} · ${a.status==='OPEN' ? '<span class="badge warning">HR 답변 대기</span>' : `<span class="badge success">답변 완료 · ${a.before===a.after?'등급 유지':`${a.before} → ${a.after}`}</span>`}
      <div class="list-sub">사유: ${escapeHtml(a.reason)}</div>${a.answer ? `<div style="margin-top:6px;"><b>HR 답변</b> ${escapeHtml(a.answer)}</div>` : ''}</div>`;
  if(!own) return '';
  if(!evCanAppeal(p, kpiRole, kpiDay(0))) return `<div class="evr-appeal"><span class="list-sub" style="margin:0;">이의 신청 기간(${due}까지)이 끝났습니다.</span></div>`;
  return `<div class="evr-appeal">
      <div style="margin-bottom:8px;"><b class="d">이의 신청 D-${evDaysLeft(due)}</b> · ${due}까지 · 결과에 동의하지 않으면 사유를 적어 HR에 보냅니다. 한 번만 신청할 수 있습니다.</div>
      <div class="field"><label for="evAp">이의 신청 사유</label><textarea id="evAp" rows="3" placeholder="어떤 KPI의 어떤 실적이 빠졌거나 다르게 평가됐는지 적어 주세요"></textarea></div>
      <div style="text-align:right; margin-top:8px;"><button class="btn primary" onclick="evAppealSubmit(${p.pid})">이의 신청하기</button></div>
    </div>`;
}
function evMyResult(me){
  const years = [KPI_YEAR, ...Object.keys(EV_HISTORY[me.key]||{}).map(Number).sort((a,b)=>b-a)];
  if(!years.includes(evResYear)) evResYear = KPI_YEAR;
  const btns = years.map(y=>`<button type="button" class="pay-year${y===evResYear?' on':''}" onclick="evResYear=${y}; renderContent()" aria-pressed="${y===evResYear}">${y}년</button>`).join('');
  const body = evResYear!==KPI_YEAR ? evResultCard(me, evResultPast(me.key, evResYear), true)
    : evReleased(me) ? evResultCard(me, evResultNow(me), false) + evAppealBox(me, true)
    : `<div class="placeholder-note" style="margin:0;">${KPI_YEAR}년 결과는 아직 공개 전입니다. HR이 공개하면 여기에 보입니다. (지금 단계: ${EV_STAGES[me.stage]})</div>`;
  return `<div class="card" style="margin-bottom:14px;"><div class="card-title"><span>나의 평가 결과</span><span class="pay-years" role="group" aria-label="연도 선택">${btns}</span></div>${body}</div>`;
}
function evPersonRows(list, hr){
  return list.map(p=>{ const open = evResView===p.pid, a = p.appeal;
    return `<tr><td>${escapeHtml(p.name)} ${escapeHtml(p.title)}<div class="list-sub">${escapeHtml(p.team||'본부 직속')}</div></td><td>${evReleased(p)||hr ? evrGrade(p.grade) : '—'}</td><td class="num">${evIsLine(p) ? '—' : evTotal(p).toFixed(1)}</td>
      <td>${a ? (a.status==='OPEN' ? '<span class="badge warning">이의 처리 중</span>' : '<span class="badge success">이의 답변 완료</span>') : '—'}</td>
      <td><button class="btn sm" onclick="evResView=${open?'null':p.pid}; kpiFlash(null)">${open?'닫기':'보기'}</button></td></tr>
      ${open ? `<tr><td colspan="5"><div class="ev-panel">${evResultCard(p, evResultNow(p), false)}${evAppealBox(p, false)}</div></td></tr>` : ''}`; }).join('');
}
function evTeamResults(me){
  const list = me.title==='본부장' ? evPeople.filter(p=>p!==me) : evPeople.filter(p=>p.evaluator===me.pid);
  if(!list.length) return '';
  const body = evRelease.at ? `<div class="ct-tbl"><table><thead><tr><th>이름</th><th>최종 등급</th><th class="num">총점</th><th>이의 신청</th><th></th></tr></thead><tbody>${evPersonRows(list, false)}</tbody></table></div>`
    : '<div class="placeholder-note" style="margin:0;">HR이 결과를 공개하면 볼 수 있습니다.</div>';
  return `<div class="card" style="margin-bottom:14px;"><div class="card-title"><span>${me.title==='본부장'?'본부':'팀원'} 평가 결과 <span class="more">${list.length}명</span></span></div>${body}</div>`;
}
function evResHrPanel(){
  const done = evPeople.filter(p=>p.stage==='DONE').length, appeals = evPeople.filter(p=>p.appeal), open = appeals.filter(p=>p.appeal.status==='OPEN');
  const toCt = evPeople.filter(p=>{ const g = evFinalGrade(p); return g && g!=='WAIT'; }).length;
  const stat = (l, v, warn)=>`<div class="evr-stat"><small>${l}</small><b${warn?' class="warn"':''}>${v}</b></div>`;
  const head = evRelease.at
    ? `<span class="list-sub" style="margin:0;">공개일 <b>${evRelease.at}</b> · 이의 신청 마감 <b>${evAppealDue()}</b></span>`
    : `<span style="display:flex; gap:8px; flex-wrap:wrap;">${done<evPeople.length ? `<button class="btn sm" onclick="evDemoFill()">시연: 확정 상태로 채우기</button>` : ''}<button class="btn primary" onclick="evPublish()">전 직원에게 결과 공개</button></span>`;
  const answerForm = p=>`<div class="ev-panel" style="margin-top:8px;">
      <div><b>${escapeHtml(p.name)} ${escapeHtml(p.title)}</b> · 현재 ${evrGrade(p.grade)} · 신청 ${p.appeal.at}</div>
      <div class="list-sub">"${escapeHtml(p.appeal.reason)}"</div>
      <div class="field-row" style="margin-top:8px;">
        <div class="field" style="max-width:200px;"><label for="evAnsG${p.pid}">최종 등급 (그대로 두면 유지)</label><select id="evAnsG${p.pid}">${KPI_GRADES.map(([g])=>`<option ${g===p.grade?'selected':''}>${g}</option>`).join('')}</select></div>
        <div class="field"><label for="evAnsT${p.pid}">답변 (직원에게 공개)</label><textarea id="evAnsT${p.pid}" rows="2" placeholder="검토한 내용과 결론"></textarea></div>
      </div>
      <div style="text-align:right;"><button class="btn primary sm" onclick="evAnswerSubmit(${p.pid})">답변 보내기</button></div>
    </div>`;
  return `<div class="card" style="margin-bottom:14px;">
      <div class="card-title"><span>결과 공개 · 이의 신청 (HR)</span>${head}</div>
      <div class="evr-stats">${stat('확정', `${done}/${evPeople.length}명`)}${stat('이의 신청', appeals.length+'건')}${stat('답변 대기', open.length+'건', open.length>0)}${stat('계약서 반영 가능', toCt+'명')}</div>
      ${!evRelease.at ? `<div class="list-sub">평가 진행 탭에서 HR 확정을 끝낸 뒤 공개합니다. 공개하면 모두 같은 날 결과를 보고, 그날부터 ${EV_APPEAL_DAYS}일 동안 이의 신청을 받습니다.</div>` : ''}
      ${open.map(answerForm).join('')}
    </div>
    <div class="card" style="margin-bottom:14px;"><div class="card-title"><span>전체 결과 <span class="more">${EV_DIVISION} ${evPeople.length}명</span></span></div>
      <div class="ct-tbl"><table><thead><tr><th>이름</th><th>최종 등급</th><th class="num">총점</th><th>이의 신청</th><th></th></tr></thead><tbody>${evPersonRows(evPeople, true)}</tbody></table></div></div>`;
}

/* ----- 동작 ----- */
function evDemoFill(){ evDemoFillData(); kpiFlash(`시연용으로 ${evPeople.length}명 모두 HR 확정까지 끝난 상태로 채웠습니다. 이제 "전 직원에게 결과 공개"를 누르세요.`); }
function evPublish(){
  if(!orgIsHr()) return;
  if(evPeople.some(p=>p.stage!=='DONE')) return kpiFlash('아직 확정되지 않은 사람이 있습니다. 평가 진행 탭에서 HR 확정을 먼저 끝내 주세요.', 'danger');
  if(!confirm(`평가 결과를 전 직원에게 공개할까요? 오늘부터 ${EV_APPEAL_DAYS}일 동안 이의 신청을 받습니다.`)) return;
  evRelease.at = kpiDay(0);
  const park = evFind(4);   // 시연: 이의 신청 예시 1건 (박영업은 시연 역할이 없어 직접 신청할 수 없다)
  if(!park.appeal) park.appeal = { reason:'하반기 원격 상담 실적이 방문 횟수에 빠졌습니다. 상담일지를 첨부합니다.', at:kpiDay(0), status:'OPEN', answer:'', before:park.grade, after:null };
  evSyncContracts();
  kpiFlash('결과를 공개했습니다. 확정 등급은 작성 중인 연봉계약서 능력급에 반영됐고, 이의 신청 중인 사람은 처리 후 반영됩니다.');
}
function evAppealSubmit(pid){
  const err = evAppeal(evFind(pid), kpiRole, document.getElementById('evAp').value, kpiDay(0));
  if(err) return kpiFlash(escapeHtml(err), 'danger');
  evSyncContracts(); kpiFlash('이의 신청을 보냈습니다. HR 답변이 오면 이 화면에서 볼 수 있습니다.');
}
function evAnswerSubmit(pid){
  const p = evFind(pid), err = evAnswer(p, orgIsHr(), document.getElementById('evAnsG'+pid).value, document.getElementById('evAnsT'+pid).value);
  if(err) return kpiFlash(escapeHtml(err).replace(/\n/g,'<br>'), 'danger');
  evSyncContracts(); kpiFlash(`${escapeHtml(p.name)} 님에게 답변을 보냈습니다. 최종 등급 ${p.grade}${p.appeal.before!==p.grade?` (${p.appeal.before}에서 변경)`:''}.`);
}
function evResultContent(){
  const me = evMe();
  return `${roleSwitcher()}${kpiMsg ? kpiNote(kpiMsg.msg, kpiMsg.type) : ''}
    ${kpiRole==='hr' ? evResHrPanel() : ''}${me ? evMyResult(me) + evTeamResults(me) : ''}
    <div class="list-sub">시연용 가상 결과입니다. 결과를 보려면 HR로 바꿔 "시연: 확정 상태로 채우기" → "전 직원에게 결과 공개"를 누르세요. 지난 연도 결과도 가상 값입니다.</div>`;
}

let currentNav = NAV[0], currentTab = NAV[0].tabs[0];

function renderSidebar(){
  document.getElementById('sidebarNav').innerHTML = NAV.map(n => `
    <div class="nav-item ${n.id===currentNav.id?'active':''}" onclick="selectNav('${n.id}')" ${n.id===currentNav.id?'aria-current="page"':''}>
      ${icon(n.icon)}<span>${n.label}</span>
    </div>`).join('');
}
function renderSubtabs(){
  document.getElementById('subtabsRow').innerHTML = currentNav.tabs.map(t => `
    <div class="subtab ${t.id===currentTab.id?'active':''}" onclick="selectTab('${t.id}')" role="tab" aria-selected="${t.id===currentTab.id}">${t.label}</div>
  `).join('');
}
function renderContent(){
  document.getElementById('pageTitle').textContent = currentNav.label;
  document.getElementById('contentArea').innerHTML =
    `<div class="breadcrumb">${currentNav.label} <b>›</b> ${currentTab.label}</div>` + currentTab.render();

function selectNav(id){
  currentNav = NAV.find(n=>n.id===id);
  currentTab = currentNav.tabs[0];
  renderSidebar(); renderSubtabs(); renderContent();
  closeSidebar();

function selectTab(id){
  currentTab = currentNav.tabs.find(t=>t.id===id);
  renderSubtabs(); renderContent();
}
function goTo(navId, tabId){
  selectNav(navId);
  if(tabId) selectTab(tabId);
}
function toggleSidebar(){ document.querySelector('.sidebar').classList.toggle('open'); }
function closeSidebar(){ document.querySelector('.sidebar').classList.remove('open'); }

/* ---------------- 키보드·화면 읽기 보조 ----------------
   onclick이 달린 div/span을 Tab으로 갈 수 있는 버튼처럼 만들고, .field 안 이름표를 입력칸에 연결한다.
   화면을 innerHTML로 다시 그리므로 변화가 생길 때마다 한 번에 처리한다. */
let a11ySeq = 0;
function a11yEnhance(root){
  root.querySelectorAll('[onclick]:not(button):not(a):not(input):not(select):not(textarea):not(label):not([tabindex])').forEach(el=>{
    el.setAttribute('tabindex','0'); if(!el.getAttribute('role')) el.setAttribute('role','button');
  });
  root.querySelectorAll('.field').forEach(f=>{
    const lb = f.querySelector(':scope > label'), inp = f.querySelector('input, select, textarea');
    if(!lb || !inp || lb.htmlFor) return;
    if(!inp.id) inp.id = 'fld_'+(++a11ySeq);
    lb.htmlFor = inp.id;
  });
  root.querySelectorAll('.field > input:not([aria-label]):not([id]), .field > div > input:not([aria-label])').forEach(inp=>{
    if(!inp.labels || !inp.labels.length){ const ph = inp.getAttribute('placeholder'); if(ph) inp.setAttribute('aria-label', ph); }
  });
}
new MutationObserver(()=>a11yEnhance(document.body)).observe(document.body, {childList:true, subtree:true});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && document.getElementById('orgModal')) return orgCloseModal();
  const t = e.target;
  if((e.key==='Enter' || e.key===' ') && t.getAttribute && t.getAttribute('role')==='button' && t.tagName!=='BUTTON'){ e.preventDefault(); t.click(); }
});

renderSidebar(); renderSubtabs(); renderContent();
a11yEnhance(document.body);
</script>
