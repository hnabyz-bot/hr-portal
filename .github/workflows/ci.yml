name: 자동 검사

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    name: 코드 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 한글 인코딩 검사
        run: bash .ci/check-encoding.sh

      - name: HTML 구조 검사
        run: python3 .ci/check-html.py

      - name: 비밀번호·인증키 검사
        run: bash .ci/check-secrets.sh

      - name: 개인정보 패턴 검사
        run: bash .ci/check-pii.sh

      - name: 공개 폴더 검사
        run: bash .ci/check-public.sh

  smoke:
    name: 사이트 동작 확인
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 컨테이너 기동
        run: docker compose up -d

      - name: 응답 확인
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8080/ -o /tmp/page.html; then
              break
            fi
            sleep 2
          done

          if [ ! -s /tmp/page.html ]; then
            echo "[실패] 사이트가 응답하지 않습니다."
            echo "파일 경로나 docker-compose.yml 설정을 확인하세요."
            docker compose logs
            exit 1
          fi

          if ! grep -q "인사 통합포털" /tmp/page.html; then
            echo "[실패] 응답은 왔지만 내용이 예상과 다릅니다."
            head -20 /tmp/page.html
            exit 1
          fi

          echo "[통과] 사이트 정상 응답 ($(wc -c < /tmp/page.html) 바이트)"

      - name: 정리
        if: always()
        run: docker compose down

  domain:
    name: 평가·계약 도메인 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 도메인 로직 자체 검증
        working-directory: backend
        run: python -m hr_eval.selfcheck

  schema:
    name: DB 스키마 검사
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          # CI 전용 일회성 컨테이너다. 비밀번호를 아예 두지 않아
          # 시크릿 검사에도 걸리지 않는다.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: hr_portal_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: 스키마 적용
        run: |
          psql -h 127.0.0.1 -U postgres -d hr_portal_ci -v ON_ERROR_STOP=1 \
            -f backend/hr_eval/sql/001_init.sql

      - name: 제약조건 동작 확인
        run: |
          psql -h 127.0.0.1 -U postgres -d hr_portal_ci -v ON_ERROR_STOP=1 \
            -f backend/hr_eval/sql/checks.sql

  promote:
    name: 배포 대상 갱신
    needs: [validate, smoke, domain, schema]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: release 브랜치 갱신
        run: |
          git push origin HEAD:release
          echo "release 브랜치를 $(git rev-parse --short HEAD) 로 갱신했습니다."
          echo "서버가 2분 이내에 가져갑니다."
