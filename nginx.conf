# 하이웍스 로그인 받는 곳은 주소 뒤(?token=…)를 빼고 기록한다 — token 이 로그에 남지 않게 (로그인 설계 §5)
log_format hr_noquery '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 5m;

    location = /api/auth/hiworks {
        access_log /var/log/nginx/access.log hr_noquery;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;   # 실제 접속자 주소 — 요청 빈도 제한 (§5)
        proxy_read_timeout 30s;
    }

    location = /api/eval/files {
        client_max_body_size 11m;   # 증빙 올리기만 본문 11MB (파일 10MB + 양식 칸) — 그 밖의 요청은 위의 5m
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;   # 세션에 남기는 접속 IP
        proxy_read_timeout 30s;
    }

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;   # 세션에 남기는 접속 IP
        proxy_read_timeout 30s;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";   # 서비스 워커 파일은 늘 새로 확인 — 고쳐도 휴대폰이 옛것을 오래 쓰지 않게
        try_files $uri =404;
    }

    # 화면 파일(/ → index.html · /xray/ 게임)은 열 때마다 새 판인지 확인한다 — 이 머리가 없으면 브라우저가 스스로 정해 옛 화면을 몇 시간 쓴다
    # (2026-11-02 휴대폰 앱이 올린 뒤에도 예전 환영 페이지를 보였다). 바뀌지 않았으면 다시 받지 않는다(304). 그림 · js 는 주소 뒤 ?v= 번호로 바꾼다
    location ~ \.html$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
