services:
  web:
    image: nginx:alpine
    container_name: hr-portal-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  api:
    build: ./backend
    container_name: hr-portal-api
    restart: unless-stopped
    environment:
      - NAVER_CLIENT_ID=${NAVER_CLIENT_ID:-}
      - NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET:-}
      - NAVER_LOCAL_CLIENT_ID=${NAVER_LOCAL_CLIENT_ID:-}
      - NAVER_LOCAL_CLIENT_SECRET=${NAVER_LOCAL_CLIENT_SECRET:-}
      - OPINET_API_KEY=${OPINET_API_KEY:-}
      - HR_DB_PATH=/app/data/hr-portal.db
      # 직원 명단 동기화 (python -m hr_eval.roster_sync). 값은 서버 .env 에만
      - HIWORKS_OFFICE_TOKEN=${HIWORKS_OFFICE_TOKEN:-}
      - HIWORKS_DOMAIN=${HIWORKS_DOMAIN:-}
      # 하이웍스 로그인 (backend/auth.py). 운영 모드는 .env 가 아니라 여기 고정 — 빠뜨릴 수 없게 (로그인 설계 §7)
      - HR_ENV=production
      - HIWORKS_FIRST_HR_USER_NO=${HIWORKS_FIRST_HR_USER_NO:-}
      - HIWORKS_SSO_LINK_BY_EMPLOYEE_NO=${HIWORKS_SSO_LINK_BY_EMPLOYEE_NO:-}
      # 급여명세서 · 원천징수영수증 잠금 열쇠 (backend/payslip.py · withholding.py). 값은 서버 .env 에만 — 없으면 HR 의 명세서 · 영수증 올리기가 막힌다
      - HR_PAY_KEY=${HR_PAY_KEY:-}
      # 휴대폰 알림(웹 푸시) 열쇠 한 쌍 (backend/push.py). 값은 서버 .env 에만 — 없으면 알림 보내기만 조용히 건너뛴다
      - HR_PUSH_PUBLIC=${HR_PUSH_PUBLIC:-}
      - HR_PUSH_PRIVATE=${HR_PUSH_PRIVATE:-}
    volumes:
      - ./regulations:/app/regulations:ro
      # 직원·로그인 DB. 상자(이미지) 안에 두면 merge 때 재빌드하면서 사라진다 → 서버 폴더 data/ 에 보관
      - ./data:/app/data
    expose:
      - "8000"
