services:
  web:
    image: nginx:alpine
    container_name: hr-portal-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  api:
    build: ./backend
    container_name: hr-portal-api
    restart: unless-stopped
    environment:
      - NAVER_CLIENT_ID=${NAVER_CLIENT_ID:-}
      - NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET:-}
      - NAVER_LOCAL_CLIENT_ID=${NAVER_LOCAL_CLIENT_ID:-}
      - NAVER_LOCAL_CLIENT_SECRET=${NAVER_LOCAL_CLIENT_SECRET:-}
      - OPINET_API_KEY=${OPINET_API_KEY:-}
      - HR_DB_PATH=/app/data/hr-portal.db
    volumes:
      - ./regulations:/app/regulations:ro
      # 직원·로그인 DB. 상자(이미지) 안에 두면 merge 때 재빌드하면서 사라진다 → 서버 폴더 data/ 에 보관
      - ./data:/app/data
    expose:
      - "8000"
